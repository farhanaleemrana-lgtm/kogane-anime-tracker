cling trips by herself to places where she can see Mt. Fuji. After they meet, Rin and Nadeshiko take camping trips, eat cup ramen together, and enjoy the scenery. (Source: Anime News Network)"}, {"title": "Douluo Dalu 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1538/93566.jpg", "score": 8.2, "episodes": 237, "year": 2018, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": ["Sparkly Key Animation Studio"], "producers": ["Tencent Penguin Pictures", "Tencent Video", "Xuanshi Tangmen"], "duration_min": 20.0, "genres": ["Action", "Adventure", "Fantasy", "Romance", "Supernatural", "Historical"], "tags": ["3D Cg Animation", "Action", "Adventure", "Based On A Web Novel", "Cg Animation", "Cg-Anime", "Cgi", "Chinese Animation", "Chinese Production", "Coming Of Age"], "local": "images/cover_7781.jpg", "synopsis": "The second part of Douluo Dalu . Note: Episodes 27 to 78."}, {"title": "Evangelion 30th Anniversary Special", "image": "https://simkl.in/posters/19/19639383cc314900f1_m.webp", "score": 8.2, "episodes": 1, "year": 2026, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Khara"], "producers": [], "duration_min": 15.0, "genres": ["Comedy", "Romance", "Sci-Fi", "Mecha", "Psychological"], "tags": ["Comedy", "Fictional Location", "Japanese Production", "Mecha", "Medium Awareness", "Parallel World", "Parody", "Place", "Psychological", "Romance"], "local": "images/cover_8728.webp", "synopsis": "A new short animation for the Evangelion series that debuted at the “EVANGELION:30+；30th ANNIVERSARY OF EVANGELION” fes. in Yokohama Arena."}, {"title": "Honzuki no Gekokujou: Shisho ni Naru Tame ni wa Shudan wo Erandeiraremasen 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1464/107998.jpg", "score": 8.2, "episodes": 12, "year": 2020, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Ajia-Do", "Ajiado Co.,Ltd."], "producers": ["Abc Animation", "Ajiado", "Bs Fuji"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Fantasy", "Slice of Life", "Isekai", "Historical"], "tags": ["Age Regression", "Age Transformation", "Alternative World", "Apprenticeship", "Based On A Light Novel", "Cheats", "Chibi", "Class Struggle", "Classical Music", "Comedy"], "local": "images/honzuki-no-gekokujou-shisho-ni-naru-tame-ni-wa-shudan-wo-era.jpg", "synopsis": "Anime adaptation of Part 2 (Volume 1 & 2) of Honzuki no Gekokujou . When Myne learns that the temple is in need of mana for their relics, she sees it as her chance to be cured of her life-threatening mana disorder. After seeing their bountiful library, she throws herself headfirst into the temple's grasp and begs to join their order. In exchange for her service and her unusually bountiful supply of mana, Myne is given the blue robes of a noble-born apprentice shrine maiden, despite being a commoner. To Myne, all this talk of mana and nobility is trivial, as she now has access to an unlimited supply of books! As Myne transitions into the next phase of her life in this new world, she soon learns that achieving her dream has come at a heavy cost. Noble society is severe, unforgiving, and fueled by politics and neglect. She must now deal with the class conflict between the noble-born blue robes and the common-born grey robes, the High Bishop's attempts to oust her, and constant behavioral issues from her new retainers. With the help of her family, friends, and the enigmatic High Priest whose loyalties and motives remain unknown, Myne seeks to overcome these obstacles and continue on the path to becoming her ideal self—the ultimate librarian! (Source: MAL Rewrite, edited)"}, {"title": "Houseki no Kuni", "image": "https://cdn.myanimelist.net/images/anime/3/88293.jpg", "score": 8.2, "episodes": 12, "year": 2017, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Orange Co., Ltd."], "producers": ["At-X", "Bs11", "Kodansha"], "duration_min": 24.0, "genres": ["Action", "Drama", "Fantasy", "Mystery", "Sci-Fi", "Psychological", "Slapstick"], "tags": ["3D Cg Animation", "Action", "Agender", "Alternative World", "Amnesia", "Anthropomorphic", "Anthropomorphism", "Astronomy", "Awards", "Based On A Manga"], "local": "images/houseki-no-kuni.jpg", "synopsis": "In the mysterious future, crystalline organisms called Gems inhabit a world that has been destroyed by six meteors. Each Gem is assigned a role in order to fight against the Lunarians, a species who attacks them in order to shatter their bodies and use them as decorations. Phosphophyllite, also known as Phos, is a young and fragile Gem who dreams of helping their friends in the war effort. Instead, they are told to compile an encyclopedia because of their delicate condition. After begrudgingly embarking on this task, Phos meets Cinnabar, an intelligent gem who has been relegated to patrolling the isolated island at night because of the corrosive poison their body creates. After seeing how unhappy Cinnabar is, Phos decides to find a role that both of the rejected Gems can enjoy. Houseki no Kuni follows Phos' efforts to be useful and protect their fellow Gems."}, {"title": "Initial D First Stage", "image": "https://cdn.myanimelist.net/images/anime/1384/127972.jpg", "score": 8.2, "episodes": 26, "year": 1998, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Gallop Co., Ltd.", "Pastel", "Studio Comet"], "producers": ["Fuji Television Network", "Fuji Tv", "Funimation"], "duration_min": 25.0, "genres": ["Action", "Drama", "Romance", "Slice of Life", "Sports", "Slapstick"], "tags": ["Action", "Age Gap", "Asia", "Auto Racing", "Based On A Manga", "Canon Filler", "Cars", "Cgi", "Coming Of Age", "Drama"], "local": "images/initial-d-first-stage.jpg"}, {"title": "Mobile Suit Gundam: The Origin", "image": "https://media.kitsu.app/anime/poster_images/6415/small.jpg", "score": 8.2, "episodes": 4, "year": 2015, "season": "SPRING", "type": "OVA", "status": "FINISHED", "studios": ["Sunrise"], "producers": ["Sunrise"], "duration_min": 63.0, "genres": ["Action", "Sci-Fi", "Mecha"], "tags": ["Action", "Future", "Mecha", "Military", "Piloted Robot", "Sci-Fi", "Science Fiction", "Space"], "local": "images/mobile-suit-gundam-the-origin.jpg", "synopsis": "The first episode, Aoi Hitomi no Casval, tells the story of Casval Rem Deikun and Artesia Som Deikun (Char and Sayla, before Char became known as the Red Comet) before the One-Year War in UC.0068. The story for the second episode, Kanashimi no Artesia, moves three years ahead to U.C. 0071. The story will follow the tearful separation of the siblings Casval and Artesia (before they became known as Char and Sayla). It will also feature more of the development of the mobile suits, particularly on the Zeon side. The third episode, Akatsuki no Houki, follows the youth who would become known as Char Aznable and his future comrade Garma Zabi after they join the Zeons' military academy. (Source: Anime News Network)"}, {"title": "Naruto: Shippuuden", "image": "https://cdn.myanimelist.net/images/anime/1565/111305.jpg", "score": 8.2, "episodes": 500, "year": 2007, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Pierrot Co., Ltd."], "producers": ["Aniplex", "Kss", "Rakuonsha"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Supernatural", "Slapstick"], "tags": ["Achronological Order", "Action", "Adventure", "Aliens", "Alternative World", "Anachronism", "Angst", "Anti-Hero", "Based On A Manga", "Bionic Powers"], "local": "images/naruto-shippuuden.jpg", "synopsis": "Naruto: Shippuuden is the continuation of the original animated TV series Naruto. The story revolves around an older and slightly more matured Uzumaki Naruto and his quest to save his friend Uchiha Sasuke from the grips of the snake-like Shinobi, Orochimaru. After 2 and a half years Naruto finally returns to his village of Konoha, and sets about putting his ambitions to work, though it will not be easy, as he has amassed a few (more dangerous) enemies, in the likes of the shinobi organization; Akatsuki. (Source: Anime News Network)"}, {"title": "Natsume Yuujinchou Movie: Utsusemi ni Musubu", "image": "https://cdn.myanimelist.net/images/anime/1250/94846.jpg", "score": 8.2, "episodes": 1, "year": 2018, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Shuka Inc."], "producers": ["Aniplex"], "duration_min": 104.0, "genres": ["Drama", "Fantasy", "Slice of Life", "Supernatural"], "tags": ["Adoption", "Based On A Manga", "Bionic Powers", "Bodyguards", "Cats", "Contemporary Fantasy", "Countryside", "Deity", "Demon", "Drama"], "local": "images/natsume-yuujinchou-movie-utsusemi-ni-musubu.jpg"}, {"title": "Nodame Cantabile Finale", "image": "https://cdn.myanimelist.net/images/anime/1084/119096.jpg", "score": 8.2, "episodes": 11, "year": 2010, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Genco", "J.C. Staff", "J.C.Staff Co., Ltd."], "producers": ["Asmik Ace Entertainment, Inc.", "Dentsu Inc.", "Fuji Television Network"], "duration_min": 22.0, "genres": ["Comedy", "Drama", "Romance", "Music", "Slapstick"], "tags": ["Adapted Into Japanese Movie", "Adapted Into Other Media", "Adult Cast", "Adult Couples", "Band", "Based On A Manga", "Catchphrase", "Classical Music", "College", "Comedy"], "local": "images/nodame-cantabile-finale.jpg", "synopsis": "The series continues the relationship between two aspiring classical musicians, Megumi \"Nodame\" Noda and Shinichi Chiaki, as students and after graduation."}, {"title": "Seihantai na Kimi to Boku", "image": "https://cdn.myanimelist.net/images/anime/1140/154457.jpg", "score": 8.2, "episodes": 12, "year": 2026, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Lapin Track", "Lapintrack"], "producers": ["Abematv", "Dentsu Inc.", "Mainichi Broadcasting System"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Slapstick"], "tags": ["Asexual", "Asia", "Based On A Manga", "Character Driven", "Chibi", "Comedy", "Coming Of Age", "Coming-Of-Age", "Daily Life", "Drama"], "local": "images/seihantai-na-kimi-to-boku.jpg", "synopsis": "Suzuki’s a high school girl in love, but the guy she’s fallen for is nothing like her! While she’s cheerful, outgoing, and always trying to fit in, her classmate Yusuke Tani is stoic, quiet, and doesn’t seem to care what people think of him. Will Suzuki be able to overcome her anxieties and ask him out, or will she discover that opposites really don’t attract? (Source: Crunchyroll)"}, {"title": "Toki wo Kakeru Shoujo", "image": "https://cdn.myanimelist.net/images/anime/1/2432.jpg", "score": 8.2, "episodes": 1, "year": 2006, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Madhouse Inc."], "producers": ["Bandai Entertainment", "Funimation", "G.T. Entertainment"], "duration_min": 98.0, "genres": ["Adventure", "Comedy", "Drama", "Romance", "Sci-Fi", "Slice of Life", "Slapstick"], "tags": ["Adapted Into Japanese Movie", "Adapted Into Jdrama", "Adapted Into Other Media", "Adventure", "Angst", "Asia", "Award Winning", "Baseball", "Based On A Novel", "Bicycling"], "local": "images/toki-wo-kakeru-shoujo.jpg", "synopsis": "The power to travel through time... It can be used for the good of humanity, or just selfishly abused. While many may fantasize about obtaining such a power, it has become nothing less than reality for otherwise-normal schoolgirl Konno Makoto. After a fated event, her life takes a turn for the extraordinary. Though she initially uses her power to literally \"leap\" into the past and change little things in order to make her life easier, she soon has to face the fact that changing the past can have drastic consequences."}, {"title": "Yuu☆Yuu☆Hakusho", "image": "https://cdn.myanimelist.net/images/anime/1228/111372.jpg", "score": 8.2, "episodes": 112, "year": 1992, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Pierrot Co., Ltd."], "producers": ["Fuji Tv", "Funimation", "Studio Pierrot"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Fantasy", "Supernatural", "Slapstick"], "tags": ["Action", "Adventure", "Afterlife", "Asia", "Based On A Manga", "Bionic Powers", "Bodyguard", "Calling Your Attacks", "Canon Filler", "Comedy"], "local": "images/yuu-yuu-hakusho.jpg", "synopsis": "Urameshi Yusuke, 14 years of age, is about as troublesome and violent as teenagers come. He is constantly ditching school, causing trouble, and getting into numerous fights everyday. One day however, he does the unexpected, sacrificing himself to save a young child. Such an action, was never ever expected, especially coming from someone as troublesome as Urameshi Yusuke. The afterlife is not prepared for Yusuke, as they never thought he would make such a sacrifice. Nowhere to go, and dead, Yusuke becomes a ghost and must earn his way back into existence. Yusuke is \"employed\" by Koenma, who is in charge while his father and ruler of the afterlife, King Enma, is away. Under Koenma's command, Yusuke helps to stop menacing demons that threaten the lives of people everywhere; whether by stealing priceless and invaluable items and destructive weapons, or by wreaking havoc on humans everywhere. Throughout Yusuke's journey, he is usually joined by; his arch-rival, and local bully, Kuwabara Kazuma. He is also joined by two demons named Hiei and Kurama, whom are ex-convicts of the afterlife that managed to escape from Koenma. This group of unlikely allies goes on to participate and struggle in battles that have outcomes that determine the fate of humanity! (Source: AniDB)"}, {"title": "Dr. Stone: Stone Wars", "image": "https://cdn.myanimelist.net/images/anime/1711/110614.jpg", "score": 8.19, "episodes": 11, "year": 2021, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["8 Pan", "8Pan", "Tms Entertainment Co., Ltd."], "producers": ["8Pan", "Dr.Stone Production Committee", "Shueisha"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Sci-Fi", "Slapstick", "Historical"], "tags": ["Action", "Adventure", "Apocalyptic Fiction", "Asexual", "Based On A Manga", "Bisexual", "Civilization", "Comedy", "Disaster", "Drama"], "local": "images/cover_7910.jpg", "synopsis": "The second season of Dr. STONE Armed with the power of science and a genius intellect, Senkuu is determined to save humanity. However, Tsukasa’s empire goes on the offensive to halt the progress of science. Bolder choices are made as these two start a war that rocks the Stone World. (Source: Crunchyroll)"}, {"title": "Fang of the Sun Dougram", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A873-1673607831.1672325197.jpg", "score": 8.19, "episodes": 75, "year": 1981, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": [], "producers": ["Sunrise"], "duration_min": 30.0, "genres": ["Drama", "Sci-Fi", "Mecha"], "tags": ["Drama", "Mecha", "Military", "Real Robot", "Science Fiction"], "local": null, "synopsis": "The story is centered around a small group of guerilla freedom fighters on a colonial planet named Deloyer, who are known as the \"Deloyer 7\", or \"Sun Fang\" team. In an unexpected coup, the elected Governor of Deloyer becomes dictator and rules Deloyer under martial law with the support of Earth's Federation. Fighting for independence from Earth's Federation influence, the freedom fighters begin a rebellion against the Federation's Combat Armors using a Combat Armor of their own: the Dougram."}, {"title": "Ginga Eiyuu Densetsu: Die Neue These - Gekitotsu", "image": "https://cdn.myanimelist.net/images/anime/1859/118711.jpg", "score": 8.19, "episodes": 12, "year": 2022, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["Aiming", "Production I.G", "Shochiku"], "duration_min": 25.0, "genres": ["Action", "Drama", "Sci-Fi"], "tags": ["Action", "Action Drama", "Adult Cast", "Drama", "Japanese Production", "Military", "Novel", "Place", "Sci-Fi", "Science Fiction"], "local": "images/ginga-eiyuu-densetsu-die-neue-these-gekitotsu.jpg", "synopsis": "The sequel to Legend of the Galactic Heroes: Die Neue These Second ."}, {"title": "Gintama°: Aizome Kaori-hen", "image": "https://cdn.myanimelist.net/images/anime/1962/133573.jpg", "score": 8.19, "episodes": 2, "year": 2016, "season": "SUMMER", "type": "OVA", "status": "FINISHED", "studios": ["Bandai Namco Pictures Inc.", "Bn Pictures", "Sunrise"], "producers": ["Bandai Namco Pictures", "Dentsu", "Tv Tokyo"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Romance", "Sci-Fi", "Slapstick", "Historical"], "tags": ["Action", "Adventure", "Aliens", "Anachronism", "Based On A Manga", "Comedy", "Crude", "Drama", "Edo Period", "Ensemble Cast"], "local": "images/gintama-aizome-kaori-hen.jpg"}, {"title": "Hachimitsu to Clover II", "image": "https://cdn.myanimelist.net/images/anime/6/11040.jpg", "score": 8.19, "episodes": 12, "year": 2006, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["J.C.Staff Co., Ltd."], "producers": ["Asmik Ace Entertainment, Inc.", "Dentsu Inc.", "Fuji Television Network"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Slapstick"], "tags": ["Adult Cast", "Age Difference", "Age Gap", "Americas", "Angst", "Art", "Art School", "Asia", "Based On A Manga", "Chicago"], "local": "images/hachimitsu-to-clover-ii.jpg", "synopsis": "The sequel and final installment to the highly popular series once again delves into the life stories and love lives of Takemoto Yuuta, Mayama Takumi and Morita Shinobu. The story continues where the first season left off, after Takemoto's self-discovery journey around Japan. Of course, the love triangles and tribulations they face will continue, and eventually decide the paths to their future. (Source: Anime News Network)"}, {"title": "Haikyuu!! Movie 4: Concept no Tatakai", "image": "https://cdn.myanimelist.net/images/anime/1854/147254.jpg", "score": 8.19, "episodes": 1, "year": 2017, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Production I.G"], "producers": [], "duration_min": 88.0, "genres": ["Comedy", "Drama", "Sports"], "tags": ["Based On A Manga", "Comedy", "Compilation", "Drama", "Male Protagonist", "Primarily Male Cast", "Primarily Teen Cast", "Recap", "School", "School Club"], "local": "images/haikyuu-movie-4-concept-no-tatakai.jpg"}, {"title": "Kaze ga Tsuyoku Fuiteiru", "image": "https://cdn.myanimelist.net/images/anime/1936/129119.jpg", "score": 8.19, "episodes": 23, "year": 2018, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["Cygames", "Medialink Entertainment Limited", "Movic"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Slice of Life", "Sports", "Slapstick"], "tags": ["Adult Cast", "Angst", "Apartment Life", "Asia", "Athletics", "Based On A Novel", "Boarding House", "Bullying", "Cgi", "Character Driven"], "local": "images/kaze-ga-tsuyoku-fuiteiru.jpg", "synopsis": "Former ace runner of Sendai Josei High School, Kakeru Kurahara is chased away from a convenience store for shoplifting. Shaking off his pursuer, he runs into Haiji Kiyose, another student from his university. Haiji is impressed by Kakeru's agility and persuades him to live in Chikusei-sou, the run-down apartment where Haiji resides along with eight other students. Having lost his entire apartment deposit at a mahjong parlor, Kakeru accepts the offer reluctantly. However, Haiji reveals a secret during Kakeru's welcoming party: the apartment is actually the dormitory of the Kansei University Track Club. He unveils his ultimate goal of participating in the Hakone Ekiden—one of the most prominent university marathon relay races in Japan. Unfortunately, all the residents apart from Haiji and Kakeru are complete running novices. Worse still, none of the inhabitants are even remotely interested in being involved with Haiji's ridiculous plan! With only months before the deadline, will the fourth-year student be able to convince them otherwise and realize his elusive dream of running in the Hakone Ekiden?"}, {"title": "Kobayashi-san Chi no Maid Dragon: Samishigariya no Ryuu", "image": "https://cdn.myanimelist.net/images/anime/1134/148744.jpg", "score": 8.19, "episodes": 1, "year": 2025, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["Kyoto Animation Co., Ltd."], "producers": ["Abc Animation", "Bandai Namco Music Live", "Heart Company"], "duration_min": 105.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Slice of Life", "Supernatural", "Isekai"], "tags": ["Action", "Animal Characteristics", "Based On A Manga", "Beastman", "Cohabitation", "Comedy", "Contemporary Fantasy", "Cute Girls Doing Cute Things", "Dragon", "Dragons"], "local": "images/kobayashi-san-chi-no-maid-dragon-samishigariya-no-ryuu.jpg"}, {"title": "Kono Subarashii Sekai ni Shukufuku wo! 2", "image": "https://cdn.myanimelist.net/images/anime/2/83188.jpg", "score": 8.19, "episodes": 10, "year": 2017, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Studio Deen Co., Ltd."], "producers": ["81 Produce", "Kadokawa Media House", "Kadokawa Shoten"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Fantasy", "Supernatural", "Isekai", "Slapstick", "Historical"], "tags": ["Action", "Adventure", "Adventure Comedy", "Afterlife", "Alcohol", "Alternative World", "Anti-Hero", "Arranged Marriage", "Awards", "Based On A Light Novel"], "local": "images/kono-subarashii-sekai-ni-shukufuku-wo-2.jpg", "synopsis": "When Kazuma Satou died, he was given two choices: pass on to heaven or be revived in a fantasy world. After choosing the new world, the goddess Aqua tasked him with defeating the Demon King, and let him choose any weapon to aid him. Unfortunately, Kazuma chose to bring Aqua herself and has regretted the decision ever since then. Not only is he stuck with a useless deity turned party archpriest, the pair also has to make enough money for living expenses. To add to their problems, their group continued to grow as more problematic adventurers joined their ranks. Their token spellcaster, Megumin, is an explosion magic specialist who can only cast one spell once per day and refuses to learn anything else. There is also their stalwart crusader, Lalatina \"Darkness\" Dustiness Ford, a helpless masochist who makes Kazuma look pure in comparison. Kono Subarashii Sekai ni Shukufuku wo! 2 continues to follow Kazuma and the rest of his party through countless more adventures as they struggle to earn money and have to deal with one another's problematic personalities. However, things rarely go as planned, and they are often sidetracked by their own idiotic tendencies."}, {"title": "Kono Subarashii Sekai ni Shukufuku wo! 3", "image": "https://cdn.myanimelist.net/images/anime/1758/141268.jpg", "score": 8.19, "episodes": 11, "year": 2024, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Drive Inc."], "producers": ["81 Produce", "Half H.P Studio", "Half Hp Studio"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Fantasy", "Isekai", "Slapstick", "Historical"], "tags": ["Action", "Adventure", "Adventure Comedy", "Afterlife", "Alcohol", "Alternate Universe", "Alternative World", "Anti-Hero", "Archery", "Arranged Marriage"], "local": "images/kono-subarashii-sekai-ni-shukufuku-wo-3.jpg", "synopsis": "The third season of Kono Subarashii Sekai ni Shukufuku wo! The dysfunctional party is back, but they may be short a member soon ’cause Kazuma is over it. Disillusioned with adventure, he wants to become a monk, but Aqua, Megumin, and Darkness call bull. However, the career dispute gets put on hold when a princess requests to hear all about their tales. Will the taste of fame at the royal castle keep them together or will this mark their farewell tour? (Source: Crunchyroll)"}, {"title": "Mast ins of an Elf city, he meets Schwi, a female exiled \"Ex Machina\" android who asks him to teach her what it means to have a human heart. (Source: Sentai Filmworks)"}, {"title": "Shokugeki no Souma", "image": "https://cdn.myanimelist.net/images/anime/1444/148976.jpg", "score": 8.19, "episodes": 24, "year": 2015, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["J.C. Staff", "J.C.Staff Co., Ltd."], "producers": ["Dentsu Inc.", "Frontier Works", "Hakuhodo Dy Music & Pictures"], "duration_min": 25.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Slapstick"], "tags": ["Absurdly Powerful Student Council", "Aim For The Top", "Animeism", "Asia", "Based On A Manga", "Boarding House", "Boarding School", "Canon Filler", "Comedy", "Competition"], "local": "images/shokugeki-no-souma.jpg", "synopsis": "Ever since he was little, Souma Yukihira’s main goals have been to beat his father in a cooking contest and take over the family diner. That’s why, when his dad suddenly announces that he’s shutting the restaurant down and sending Souma to cooking school, Souma is shocked. However, Totsuki Academy is no ordinary cooking school. This elite institution is filled with culinary giants like Erina “God Tongue” Nakiri, who does her best to keep a lowly short-order like Souma from even making it inside the door. However, if the snobs can dish it out, Souma can serve it up, and when he learns that only a handful of the students manage to graduate every year, he swears that the only way he’ll leave is as number one! (Source: Sentai Filmworks)"}, {"title": "Space Sagittarius", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A1721-2116644707.1511431107.jpg", "score": 8.19, "episodes": 77, "year": 1986, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Nippon Animation"], "producers": ["Nippon Animation", "Tv Asahi"], "duration_min": 30.0, "genres": ["Adventure", "Comedy", "Sci-Fi"], "tags": ["Adventure", "Comedy", "Scie nks begin to stagnate. Acquainted with Rei are the three Kawamoto sisters: Akari, Hinata, and Momo. Unlike Rei, they live happily in their modest home, which they warmly welcome Rei into as if he were one of their own. He frequently visits the family, interacting with them and receiving the kind of care and affection he never quite had while under his foster home. This is the story of Rei's triumphs and failures, relationships new and old, and his growth as a person."}, {"title": "Batman Beyond", "image": "https://media.kitsu.app/anime/poster_images/7954/small.jpg", "score": 8.18, "episodes": 52, "year": 1999, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": [], "producers": ["Dc Entertainment", "Warner Bros."], "duration_min": null, "genres": ["Action", "Adventure", "Mystery", "Sci-Fi"], "tags": ["Action", "Adventure", "Anime Influenced", "Mystery", "Sci-Fi", "Science Fiction", "Super Power", "Superhero"], "local": "images/cover_2954.jpg"}, {"title": "Batman Beyond: Return of the Joker", "image": "https://media.kitsu.app/anime/poster_images/7960/small.jpg", "score": 8.18, "episodes": 1, "year": 2000, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": [], "producers": ["Dc Entertainment", "Warner Bros."], "duration_min": 76.0, "genres": ["Action", "Adventure", "Mystery", "Sci-Fi", "Thriller"], "tags": ["Action", "Adventure", "Anime Influenced", "Mystery", "Sci-Fi", "Science Fiction", "Super Power", "Superhero", "Thriller"], "local": "images/cover_2956.jpg"}, {"title": "Benghuai: Xingqiong Tiedao - Yilun Zhaoyang de Mingyun", "image": "https://s4.anilist.co/file/anilistcdn/media/anime/cover/medium/bx206290-iXvhfXiy4W9H.png", "score": 8.18, "episodes": 1, "year": 2025, "season": "UNDEFINED", "type": "ONA", "status": "FINISHED", "studios": ["Mihoyo Anime"], "producers": [], "duration_min": 1.0, "genres": ["Action", "Drama", "Psychological"], "tags": ["Action", "Advertisement", "Drama", "Male Protagonist", "Psychological", "Revenge", es, Higurashi no Naku Koro ni Kai begins to shed some light on the dark mysteries prevalent in the preceding season. The young group of friends in the town of Hinamizawa continue to enter terrible conflicts with one another in their never ending summer of 1983, often ending with the brutal murder of one of their numbers. Furude Rika, with the help of her spiritual friend Hanyuu, tackles challenges over and over, trying her best to keep their lives from coming to a tragic end. With no end to the torture in sight, Rika must call upon the bonds of friendship and trust among her friends to discover the true villain of this eternal June."}, {"title": "Honzuki no Gekokujou: Shisho ni Naru Tame ni wa Shudan wo Erandeiraremasen 3rd Season", "image": "https://cdn.myanimelist.net/images/anime/1976/122302.jpg", "score": 8.18, "episodes": 10, "year": 2022, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Ajia-Do", "Ajiado Co.,Ltd."], "producers": ["Ajiado", "Bs Fuji", "Flying Dog"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Fantasy", "Slice of Life", "Isekai", "Historical"], "tags": ["Adoption", "Age Regression", "Age Transformation", "Alternative World", "Apprenticeship", "Based On A Light Novel", "Cheats", "Chibi", "Class Struggle", "Comedy"], "local": "images/honzuki-no-gekokujou-shisho-ni-naru-tame-ni-wa-shudan-wo-era.jpg", "synopsis": "Anime adaptation of Part 2 (Volume 3 & 4) of Honzuki no Gekokujou . An immense display of mana in front of the Knight’s Order has earned Myne the attention of nobles. The result? Yet more people appear hoping to exploit the young apprentice shrine maiden’s value. And so the High Priest decides to shelter Myne in the temple to safeguard her from the impending danger he foresees. But Myne’s main concern is still books, and she works to advance the printing process so that their price falls and more people can buy them. Her long winter in the temple away from her family begins, but everything changes as the harsh ion", "Adventure", "Fantasy"], "tags": ["Action", "Adventure", "Coming Of Age", "Cultivation", "Fantasy", "Female Harem", "Full Cgi", "Male Protagonist", "Martial Arts", "Revenge"], "local": "images/wanmei-shijie-2.jpeg", "synopsis": "Born into a unique world where villages fight to gain power and control, the main character, Shi Hao, is a genius blessed by the heavens born under the poorest of conditions. His clan, however, has a mysterious past. To rise up and become the genius he is meant to be, the clan goes through every effort to aid his cultivation as they battle through fanatical monsters and engage in power struggles with other clans. His journey will bring him through unknown lands until he is able to become a person that can truly shake the world."}, {"title": "Wu Liuqi: Anying Suming", "image": "https://cdn.myanimelist.net/images/anime/1016/153863.jpg", "score": 8.18, "episodes": 10, "year": 2023, "season": "WINTER", "type": "ONA", "status": "FINISHED", "studios": ["Aha Entertainment", "Sharefun Studio"], "producers": ["Aha Entertainment", "Ahaverse", "Bilibili"], "duration_min": 16.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Mystery", "Romance", "Supernatural", "Slapstick"], "tags": ["Action", "Adventure", "Amnesia", "Assassins", "Chinese Animation", "Chinese Production", "Comedy", "Cultivation", "Cyborg", "Demons"], "local": "images/wu-liuqi-anying-suming.jpg", "synopsis": "Wu Liuqi originally lived a carefree life on Xiaoji Island, but his identity remained a mystery because of amnesia. As an outsider arrives and recognizes Wu Liuqi, various conspiracies begin to envelop the Island. In order to protect his friends and their home, Wu Liuqi decides to return to Xuanwu to face his destiny. (Source: bilibili, translated)"}, {"title": "Yi Nian Yong Heng 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1999/155867.jpg", "score": 8.18, "episodes": 54, "year": 2022, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios" herlock Holmes can stand in his way. It’s time for crime to revolutionize the world! (Source: Funimation) Note: The anime received a special premiere on Funimation on March 28, 2021."}, {"title": "Berserk: Ougon Jidai-hen III - Kourin", "image": "https://cdn.myanimelist.net/images/anime/12/41305.jpg", "score": 8.17, "episodes": 1, "year": 2013, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Studio 4°C", "Studio4°C"], "producers": ["Berserk Film Partners", "Beyond C.", "Good Smile Company"], "duration_min": 112.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Horror", "Supernatural", "Psychological"], "tags": ["Action", "Adventure", "Anti-Hero", "Based On A Manga", "Body Horror", "Cgi", "Cosmic Horror", "Dark Fantasy", "Demon", "Demons"], "local": "images/cover_3222.jpg", "synopsis": "One year has passed since Guts left the Band of the Hawk and Griffith was imprisoned by the Kingdom of Midland for treason. In the dead of night, at a camping site where they hide, the Band of the Hawk is attacked by Bakiraka assassins led by Silat. When all seems lost, Guts returns from his journey. \"You destroyed everything.\" Crying that Griffith is nothing without Guts, Casca and Guts are joined together body and soul. Griffith is imprisoned in the oldest building in Wyndham Catle, the Tower of Rebirth."}, {"title": "Fate/stay night Movie: Heaven's Feel - I. Presage Flower", "image": "https://cdn.myanimelist.net/images/anime/1274/102213.jpg", "score": 8.17, "episodes": 1, "year": 2017, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Ufotable"], "producers": ["Aniplex", "Fate/Stay Night Production Committee", "Kadokawa"], "duration_min": 120.0, "genres": ["Action", "Drama", "Fantasy", "Romance", "Supernatural", "Thriller", "Psychological"], "tags": ["Action", "Adoption", "Archery", "Assassins", "Based On A Visual Novel", "Based On An Eroge", "Battle Royale", "Cgi", "Coming-Of-Age", "Conspiracy"], "local": "images/cover_9050.jpg me/8/76011.jpg", "score": 8.17, "episodes": 1, "year": 2015, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Production I.G"], "producers": ["Toho Animation"], "duration_min": 89.0, "genres": ["Comedy", "Drama", "Sports"], "tags": ["Based On A Manga", "Comedy", "Compilation", "Cute Boys Doing Cute Things", "Drama", "Male Protagonist", "Primarily Male Cast", "Recap", "School", "School Club"], "local": "images/haikyuu-movie-1-owari-to-hajimari.jpg"}, {"title": "Kemono no Souja Erin", "image": "https://cdn.myanimelist.net/images/anime/1929/121700.jpg", "score": 8.17, "episodes": 50, "year": 2009, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Production I.G., Inc.", "Trans Arts Co."], "producers": ["Nhk Enterprises", "Production I.G", "Trans Arts"], "duration_min": 24.0, "genres": ["Adventure", "Comedy", "Drama", "Fantasy", "Slice of Life", "Slapstick", "Historical"], "tags": ["Adoption", "Adventure", "Alternative World", "Angst", "Animals", "Anti-War", "Based On A Novel", "Beast", "Boarding School", "Civil War"], "local": "images/kemono-no-souja-erin.jpg", "synopsis": "In the land of Ryoza, the neighboring provinces of Shin-Ou and Tai-Kou have been at peace. Queen Shinou is the ruler of Ryoza and her greatest general, Grand Duke Taikou, defends the kingdom with his army of powerful war-lizards known as the \"Touda.\" Although the two regions have enjoyed a long-standing alliance, mounting tensions threaten to spark a fierce civil war. Within Ake, a village in Tai-Kou tasked with raising the Grand Duke's army, lives Erin, a bright girl who spends her days watching the work of her mother Soyon, the village's head Touda doctor. But while under Soyon's care, a disastrous incident befalls the Grand Duke's strongest Touda, and the peace that Erin and her mother had been enjoying vanishes as Soyon is punished severely. In a desperate attempt to save her mother, Erin ends up falling in a river and is swept towards Shin-Ou. Unable to return home, Erin must learn to lead a new life with completely different people, all while hunting for the truth of both beasts and humanity itself, with tensions between the two regions constantly escalating. (Source: MAL Rewrite)"}, {"title": "Kimagure Orange Road: The Movie", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A493-1881373570.1505992510.jpg", "score": 8.17, "episodes": 1, "year": 1988, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": [], "producers": ["Shueisha", "Studio Pierrot", "Toho"], "duration_min": 68.0, "genres": ["Drama", "Romance"], "tags": ["Drama", "Love Triangle", "Romance"], "local": "images/kimagure-orange-road-movie.jpg", "synopsis": "After the TV-series of Kimagure Orange Road, Kyosuke and Madoka have finally arrived at the point where they are close to graduation and have to decide where they want to go to college. Naturally, they want to go together, so beside all the studying they also have to look for a proper college where they can enter both. Hikaru, still a year from graduating, wants to support Kyosuke as well and does that in her own way. But while she does that, Madoka feels jealous and tells her feelings to Kyosuke. And then Kyosuke has to take action to finally decide on the girl he loves... thus concluding the story of the Kimagure Orange Road. (Source: AniDB)"}, {"title": "Kimetsu no Yaiba: Kyoudai no Kizuna", "image": "https://media.kitsu.app/anime/poster_images/44388/small.jpg", "score": 8.17, "episodes": 1, "year": 2019, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["Ufotable, Inc."], "producers": ["Aniplex", "Shueisha", "Ufotable"], "duration_min": 120.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Horror", "Supernatural", "Historical"], "tags": ["Action", "Action Drama", "Adventure", "Asia", "Demon", "Demons", "Drama", "Earth", "Excessive Violence", "Fantasy"], "local": "images/kimetsu-no-yaiba-kyoudai-no-kizuna.jpg", "synopsis": "It is the Taisho Period in Japan. Tanjiro, a kindhearted boy who sells charcoal for a living, finds his family slaughtered by a demon. To make matters worse, his younger sister Nezuko, the sole survivor, has been transformed into a demon herself. Though devastated by this grim reality, Tanjiro resolves to become a “demon slayer” so that he can turn his sister back into a human, and kill the demon that massacred his family. (Source: Crunchyroll)"}, {"title": "Mononoke", "image": "https://cdn.myanimelist.net/images/anime/3/20713.jpg", "score": 8.17, "episodes": 12, "year": 2007, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Toei Animation Co., Ltd."], "producers": ["Asmik Ace Entertainment, Inc.", "Dentsu Inc.", "Discotek"], "duration_min": 22.0, "genres": ["Adventure", "Drama", "Fantasy", "Horror", "Mystery", "Supernatural", "Thriller", "Psychological", "Historical"], "tags": ["Abstract", "Adult Cast", "Adventure", "Angst", "Anthology", "Asia", "Body Horror", "Brother-Sister Incest", "Buddhism", "Carefree"], "local": "images/mononoke.jpg", "synopsis": "In feudal Japan, evil spirits known as mononoke plague both households and the countryside, leaving a trail of fear in their wake. One mysterious person has the power to slay the mononoke where they stand; he is known only as the Medicine Seller, and he vanquishes the spirits using the power of his Exorcism Sword. However, in order to draw his sword he must first understand the Form, Truth and Reason of the mononoke. Armed with a sharp wit and keen intellect, the Medicine Seller wanders from place to place, striking down the evil spirits in his wake. (Source: Discotek)"}, {"title": "No Game No Life", "image": "https://cdn.myanimelist.net/images/anime/1074/111944.jpg", "score": 8.17, "episodes": 12, "year": 2014, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Madhouse Inc."], "producers": ["At-X", "Frontier Works", "Kadokawa"], "duration_min": 23.0, "genres": ["Adventure", "Comedy", "Fantasy", "Supernatural", "Isekai"], "tags": ["Adventure", "Alternate Universe", "Alternate World", "Alternative World", "Asia", "Based On A Light Novel", "Battle Of Wits", "Board Games", "Brain Games And Gambling", "Card Games"], "local": "images/no-game-no-life.jpg", "synopsis": "Bored with life and considering the real world to be just a “crappy game,” savvy sibling shut-ins Sora and Shiro have withdrawn into their own fantasy world filled with video games. However, one day they find themselves summoned to another world by a boy who calls himself “God,” their abilities are about to be put to the ultimate test! Now not only their fates — but the fate of all of humanity — will be decided by a series of games that may just be the hardest these super-geniuses have ever faced! (Source: Sentai Filmworks, edited)"}, {"title": "Seirei no Moribito", "image": "https://cdn.myanimelist.net/images/anime/4/50337.jpg", "score": 8.17, "episodes": 26, "year": 2007, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["Atelier Musa", "Dentsu Inc.", "Fonishia"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Mystery", "Historical"], "tags": ["Action", "Adapted Into Jdrama", "Adapted Into Other Media", "Adults Are Useless", "Adventure", "Alternative Past", "Angst", "Asia", "Assassins", "Based On A Novel"], "local": "images/seirei-no-moribito.jpg", "synopsis": "Balsa’s prowess in battle is legendary, but the weight of death bears heavily on the spear-wielding mercenary’s soul. To atone, she has sworn to save 8 lives, no matter what the cost, and now only one life remains. Prince Chagum has been blessed with the power to stave off the droughts that threaten to starve and destroy his father’s empire, but he has been accused of being possessed by evil spirits, and court officials have set his own father against him. Condemned to death, he is saved by Balsa’s intervention and now, together, the two  "Drama", "Fantasy", "Slapstick"], "tags": ["Adventure", "Comedy", "Developing Powers", "Drama", "Fanservice", "Fantasy", "Fighting", "Navy", "Pirates", "Slapstick"], "local": "images/one-piece.jpg", "synopsis": "Gold Roger was known as the Pirate King, the strongest and most infamous being to have sailed the Grand Line. The capture and death of Roger by the World Government brought a change throughout the world. His last words before his death revealed the location of the greatest treasure in the world, One Piece. It was this revelation that brought about the Grand Age of Pirates, men who dreamed of finding One Piece (which promises an unlimited amount of riches and fame), and quite possibly the most coveted of titles for the person who found it, the title of the Pirate King. Enter Monkey D. Luffy, a 17-year-old boy that defies your standard definition of a pirate. Rather than the popular persona of a wicked, hardened, toothless pirate who ransacks villages for fun, Luffy’s reason for being a pirate is one of pure wonder; the thought of an exciting adventure and meeting new and intriguing people, along with finding One Piece, are his reasons of becoming a pirate. Following in the footsteps of his childhood hero, Luffy and his crew travel across the Grand Line, experiencing crazy adventures, unveiling dark mysteries and battling strong enemies, all in order to reach One Piece. *This includes the following special episodes: - Chopperman to the Rescue! Protect the TV Station by the Shore! (Episode 336) - The Strongest Tag-Team! Luffy and Toriko's Hard Struggle! (Episode 492) - Team Formation! Save Chopper (Episode 542) - History's Strongest Collaboration vs. Glutton of the Sea (Episode 590) - 20th Anniversary! Special Romance Dawn (Episode 907)"}, {"title": "Akatsuki no Yona: Zeno Kako-hen", "image": "https://cdn.anisearch.com/images/anime/cover/11/11235_600.webp", "score": 8.16, "episodes": 2, "year": 2016, "season": "SUMMER", "type": "OVA", "status": "FINISHED", "st a promise to meet them at the Koshien tournament, Goro comes back to his home town once again in an attempt to join up with his old friends. Only this time, things aren't as easy to get back in the groove of."}, {"title": "Major S4", "image": "https://cdn.myanimelist.net/images/anime/9/75217.jpg", "score": 8.16, "episodes": 26, "year": 2008, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Synergy Sp", "Synergysp Co. ,Ltd."], "producers": ["Nhk Enterprises", "Shogakukan Productions", "Shogakukan-Shueisha Productions"], "duration_min": 24.0, "genres": ["Adventure", "Comedy", "Drama", "Sports"], "tags": ["Adoption", "Adventure", "Ambitious", "Americas", "Asia", "Baseball", "Based On A Manga", "Comedy", "Coming Of Age", "Drama"], "local": "images/major-s4.jpg", "synopsis": "Next season of Major. After the final game of his Seishuu team against the goal he set himself, Kaidou - the team he left to play against, Gorou has no feelings of remorse anymore. Again he decides to take a step forward and challenge himself. Saying one more time good bye to Shimizu and his friends, he leaves for the USA, where he plans on competing in the Minor League. This is where Season 4 starts, in a country that`s foreign to him, a baseball style that`s unknown to him and new friends and strong rivals who share the same love to the game as him. Accompany Gorou in his neverending quest for new challenges. (Source: AniDB)"}, {"title": "Precure All Stars Movie F", "image": "https://cdn.myanimelist.net/images/anime/1959/137024.jpg", "score": 8.16, "episodes": 1, "year": 2023, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Toei Animation Co., Ltd."], "producers": ["Abc Animation", "Adk Emotions", "Bandai Co., Ltd."], "duration_min": 72.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Mystery", "Supernatural", "Isekai"], "tags": ["Action", "Adventure", "Agender", "Aliens", "Amnesia", "Animals", "Archery", "Coastal", "Crossover", "Cute Girls Doing Cute Things"], "local": "images/precure-all-stars-movie-f.jpg"}, {"title": "Seishun Buta Yarou wa Randoseru Girl no Yume wo Minai", "image": "https://cdn.myanimelist.net/images/anime/1937/138379.jpg", "score": 8.16, "episodes": 1, "year": 2023, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Cloverworks Inc."], "producers": ["Abc Animation", "Aniplex", "Bs11"], "duration_min": 74.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Supernatural", "Psychological"], "tags": ["Acting", "Alternate Universe", "Based On A Light Novel", "Comedy", "Coming Of Age", "Contemporary Fantasy", "Drama", "Family Life", "Heterosexual", "High School"], "local": "images/seishun-buta-yarou-wa-randoseru-girl-no-yume-wo-minai.jpg", "synopsis": "March begins, and there is only one month left in the third term. Sakuta Azusagawa is about to celebrate the graduation of his girlfriend Mai Sakurajima. As he waits for Mai at Shichirigahama beach, an elementary school-aged girl who looks like Mai did when she was a child actress appears in front of him. While reflecting on this mysterious encounter, he receives a phone call from his father. Kaede’s mother never came to terms with what happened to Kaede. Having been hospitalized for so long, their mother finally wants to see her daughter. To fulfill their mother’s wish, Sakuta makes the decision to meet face-to-face–something they haven’t done in a long time. He’s unable to hide his nervousness about all this. Never-before-seen scars begin to appear on Sakuta’s body. Could these be warning signs of a new type of puberty syndrome? (Source: Fathom Events)"}, {"title": "Tate no Yuusha no Nariagari", "image": "https://cdn.myanimelist.net/images/anime/1490/101365.jpg", "score": 8.16, "episodes": 25, "year": 2019, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Kinema Citrus Co., Ltd."], "producers": ["At-X", "Crunchyroll Sc Anime Fund", "Frontier Works"], "duration_min": 24.0, "genres": ["Action", e a boy named Maru to a place called Heaven. (Source: Disney+, edited)"}, {"title": "Tokyo Godfathers", "image": "https://cdn.myanimelist.net/images/anime/1480/132791.jpg", "score": 8.16, "episodes": 1, "year": 2003, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Madhouse Inc."], "producers": ["Dentsu Inc.", "Genco", "Madhouse"], "duration_min": 92.0, "genres": ["Adventure", "Comedy", "Drama", "Slice of Life"], "tags": ["Adult Cast", "Adventure", "Angst", "Asia", "Award Winning", "Cgi", "Childcare", "Christmas", "Class Struggle", "Comedy"], "local": "images/tokyo-godfathers.jpg", "synopsis": "In modern-day Tokyo, three homeless people’s lives are changed forever when they discover a baby girl at a garbage dump on Christmas Eve. As the New Year fast approaches, these three forgotten members of society band together to solve the mystery of the abandoned child and the fate of her parents. Along the way, encounters with seemingly unrelated events and people force them to confront their own haunted pasts, as they learn to face their future, together. (Source: Shout! Factory) Note: The film received an early premiere at the Big Apple Anime Fest on August 30, 2003."}, {"title": "Voltron: Legendary Defender Season 6", "image": "https://media.kitsu.app/anime/poster_images/41012/small.jpg", "score": 8.16, "episodes": 7, "year": 2018, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": ["Dreamworks", "Studio Mir"], "producers": ["Netflix"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Sci-Fi", "Mecha"], "tags": ["Action", "Adventure", "Alien", "Anime Influenced", "Humanoid Alien", "Mecha", "Piloted Robot", "Science Fiction", "Space", "Transforming Craft"], "local": "images/voltron-legendary-defender-season-6.jpg"}, {"title": "xxxHOLiC◆Kei", "image": "https://cdn.myanimelist.net/images/anime/9/8626.jpg", "score": 8.16, "episodes": 13, "year": 2008, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Production e Ye Fan finds himself surrounded by enemies and pressure from all sides. Amid escalating tensions, the conflict between the Desolate Ancient Sacred Physique and the inheritance of ancient chaotic traditions erupts. In this battle of geniuses, the question remains—who truly possesses the bearing of a future Great Emperor? (Source: Tencent, translated)"}, {"title": "Black Lagoon", "image": "https://cdn.myanimelist.net/images/anime/1906/121592.jpg", "score": 8.15, "episodes": 12, "year": 2006, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Madhouse Inc."], "producers": ["Arts Pro", "Black Lagoon Production Team", "Funimation"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Drama", "Slice of Life", "Thriller"], "tags": ["Action", "Adult Cast", "Adults Are Useless", "Adventure", "Anti-Hero", "Asia", "Assassins", "Based On A Manga", "Bounty Hunter", "Collateral Damage"], "local": "images/cover_3526.jpg", "synopsis": "Okajima Rokuro is a Japanese businessman in a town full of Japanese businessmen. His normal day consists of social drinking with clients and being kicked around by his bosses. He finally gets a break though, as he's sent by his company to the tropical seas of Eastern China to deliver a disc. But his boat gets hijacked by a band of mercenaries hired to retrieve the disc. Rock (as he is newly dubbed by his captors) catches the interest of the only female merc Revy as she thinks he's worth a ransom, taking him hostage. However, the disc that was stolen has a terrible secret that's unknown to Rock, which causes massive confusion and chaos for both him and his kidnappers."}, {"title": "Boku no Hero Academia 7th Season", "image": "https://cdn.myanimelist.net/images/anime/1573/157212.jpg", "score": 8.15, "episodes": 21, "year": 2024, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Bones Inc."], "producers": ["Bones", "Dentsu", "Movic"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Sci-Fi", "Slapstick"], "tags": ["Action", "Action Comedy", "Adventure", "Anti-Hero", "Based On A Manga", "Bisexual", "Boarding School", "Comedy", "Coming-Of-Age", "Contemporary Fantasy"], "local": "images/cover_3765.jpg", "synopsis": "The seventh season of Boku no Hero Academia . Following an all-out battle with the Paranormal Liberation Front, it is difficult for the people of Japan to continue placing faith in their heroes. To combat the combined power of Tomura Shigaraki and All For One, All Might calls for his ally from the West—the strongest woman on the planet, Star and Stripe. However, All For One decides to intercept Star and her fleet to get his hands on her overpowered quirk before she can enter Japanese airspace. Although Endeavor, Hawks, and Best Jeanist are headed to the rendezvous point, Star makes a gamble in the present to save her comrades. (Source: MAL Rewrite) Note: The season was preceded by a 4-episode special titled 'Boku no Hero Academia: Memories' recapping events from the 6th season along with adding a few minutes of new material each episode."}, {"title": "Chainsaw Man PV", "image": "https://cdn.anime-planet.com/anime/primary/chainsaw-man-pv-1.webp", "score": 8.15, "episodes": 1, "year": 2021, "season": "UNDEFINED", "type": "ONA", "status": "FINISHED", "studios": ["Mappa"], "producers": [], "duration_min": 2.0, "genres": ["Action", "Fantasy", "Horror"], "tags": ["Action", "Based On A Manga", "Dark Fantasy", "Demons", "Fantasy", "Horror", "Promotional", "Shounen"], "local": "images/cover_4813.webp"}, {"title": "Douluo Dalu: Haishen Zhi Guang", "image": "https://media.kitsu.app/anime/poster_images/44624/small.jpg", "score": 8.15, "episodes": 13, "year": 2021, "season": "WINTER", "type": "ONA", "status": "FINISHED", "studios": ["Sparkly Key Animation Studio"], "producers": ["Tencent Penguin Pictures"], "duration_min": 20.0, "genres": ["Action", "Adventure", "Fantasy", "Romance", "Supernatural", "Historical"], "tags": ["3D Cg Animation", "Actio Love", "Boys' Love", "Cgi", "Comedy", "Coming Of Age"], "local": "images/given.jpg", "synopsis": "Tightly clutching his Gibson guitar, Mafuyu Satou steps out of his dark apartment to begin another day of his high school life. While taking a nap in a quiet spot on the gymnasium staircase, he has a chance encounter with fellow student Ritsuka Uenoyama, who berates him for letting his guitar's strings rust and break. Noticing Uenoyama's knowledge of the instrument, Satou pleads for him to fix it and to teach him how to play. Uenoyama eventually agrees and invites him to sit in on a jam session with his two band mates: bassist Haruki Nakayama and drummer Akihiko Kaji. Satou's voice is strikingly beautiful, filling Uenoyama with the determination to make Satou the lead singer of the band. Though reticent at first, Satou takes the offer after an emotional meeting with an old friend. With the support of his new friends, Satou must not only learn how to play guitar, but also come to terms with the mysterious circumstances that led him to be its owner. (Source: MAL Rewrite)"}, {"title": "Golden Kamuy 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1180/95018.jpg", "score": 8.15, "episodes": 12, "year": 2018, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Geno Studio Inc."], "producers": ["East Japan Marketing & Communications, Inc.", "Golden Kamuy Production Committee", "Good Smile Company"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Mystery", "Thriller", "Psychological", "Slapstick", "Historical"], "tags": ["Absurdist Humour", "Action", "Adult Cast", "Adventure", "Ainu", "Ainu Mythology", "Animal Abuse", "Animals", "Anti-Hero", "Archery"], "local": "images/golden-kamuy-2nd-season.jpg", "synopsis": "The high-stakes search for gold continues in the harsh wilderness of Hokkaido! More and more people seek the treasure map, and the race to find its living pieces is brutal as all get-out. War veteran Sugimoto and his guide to the wilds, Asirpa, are hot on the trail, and as long as they stick together through thick and thin—chitatap and miso—they’ve got a shot at finding that gold."}, {"title": "Kidou Senshi Gundam: The Origin", "image": "https://cdn.myanimelist.net/images/anime/4/72702.jpg", "score": 8.15, "episodes": 6, "year": 2015, "season": "WINTER", "type": "OVA", "status": "FINISHED", "studios": ["Sunrise Inc."], "producers": ["Cruise", "Shouchiku", "Sotsu"], "duration_min": 71.0, "genres": ["Action", "Comedy", "Drama", "Sci-Fi", "Mecha"], "tags": ["3D Cg Animation", "Action", "Action Drama", "Adoption", "Anti-Hero", "Bar", "Based On A Manga", "Basketball", "Cgi", "Comedy"], "local": "images/kidou-senshi-gundam-the-origin.jpg", "synopsis": "The first episode, Aoi Hitomi no Casval, tells the story of Casval Rem Deikun and Artesia Som Deikun (Char and Sayla, before Char became known as the Red Comet) before the One-Year War in UC.0068. The story for the second episode, Kanashimi no Artesia, moves three years ahead to U.C. 0071. The story will follow the tearful separation of the siblings Casval and Artesia (before they became known as Char and Sayla). It will also feature more of the development of the mobile suits, particularly on the Zeon side. The third episode, Akatsuki no Houki, follows the youth who would become known as Char Aznable and his future comrade Garma Zabi after they join the Zeons' military academy. (Source: Anime News Network)"}, {"title": "Kuroko no Basket 3rd Season", "image": "https://cdn.myanimelist.net/images/anime/4/68299.jpg", "score": 8.15, "episodes": 25, "year": 2015, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["Bandai Visual", "Banpresto", "Bs11"], "duration_min": 24.0, "genres": ["Comedy", "Sports", "Slapstick"], "tags": ["Asia", "Based On A Manga", "Basketball", "Club", "Comedy", "Competition", "Disability", "Dissociative Identities", "Earth", "Ensemble Cast"], "local": "images/kuroko-no-basket-3rd-season.jpg", "synopsis": "Following their triumph against Yousen High, Seirin's basketball team has reached the semifinals of the Winter Cup along with Kaijou, Rakuzan, and Shuutoku. Each of these teams possesses a member of the Generation of Miracles, and Seirin prepares to face the largest obstacles on their path to winning the Winter Cup. In the final season of Kuroko no Basket, Kuroko goes head-to-head with his old teammates once more as he attempts to show them that individual skill is not the only way to play basketball. His firm belief that his form of basketball, team play, is the right way to play the sport will clash with the talents of a perfect copy and an absolute authority. While Kuroko tries to prove that his basketball is \"right,\" he and the rest of Seirin High ultimately have one goal: to win the Winter Cup and overcome the strength of the Generation of Miracles, who have long dominated the scene of middle and high school basketball. (Source: MAL Rewrite)"}, {"title": "Legend of the Galactic Heroes: Die Neue These Fourth 2", "image": "https://cdn.anime-planet.com/anime/primary/legend-of-the-galactic-heroes-die-neue-these-fourth-2-1.webp", "score": 8.15, "episodes": 1, "year": 2022, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Production I.G"], "producers": [], "duration_min": 94.0, "genres": ["Action", "Drama", "Sci-Fi"], "tags": ["Action", "Adult Cast", "Based On A Novel", "Drama", "Military", "Outer Space", "Sci Fi", "Sci-Fi", "Sequel", "Space"], "local": "images/legend-of-the-galactic-heroes-die-neue-these-fourth-2.webp"}, {"title": "Magi: The Kingdom of Magic", "image": "https://cdn.myanimelist.net/images/anime/13/55039.jpg", "score": 8.15, "episodes": 25, "year": 2013, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["A-1 Pictures Inc."], "producers": ["A-1 Pictures", "Aniplex Of America", "Dentsu Inc."], "duration_min": 25.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Romance", "Slapstick", "Historical"], "tags": ["Action", "Adventure", "Alternative World", "Angst", "Anti-Hero", "Barefoot", "Based On A Manga", "Calling Your Attacks", "Class Struggle", "Clone"], "local": "images/magi-the-kingdom-of-magic.jpg", "synopsis": "After celebrating their victory against Al-Thamen, Aladdin and his friends depart the land of Sindria. With the end of the battle, however, comes the time for each of them to go their separate ways. Hakuryuu and Kougyoku are ordered to go back to their home country, the Kou Empire. Meanwhile Aladdin announces he needs to head for Magnostadt—a mysterious country ruled by magicians—to investigate the mysterious events occurring in this new kingdom and become more proficient in magic. For their part, encouraged by Aladdin's words, Alibaba and Morgiana also set off in pursuit of their own goals: training and going to her homeland, respectively. Magi: The Kingdom of Magic follows these friends as they all go about their separate adventures, each facing their own challenges. However, a new threat begins to rise as a great war looms over the horizon... [Written by MAL Rewrite]"}, {"title": "Mahou Shoujo Madoka★Magica Movie 1: Hajimari no Monogatari", "image": "https://cdn.myanimelist.net/images/anime/6/42331.jpg", "score": 8.15, "episodes": 1, "year": 2012, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Shaft Inc."], "producers": ["Aniplex Of America", "Hakuhodo Dy Media Partners", "Hobunsha"], "duration_min": 131.0, "genres": ["Action", "Drama", "Fantasy", "Thriller", "Psychological"], "tags": ["Action", "Aliens", "Angst", "Asia", "Coming Of Age", "Contemporary Fantasy", "Dark Fantasy", "Death", "Drama", "Earth"], "local": "images/mahou-shoujo-madoka-magica-movie-1-hajimari-no-monogatari.jpg"}, {"title": "No Doubt In Us: Part II", "image": "https://cdn.anime-planet.com/anime/primary/no-doubt-in-us-part-ii-1.webp", "score": 8.15, "episodes": 12, "year": 2021, "season": "UNDEFINED" vie", "Anime Industry", "Anthropomorphism", "Asia", "Award Winning", "Bowling"], "local": "images/shirobako.jpg", "synopsis": "Once upon a time, five girls made an animated film and it was so much fun that they pledged to get jobs in animation so that someday they could make another film together. Now, two years later, Aoi, Shizuka, Ema, Misa and Midori have learned the truth about the anime industry: it's not always fun, it's anything but easy, and having talent isn't always enough to open the right doors. Which is why Aoi's overwhelmed by her job as a production assistant, Shizuka's waiting on tables between auditions, Midori's currently scriptless, Misa's switched to C.G., and Ema's working long hours as a key animator. Is it what they imagined? No. But are they ready to give up? Not just yet! Sometimes, when things happen in animation, they can happen in the most wonderful ways! (Source: Sentai Filmworks)"}, {"title": "Steven Universe Season 4 Specials", "image": "https://media.kitsu.app/anime/poster_images/13424/small.jpg", "score": 8.15, "episodes": 5, "year": 2016, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": ["Cartoon Network Studios"], "producers": [], "duration_min": 3.0, "genres": ["Adventure", "Comedy", "Fantasy"], "tags": ["Adventure", "Anime Influenced", "Comedy", "Contemporary Fantasy", "Family", "Fantasy", "Friendship", "Kids", "United States"], "local": "images/steven-universe-season-4-specials.jpg"}, {"title": "Tian Guan Cifu", "image": "https://cdn.myanimelist.net/images/anime/1319/109301.jpg", "score": 8.15, "episodes": 11, "year": 2020, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": ["Haoliners Animation League"], "producers": ["Bilibili", "Red Dog Culture House", "Reddog Culture House"], "duration_min": 26.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Romance", "Supernatural", "Historical"], "tags": ["Action", "Adventure", "Afterlife", "Ancient China", "Asia", "Based On A Web Novel", Prefecture to brainstorm ideas suitable for an ideal date with Hayato Hayama. As the duo wanders from place to place without a plan, they seemingly enjoy each other's company. Yet, through these straightforward and sincere interactions, the meaning behind what it means to be genuine continues to intrigue Hachiman and his outlook for the future of the Volunteer Service Club and its members. (Source: MAL Rewrite) Note: Bundled with the limited edition of the Yahari Game demo Ore no Seishun Love Come wa Machigatteiru. Zoku PlayStation Vita game from 5pb."}, {"title": "You Shou Yan 3rd Season", "image": "https://cdn.myanimelist.net/images/anime/1102/142342.jpg", "score": 8.15, "episodes": 12, "year": 2024, "season": "SPRING", "type": "ONA", "status": "FINISHED", "studios": ["Fenz"], "producers": ["Bilibili"], "duration_min": 6.0, "genres": ["Comedy", "Fantasy", "Slice of Life"], "tags": ["Animal Protagonist", "Animal Protagonists", "Anthropomorphism", "Based On A Manga", "Chinese Animation", "Chinese Production", "Comedy", "Episodic", "Fantasy", "Found Family"], "local": "images/you-shou-yan-3rd-season.jpg", "synopsis": "The third season of You Shou Yan ."}, {"title": "Bakuman.", "image": "https://cdn.myanimelist.net/images/anime/6/26138.jpg", "score": 8.14, "episodes": 25, "year": 2010, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["J.C. Staff", "J.C.Staff Co., Ltd."], "producers": ["J.C.Staff", "Media Blasters", "Nhk Enterprises"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life"], "tags": ["Adapted Into Japanese Movie", "Adapted Into Other Media", "Aim For The Top", "Anime Industry", "Asia", "Based On A Manga", "Comedy", "Coming Of Age", "Confession", "Daily Life"], "local": "images/cover_2672.jpg", "synopsis": "Moritaka Mashiro and Akito Takagi are pretty much foils of each other. Mashiro, an average 9th grade student but talented artist, and Takagi, an overall advanced 9th grader and aspiring writer. After great convincing, Takagi convinces Mashiro to join him in becoming the greatest mangakas Japan has ever seen. Takagi, with his gift of writing, hopes to become a successful mangaka, and Mashiro, with his gift of art, hopes to marry the girl of his dreams, Azuki Miho. (Source: Anime News Network)"}, {"title": "Banana Fish", "image": "https://cdn.myanimelist.net/images/anime/1190/93472.jpg", "score": 8.14, "episodes": 24, "year": 2018, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Mappa Co., Ltd."], "producers": ["Aniplex", "Dentsu Inc.", "Dugout"], "duration_min": 22.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Mystery", "Thriller", "Psychological", "Slapstick"], "tags": ["Action", "Action Drama", "Adventure", "America", "Americas", "Angst", "Anti-Hero", "Assassins", "Awards", "Based On A Manga"], "local": "images/cover_2769.jpg", "synopsis": "Nature made Ash Lynx beautiful; nurture made him a cold ruthless killer. A runaway brought up as the adopted heir and sex toy of \"Papa\" Dino Golzine, Ash, now at the rebellious age of seventeen, forsakes the kingdom held out by the devil who raised him. But the hideous secret that drove Ash's older brother mad in Vietnam has suddenly fallen into Papa's insatiably ambitious hands—and it's exactly the wrong time for Eiji Okamura, a pure-hearted young photographer from Japan, to make Ash Lynx's acquaintance... (Source: VIZ Media)"}, {"title": "Blue Giant", "image": "https://cdn.myanimelist.net/images/anime/1958/132159.jpg", "score": 8.14, "episodes": 1, "year": 2023, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Nut Inc."], "producers": ["Shogakukan", "Toho Animation"], "duration_min": 119.0, "genres": ["Drama", "Slice of Life", "Music"], "tags": ["Asia", "Band", "Bar", "Based On A Manga", "Cgi", "Drama", "Earth", "Ensemble Cast", "Ganbatte", "High School"], "local": "images/cover_3651.jpg", "synopsis": "Dai Miyamoto's life is turned upside down the day he discovers jazz. A former high school basketball player, Dai picks up a saxophone and begins practicing day and night, determined to become one of the greatest of all time. He leaves his hometown Sendai for the bustling nightclubs of Tokyo, but soon finds the life of a professional musician is not for the faint of heart. His passion eventually wins over the cocky but talented pianist Yukinori, and after Dai convinces his friend Shunji to learn the drums, they launch a new jazz trio whose rough sound contains a raw energy that quickly wins attention from local audiences. But what does it take to truly be great? (Source: GKIDS)"}, {"title": "Full Metal Panic? Fumoffu", "image": "https://cdn.myanimelist.net/images/anime/4/75260.jpg", "score": 8.14, "episodes": 12, "year": 2003, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Kyoto Animation Co., Ltd."], "producers": ["Adv Films", "Ani Village", "Animation Do"], "duration_min": 24.0, "genres": ["Action", "Comedy", "Romance", "Slice of Life", "Mecha", "Slapstick"], "tags": ["Absurdist Humour", "Action", "Asia", "Based On A Light Novel", "Bullet Time", "Comedy", "Crime", "Dancing", "Delinquent", "Delinquents"], "local": "images/cover_9637.jpg", "synopsis": "It's back-to-school mayhem with Kaname Chidori and her war-freak classmate Sousuke Sagara as they encounter more misadventures in and out of Jindai High School. But when Kaname gets into some serious trouble, Sousuke takes the guise of Bonta-kun - the gun-wielding, butt-kicking mascot. And while he struggles to continue living as a normal teenager, Sousuke also has to deal with protecting his superior officer Teletha Testarossa, who has decided to take a vacation from Mithril and spend a couple of weeks as his and Kaname's classmate. (Source: Anime News Network)"}, {"title": "Ginga Eiyuu Densetsu: Die Neue These - Seiran 3", "image": "https://cdn.myanimelist.net/images/anime/1782/103917.jpg", "score": 8.14, "episodes": 4, "year": 2019, "season": "FALL", "type": "MOVIE",  with her, leaving Tomoe to pose as her at school. However, she has an ulterior motive for attending the Divine Assembly: to discover the whereabouts of the missing Lord Mikage, the former god of the shrine. After her adventures in Izumo, Nanami meets Botanmaru, a tengu child looking for someone she knows all too well—tengu turned goth idol Shinjirou Kurama. Botanmaru needs Shinjirou, their prince, to return home to Mount Kurama and stop the tyranny of Jirou, who has taken over the rule of their hometown. However, Nanami soon discovers a force much darker than Jirou is at work on the mountain. As a fledgling god becoming more accustomed to divinity, Nanami finds herself dealing with a tengu rebellion, her blooming feelings for Tomoe, and a strange man with ties to both Tomoe's past and Nanami's future. (Source: MAL Rewrite)"}, {"title": "Major: World Series", "image": "https://cdn.myanimelist.net/images/anime/5/75220.jpg", "score": 8.14, "episodes": 2, "year": 2011, "season": "FALL", "type": "OVA", "status": "FINISHED", "studios": ["Synergy Sp", "Synergysp Co. ,Ltd."], "producers": ["Synergysp"], "duration_min": 28.0, "genres": ["Comedy", "Drama", "Sports"], "tags": ["Ambitious", "Americas", "Baseball", "Based On A Manga", "Comedy", "Drama", "Earth", "Flashback", "Following One'S Dream", "Ganbatte"], "local": "images/major-world-series.jpg", "synopsis": "According to Weekly Shonen Sunday, a new OVA of manga \"Major\" was announced to be released in December. The World Series chapter, which was skipped in the TV series, will be animated. This OVA will be the final anime of Major. (Source: Scan of WSS)"}, {"title": "Mignon", "image": "https://cdn.myanimelist.net/images/anime/1054/137743.jpg", "score": 8.14, "episodes": 12, "year": 2023, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": ["Abj Company"], "producers": [], "duration_min": 5.0, "genres": ["Drama", "Fantasy", "Romance", "Sports", "Supernatural"], "tags": ["Adult Audience Only", "Bl", "Boxing", "Boys Love", "Boys' Love", "Combat Sport", "Doctors", "Drama", "Fantasy", "Hand To Hand Combat"], "local": "images/mignon.jpg", "synopsis": "After losing his parents at a young age, Mignon lives as a mechanic by day, and a cage fighter by night at an illegal arena. Living a life of exploitation and violence, the only person who gives him any attention is Oh Young-One, a doctor at the illegal arena. “I’ll do anything…! I… I can help you!” Despite knowing Young-One’s true identity, Mignon’s pure and blind love for him causes Young-One to start slowly opening his heart. But the hellish reality that surrounds Mignon starts to shake up even Young-One’s life!"}, {"title": "Nodame Cantabile: Paris-hen", "image": "https://cdn.myanimelist.net/images/anime/1896/147906.jpg", "score": 8.14, "episodes": 11, "year": 2008, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Genco", "J.C. Staff", "J.C.Staff Co., Ltd."], "producers": ["Asmik Ace Entertainment, Inc.", "Dentsu Inc.", "Fuji Television Network"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Music", "Slapstick"], "tags": ["Adapted Into Jdrama", "Adapted Into Other Media", "Adult Cast", "Adult Couples", "Band", "Based On A Manga", "Catchphrase", "Classical Music", "College", "Comedy"], "local": "images/nodame-cantabile-paris-hen.jpg", "synopsis": "Having been given the opportunity to study in Paris, Noda accompanies Chiaki to Europe as he strives to become the accomplished conductor he always dreamt to be. (Source: Anime News Network)"}, {"title": "Planetes", "image": "https://cdn.myanimelist.net/images/anime/1209/142900.jpg", "score": 8.14, "episodes": 26, "year": 2003, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Sunrise Inc."], "producers": ["Bandai Entertainment", "Bandai Visual", "Nhk"], "duration_min": 25.0, "genres": ["Adventure", "Comedy", "Drama", "Romance", "Sci-Fi", "Slice of Life"], "tags": ["Adult Cast", "Adventure", "Age Difference", "Angst", "Asia", "Astronauts", "Award Winning", "Based On A Manga", "Boy Meets Girl", "Comedy"], "local": "images/planetes.jpg", "synopsis": "In the year 2075, mankind has reached a point where journeying between Earth, the moon and the space stations is part of daily life. However, the progression of technology in space has also resulted in the problem of the space debris, which can cause excessive and even catastrophic damage to spacecrafts and equipment. This is the story of Technora's Debris Collecting section, its EVA worker, Hachirota \"Hachimaki\" Hoshino, and the newcomer to the group, Ai Tanabe. (Source: Anime News Network)"}, {"title": "She-Ra and the Princesses of Power", "image": "https://media.kitsu.app/anime/poster_images/41994/small.jpg", "score": 8.14, "episodes": 13, "year": 2018, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": ["Dreamworks"], "producers": ["Netflix"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Fantasy", "Sci-Fi"], "tags": ["Action", "Adventure", "Anime Influenced", "Comedy", "Fantasy", "Fantasy World", "Friendship", "Magic", "Science Fiction"], "local": "images/she-ra-and-the-princesses-of-power.jpg"}, {"title": "Shiguang Dailiren: Yingdu Pian", "image": "https://cdn.myanimelist.net/images/anime/1496/147189.jpg", "score": 8.14, "episodes": 6, "year": 2024, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": ["Cmc Media Inc.", "Shanghai Phantom"], "producers": ["Bedream", "Bilibili"], "duration_min": 32.0, "genres": ["Drama", "Fantasy", "Mystery", "Supernatural", "Thriller"], "tags": ["Adult Cast", "Age Regression", "Basketball", "Bisexual", "Body Swapping", "Bullying", "Chinese Animation", "Chinese Production", "Classic Literature", "College"], "local": "images/shiguang-dailiren-yingdu-pian.jpg", "synopsis": "In order to save the deceased Cheng Xiaoshi, Lu Guang returned to the beginning and started anew along the path of destiny. However, a photograph carrying clues about batics", "Action", "Action Comedy", "Adult Cast", "Adventure", "Alcohol", "Alien", "Aliens", "Alternative World", "Angst"], "local": "images/trigun.jpg", "synopsis": "Vash the Stampede is a wanted man with a habit of turning entire towns into rubble. The price on his head is a fortune, and his path of destruction reaches across the arid wastelands of a desert planet. Unfortunately, most encounters with the spiky-haired gunslinger don't end well for the bounty hunters who catch up with him; someone almost always gets hurt - and it's never Vash. Oddly enough, for such an infamous fugitive, there's no proof that he's ever taken a life. In fact, he's a pacifist with a doughnut obsession who's more doofus than desperado. There's a whole lot more to him than his reputation lets on - Vash the Stampede definitely ain't your typical outlaw. (Source: Funimation)"}, {"title": "Uni-President Suanmeitang x Tian Guan Ci Fu: Gong Chuang Liandong Duanpian", "image": "https://cdn.anime-planet.com/anime/primary/uni-president-suanmeitang-x-tian-guan-ci-fu-gong-chuang-liandong-duanpian-1.webp", "score": 8.14, "episodes": 1, "year": 2024, "season": "UNDEFINED", "type": "ONA", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 1.0, "genres": ["Fantasy"], "tags": ["Based On A Web Novel", "Chinese Animation", "Commercials", "Danmei", "Fantasy", "Food And Beverage", "Ghosts", "Gods", "Promotional"], "local": "images/uni-president-suanmeitang-x-tian-guan-ci-fu-gong-chuang-lian.webp"}, {"title": "Angel Beats!", "image": "https://cdn.myanimelist.net/images/anime/1244/111115.jpg", "score": 8.13, "episodes": 13, "year": 2010, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["P.A. Works Co., Ltd.", "P.A.Works"], "producers": ["Aniplex Of America", "Ascii Media Works", "Cbc Television"], "duration_min": 26.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Romance", "Supernatural", "Isekai", "Music", "Slapstick"], "tags": ["Absurdist Humour", "Absurdly Pow
