 turn them into bitter enemies and cement their destinies—one as the world’s strongest sorcerer, and the other its most twisted curse user! (Source: Crunchyroll)"}, {"title": "Kimi no Suizou wo Tabetai", "image": "https://cdn.myanimelist.net/images/anime/1768/93291.jpg", "score": 8.48, "episodes": 1, "year": 2018, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Studio Voln Co., Ltd."], "producers": ["Abc Animation", "Aniplex", "Asahi Shimbun"], "duration_min": 108.0, "genres": ["Drama", "Romance", "Slice of Life"], "tags": ["3D Cg Animation", "Achronological Order", "Asia", "Based On A Novel", "Be Careful What You Wish For", "Boy Meets Girl", "Cgi", "Character Driven", "Classic Literature", "Coming Of Age"], "local": "images/kimi-no-suizou-wo-tabetai.jpg", "synopsis": "Spring time in April and the last of the cherry blossoms are still in bloom. The usually aloof bookworm with no interest in others comes across a book in a hospital waiting room. Handwritten on the cover are the words: \"Living with Dying.\" He soon discovers that it is a diary kept by his very popular and genuinely cheerful classmate, Sakura Yamauchi, who reveals to him that she is secretly suffering from a pancreatic illness and only has a limited time left. It is at this moment that she gains just one more person to share her secret. Trying to maintain a normal life as much as possible, Sakura is determined to live her life to the fullest until the very last day. As her free spirit and unpredictable actions throw him for a loop, his heart begins to gradually change. (Source: Aniplex USA)"}, {"title": "Made in Abyss: Retsujitsu no Ougonkyou", "image": "https://cdn.myanimelist.net/images/anime/1864/122519.jpg", "score": 8.48, "episodes": 12, "year": 2022, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Kinema Citrus Co., Ltd."], "producers": ["At-X", "Cygames", "Global Solutions"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Horror", "Mystery", "Sci-Fi", "Psychological", "Slapstick"], "tags": ["Aboard Ship", "Achronological Order", "Action", "Adventure", "Alternative World", "Amnesia", "Amputation", "Android", "Androids", "Angst"], "local": "images/made-in-abyss-retsujitsu-no-ougonkyou.jpg", "synopsis": "The second season of Made in Abyss . Directly after the events of Made in Abyss: Fukaki Tamashii no Reimei , the third installment of Made in Abyss covers the adventures of Reg, Riko, and Nanachi in the Sixth Layer, The Capital of the Unreturned. Note: The last episode aired with a runtime of ~48 minutes as opposed to the standard 24 minute long episode."}, {"title": "Mushishi Zoku Shou: Suzu no Shizuku", "image": "https://cdn.myanimelist.net/images/anime/9/72689.jpg", "score": 8.48, "episodes": 1, "year": 2015, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["Animation Studio Artland Inc.", "Artland"], "producers": ["Aniplex", "Artland", "Delfi Sound"], "duration_min": 47.0, "genres": ["Adventure", "Drama", "Fantasy", "Horror", "Mystery", "Slice of Life", "Supernatural", "Psychological", "Historical"], "tags": ["Adult Cast", "Adventure", "Alternative Past", "Asia", "Based On A Manga", "Buddhism", "Contemporary Fantasy", "Countryside", "Curse", "Daily Life"], "local": "images/mushishi-zoku-shou-suzu-no-shizuku.jpg"}, {"title": "Natsume's Book of Friends", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A28839-3817974523.1725057216.jpg", "score": 8.48, "episodes": 12, "year": 2024, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Shuka"], "producers": ["Nas"], "duration_min": null, "genres": ["Drama", "Supernatural"], "tags": ["Drama", "Iyashikei", "Supernatural", "Youkai"], "local": "images/natsumes-book-of-friends.png", "synopsis": "Takashi Natsume and his loyal feline protector Madara take a trip to Hitoyoshi Kuma, a peaceful area in Kumamoto. From admiring the Kaname Falls to relaxing at the Tsurukame hot spring, the duo unwind and take in the beautiful scenery throughout the eventful day. (Source: MAL Rewrite)"}, {"title": "Ookami Kodomo no Ame to Yuki", "image": "https://cdn.myanimelist.net/images/anime/9/35721.jpg", "score": 8.48, "episodes": 1, "year": 2012, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Chizu, Inc.", "Madhouse", "Studio Chizu"], "producers": ["Chukyo Tv. Broadcasting Co., Ltd.", "D.N. Dream Partners", "Dentsu Inc."], "duration_min": 117.0, "genres": ["Drama", "Fantasy", "Romance", "Slice of Life", "Supernatural"], "tags": ["Agriculture", "Animal Characteristics", "Animal Transformation", "Animals", "Asia", "Award Winning", "Awards", "Beastman", "Childcare", "Coming Of Age"], "local": "images/ookami-kodomo-no-ame-to-yuki.jpg", "synopsis": "The theme of the film is the love between parents and children. The story covers 13 years and begins with a 19-year-old college student named Hana who encounters and falls in \"fairy tale-like\" love with a \"wolf man.\" After marrying the wolf man, Hana gives birth and raises two wolf children&mdash;an older sister named Yuki who was born on a snowy day, and a younger brother named Ame who was born on a rainy day. The four quietly lived in a corner of a city to conceal the existence of the \"wolf children,\" but when the wolf man suddenly dies, Hana decides to move to a rural town far removed from the city. (Source: Anime News Network)"}, {"title": "Spy x Family", "image": "https://cdn.myanimelist.net/images/anime/1441/122795.jpg", "score": 8.48, "episodes": 12, "year": 2022, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Cloverworks Inc.", "Wit Studio, Inc."], "producers": ["Shogakukan-Shueisha Productions", "Shueisha", "Spy×Family Production Committee"], "duration_min": 24.0, "genres": ["Action", "Comedy", "Drama", "Romance", "Slice of Life", "Supernatural", "Slapstick"], "tags": ["Action", "Action Comedy", "Adoption", "Assassin", "Assassins", "Award Winning", "Based On A Manga", "Bullying", "Canon Filler", "Childcare"], "local": "images/spy-x-family.jpg", "synopsis": "Everyone has a part of themselves they cannot show to anyone else. At a time when all nations of the world were involved in a fierce war of information happening behind closed doors, Ostania and Westalis had been in a state of cold war against one another for decades. The Westalis Intelligence Services' Eastern-Focused Division (WISE) sends their most talented spy, \"Twilight,\" on a top-secret mission to investigate the movements of Donovan Desmond, the chairman of Ostania's National Unity Party, who is threatening peace efforts between the two nations. This mission is known as \"Operation Strix.\" It consists of \"putting together a family in one week in order to infiltrate social gatherings organized by the elite school that Desmond's son attends.\" \"Twilight\" takes on the identity of psychiatrist Loid Forger and starts looking for family members. But Anya, the daughter he adopts, turns out to have the ability to read people's minds, while his wife, Yor, is an assassin! With it being in each of their own interests to keep these facts hidden, they start living together while concealing their true identities from one another. World peace is now in the hands of this brand-new family as they embark on an adventure full of surprises. (Source: Crunchyroll)"}, {"title": "ALIEN STAGE: PROLOGUE", "image": "https://cdn.anime-planet.com/anime/primary/alien-stage-prologue-1.webp", "score": 8.47, "episodes": 1, "year": 2022, "season": "UNDEFINED", "type": "ONA", "status": "FINISHED", "studios": ["Lico"], "producers": [], "duration_min": 2.0, "genres": ["Sci-Fi"], "tags": ["Korean Animation", "Sci Fi", "Shorts"], "local": "images/cover_1169.webp"}, {"title": "Dandadan", "image": "https://cdn.myanimelist.net/images/anime/1584/143719.jpg", "score": 8.47, "episodes": 12, "year": 2024, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Science Saru Inc."], "producers": ["Aniplex", "Dentsu", "Mainichi Broadcasting System"], "duration_min": 23.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Horror", "Mystery", "Romance", "Sci-Fi", "Supernatural", "Slapstick"], "tags": ["Achromatic", "Acrobatics", "Action", "Alien", "Alien Invasion", "Aliens", "Alternating Animation Style", "Angst", "Animeism", "Asia"], "local": "images/cover_6534.jpg", "synopsis": "This is a story about Momo, a high school girl who comes from a family of spirit mediums, and her classmate Okarun, an occult fanatic. After Momo rescues Okarun from being bullied, they begin talking. However, an argument ensues between them since Momo believes in ghosts but denies aliens exist, and Okarun believes in aliens but denies ghosts exist. To prove to each other what they believe in is real, Momo goes to an abandoned hospital where a UFO has been spotted and Okarun goes to a tunnel rumored to be haunted. To their surprise, they each encounter overwhelming paranormal activities that transcend comprehension. Amid these predicaments, Momo awakens her hidden power and Okarun gains the power of a curse to overcome these new dangers! Their fateful love begins as well!? The story of the occult battle and adolescence starts! (Source: Crunchyroll) Notes: - Worldwide premiere of Episode 1 before the Japanese television premiere occurred at Anime Expo July 6, 2024. - Episodes 1-3 titled as DAN DA DAN: FIRST ENCOUNTER was pre-screened in advance in theaters on August 31, 2024 in Asia, September 7, 2024 in Europe and September 13, 2024 in North America. The regular TV broadcast began October 4, 2024."}, {"title": "Fate/stay night Movie: Heaven's Feel - III. Spring Song", "image": "https://cdn.myanimelist.net/images/anime/1142/112957.jpg", "score": 8.47, "episodes": 1, "year": 2020, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Ufotable"], "producers": ["Aniplex Of America", "Kadokawa", "Notes"], "duration_min": 122.0, "genres": ["Action", "Drama", "Fantasy", "Romance", "Supernatural", "Thriller", "Psychological"], "tags": ["Action", "Adoption", "Anti-Hero", "Archery", "Assassins", "Based On A Visual Novel", "Based On An Eroge", "Battle Royale", "Body Horror", "Cgi"], "local": "images/cover_9052.jpg"}, {"title": "Fruits Basket 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1972/111635.jpg", "score": 8.47, "episodes": 25, "year": 2020, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["8 Pan", "8Pan", "Tms Entertainment Co., Ltd."], "producers": ["8Pan", "Avex Pictures", "Fruits Basket Production Committee"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Fantasy", "Romance", "Slice of Life", "Supernatural", "Psychological", "Slapstick"], "tags": ["3D Cg Animation", "Adoring Fan Club", "Age Gap", "Angst", "Animal Transformation", "Animals", "Asia", "Autumn", "Based On A Manga", "Bisexual"], "local": "images/cover_9530.jpg", "synopsis": "A year has passed since Tohru Honda began living in the Souma residence, and she has since created stronger relationships with its inhabitants Shigure, Kyou, and Yuki. She has also grown closer to the rest of the Souma family and has become familiar with their ancestral secret, having helped them with many of their personal issues. The closer Tohru gets, however, the more she begins to realize that their secret holds a darker truth than she first presumed. Summer is approaching and Tohru is invited to spend her days with the Soumas, mainly Kyou and Yuki. Tohru wishes for an easy-going vacation, but her close relationships with the two boys and the rest of the Soumas may prove to cause trouble. As they grow more intimate, their carefree time together is hindered by older hardships and feelings from the past that begin to resurface. The Eternal Banquet also dawns on the members of the zodiac, and they must tend to their duties alongside the unnerving head of the family, Akito Souma. With the banquet approaching and a plethora of feelings to be solved, will Tohru's life with the Soumas remain peaceful, or will she find herself in a situation from which she cannot escape?"}, {"title": "Gintama", "image": "https://cdn.myanimelist.net/images/anime/10/73274.jpg", "score": 8.47, "episodes": 201, "year": 2006, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Sunrise Inc."], "producers": ["Aniplex", "Audio Highs", "Crunchyroll"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Sci-Fi", "Slapstick", "Historical"], "tags": ["Action", "Adapted Into Japanese Movie", "Adapted Into Jdrama", "Adapted Into Other Media", "Adventure", "Alien", "Aliens", "Aliens Living On Earth", "Alternative Past", "Anachronism"], "local": "images/gintama.jpg", "synopsis": "Life isn't easy in feudal Japan... especially since the aliens landed and conquered everything! Oh sure, the new health care is great, but the public ban on the use of swords has left a lot of defeated samurai with a difficult decision to make concerning their future career paths! This is especially true if, as in the case of Gintoki Sakata, they're not particularly inclined towards holding a day job, which is why Gintoki's opted for the freelance route, taking any job that's offered to him as long as the financial remuneration sounds right. Unfortunately, in a brave new world filled with stray bug-eyed monsters, upwardly mobile Yakuza and overly ambitious E.T. entrepreneurs, those jobs usually don't pay as well as they should for the pain, suffering and indignities endured! (Source: Sentai Filmworks)"}, {"title": "Kimetsu no Yaiba", "image": "https://cdn.myanimelist.net/images/anime/1286/99889.jpg", "score": 8.47, "episodes": 26, "year": 2019, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Ufotable, Inc."], "producers": ["Aniplex Of America", "Shueisha", "Studio Mausu"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Horror", "Supernatural", "Thriller", "Slapstick", "Historical"], "tags": ["3D Cg Animation", "Action", "Action Drama", "Adventure", "Anachronisms", "Animals", "Asia", "Asymmetric Warfare", "Award Winning", "Awards"], "local": "images/kimetsu-no-yaiba.jpg", "synopsis": "It is the Taisho Period in Japan. Tanjiro, a kindhearted boy who sells charcoal for a living, finds his family slaughtered by a demon. To make matters worse, his younger sister Nezuko, the sole survivor, has been transformed into a demon herself. Though devastated by this grim reality, Tanjiro resolves to become a “demon slayer” so that he can turn his sister back into a human, and kill the demon that massacred his family. (Source: Crunchyroll)"}, {"title": "Kizumonogatari II: Nekketsu-hen", "image": "https://cdn.myanimelist.net/images/anime/1981/112812.jpg", "score": 8.47, "episodes": 1, "year": 2016, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Shaft"], "producers": ["Aniplex", "Kodansha", "Shaft"], "duration_min": 68.0, "genres": ["Action", "Drama", "Fantasy", "Mystery", "Supernatural", "Psychological"], "tags": ["Action", "Age Regression", "Anti-Hero", "Based On A Light Novel", "Body Horror", "Cgi", "Coming Of Age", "Drama", "Ecchi", "Fantasy"], "local": "images/kizumonogatari-ii-nekketsu-hen.jpg", "synopsis": "First season of the Monogatari Series, part 3/6. Contains the arc Koyomi Vamp from the Kizumonogatari light novel. In the spring of his second year of high school, Koyomi Araragi met the beautiful vampire Kiss-Shot Acerola-Orion Heart-Under-Blade. Koyomi saved Kiss-shot, who was on the verge of death with all four of her limbs cut off, but only at the expense of becoming her minion and a vampire. “In order to go back to being a human again, you must take back all of Kiss-shot’s limbs.” After receiving advice from Meme Oshino, an expert in the supernatural, Koyomi prepares to go into battle. Awaiting him are three powerful vampire hunters—Dramaturgy, a giant vampire hunter who is a vampire himself. Episode, a half-vampire who wields an enormous cross, and Guillotinecutter, a quiet man who specializes in killing vampires. Will Koyomi be able to take back Kiss-Shot’s limbs from the vampire hunters? Amidst the soft spring rain, the curtain rises on this fateful blood bath… (Source: Aniplex)"}, {"title": "Koukaku Kidoutai: Stand Alone Complex 2nd GIG", "image": "https://cdn.myanimelist.net/images/anime/1646/135390.jpg", "score": 8.47, "episodes": 26, "year": 2004, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["Bandai Entertainment", "Bandai Visual", "Dentsu Inc."], "duration_min": 25.0, "genres": ["Action", "Drama", "Mystery", "Sci-Fi", "Thriller", "Mecha", "Psychological"], "tags": ["Action", "Action Drama", "Adult Cast", "Android", "Androids", "Artificial Intelligence", "Asia", "Assassins", "Based On A Manga", "Bionic Powers"], "local": "images/koukaku-kidoutai-stand-alone-complex-2nd-gig.jpg", "synopsis": "In a futuristic world where the internet and cybernetics has blurred the borders between societies; the members of Public Security Section 9 are reinstated to assist in solving numerous cases of cyber crime. A spate of similar crimes committed by separate suicidal groups known as \"The Individual Eleven\" becomes the core focus for Section 9 as war approaches in the form of refugees flooding into the country. (Source: Anime News Network)"}, {"title": "Re:Zero kara Hajimeru Isekai Seikatsu: Shin Henshuu-ban", "image": "https://media.kitsu.app/anime/42903/poster_image/small-6e824557e126ca9ac8ce67ae8e31d37b.jpeg", "score": 8.47, "episodes": 13, "year": 2020, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["White Fox Co., Ltd."], "producers": [], "duration_min": 45.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Romance", "Thriller", "Isekai", "Psychological", "Historical"], "tags": ["Action", "Adventure", "Alternative World", "Demon", "Drama", "Elf", "Excessive Vio  Thanks to his short height, Hinata struggles to find his role on the team, even with his superior jumping power. Surprisingly, Kageyama has his own problems that only Hinata can help with, and learning to work together appears to be the only way for the team to be successful. Based on Haruichi Furudate's popular shounen manga of the same name, Haikyuu!! is an exhilarating and emotional sports comedy following two determined athletes as they attempt to patch a heated rivalry in order to make their high school volleyball team the best in Japan. [Written by MAL Rewrite]"}, {"title": "Hajime no Ippo: Rising", "image": "https://cdn.myanimelist.net/images/anime/6/56147.jpg", "score": 8.45, "episodes": 25, "year": 2013, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Madhouse Inc.", "Mappa Co., Ltd."], "producers": ["Kodansha", "Madhouse", "Mappa"], "duration_min": 22.0, "genres": ["Action", "Comedy", "Drama", "Sports", "Slapstick"], "tags": ["Action", "Athletics", "Based On A Manga", "Boxing", "Combat", "Combat Sport", "Combat Sports", "Comedy", "Drama", "Ensemble Cast"], "local": "images/hajime-no-ippo-rising.jpg", "synopsis": "Ippo continues to defend his Japanese Featherweight title from an ever stronger pool of challengers. Meanwhile, Takamura challenges for his second WBC title in the middleweight class, and Aoki challenges for the Japanese Lightweight title."}, {"title": "Jian Lai 2", "image": "https://s4.anilist.co/file/anilistcdn/media/anime/cover/medium/b205290-oc3SbEom5g7U.png", "score": 8.45, "episodes": 27, "year": 2025, "season": "WINTER", "type": "ONA", "status": "FINISHED", "studios": ["Cloud Art"], "producers": ["Tencent Penguin Pictures"], "duration_min": 31.0, "genres": ["Action", "Adventure", "Fantasy"], "tags": ["Action", "Adventure", "Fantasy", "Full Cgi"], "local": "images/jian-lai-2.png", "synopsis": "The second season of Jian Lai ."}, {"title": "Liaozhai: Lanre Si", "image": "https://cdn.myanimelist.net/images/anime/1111/156691.jpg", "score": 8.45, "episodes": 1, "year": 2025, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Light Chaser Animation Studios"], "producers": [], "duration_min": 151.0, "genres": ["Adventure", "Fantasy"], "tags": ["Adventure", "Based On A Novel", "Cg Animation", "Chinese Animation", "Fantasy"], "local": "images/liaozhai-lanre-si.jpg", "synopsis": "Adapted from the most outstanding collection of Chinese classical short stories. Pu Songling, a scholar, stays overnight at Lanruo Temple. He is caught by two monsters, Toad and Turtle, and brought to the bottom of an ancient well to judge the quality of his stories. In a temple, a well, and a tree, classic chapters of Strange Stories, such as The Taoist Priest of Mount Laoshan, Lotus Princess, Nie Xiaoqian, Painted Skin, and Lady Lu, unfold one after another across the vicissitudes of life. Six story styles present an audio-visual feast of the most bizarre stories, the most emotional and the most fateful."}, {"title": "Natsume Yuujinchou San", "image": "https://cdn.myanimelist.net/images/anime/8/82394.jpg", "score": 8.45, "episodes": 13, "year": 2011, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Brain'S Base"], "producers": ["Aniplex", "Brain'S Base", "Nas"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Fantasy", "Slice of Life", "Supernatural"], "tags": ["Adoption", "Afterlife", "Alcohol", "Animal Sidekick", "Archery", "Asia", "Based On A Manga", "Body And Host", "Body Takeover", "Bodyguards"], "local": "images/natsume-yuujinchou-san.jpg", "synopsis": "The third season of Natsume Yuujinchou . Takashi Natsume has always been shunned by those around him because of his mysterious ability to see yokai. Eventually, he came into possession of his grandmother Reiko’s “Book of Friends,” and together with his bodyguard Nyanko-sensei he set out to return the names of the yokai contained within it. Since then, he’s found a home with the Fujiwaras and surrounded himself with ontemporary Fantasy"], "local": "images/seishun-buta-yarou-wa-yumemiru-shoujo-no-yume-wo-minai.jpg", "synopsis": "In Fujisawa, where the skies are bright and the seas glisten, Sakuta Azusagawa is in his second year of high school. His blissful days with his girlfriend and upperclassman, Mai Sakurajima, are interrupted with the appearance of his first crush, Shouko Makinohara. For reasons unknown, he encounters two Shouko's: one in middle school and another who has become an adult. As Sakuta finds himself helplessly living with the Shouko's, the adult Shouko leads him around by the nose, causing a huge rift in his relationship with Mai. In the midst of all of this, he discovers that the middle school Shouko is suffering from a grave illness and his scar begins to throb... (Source: Aniplex USA)"}, {"title": "Shouwa Genroku Rakugo Shinjuu: Sukeroku Futatabi-hen", "image": "https://cdn.myanimelist.net/images/anime/1493/124765.jpg", "score": 8.44, "episodes": 12, "year": 2017, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Studio Deen Co., Ltd."], "producers": ["Dax Production", "King Records", "Kodansha"], "duration_min": 24.0, "genres": ["Drama", "Historical"], "tags": ["Acting", "Adult Cast", "Adult Couples", "Afterlife", "Age Gap", "Animeism", "Apprenticeship", "Based On A Manga", "Drama", "Elderly Protagonist"], "local": "images/shouwa-genroku-rakugo-shinjuu-sukeroku-futatabi-hen.jpg", "synopsis": "Unable to forget a performance of \"Shinigami\" performed by the rakugo master Yakumo in the prison where he was being held, Yotaro's first act upon his release was go right to the theater, where he begged, pleaded, and was finally accepted as Yakumo's live-in apprentice. After years of refining his art, Yotaro was promoted to the rank of Shinuchi and inherited the title of 3rd Generation Sukeroku. For the sake of his master Yakumo, Konatsu, and to change the image of Sukeroku inside them both, what kind of rakugo will Yotaro discover? This celebrate tion_min": 24.0, "genres": ["Action", "Drama", "Slice of Life", "Sports", "Historical"], "tags": ["Action", "Americas", "Anti-Hero", "Asia", "Bar", "Based On A Manga", "Body Image", "Boxing", "Class Struggle", "Combat"], "local": "images/cover_2080.jpg", "synopsis": "Yabuki Joe is left downhearted and hopeless after a certain tragic event. In attempt to put the past behind him, Joe leaves the gym behind and begins wandering. On his travels he comes across the likes of Wolf Kanagushi and Goromaki Gondo, men who unintentionally fan the dying embers inside him, leading him to putting his wanderings to an end. His return home puts Joe back on the path to boxing, but unknown to himself and his trainer, he now suffers deep-set issues holding him back from fighting. In attempt to quell those issues, Carlos Rivera, a world renowned boxer is invited from Venezuela to help Joe recover."}, {"title": "Cyberpunk: Edgerunners", "image": "https://cdn.myanimelist.net/images/anime/1818/126435.jpg", "score": 8.41, "episodes": 10, "year": 2022, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": ["Trigger Inc."], "producers": ["Cd Projekt Red", "Netflix"], "duration_min": 25.0, "genres": ["Action", "Drama", "Horror", "Romance", "Sci-Fi", "Thriller", "Psychological"], "tags": ["Action", "Advertisement", "Age Gap", "Alternative World", "Americas", "Anti-Hero", "Artificial Intelligence", "Bar", "Based On A Video Game", "Bionic Powers"], "local": "images/cover_6207.jpg", "synopsis": "An original anime series set in in the universe of Cyberpunk 2077 . Cyberpunk: Edgerunners tells a standalone, 10-episode story about a street kid trying to survive in a technology and body modification-obsessed city of the future. Having everything to lose, he chooses to stay alive by becoming an edgerunner—a mercenary outlaw also known as a cyberpunk. (Source: CD PROJEKT RED) Note: The first episode received a pre-screening at Anime Expo on July 2, 2022. The first 3 dubbed episodes were streamed on Twitch as part of a co-stream promotion on September 12, a day before the show’s premiere."}, {"title": "Hotaru no Haka", "image": "https://cdn.myanimelist.net/images/anime/1485/141208.jpg", "score": 8.41, "episodes": 1, "year": 1988, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["Studio Ghibli Inc."], "producers": ["Adv Films", "Central Park Media", "Sentai Filmworks"], "duration_min": 88.0, "genres": ["Drama", "Slice of Life", "Historical"], "tags": ["Adapted Into Japanese Movie", "Adapted Into Other Media", "Angst", "Anti War", "Anti-War", "Asia", "Autobiographical", "Autobiographies", "Based On Real Events", "Child Protagonists"], "local": "images/hotaru-no-haka.jpg", "synopsis": "In the aftermath of a World War II bombing, two orphaned children struggle to survive in the Japanese countryside. To Seita and his four-year-old sister, the helplessness and indifference of their countrymen is even more painful than the enemy raids. Through desperation, hunger and grief, these children's lives are as heartbreakingly fragile as their spirit and love is inspiring. (Source: Sentai Filmworks)"}, {"title": "JoJo no Kimyou na Bouken Part 4: Diamond wa Kudakenai", "image": "https://cdn.myanimelist.net/images/anime/3/79156.jpg", "score": 8.41, "episodes": 39, "year": 2016, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["David Production Inc."], "producers": ["Klockworx", "Medicos Entertainment", "One Music"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Mystery", "Supernatural", "Slapstick"], "tags": ["Achronological Order", "Action", "Adapted Into Japanese Movie", "Adapted Into Other Media", "Adventure", "Afterlife", "Aliens", "Asia", "Awards", "Based On A Manga"], "local": "images/jojo-no-kimyou-na-bouken-part-4-diamond-wa-kudakenai.jpg", "synopsis": "JoJo no Kimyou na Bouken: Diamond wa Kudakenai adapts the fourth part of the JoJo no Kimyou na Bouken manga series. It's the year rama", "Romance", "Slice of Life", "Music", "Slapstick"], "tags": ["3D Cg Animation", "Adult Cast", "Adult Couples", "Age Gap", "Angst", "Asia", "Band", "Based On A Manga", "Cgi", "College"], "local": "images/nana.jpg", "synopsis": "Two twenty-somethings seemingly share nothing in common apart from their first name, but a chance meeting on a train bound for Tokyo sets Nana Komatsu and Nana Oosaki on a collision course with destiny. Nana Komatsu, a love-at-first-sight dreamer, aims to find enduring happiness in the big city. Nana Oosaki, neo punk rock vocalist, pursues her burning ambitions of musical stardom and worldwide fame. As their fates increasingly intertwine, they each chase their dreams — until the harsh realities of life in big city Tokyo threaten to tear everything apart. (Source: Sentai Filmworks)"}, {"title": "Release That Witch (Web)", "image": "https://simkl.in/posters/18/18927308878bb38e9e_m.webp", "score": 8.4, "episodes": 8, "year": 2026, "season": "WINTER", "type": "ONA", "status": "FINISHED", "studios": ["Thundray"], "producers": ["China Literature Limited", "Tencent Animation & Comics", "Tencent Penguin Pictures"], "duration_min": 25.0, "genres": ["Fantasy", "Isekai"], "tags": ["Alternative Past", "Chinese Production", "Fantasy", "Feudal Warfare", "Isekai", "Male Protagonist", "Past", "Plot Continuity", "Speculative Fiction", "Time"], "local": "images/release-that-witch-web.webp"}, {"title": "Space Battleship Yamato 2199", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A13765-3969446414.1417423808.jpg", "score": 8.4, "episodes": 1, "year": 2012, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["Aic", "Xebec"], "producers": ["Aic", "Bandai Co., Ltd.", "Bandai Namco Games"], "duration_min": 50.0, "genres": ["Sci-Fi"], "tags": ["Science Fiction"], "local": "images/space-battleship-yamato-2199.png", "synopsis": "The year is 2199. The human race has been crushed in their war with the Gamilos, driven into g Films"], "producers": ["Avex Pictures", "Crunchyroll", "Dugout"], "duration_min": 23.0, "genres": ["Adventure", "Comedy", "Drama", "Fantasy", "Slapstick"], "tags": ["Achromatic", "Adventure", "Alternative World", "Apprenticeship", "Based On A Manga", "Body Horror", "Comedy", "Coming Of Age", "Conspiracy", "Countryside"], "local": "images/tongari-boushi-no-atelier.jpg", "synopsis": "In a world where everyone takes wonders like magic spells and dragons for granted, Coco is a girl with a simple dream: she wants to be a witch. But everybody knows magicians are born, not made, and Coco was not born with a gift for magic. Resigned to her un-magical life, Coco is about to give up on her dream to become a witch … until the day she meets Qifrey, a mysterious, traveling magician. After secretly seeing Qifrey perform magic in a way she’s never seen before, Coco soon learns what everybody “knows” might not be the truth, and discovers that her magical dream may not be as far away as it may seem... (Source: Kodansha USA) Note: Tongari Boushi no Atelier episode 2 was streamed a week in advance on Crunchyroll, ABEMA, and Netflix, alongside episode 1. Streaming is one week ahead of the TV broadcast."}, {"title": "Usagi Drop", "image": "https://cdn.myanimelist.net/images/anime/1460/98853.jpg", "score": 8.4, "episodes": 11, "year": 2011, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["Dentsu", "Fonishia", "Fuji Pacific Music Publishing"], "duration_min": 22.0, "genres": ["Comedy", "Drama", "Slice of Life"], "tags": ["3D Cg Animation", "Adapted Into Japanese Movie", "Adapted Into Other Media", "Adoption", "Angst", "Asia", "Babysitting", "Based On A Manga", "Buddhism", "Cgi"], "local": "images/usagi-drop.jpg", "synopsis": "Going home from his grandfather's funeral, thirty-year-old Daikichi is floored to discover that the old man had an illegitimate child with a younger lover. The rest of his family is equally shocked and embarrassed by this surprise development, and not one of them wants anything to do with the silent little girl, Rin Kaga. In a fit of anger, Daikichi decides to take her in himself. As Daikichi nurtures Rin, he started to understand the struggle while at the same time the joy of parenting. (Source: Anime News Network)"}, {"title": "Violet Evergarden Gaiden: Eien to Jidou Shuki Ningyou", "image": "https://cdn.myanimelist.net/images/anime/1667/112943.jpg", "score": 8.4, "episodes": 1, "year": 2019, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Kyoto Animation Co., Ltd."], "producers": ["Abc Animation", "Bandai Namco Arts", "Kyoto Animation"], "duration_min": 91.0, "genres": ["Drama", "Fantasy", "Romance", "Sci-Fi", "Slice of Life", "Psychological", "Historical"], "tags": ["Alternative Past", "Based On A Light Novel", "Character Driven", "College", "Coming-Of-Age", "Contemplation", "Daily Life", "Disability", "Disaster", "Drama"], "local": "images/violet-evergarden-gaiden-eien-to-jidou-shuki-ningyou.jpg", "synopsis": "Violet Evergarden comes to a private women's academy to tutor Isabella in the ways of being a lady. Heir to the York family, Isabella feels trapped in this new and uncomfortable world. She still grieves for the only person to ever bring her happiness – now lost to her. Violet's lessons do give her a brief respite from the melancholy but with the absence of joy, how long does it take to truly heal? (Source: Funimation)"}, {"title": "Zhu Xian 3rd Season", "image": "https://cdn.myanimelist.net/images/anime/1953/150409.jpg", "score": 8.4, "episodes": 26, "year": 2025, "season": "SPRING", "type": "ONA", "status": "FINISHED", "studios": ["Cloud Art"], "producers": ["Tencent Penguin Pictures", "Tencent Video"], "duration_min": 20.0, "genres": ["Action", "Adventure", "Fantasy", "Historical"], "tags": ["Action", "Adventure", "Based On A Novel", "Cg Animation", "Cg-Anime", "Chinese Animation", "Chinese Production", "Fantasy", "Full Cgi", "Historical"], "local": "images/zhu-xian-3rd-season.jpg", "synopsis": "The third season of Zhu Xian ."}, {"title": "Zoku Natsume Yuujinchou", "image": "https://cdn.myanimelist.net/images/anime/4/79738.jpg", "score": 8.4, "episodes": 13, "year": 2009, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Brain'S Base"], "producers": ["Aniplex", "Brain'S Base", "Hakusensha"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Fantasy", "Slice of Life", "Supernatural"], "tags": ["Adoption", "Afterlife", "Animal Abuse", "Animal Sidekick", "Asia", "Based On A Manga", "Bionic Powers", "Bodyguards", "Bullying", "Cats"], "local": "images/zoku-natsume-yuujinchou.jpg", "synopsis": "The second season of Natsume Yuujinchou . As with its prequel, Zoku Natsume Yuujinchou is about Natsume Takashi, a boy who has had the ability to see youkai since he was young, and his bodyguard youkai, Madara, nicknamed Nyanko-sensei. Natsume attempts to return names written in his Book of Friends, which he inherited from his grandmother Reiko, to youkai in his village. Throughout these adventures, he meets some youkai that are friendly, some that want to steal the Book of Friends, and some that want to kill him. Natsume learns about himself and his relationship with youkai along the way. (Source: MAL Rewrite)"}, {"title": "Ansatsu Kyoushitsu 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/8/77966.jpg", "score": 8.39, "episodes": 25, "year": 2016, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Lerche"], "producers": ["Avex Pictures", "Dax Production", "Dentsu Inc."], "duration_min": 23.0, "genres": ["Action", "Comedy", "Drama", "Sci-Fi", "Supernatural"], "tags": ["Action", "Action Comedy", "Angst", "Anti-Hero", "Assassin", "Assassins", "Based On A Manga", "Brainwashing", "Bullying", "Comedy"], "local": "images/cover_1605.jpg", "synopsis": "The second season of Ansatsu Kyoushitsu . The students return as school is back in session for the second semester. Following their exploits on the island during summer vacation, Class 3-E continues to sharpen their blades with their sights set on their teacher, the slippery Koro-sensei. They have more to worry about than just their teacher, however, as enemy assassins, both old and new, are out for the increased bounty on the octopus' head. Moreover, their rivals in Class A, as well as Kunugigaoka Junior High's fearsome principal, stand to block Class E from achieving academic excellence. With all of these obstacles opposing them, the group must continue to work together in order to overcome their foes and accomplish their goal of successfully assassinating their teacher."}, {"title": "Avatar: The Last Airbender Book 1: Water", "image": "https://media.kitsu.app/anime/poster_images/7936/small.jpg", "score": 8.39, "episodes": 20, "year": 2005, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": [], "producers": ["Nickelodeon Animation Studios"], "duration_min": 22.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy"], "tags": ["Action", "Adventure", "Anime Influenced", "Comedy", "Drama", "Fantasy", "Fantasy World", "Martial Arts", "Super Power"], "local": "images/cover_2263.jpg"}, {"title": "Avatar: The Last Airbender Book 2: Earth", "image": "https://media.kitsu.app/anime/poster_images/7937/small.jpg", "score": 8.39, "episodes": 20, "year": 2006, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": [], "producers": ["Nickelodeon Animation Studios"], "duration_min": 22.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy"], "tags": ["Action", "Adventure", "Anime Influenced", "Comedy", "Drama", "Fantasy", "Fantasy World", "Martial Arts", "Super Power"], "local": "images/cover_2264.jpg"}, {"title": "Bleach: Sennen Kessen-hen - Soukoku-tan", "image": "https://cdn.myanimelist.net/images/anime/1595/144074.jpg", "score": 8.39, "episodes": 14, "year": 2024, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Pierrot Co., Ltd.", "Pierrot Films"], "producers": ["Aniplex", "Dentsu Inc.", "Shueisha"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Supernatural", "Thriller", "Psychological"], "tags": ["Achromatic", "Action", "Adventure", "Afterlife", "Archery", "Based On A Manga", "Body Horror", "Calling Your Attacks", "Comedy", "Conspiracy"], "local": "images/cover_3579.jpg", "synopsis": "The third part of BLEACH: Sennen Kessen-hen . After an awe-inspiring battle with Ichibei Hyousube—leader of the Soul Society's Royal Guard—the powerful Yhwach moves into the final stage of his master plan. He aims to slay the Soul King, the being whose very existence maintains the status quo of three worlds: Hueco Mundo, the Soul Society, and the realm of humans that Ichigo Kurosaki and his closest friends hail from. Conquering his own bout with the remainder of the Royal Guard, Uryuu Ishida joins Yhwach in his efforts to create a new world in his image. With a flood of resolution and newfound power, Ichigo rushes to stop Yhwach from accomplishing his ultimate goal and save the countless lives within the three existing realms. But Ichigo has a complicated lineage, one that leaves him susceptible to Yhwach's sinister influence. Meanwhile, in a final desperate gambit, Jirou Sakuranosuke Shunsui Kyouraku, the newly promoted head captain of the Soul Society's combat corps, enlists the help of an old enemy whose immense power may turn the tide of battle. [Written by MAL Rewrite]"}, {"title": "Haikyu!!", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A18459-1066827729.1476392309.jpg", "score": 8.39, "episodes": 10, "year": 2016, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Production I.G"], "producers": ["Haikyu!! Karasuno Kōkō Vs Shiratorizawa Gakuen Kōkō Production Committee"], "duration_min": 22.0, "genres": ["Sports"], "tags": ["Sports", "Tournament", "Volleyball"], "local": "images/haikyuu.png", "synopsis": "Inspired after watching a volleyball ace nicknamed \"Little Giant\" in action, small-statured Shouyou Hinata revives the volleyball club at his middle school. The newly-formed team even makes it to a tournament; however, their first match turns out to be their last when they are brutally squashed by the \"King of the Court,\" Tobio Kageyama. Hinata vows to surpass Kageyama, and so after graduating from middle school, he joins Karasuno High School's volleyball team—only to find that his sworn rival, Kageyama, is now his teammate. Thanks to his short height, Hinata struggles to find his role on the team, even with his superior jumping power. Surprisingly, Kageyama has his own problems that only Hinata can help with, and learning to work together appears to be the only way for the team to be successful. Based on Haruichi Furudate's popular shounen manga of the same name, Haikyuu!! is an exhilarating and emotional sports comedy following two determined athletes as they attempt to patch a heated rivalry in order to make their high school volleyball team the best in Japan. [Written by MAL Rewrite]"}, {"title": "Hunter x Hunter", "image": "https://cdn.myanimelist.net/images/anime/1305/132237.jpg", "score": 8.39, "episodes": 62, "year": 1999, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Nippon Animation Co., Ltd."], "producers": ["Fuji Tv", "Nippon Animation", "Shueisha"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy"], "tags": ["Action", "Adventure", "Alternative Present", "Alternative World", "Assassins", "Based On A Manga", "Bionic Powers", "Child Protagonists", "Comedy", "Crime"], "local": "images/hunter-x-hunter.jpg", "synopsis": "A Hunter is one who travels the world doing all sorts of dangerous tasks. From capturing criminals to searching deep within uncharted lands for any lost treasures. Gon is a young boy whose father disappeared long ago, being a Hunter. He believes if he could also follow his father's path, he could one day reunite with him. After becoming 12, Gon leaves his home and takes on the task of entering the Hunter exam, notorious for its low success rate and high probability of death to become an official Hunter. He befriends the revenge-driven Kurapika, the doctor-to-be Leorio and the rebellious ex-assassin Killua in the exam, with their friendship prevailing throughout the many trials and threats they come upon taking on the dangerous career of a Hunter. Based on the manga by Togashi Yoshihiro."}, {"title": "Kimetsu no Yaiba: Mugen Ressha-hen", "image": "https://cdn.myanimelist.net/images/anime/1065/118763.jpg", "score": 8.39, "episodes": 7, "year": 2021, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Ufotable, Inc."], "producers": ["Aniplex Of America", "Shueisha", "Ufotable"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Horror", "Mystery", "Supernatural", "Thriller", "Slapstick", "Historical"], "tags": ["Action", "Action Drama", "Adventure", "Angst", "Asia", "Based On A Manga", "Body Horror", "Call My Name", "Calling Your Attacks", "Cannibalism"], "local": "images/kimetsu-no-yaiba-mugen-ressha-hen.jpg", "synopsis": "This Demon Slayer movie sees Tanjiro Kamado and friends from the Demon Slayer corps board the Infinity Train on a new mission to investigate a mysterious series of disappearances, perpetrated by a demon who has been tormenting people and killing the demon slayers who oppose it."}, {"title": "Natsume Yuujinchou Go", "image": "https://cdn.myanimelist.net/images/anime/11/81755.jpg", "score": 8.39, "episodes": 11, "year": 2016, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Shuka Inc."], "producers": ["Aniplex", "Hakusensha", "Nas"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Fantasy", "Slice of Life", "Supernatural", "Slapstick"], "tags": ["Adoption", "Asia", "Based On A Manga", "Bodyguards", "Cats", "Comedy", "Coming Of Age", "Contemporary Fantasy", "FINISHED", "studios": ["Madhouse Inc."], "producers": ["A Place Further Than The Universe Production Committee", "At-X", "Crunchyroll Sc Anime Fund"], "duration_min": 23.0, "genres": ["Adventure", "Comedy", "Drama", "Slice of Life", "Slapstick"], "tags": ["3D Cg Animation", "Acting", "Adventure", "Antarctic", "Antarctica", "Asia", "Australia", "Awards", "Broken Friendship", "Bullying"], "local": "images/sora-yori-mo-tooi-basho.jpg", "synopsis": "Mari Tamaki is in her second year of high school and wants to start something. It's then that she meets Shirase, a girl with few friends who's considered weirdo by the rest of the class and nicknamed \"Antarctic\" since it's all she ever talks about. Unlike her peers, Mari is moved by Shirase's dedication and decides that even though it's unlikely that high school girls will ever go to Antarctica, she's going to try to go with Shirase. (Source: Anime News Network)"}, {"title": "Spider-Man: Into The Spider-Verse", "image": "https://media.kitsu.app/anime/42218/poster_image/small-c71062d574e48184148ab1e3c77f423c.jpeg", "score": 8.39, "episodes": 1, "year": 2018, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 126.0, "genres": ["Action", "Sci-Fi"], "tags": ["Action", "Anime Influenced", "New York", "Parallel Universe", "Science Fiction", "Super Power", "Superhero"], "local": "images/spider-man-into-the-spider-verse.jpeg"}, {"title": "Tengen Toppa Gurren Lagann Movie 2: Lagann-hen", "image": "https://cdn.myanimelist.net/images/anime/12/19698.jpg", "score": 8.39, "episodes": 1, "year": 2009, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["Gainax Co., Ltd."], "producers": ["Aniplex Of America", "Dentsu Inc.", "Gainax"], "duration_min": 125.0, "genres": ["Action", "Comedy", "Drama", "Romance", "Sci-Fi", "Mecha"], "tags": ["Absurdist Humour", "Action", "Alien", "Aliens", "Alternate Universe", "Alternative World", "Ancient Aliens", "Animal Sidekick", "Anthropomorphism", "Bridge Bunnies"], "local": "images/tengen-toppa-gurren-lagann-movie-2-lagann-hen.jpg"}, {"title": "Tensei shitara Slime Datta Ken 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1271/109841.jpg", "score": 8.39, "episodes": 12, "year": 2021, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["8 Bit", "8-Bit", "8Bit Corp, Inc."], "producers": ["Adk Marketing Solutions", "Bandai Namco Arts", "Bandai Spirits"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Fantasy", "Isekai", "Slapstick"], "tags": ["3D Cg Animation", "Action", "Adventure", "Agender", "Alcohol", "Alternative World", "Anti-Hero", "Based On A Manga", "Beastman", "Calling Your Attacks"], "local": "images/tensei-shitara-slime-datta-ken-2nd-season.jpg", "synopsis": "The second season of Tensei Shitara Slime Datta Ken . Now that the Jura Tempest Alliance is growing even further, they will now be meeting the animal kingdom of Eurazania, reuniting with King Gazel, rising tensions between monsters and humans, and Rimuru encountering the strongest enemy he’s ever faced. (Source: Funimation)"}, {"title": "You Shou Yan 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1350/136787.jpg", "score": 8.39, "episodes": 12, "year": 2023, "season": "SPRING", "type": "ONA", "status": "FINISHED", "studios": ["Fenz"], "producers": ["Bilibili"], "duration_min": 6.0, "genres": ["Comedy", "Fantasy", "Slice of Life"], "tags": ["Animal Protagonists", "Anthropomorphism", "Based On A Manga", "Chinese Animation", "Chinese Production", "Comedy", "Episodic", "Fantasy", "Found Family", "Iyashikei"], "local": "images/you-shou-yan-2nd-season.jpg", "synopsis": "The second season of You Shou Yan ."}, {"title": "Bleach: Sennen Kessen-hen - Ketsubetsu-tan", "image": "https://cdn.myanimelist.net/images/anime/1164/138058.jpg", "score": 8.38, "episodes": 13, "year": 2023, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Pierrot Co., Ltd."], "producers": ["Aniplex", "Dentsu Inc.", "Shueisha"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Supernatural", "Thriller", "Psychological"], "tags": ["Action", "Adventure", "Afterlife", "Based On A Manga", "Calling Your Attacks", "Comedy", "Conspiracy", "Contemporary Fantasy", "Demi-Humans", "Demon"], "local": "images/cover_3577.jpg", "synopsis": "The second part of BLEACH: Sennen Kessen-hen . After a brutal surprise attack by the forces of Quincy King Yhwach, the resident Reapers of the Soul Society lick their wounds and mourn their losses. Many of the surviving Soul Reaper captains train to battle without their Bankai, the ultimate technique wielded by the fiercest warriors. In the previous assault, Ichigo Kurosaki narrowly managed to help fend off Yhwach's fearsome wrath. However, to ultimately defeat his godly adversary and save his allies, Ichigo must now undergo severe training that will push him beyond his physical, emotional, and mental limits. Though Yhwach already holds the upper hand in this ongoing blood feud, he also successfully recruits Uryuu Ishida, Ichigo's close friend and rival, to be his successor. Yhwach strikes out once again at the weakened Soul Society, intent on finally obliterating his long-standing enemies. As Ichigo struggles to attain new power, the Soul Reaper captains fight for survival and borrowed time. (Source: MAL Rewrite)"}, {"title": "Dungeon Meshi", "image": "https://cdn.myanimelist.net/images/anime/1711/142478.jpg", "score": 8.38, "episodes": 24, "year": 2024, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Trigger Inc."], "producers": ["Good Smile Company", "Kadokawa", "Tencent Japan"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Slapstick", "Historical"], "tags": ["Action", "Adventure", "Adventure Comedy", "Alternative World", "Anthropomorphism", "Asexual", "Based On A Manga", "Biology", "Body Horror", "Cannibalism"], "local": "images/cover_8179.jpg", "synopsis": "When young adventurer Laios and his company are attacked and soundly thrashed by a dragon deep in a dungeon, the party loses all its money and provisions...and a member! They're eager to go back and save her, but there is just one problem: If they set out with no food or coin to speak of, they're sure to starve on the way! But Laios comes up with a brilliant idea: \"Let's eat the monsters!\" Slimes, basilisks, and even dragons...none are safe from the appetites of these dungeon-crawling gourmands! (Source: Yen Press) Note: A world premiere screening of Episode 1 was shown in the Studio TRIGGER panel at Anime Expo on July 1, 2023."}, {"title": "Fate/stay night Movie: Heaven's Feel - II. Lost Butterfly", "image": "https://cdn.myanimelist.net/images/anime/1974/98158.jpg", "score": 8.38, "episodes": 1, "year": 2019, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Ufotable"], "producers": ["Aniplex Of America", "Kadokawa", "Notes"], "duration_min": 117.0, "genres": ["Action", "Drama", "Fantasy", "Romance", "Supernatural", "Thriller", "Psychological"], "tags": ["Action", "Adoption", "Archery", "Assassins", "Based On A Visual Novel", "Based On An Eroge", "Battle Royale", "Body Horror", "Cannibalism", "Cgi"], "local": "images/cover_9051.jpg"}, {"title": "JoJo no Kimyou na Bouken Part 3: Stardust Crusaders - Egypt-hen", "image": "https://cdn.myanimelist.net/images/anime/11/75045.jpg", "score": 8.38, "episodes": 24, "year": 2015, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["David Production Inc."], "producers": ["Kamikaze Douga", "Klockworx", "Medicos Entertainment"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Horror", "Supernatural", "Slapstick"], "tags": ["Action", "Adventure", "Africa", "Age Regression", "Animal Abuse", "Animals", "Asia", "Based On A Manga", "Bionic Powers", "Body Horror"], "local": "images/jojo-no-kimyou-na-bouken-part-3-stardust-crusaders-egypt-hen.jpg", "synopsis": "After 30 days of travel across the world, plagued with countless battles, Jotaro and his companions have finally arrived in Egypt! Now only the strongest \"Stand\" users remain to rebuff our heroes' final march on Cairo: The Nine Egyptian Gods, Dio's most zealous servants. Will the Joestar line fall to the monstrous vampire, or can Jotaro defeat Dio and save his mother's life? (Source: Crunchyroll)"}, {"title": "Ling Long 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1980/150040.jpg", "score": 8.38, "episodes": 12, "year": 2025, "season": "SPRING", "type": "ONA", "status": "FINISHED", "studios": ["Yhkt Entertainment"], "producers": ["Bilibili"], "duration_min": 38.0, "genres": ["Action", "Drama", "Horror", "Sci-Fi", "Thriller"], "tags": ["Action", "Agriculture", "Artificial Intelligence", "Cg Animation", "Chimera", "Chinese Animation", "Chinese Production", "Class Struggle", "Cult", "Drama"], "local": "images/ling-long-2nd-season.jpg", "synopsis": "In this thrilling continuation, former Wilderness Hunter Commander Marc has transformed into a blood-stained monster who destroys lighthouses. Guided by the enigmatic Bai Yuekui, he embarks on a new mission. The arrival of survivors on the ground reveals that the lighthouse isn't humanity's final refuge. Facing adversity, they harness their innate abilities to combat the Mana ecosystem. Bai Yuekui's past intricately links to Mark's origins and the apocalypse's truth. Meanwhile, the colossal brain on the lighthouse awakens, the old shadows linger, and a new crisis emerges. As unprecedented disasters loom, where will the two human factions ultimately head? (Source: BiliBili, translated)"}, {"title": "Mob Psycho 100", "image": "https://cdn.myanimelist.net/images/anime/8/80356.jpg", "score": 8.38, "episodes": 12, "year": 2016, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Bones Inc."], "producers": ["Bones", "Bs Fuji", "Hakuhodo Dy Music & Pictures"], "duration_min": 24.0, "genres": ["Action", "Comedy", "Drama", "Slice of Life", "Supernatural", "Psychological", "Slapstick"], "tags": ["Action", "Action Comedy", "Adapted Into Jdrama", "Adapted Into Other Media", "Awards", "Based On A Manga", "Bullying", "Calling Your Attacks", "Canon Filler", "Collateral Damage"], "local": "images/mob-psycho-100.jpg", "synopsis": "The story revolves around \"Mob,\" a boy who will explode if his emotional capacity reaches 100%. This boy with psychic powers earned his nickname \"Mob\" because he does not stand out among other people. He keeps his psychic powers bottled up so he can live normally, but if his emotional level reaches 100, something will overwhelm his entire body. (Source: Anime News Network)"}, {"title": "Ousama Ranking", "image": "https://cdn.myanimelist.net/images/anime/1347/117616.jpg", "score": 8.38, "episodes": 23, "year": 2021, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Wit Studio, Inc."], "producers": ["Aniplex", "Bandai Spirits", "Dentsu Inc."], "duration_min": 22.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Psychological", "Historical"], "tags": ["Achronological Order", "Action", "Adventure", "Amputation", "Angst", "Aristocracy", "Assassins", "Based On A Manga", "Betrayal", "Body And Host"], "local": "images/ousama-ranking.jpg", "synopsis": "Unable to hear, speak, or wield a sword, Prince Bojji doesn’t seem like a typical heir to the throne—and his kingdom agrees. But his fateful encounter with Kage, a shadow on the ground, gives him his first true friend. The two set off on a grand adventure and, together, form a bond that can overcome any obstacle...even being king. (Source: Funimation)"}, {"title": "The Owl House Season 3", "image": "https://media.kitsu.app/anime/46485/poster_image/small-990dbad388507d6fd3d4df0a32088489.jpeg", "score": 8.38, "episodes": 3, "year": 2022, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": [], "produce  "TV", "status": "FINISHED", "studios": ["A-1 Pictures Inc."], "producers": ["A-1 Pictures", "Aniplex Of America", "C-One"], "duration_min": 23.0, "genres": ["Drama", "Mystery", "Slice of Life", "Supernatural", "Thriller", "Psychological"], "tags": ["Adapted Into Japanese Movie", "Adapted Into Jdrama", "Adapted Into Other Media", "Age Gap", "Age Regression", "Age Transformation", "Amnesia", "Angst", "Animal Abuse", "Awards"], "local": "images/cover_3735.jpg", "synopsis": "Satoru Fujinuma is a 29 year old manga artist struggling to make a name for himself following his debut. But, that was not the only thing in his life that Satoru was feeling frustrated about… He has a unique supernatural ability of being forced to prevent deaths and catastrophes by being sent back in time before the incident occurred, repeating time until the accident is prevented. One day, he gets involved in an accident that has him framed as a murderer. Desperate to save the victim, he sends himself back in time only to find himself as a grade-schooler one month before fellow classmate Kayo Hinazuki went missing. Satoru now embarks on a new quest: to save Kayo and solve the mystery behind her disappearance."}, {"title": "Grand Blue Season 2", "image": "https://cdn.myanimelist.net/images/anime/1108/150583.jpg", "score": 8.37, "episodes": 12, "year": 2025, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Liber Inc.", "Zero-G, Inc."], "producers": ["Avex Pictures", "Jr East Marketing & Communications", "Jr Higashi Nihon Kikaku"], "duration_min": 24.0, "genres": ["Comedy", "Romance", "Slice of Life", "Sports", "Slapstick"], "tags": ["Adult Cast", "Alcohol", "Bar", "Based On A Manga", "Bisexual", "Boys' Love", "Club", "Coastal", "College", "Comedy"], "local": "images/grand-blue-season-2.jpg", "synopsis": "The second season of Grand Blue . University is back in session for Iori, and so are the booze-fueled parties! Between diving club shenanigans, a surprise from his sister, and wild tests of courage, normal college life is anything but. Dive back into the madness with Iori and his beloved crew of lively splash artists. (Source: Crunchyroll)"}, {"title": "Guimi Zhi Zhu: Xiaochou Pian", "image": "https://cdn.myanimelist.net/images/anime/1952/149229.jpg", "score": 8.37, "episodes": 13, "year": 2025, "season": "SPRING", "type": "ONA", "status": "FINISHED", "studios": ["B.C May Pictures", "B.Cmay Pictures", "G.Cmay Animation & Film Co., Ltd"], "producers": ["China Literature Limited", "Tencent Penguin Pictures", "Tencent Video"], "duration_min": 35.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Horror", "Mystery", "Supernatural", "Thriller", "Isekai", "Historical"], "tags": ["Acting", "Action", "Action Drama", "Adult Cast", "Adventure", "Alchemy", "Alternative World", "Amnesia", "Angels", "Astronomy"], "local": "images/guimi-zhi-zhu-xiaochou-pian.jpg", "synopsis": "In a Victorian world of steam, dreadnoughts, and occult horrors, Zhou Mingrui awakens as Klein Moretti. He walks a razor’s edge between light and darkness, entangled with warring Churches. This is the legend of unlimited potential…and unspeakable danger. (Source: Crunchyroll)"}, {"title": "Haikyuu!! To the Top", "image": "https://cdn.myanimelist.net/images/anime/1813/105367.jpg", "score": 8.37, "episodes": 13, "year": 2020, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["Dentsu Inc.", "Haikyu!! To The Top Production Committee", "Mainichi Broadcasting System"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Sports", "Slapstick"], "tags": ["Animeism", "Asia", "Based On A Manga", "Club", "Comedy", "Coming Of Age", "Competition", "Drama", "Earth", "Ensemble Cast"], "local": "images/haikyuu-to-the-top.jpg", "synopsis": "The fourth season of Haikyuu!! The Karasuno High School Volleyball Club finally won their way into the nationals after an intense battle for the Miyagi Prefecture Spring Tournament qualifiers. As they were preparing for the nationals, Kageyama is invited to go to All-Japan Youth Training Camp. At the same time, Tsukishima is invited to go to a special rookie select training camp for first-years in Miyagi Prefecture. Hinata feels panic that he’s being left behind as one of the first-years and then decides to show up at the Miyagi Prefecture rookie select training camp anyway... (Source: Crunchyroll)"}, {"title": "JoJo no Kimyou na Bouken Part 5: Ougon no Kaze", "image": "https://cdn.myanimelist.net/images/anime/1882/94989.jpg", "score": 8.37, "episodes": 39, "year": 2018, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["David Production Inc."], "producers": ["Klockworx", "Medicos Entertainment", "One Music"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Horror", "Mystery", "Supernatural", "Thriller", "Psychological"], "tags": ["Absurdity", "Action", "Adventure", "Aliens", "Animals", "Aristocracy", "Awards", "Based On A Manga", "Betrayal", "Body Horror"], "local": "images/jojo-no-kimyou-na-bouken-part-5-ougon-no-kaze.jpg"}, {"title": "Jujutsu Kaisen: Shimetsu Kaiyuu - Zenpen", "image": "https://cdn.myanimelist.net/images/anime/1659/154920.jpg", "score": 8.37, "episodes": 12, "year": 2026, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Mappa Co., Ltd."], "producers": ["Dugout", "Mainichi Broadcasting System", "Mappa"], "duration_min": 23.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Horror", "Mystery", "Supernatural", "Thriller", "Psychological"], "tags": ["Action", "Alternate Dimension", "Angst", "Based On A Manga", "Battle Royale", "Bisexual", "Body Sharing", "Comedy", "Contemporary Fantasy", "Crossdressing"], "local": "images/jujutsu-kaisen-shimetsu-kaiyuu-zenpen.jpg", "synopsis": "The third season of Jujutsu Kaisen . After the Shibuya Incident, a deadly jujutsu battle known as the Culling Game orchestrated by Noritoshi Kamo erupts across ten colonies in Japan. Haunted by guilt over the mass killings in Shibuya and wary of Sukuna’s interest in Fushiguro, Itadori chooses not to return to Jujutsu High. Instead, he teams up with Choso to exorcise the countless cursed spirits unleashed by Noritoshi Kamo. Amid this chaos, the Jujutsu Headquarters revokes Yuji Itadori’s suspended death sentence and appoints special-grade sorcerer Yuta Okkotsu as his executioner. Newly awakened modern sorcerers and resurrected ancient ones, now fighting as players in the Culling Game, collide with conflicting motives, driving the world once more toward an age ruled by jujutsu. (Source: TOHO Animation)"}, {"title": "Legend of the Galactic Heroes: Spiral Labyrinth", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A6488-38.jpg", "score": 8.37, "episodes": 28, "year": 1999, "season": "FALL", "type": "OVA", "status": "FINISHED", "studios": ["Artland"], "producers": ["Kitty Films", "Tokuma Japan Corporation"], "duration_min": null, "genres": ["Sci-Fi"], "tags": ["Military", "Science Fiction", "Space"], "local": "images/logh-spiral-labyrinth.jpg", "synopsis": "A prequel to Legend of Galactic Heroes, focusing more on Yang Wen-li; how he became the hero of El Facile and how he handled a couple of assignments he received afterward. Spiral Labyrinth also continues with the background of Reinhard and Kircheis where the first Gaiden left off. A collection of independent short stories taking place prior to the Overture to a New War, some of which are adapted from the novel and some of which are completely original."}, {"title": "Steins;Gate Movie: Fuka Ryouiki no Déjà vu", "image": "https://cdn.myanimelist.net/images/anime/1611/112806.jpg", "score": 8.37, "episodes": 1, "year": 2013, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["White Fox Co., Ltd."], "producers": ["At-X", "Cinema Sunshine", "Frontier Works"], "duration_min": 90.0, "genres": ["Drama", "Romance", "Sci-Fi", "Thriller", "Psychological"], "tags": ["Age Regr er", "Action", "Against Destiny", "Alcohol", "Alien", "Aliens", "Alternate Reality", "Alternate Universe", "Angst", "Anthropomorphism"], "local": "images/mahou-shoujo-madoka-magica.jpg", "synopsis": "A short four-minute concept film that served as a surprise unveil at Studio SHAFT's 40th anniversary event in Winter 2015, Madogatari. The concept movie is the core of a new Madoka Magica project, and serves as its trailer. The second short was later screened in Osaka, with the difference being a replacement of several imageboard segments."}, {"title": "Re:Zero kara Hajimeru Isekai Seikatsu 3rd Season", "image": "https://cdn.myanimelist.net/images/anime/1706/144725.jpg", "score": 8.36, "episodes": 16, "year": 2024, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["White Fox Co., Ltd."], "producers": ["At-X", "Daxel", "Hakuhodo Dy Music & Pictures"], "duration_min": 28.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Romance", "Thriller", "Isekai", "Psychological"], "tags": ["Action", "Adventure", "Anthropomorphism", "Based On A Light Novel", "Body Horror", "Cheats", "Cult", "Dark Fantasy", "Dragons", "Drama"], "local": "images/re-zero-kara-hajimeru-isekai-seikatsu-3rd-season.jpg", "synopsis": "The third season of Re:Zero kara Hajimeru Isekai Seikatsu . A year has passed since Subaru’s victory at the Sanctuary. He savors a life of fulfillment while Emilia’s camp stands united for the royal selection—until a fateful letter arrives. Anastasia, a royal selection candidate, has invited Emilia to the Watergate City of Priestella. But as the party begins its journey, crisis stirs beneath the surface and Subaru meets a cruel fate once again. (Source: Crunchyroll) Note: The first episode has an extended runtime of ~90 minutes, and received an early premiere at Anime Expo on July 5, 2024."}, {"title": "Shingeki no Kyojin: Kuinaki Sentaku", "image": "https://cdn.myanimelist.net/images/anime/8/69497.jpg", "score": 8.36, "episodes": 2, "year": 2014, "season": "FALL", "type": "OVA", "status": "FINISHED", "studios": ["Wit Studio, Inc."], "producers": ["Attack On Titan Oad Production Committee", "Dentsu", "Kodansha"], "duration_min": 27.0, "genres": ["Action", "Drama", "Fantasy", "Horror", "Slice of Life", "Supernatural", "Thriller", "Psychological", "Historical"], "tags": ["Action", "Action Drama", "Alternative World", "Anti-Hero", "Based On A Manga", "Cgi", "Class Struggle", "Dark Fantasy", "Drama", "Excessive Violence"], "local": "images/shingeki-no-kyojin-kuinaki-sentaku.jpg", "synopsis": "This prequel to megahit Attack on Titan answers the questions: How did Captain Levi of the Survey Corps go from street thug to humanity's strongest soldier? And how did Commander Erwin become a cold, calculating leader, ready to sacrifice anything to save the human race? The fires that forged this bond of loyalty and trust were intense indeed! (Source: Anime News Network, revised)"}, {"title": "Steins;Gate 0", "image": "https://cdn.myanimelist.net/images/anime/1375/93521.jpg", "score": 8.36, "episodes": 23, "year": 2018, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["White Fox Co., Ltd."], "producers": ["Cinema Sunshine", "Frontier Works", "Funimation"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Mystery", "Romance", "Sci-Fi", "Thriller", "Psychological"], "tags": ["Age Regression", "Akihabara", "Alternate Universe", "Amnesia", "Angst", "Artificial Intelligence", "Asia", "Based On A Visual Novel", "Butterfly Effect", "Chuunibyou"], "local": "images/steins-gate-0.jpg", "synopsis": "The eccentric, self-proclaimed mad scientist Rintarou Okabe has become a shell of his former self. Depressed and traumatized after failing to rescue his friend, he has decided to forsake his mad scientist alter ego and live as an ordinary college student. Surrounded by friends who know little of his time travel experiences, Okabe spends his days trying to forget the horrors of his adventures alone. While working as a receptionist at a college technology forum, Okabe meets the short, spunky Maho Hiyajo, who later turns out to be the interpreter at the forum's presentation, conducted by Professor Alexis Leskinen. In front of a stunned crowd, Alexis and Maho unveil Amadeus—a revolutionary AI capable of storing a person's memories and creating a perfect simulation of that person complete with their personality and quirks. Meeting with Maho and Alexis after the presentation, Okabe learns that the two were Kurisu's colleagues in university, and that they have simulated her in Amadeus. Hired by Alexis to research the simulation's behavior, Okabe is given the chance to interact with the shadow of a long-lost dear friend. Dangerously tangled in the past, Okabe must face the harsh reality and carefully maneuver around the disastrous consequences that come with disturbing the natural flow of time."}, {"title": "The Boondocks", "image": "https://media.kitsu.app/anime/poster_images/7950/small.jpg", "score": 8.36, "episodes": 55, "year": 2005, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": [], "producers": ["Jm Animation", "Rebel Base Productions", "Sony Pictures Entertainment"], "duration_min": 22.0, "genres": ["Action", "Comedy"], "tags": ["Action", "Anime Influenced", "Comedy", "Parody"], "local": "images/the-boondocks.jpg"}, {"title": "Uma Musume: Pretty Derby - Shin Jidai no Tobira", "image": "https://cdn.myanimelist.net/images/anime/1427/142210.jpg", "score": 8.36, "episodes": 1, "year": 2024, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["Cygamespictures", "Cypic, Inc."], "producers": ["Cygames", "Toho"], "duration_min": 107.0, "genres": ["Comedy", "Drama", "Fantasy", "Slice of Life", "Sports", "Psychological", "Music"], "tags": ["Animal Characteristics", "Anthropomorphic", "Anthropomorphism", "Athletics", "Based On A Mobile Game", "Comedy", "Disability", "Drama", "Ensemble Cast", "Fantasy"], "local": "images/uma-musume-pretty-derby-shin-jidai-no-tobira.jpg", "synopsis": "REACH OUT AND GRASP GREATNESS. Jungle Pocket, known to her close friends as \"Pokke,\" is a free-spirited Umamusume who has proven her dominance in the freestyle racing scene. Overwhelmed by Fuji Kiseki's majestic performance at a graded Twinkle Series race, she resolves to take on the Twinkle Series herself. Shortly after joining the Umamusume training school Tracen Academy, Pokke comes under the wing of Tanabe, a veteran trainer who fostered Fuji Kiseki's talent. Together, they aspire to dominate the Triple Crown series, a set of three races that can only be attempted once in a lifetime. Awaiting them are formidable rivals of Pokke's generation, whose talents surpass even her own. There's Dantsu Flame, whose diligence and determination to win are second to none; Manhattan Cafe, who chases the shadowy silhouette of a \"friend\" that only she can see; and Agnes Tachyon, a veritable mad scientist seeking to push the very boundaries of what is possible for Umamusume. These four runners take to the track with their very pride, spirit, and souls on the line. Past the finish of their epic clash is a door waiting to be opened—one that leads to the beginning of a new era. \"It doesn't matter who stands in my way! I'm gonna be the greatest!\" (Source: Umamusume: Pretty Derby - Beginning of a New Era Site)"}, {"title": "Wanmei Shijie 4", "image": "https://media.kitsu.app/anime/48051/poster_image/small-e39df2f0e4d6f76c5f55874e913586ab.jpeg", "score": 8.36, "episodes": 52, "year": 2023, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": ["Foch"], "producers": ["Tencent Penguin Pictures"], "duration_min": 22.0, "genres": ["Action", "Adventure", "Fantasy"], "tags": ["Action", "Adventure", "Cultivation", "Fantasy", "Full Cgi"], "local": "images/wanmei-shijie-4.jpeg", "synopsis": "The fourth season of Wanmei Shijie ."}, {"title": "Adventure Time Season 3", "image": "https://media.kitsu.app/anime/poster_images/13763/small.jpg", "score": 8.35, s": ["Madhouse", "Nhk Enterprises", "Shogakukan-Shueisha Productions"], "duration_min": 25.0, "genres": ["Adventure", "Drama", "Horror", "Mystery", "Sci-Fi", "Thriller", "Psychological", "Historical"], "tags": ["15Th Century", "Adventure", "Alternate Universe", "Assassins", "Astronomy", "Based On A Manga", "Christianity", "Conspiracy", "Corrupt Church", "Detailed Landscapes"], "local": "images/cover_5052.jpg", "synopsis": "The setting is 15th-century Europe. It was a time when heretical ideas lead those to who possessed such a mindset to being burned at the stake for their beliefs. The protagonist, Rafał, a child prodigy, is expected to major in theology, the most important subject at the time, at the university where he plans to skip a grade. One day, however, he comes across a mysterious man, and is now studying a possible \"truth\" in the midst of heretical thought! (Source: Shogakukan, translated)"}, {"title": "Cross Game", "image": "https://cdn.myanimelist.net/images/anime/6/22103.jpg", "score": 8.35, "episodes": 50, "year": 2009, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Synergy Sp", "Synergysp Co. ,Ltd."], "producers": ["Half H.P Studio", "Shogakukan Productions", "Shogakukan-Shueisha Productions"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Sports"], "tags": ["Animal Sidekick", "Asia", "Baseball", "Based On A Manga", "Childhood Friends", "Comedy", "Coming Of Age", "Daily Life", "Death Of A Loved One", "Drama"], "local": "images/cover_6145.jpg", "synopsis": "The main character is Kou Kitamura, son of the owner of Kitamura Sports. In the same neighborhood is a batting center run by the Tsukishima family. Due to their proximity and the relationship between their businesses, the Kitamura and Tsukishima familes have been close for many years, with their children going back and forth between the two homes like extended family. Because Kou and Wakaba were the same age and always together, Aoba was jea
