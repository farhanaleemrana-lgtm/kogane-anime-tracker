) for every out he pitches, but loses 50,000,000 yen (US$460,000) for every point he gives up. (Source: Anime News Network)"}, {"title": "Perfect Blue", "image": "https://cdn.myanimelist.net/images/anime/1254/134212.jpg", "score": 8.24, "episodes": 1, "year": 1998, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Madhouse Inc.", "Oniro"], "producers": ["Gkids", "Madhouse", "Manga Entertainment"], "duration_min": 81.0, "genres": ["Drama", "Horror", "Mystery", "Slice of Life", "Thriller", "Psychological", "Music"], "tags": ["Acting", "Adapted Into Japanese Movie", "Adapted Into Other Media", "Adult Cast", "Angst", "Anime & Movie", "Asia", "Avant Garde", "Avant-Garde", "Award Winning"], "local": "images/perfect-blue.jpg", "synopsis": "Rising pop star Mima has quit singing to pursue a career as an actress and model, but her fans aren’t ready to see her go... Encouraged by her managers, Mima takes on a recurring role on a popular TV show, when suddenly her handlers and collaborators begin turning up murdered. Harboring feelings of guilt and haunted by visions of her former self, Mima’s reality and fantasy meld into a frenzied paranoia. As her stalker closes in, in person and online, the threat he poses is more real than even Mima knows, in this iconic psychological thriller that has frequently been hailed as one of the most important animated films of all time. (Source: Shout! Factory) Note: The film received an early premiere at the Fantasia Film Festival on August 5, 1997."}, {"title": "Rainbow: Nisha Rokubou no Shichinin", "image": "https://cdn.myanimelist.net/images/anime/9/72697.jpg", "score": 8.24, "episodes": 26, "year": 2010, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Madhouse Inc."], "producers": ["Funimation", "Madhouse", "Nippon Television Network Corporation"], "duration_min": 22.0, "genres": ["Action", "Drama", "Horror", "Romance", "Thriller", "Psychological", "Historical"], "tags": ["Abuse", "Action", "Action Drama", "Angst", "Asia", "Bar", "Based On A Manga", "Betrayal", "Boxing", "Child Abuse"], "local": "images/rainbow-nisha-rokubou-no-shichinin.jpg", "synopsis": "Seven teenagers in 1955 have to learn to live together in the same hold in the reformatory of Shounan. Confined in a hall where suffering and humiliation are daily, they are waiting for a ray of hope in a dark, incarcerating world. The story follows their life together and how they move on afterwards."}, {"title": "Saiki Kusuo no Ψ-nan", "image": "https://cdn.myanimelist.net/images/anime/1973/142750.jpg", "score": 8.24, "episodes": 120, "year": 2016, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Egg Firm", "J.C. Staff", "J.C.Staff Co., Ltd."], "producers": ["Asmik Ace", "Bandai Namco Entertainment", "Dear Stage Inc."], "duration_min": 5.0, "genres": ["Comedy", "Slice of Life", "Supernatural", "Slapstick"], "tags": ["Absurdist Humour", "Adapted Into Japanese Movie", "Adapted Into Other Media", "Animal Abuse", "Aromantic", "Asexual", "Based On A Manga", "Befriend Attack", "Breaking The Fourth Wall", "Chibi Ed"], "local": "images/saiki-kusuo-no-nan.jpg", "synopsis": "To the average person, psychic abilities might seem a blessing; for Kusuo Saiki, however, this couldn't be further from the truth. Gifted with a wide assortment of supernatural abilities ranging from telepathy to x-ray vision, he finds this so-called blessing to be nothing but a curse. As all the inconveniences his powers cause constantly pile up, all Kusuo aims for is an ordinary, hassle-free life—a life where ignorance is bliss. Unfortunately, the life of a psychic is far from quiet. Though Kusuo tries to stay out of the spotlight by keeping his powers a secret from his classmates, he ends up inadvertently attracting the attention of many odd characters, such as the empty-headed Riki Nendou and the delusional Shun Kaidou. Forced to deal with the craziness of the people around him, Kusuo comes to learn that the ordinary life he has been striving for is a lot more difficult to achieve than expected. Note: Aired in 2 versions, a 120-episode 5-minute short series, and a combined 24-episode 24-minute TV series with the same content."}, {"title": "Shangri-La Frontier: Kusoge Hunter, Kamige ni Idoman to su 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1996/147601.jpg", "score": 8.24, "episodes": 25, "year": 2024, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["C2C Co., Ltd."], "producers": ["Crunchyroll", "Dentsu Inc.", "Kodansha"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Romance", "Sci-Fi"], "tags": ["Action", "Adventure", "Animals", "Anthropomorphism", "Anthropomorphs", "Based On A Manga", "Beastman", "Comedy", "Crunchyroll Co-Production", "Curses"], "local": "images/shangri-la-frontier-kusoge-hunter-kamige-ni-idoman-to-su-2nd.jpg", "synopsis": "The second season of Shangri-La Frontier . Rakuro Hizutome only cares about one thing: beating crappy VR games. He devotes his entire life to these buggy games and could clear them all in his sleep. One day, he decides to challenge himself and play a popular god-tier game called Shangri-La Frontier. But he quickly learns just how difficult it is. Will his expert skills be enough to uncover its hidden secrets? (Source: Crunchyroll)"}, {"title": "Shen Yin Wangzuo 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1897/150028.jpg", "score": 8.24, "episodes": 182, "year": 2022, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": ["Shenman Entertainment"], "producers": ["China South Angel", "Tencent Penguin Pictures", "Tencent Video"], "duration_min": 20.0, "genres": ["Action", "Adventure", "Fantasy"], "tags": ["Action", "Adventure", "Based On A Web Novel", "Cg Animation", "Cg-Anime", "Chinese Animation", "Chinese Production", "Cultivation", "Demons", "Fantasy"], "local": "images/shen-yin-wangzuo-2nd-season.jpg", "synopsis": "The second season of Shen Yin Wangzuo ."}, {"title": "Slam Dunk", "image": "https://cdn.myanimelist.net/images/anime/12/86890.jpg", "score": 8.24, "episodes": 101, "year": 1993, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Toei Animation Co., Ltd."], "producers": ["Animax", "Flatiron Film Company", "Funimation"], "duration_min": 23.0, "genres": ["Action", "Comedy", "Drama", "Slice of Life", "Sports"], "tags": ["Action", "Asia", "Based On A Manga", "Basketball", "Bright Slap", "Canon Filler", "Coastal", "Comedy", "Competition", "Defeat Means Friendship"], "local": "images/slam-dunk.jpg", "synopsis": "Hanamichi Sakuragi, an entering Shohoku high school freshman holds a record for being rejected by 50 girls during middle school. His nearly 2 meters height and bright red hair causes most students to write him off as a delinquent. One day, a girl named Haruko Akagi approaches Hanamichi without any fear. When she asks Hanamichi: \"do you like basketball?\" Hanamichi falls head over heels for the girl of his dreams. Without missing a beat, Hanamichi tells her he loves basketball, and the two head to the gymnasium where Hanamichi learns about the slam dunk. He also learns of Rukawa, one of the country&rsquo;s top basketball prospects, also a freshman at Shohoku. (Source: Funimation)"}, {"title": "The Dragon Prince Season 2", "image": "https://media.kitsu.app/anime/42097/poster_image/small-071c06ad8b37cd35d27696d4ac042557.jpeg", "score": 8.24, "episodes": 9, "year": 2019, "season": "WINTER", "type": "ONA", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 26.0, "genres": ["Adventure", "Fantasy"], "tags": ["Adventure", "Anime Influenced", "Dragon", "Elf", "Fantasy", "Fantasy World", "High Fantasy", "Kids", "Magic"], "local": "images/the-dragon-prince-season-2.jpeg"}, {"title": "Toradora!", "image": "https://cdn.myanimelist.net/images/anime/13/22128.jpg", "score": 8.24, "episodes": 25, "year": 2008, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["J.C. Staff", "J.C.Staff Co., Ltd."], "producers": ["Genco", "Hanabee Entertainment", "J.C. Staff"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Music", "Slapstick"], "tags": ["Angst", "Asia", "Baseball", "Based On A Light Novel", "Basketball", "Body Horror", "Boy Meets Girl", "Comedy", "Coming Of Age", "Cooking"], "local": "images/toradora.jpg", "synopsis": "Ryuuji Takasu is a gentle high school student with a love for housework; but in contrast to his kind nature, he has an intimidating face that often gets him labeled as a delinquent. On the other hand is Taiga Aisaka, a small, doll-like student, who is anything but a cute and fragile girl. Equipped with a wooden katana and feisty personality, Taiga is known throughout the school as the \"Palmtop Tiger.\" One day, an embarrassing mistake causes the two students to cross paths. Ryuuji discovers that Taiga actually has a sweet side: she has a crush on the popular vice president, Yuusaku Kitamura, who happens to be his best friend. But things only get crazier when Ryuuji reveals that he has a crush on Minori Kushieda—Taiga's best friend! Toradora! is a romantic comedy that follows this odd duo as they embark on a quest to help each other with their respective crushes, forming an unlikely alliance in the process."}, {"title": "Voltron: Legendary Defender Season 2", "image": "https://media.kitsu.app/anime/poster_images/13426/small.jpg", "score": 8.24, "episodes": 13, "year": 2017, "season": "WINTER", "type": "ONA", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 23.0, "genres": ["Action", "Sci-Fi", "Mecha"], "tags": ["Action", "Alien", "Anime Influenced", "Humanoid Alien", "Mecha", "Piloted Robot", "Sci-Fi", "Science Fiction", "Space", "Transforming Craft"], "local": "images/voltron-legendary-defender-season-2.jpg"}, {"title": "Yuru Camp△ Movie", "image": "https://cdn.myanimelist.net/images/anime/1806/124396.jpg", "score": 8.24, "episodes": 1, "year": 2022, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["C-Station Co., Ltd"], "producers": ["81 Produce", "At-X", "Bs11"], "duration_min": 120.0, "genres": ["Adventure", "Comedy", "Slice of Life"], "tags": ["Adult Cast", "Adventure", "Animals", "Asia", "Based On A Manga", "Camping", "Cgdct", "Comedy", "Coming Of Age", "Cooking"], "local": "images/yuru-camp-movie.jpg", "synopsis": "Rin Shima has left her hometown in Yamanashi to live on her own in Nagoya while working for a small publishing company there. On one winter’s weekend in the not-too-distant future, as she’s planning a bike tour, she unexpectedly receives a message from an old high school friend, Chiaki Oogaki, saying she’s currently in Nagoya. Chiaki now works for an organization promoting tourism in Yamanashi, and she’s in charge of a project to reopen a facility that was closed a few years ago. When Rin casually suggests that such a large property would make a good campground, Chiaki is inspired. She gathers up all of their old camping buddies— Nadeshiko Kagamihara, who works at an outdoor goods store in Tokyo; Aoi Inuyama, who’s now an elementary school teacher in their hometown of Yamanashi; and Ena Saitou, who works at a dog grooming salon in Yokohama—and the campground-opening project is set in motion. So the story of five outdoorsy girls who became friends thanks to their shared love of camping begins once more, taking on a new challenge with the knowledge and experience they’ve gained. (Source: Crunchyroll, edited)"}, {"title": "Castlevania: Nocturne Season 2", "image": "https://cdn.anime-planet.com/anime/primary/castlevania-nocturne-season-2-1.webp", "score": 8.23, "episodes": 8, "year": 2025, "season": "WINTER", "type": "ONA", "status": "FINISHED", "studios": ["Powerhouse Animation"], "producers": [], "duration_min": 28.0, "genres": ["Action", "Adventure", "Drama", "Horror", "Romance", "Supernatural", "Historical"], "tags": ["18Th Century", "Action", "Adventure", "Anime Influenced", "Based On A Video Game", "Dark Fantasy", "Demons", "Drama", "Egyptian Mythology", "Elemental Powers"], "local": "images/cover_4711.webp"}, {"title": "Fumetsu no Anata e", "image": "https://cdn.myanimelist.net/images/anime/1880/118484.jpg", "score": 8.23, "episodes": 20, "year": 2021, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Brain'S Base"], "producers": ["Kodansha", "Nhk Enterprises"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Supernatural", "Psychological", "Historical"], "tags": ["3D Cg Closing", "Action", "Adoption", "Adventure", "Afterlife", "Agender", "Alternative Past", "Ancient Aliens", "Animal Transformation", "Animals"], "local": "images/cover_9660.jpg", "synopsis": "In the beginning, an \"orb\" is cast unto Earth. \"It\" can do two things: change into the form of the thing that stimulates \"it\"; and come back to life after death. \"It\" morphs from orb to rock, then to wolf, and finally to boy, but roams about like a newborn who knows nothing. As a boy, \"it\" becomes Fushi. Through encounters with human kindness, Fushi not only gains survival skills but grows as a \"person\". But his journey is darkened by the inexplicable and destructive enemy Nokker and cruel partings with the people he loves. (Source: Crunchyroll)"}, {"title": "Gekijouban Fate/Stay Night: Heaven’s Feel", "image": "https://cdn.anisearch.com/images/anime/cover/9/9744_600.webp", "score": 8.23, "episodes": 3, "year": 2017, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Ufotable, Inc."], "producers": ["Aniplex", "Kadokawa", "Notes"], "duration_min": 120.0, "genres": ["Action", "Drama", "Fantasy", "Romance", "Slice of Life"], "tags": ["Action", "Action Drama", "Attempted Rape", "Awards", "Battle Royale", "Bionic Powers", "Calling Your Attacks", "Contemporary Fantasy", "Dark Fantasy", "Drama"], "local": "images/gekijouban-fate-stay-night-heaven-s-feel.webp"}, {"title": "Horimiya", "image": "https://cdn.myanimelist.net/images/anime/1695/111486.jpg", "score": 8.23, "episodes": 13, "year": 2021, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Cloverworks Inc."], "producers": ["Aniplex", "Global Solutions", "Kanetsu Investment"], "duration_min": 23.0, "genres": ["Comedy", "Romance", "Slice of Life", "Slapstick"], "tags": ["Angst", "Asia", "Baking", "Based On A Manga", "Bullying", "Chibi", "Colour Coded", "Comedy", "Coming Of Age", "Cooking"], "local": "images/horimiya.jpg", "synopsis": "A secret life is the one thing they have in common. At school, Hori is a prim and perfect social butterfly, but the truth is she's a brash homebody. Meanwhile, under a gloomy facade, Miyamura hides a gentle heart, along with piercings and tattoos. In a chance meeting, they both reveal a side they've never shown. Could this blossom into something new? (Source: Funimation)"}, {"title": "Kamisama Hajimemashita: Kamisama, Shiawase ni Naru", "image": "https://cdn.myanimelist.net/images/anime/1542/148441.jpg", "score": 8.23, "episodes": 1, "year": 2016, "season": "FALL", "type": "OVA", "status": "FINISHED", "studios": ["Tms Entertainment Co., Ltd.", "V1 Studio"], "producers": ["Tms Entertainment"], "duration_min": 12.0, "genres": ["Comedy", "Fantasy", "Romance", "Supernatural"], "tags": ["Based On A Manga", "Beastman", "Comedy", "Contemporary Fantasy", "Demon", "Demons", "Fantasy", "Female Protagonist", "Japanese Mythology", "Kamis"], "local": "images/kamisama-hajimemashita-kamisama-shiawase-ni-naru.jpg", "synopsis": "Nanami Momozono, current land god of Mikage Shrine, and her fox familiar Tomoe have faced many obstacles during their time together, but none so challenging as the one posed by the wealth god Ookuninushi—if Tomoe's wish to be human is granted, he must learn to live as one, and Nanami will have to return to being a human. As the couple look to the future and reflect on their former adventures, Nanami tries to figure out their new living situation as her high school graduation approaches. But no matter the path they choose to walk, Tomoe and Nanami's love will endure. (Source: MAL Rewrite)"}, {"title": "Major S1", "image": "https://cdn.myanimelist.net/images/anime/13/73973.jpg", "score": 8.23, "episodes": 26, "year": 2004, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Studio Hibari Co., Ltd.", "Synergysp"], "producers": ["Nhk Enterprises", "Shogakukan Productions", "Shogakukan-Shueisha Productions"], "duration_min": 25.0, "genres": ["Comedy", "Drama", "Romance", "Sports"], "tags": ["Adoption", "Ambitious", "Americas", "Asia", "Baseball", "Based On A Manga", "Bullying", "Child Protagonists", "Comedy", "Coming Of Age"], "local": "images/major-s1.jpg", "synopsis": "Honda Shigeharu is a Major League batter on the rise. His son Gorou is a Little League pitcher who one day hopes to follow in his father's footsteps. Hoshino Momoko is Gorou's schoolteacher and the first woman Shigeharu has been interested in since the death of Gorou's mother. The destinies of these three individuals will become intertwined as father and son experience both heartbreak and triumph on the baseball diamond. But when an unspeakable tragedy visits the family, it will take everything they have to pick up the pieces and reclaim their dreams. (Source: Anime News Network)"}, {"title": "Ore dake Level Up na Ken", "image": "https://cdn.myanimelist.net/images/anime/1801/142390.jpg", "score": 8.23, "episodes": 12, "year": 2024, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["A-1 Pictures Inc."], "producers": ["Aniplex", "Crunchyroll", "D&C Media"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Isekai", "Psychological"], "tags": ["Action", "Adult Cast", "Adventure", "Alternate Dimension", "Alternate Universe", "Angels", "Anti-Hero", "Based On A Webtoon", "Bullying", "College"], "local": "images/ore-dake-level-up-na-ken.jpg", "synopsis": "They say whatever doesn’t kill you makes you stronger, but that’s not the case for the world’s weakest hunter Seong Jin-U. After being brutally slaughtered by monsters in a high-ranking dungeon, Jin-U came back with the System, a program only he could see, that’s leveling him up in every way. Now, he’s inspired to discover the secrets behind his powers and the dungeon that spawned them. (Source: Crunchyroll)"}, {"title": "Ore dake Level Up na Ken: ReAwakening", "image": "https://cdn.myanimelist.net/images/anime/1983/146190.jpg", "score": 8.23, "episodes": 1, "year": 2024, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["A-1 Pictures Inc."], "producers": ["Aniplex"], "duration_min": 116.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Isekai", "Psychological"], "tags": ["Action", "Adult Cast", "Adventure", "Alternate Dimension", "Archery", "Based On A Webtoon", "Conspiracy", "Contemporary Fantasy", "Corporations", "Dark Fantasy"], "local": "images/ore-dake-level-up-na-ken-reawakening.jpg", "synopsis": "A movie compilation of the first season and first two episodes of the second season of the Solo Leveling series."}, {"title": "Ouran Koukou Host Club", "image": "https://cdn.myanimelist.net/images/anime/2/71992.jpg", "score": 8.23, "episodes": 26, "year": 2006, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Bones Inc."], "producers": ["Bones", "Fonishia", "Funimation"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Slapstick"], "tags": ["Adapted Into Japanese Movie", "Adapted Into Jdrama", "Adapted Into Other Media", "Adoring Fan Club", "Asia", "Banana Peel", "Based On A Manga", "Bishounen", "Boy Meets Girl", "Canon Filler"], "local": "images/ouran-koukou-host-club.jpg", "synopsis": "Fujioka Haruhi wins a scholarship to attend Ouran Academy, a school reserved for only the most rich and prestigious. Despite what other students may think of her, she cares little for physical appearances or the fact that she is a commoner. Unfortunately for Haruhi, her high school days take a sudden turn when she stumbles upon the Host Club, an elite club filled with super rich and beautiful boys who use their specific traits and charms to entertain young ladies. Even worse, Haruhi accidentally breaks an 8-million yen vase in the club. Since she is unable to repay her debt with money, Haruhi finds herself with no choice but to work for the Host Club, becoming a male host herself."}, {"title": "Qiyun Dantian: Kaiju Qiandao Zhizun Dantian", "image": "https://cdn.myanimelist.net/images/anime/1251/153460.jpg", "score": 8.23, "episodes": 60, "year": 2025, "season": "FALL", "type": "ONA", "status": "ONGOING", "studios": ["Sanjie Donghua", "Zhonghui Donghua"], "producers": ["Iqiyi", "Sanjie Donghua"], "duration_min": 9.0, "genres": ["Action", "Adventure", "Fantasy"], "tags": ["Action", "Adventure", "Cg Animation", "Chinese Animation", "Chinese Production", "Fantasy", "Full Cgi", "Martial Arts"], "local": "images/qiyun-dantian-kaiju-qiandao-zhizun-dantian.jpg"}, {"title": "Saenai Heroine no Sodatekata Fine", "image": "https://cdn.myanimelist.net/images/anime/1671/111411.jpg", "score": 8.23, "episodes": 1, "year": 2019, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Cloverworks Inc."], "producers": ["Aniplex", "Cospa", "Dentsu Inc."], "duration_min": 114.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life"], "tags": ["Based On A Light Novel", "Comedy", "Doujinshi Industry", "Drama", "Drawing", "Ecchi", "Female Harem", "Harem", "Heterosexual", "High School"], "local": "images/saenai-heroine-no-sodatekata-fine.jpg", "synopsis": "After Eriri and Utaha leave Blessing Software, Tomoya and Megumi work alongside Izumi, Michiru, and Hashima in order to create their next game together: \"How to Raise a Boring Girlfriend.\" However, Tomoya is stuck when it comes to writing the main heroine Meguri's route. And to make things even more complicated, Eriri and Utaha are encountering troubles on their own after a series of complications around their work on Fields Chronicle. Can Tomoya maintain his commitments to both Megumi and Blessing Software, as well as Eriri and Utaha? (Source: Anime News Network)"}, {"title": "Seishun Buta Yarou wa Bunny Girl Senpai no Yume wo Minai", "image": "https://cdn.myanimelist.net/images/anime/1301/93586.jpg", "score": 8.23, "episodes": 13, "year": 2018, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Cloverworks Inc."], "producers": ["Abc Animation", "Aniplex", "Bs11"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Mystery", "Romance", "Slice of Life", "Supernatural", "Psychological", "Music"], "tags": ["Acting", "Adults Are Useless", "Amnesia", "Asia", "Based On A Light Novel", "Body And Host", "Body Exchange", "Body Swapping", "Boy Meets Girl", "Bullying"], "local": "images/seishun-buta-yarou-wa-bunny-girl-senpai-no-yume-wo-minai.jpg", "synopsis": "There's a rumor about a mysterious phenomenon called \"puberty syndrome.\" For example, Sakuta Azusagawa is a high school student who suddenly sees a bunny girl appear in front of him. The girl is actually a girl named Mai Sakurajima, who is Sakuta's upperclassman who is also a famous actress who has gone on hiatus from the entertainment industry. For some reason, the people around Mai cannot see her bunny-girl figure. Sakuta sets out to solve this mystery, and as he spends time with Mai, he learns her secret feelings. Other heroines who have \"puberty syndrome\" start to appear in front of Sakuta. (Source: Anime News Network)"}, {"title": "Vivy: Fluorite Eye's Song", "image": "https://cdn.myanimelist.net/images/anime/1551/128960.jpg", "score": 8.23, "episodes": 13, "year": 2021, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Wit Studio, Inc."], "producers": ["Aniplex Of America", "Wit Studio"], "duration_min": 24.0, "genres": ["Action", "Drama", "Sci-Fi", "Thriller", "Music"], "tags": ["3D Cg Animation", "Action", "Action Drama", "Against Destiny", "Alternative Past", "Alternative Present", "Amnesia", "Android", "Androids", "Anthropomorphism"], "local": "images/vivy-fluorite-eye-s-song.jpg", "synopsis": "An AI named Matsumoto appears before Vivy, the world’s first autonomous humanoid AI. Matsumoto’s mission is to rewrite history together with Vivy, in order to stop the war between AI and humans that will happen one century later. (Source: Funimation)"}, {"title": "Voltron: Legendary Defender", "image": "https://media.kitsu.app/anime/poster_images/11825/small.jpg", "score": 8.23, "episodes": 11, "year": 2016, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": ["Dreamworks Studios", "Studio Mir", "World Events Productions"], "producers": ["Netflix"], "duration_min": 27.0, "genres": ["Action", "Sci-Fi", "Mecha"], "tags": ["Action", "Alien", "Anime Influenced", "Humanoid Alien", "Mecha", "Piloted Robot", "Sci-Fi", "Science Fiction", "Space", "Transforming Craft"], "local": "images/voltron-legendary-defender.jpg"}, {"title": "Wu Liuqi: Xuanwu Guo Pian", "image": "https://cdn.myanimelist.net/images/anime/1884/111224.jpg", "score": 8.23, "episodes": 10, "year": 2021, "season": "WINTER", "type": "ONA", "status": "FINISHED", "studios": ["Sharefun Studio"], "producers": ["Aha Entertainment", "Ahaverse", "Sharefun Studio"], "duration_min": 16.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Mystery", "Romance", "Slapstick"], "tags": ["Action", "Adventure", "Amnesia", "Assassins", "Chinese Animation", "Chinese Production", "Comedy", "Cultivation", "Drama", "Heterosexual"], "local": "images/wu-liuqi-xuanwu-guo-pian.jpg", "synopsis": "In order to protect the residents of Xiaoji Island and the peaceful life there, Wu Liuqi with his partners Dabao and Xiaofei embarks on an adventure to the Xuanwu Kingdom to find out the truth about his identity and a way to save the island. Waiting for them are more mysteries and adventures. (Source: bilibili, translated)"}, {"title": "Yojouhan Shinwa Taikei", "image": "https://cdn.myanimelist.net/images/anime/1633/123689.jpg", "score": 8.23, "episodes": 11, "year": 2010, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Madhouse Inc."], "producers": ["Asmik Ace Entertainment, Inc.", "Dentsu Inc.", "Fuji Pacific Music Publishing"], "duration_min": 22.0, "genres": ["Comedy", "Drama", "Mystery", "Romance", "Slice of Life", "Thriller", "Psychological", "Slapstick"], "tags": ["Abstract", "Absurdity", "Achronological Order", "Adult Cast", "Alternate Universe", "Angst", "Asia", "Award Winning", "Back To Square One", "Based On A Novel"], "local": "images/yojouhan-shinwa-taikei.jpg", "synopsis": "When a college dropout stops for a late night bite at a mysterious ramen stand, he crosses paths with a self-proclaimed deity of matrimony. This bizarre meeting sends the young man hurtling through a horrifying flashback to his not-so-glorious college days when the influence of a cruel new friend turned him from a hopeless romantic into a mischievous “black cupid.” (Source: Funimation)"}, {"title": "Youjo Senki Movie", "image": "https://cdn.myanimelist.net/images/anime/1249/117182.jpg", "score": 8.23, "episodes": 1, "year": 2019, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Nut Inc."], "producers": ["At-X", "Crunchyroll", "Kadokawa Animation"], "duration_min": 98.0, "genres": ["Action", "Drama", "Fantasy", "Thriller", "Isekai", "Psychological", "Historical"], "tags": ["Action", "Africa", "Age Regression", "Air Combat", "Air Force", "Alternate History", "Alternative Past", "Alternative World", "Anti-Hero", "Based On A Light Novel"], "local": "images/youjo-senki-movie.jpg", "synopsis": "In 1926, Tanya and her battalion return home from defeating remnants of the Republic's army. However, when they arrive they receive word of a massive mobilization near the border with the Russy Federation, so the Empire's army must prepare. At the same time, a multinational army under the leadership of the Allied Kingdom moves into the Russy Federation. The enemy of an enemy is a friend, but among the Allied Kingdom army is Mary Sioux, a girl who has sworn to exact justice against the Empire for the death of her father. (Source: Anime News Network)"}, {"title": "Adventure Time: Distant Lands", "image": "https://media.kitsu.app/anime/poster_images/42648/small.jpg", "score": 8.22, "episodes": 4, "year": 2020, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 60.0, "genres": ["Adventure", "Fantasy", "Sci-Fi"], "tags": ["Adventure", "Anime Influenced", "Anthropomorphism", "Fantasy", "Friendship", "Magic", "Post Apocalypse", "Robot", "Science Fiction", "Space"], "local": "images/cover_622.jpg"}, {"title": "Barakamon", "image": "https://cdn.myanimelist.net/images/anime/1426/111248.jpg", "score": 8.22, "episodes": 12, "year": 2014, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Kinema Citrus Co., Ltd."], "producers": ["Barakamon Production Committee", "Funimation", "Kinema Citrus"], "duration_min": 22.0, "genres": ["Comedy", "Slice of Life", "Slapstick"], "tags": ["Aim For The Top", "Art", "Asia", "Based On A Manga", "Calligraphy", "Character Driven", "Childcare", "Coastal", "Comedy", "Coming Of Age"], "local": "images/cover_2917.jpg", "synopsis": "Seishuu Handa is an up-and-coming calligrapher: young, handsome, talented, and unfortunately, a narcissist to boot. When a veteran labels his award-winning piece as \"unoriginal,\" Seishuu quickly loses his cool with severe repercussions. As punishment, and also in order to aid him in self-reflection, Seishuu's father exiles him to the Goto Islands, far from the comfortable Tokyo lifestyle the temperamental artist is used to. Now thrown into a rural setting, Seishuu must attempt to find new inspiration and develop his own unique art style—that is, if boisterous children (headed by the frisky Naru Kotoishi), fujoshi middle schoolers, and energetic old men stop barging into his house! The newest addition to the intimate and quirky Goto community only wants to get some work done, but the islands are far from the peaceful countryside he signed up for. Thanks to his wacky neighbors who are entirely incapable of minding their own business, the arrogant calligrapher learns so much more than he ever hoped to. (Source: MAL Rewrite)"}, {"title": "Fate/stay night: Unlimited Blade Works", "image": "https://cdn.myanimelist.net/images/anime/12/67333.jpg", "score": 8.22, "episodes": 12, "year": 2014, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Ufotable, Inc."], "producers": ["Aniplex Of America", "Fate/Stay Night Production Committee", "Notes"], "duration_min": 28.0, "genres": ["Action", "Drama", "Fantasy", "Romance", "Supernatural"], "tags": ["3D Cg Animation", "Action", "Action Drama", "Adoption", "Archery", "Assassins", "Awards", "Based On A Visual Novel", "Based On An Eroge", "Battle Royale"], "local": "images/cover_9055.jpg", "synopsis": "Fuyuki City - a city surrounded by the sea and mountains becomes the setting for an ancient ritual. Seven masters are given control of heroic spirits in order to realize the mythical Holy Grail, which is said to grant its owner any wish. These heroic spirits or servants represent legendary heroes of various classes: \"Saber,\" \"Lancer,\" \"Archer,\" \"Rider,\" \"Caster,\" \"Assassin,\" and \"Berserker.\" Each master will enter into a contract with their chosen servant and battle the others to the death until only one pair remains... This is the \"Holy Grail War.\" The young and capable mage, Rin Tohsaka, prepares for her long-awaited Fifth Holy Grail War to begin... With her servant Archer, Rin enters the Holy Grail War as the sole heir to the prestigious Tohsaka family after her father's death. But when Shirou Emiya, a boy from Rin's school, unwittingly becomes a Master and is fatally wounded in battle, she has no choice but to save him. With Shirou and his servant Saber, Rin sets out to strike down the conspiracies surrounding the Holy Grail War. Will the Holy Grail bless Rin and Shirou's path toward victory or will they be cursed with defeat? (Source: Aniplex of America) Notes: - Includes Prologue. - The first, second and last episodes aired with a runtime of ~48 minutes as opposed to the standard 24 minute long episode."}, {"title": "Kimetsu no Yaiba: Jougen Shuuketsu, Soshite Katanakaji no Sato e", "image": "https://media.kitsu.app/anime/47122/poster_image/small-db846af6a061c779c6c7a1307ebe661a.jpeg", "score": 8.22, "episodes": 1, "year": 2023, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Ufotable, Inc."], "producers": [], "duration_min": 110.0, "genres": ["Action", "Drama", "Fantasy", "Supernatural", "Slapstick", "Historical"], "tags": ["Action", "Action Drama", "Demon", "Drama", "Excessive Violence", "Fantasy", "Hero Of Strong Character", "Heroine Of Strong Character", "Historical", "Shounen"], "local": "images/kimetsu-no-yaiba-jougen-shuuketsu-soshite-katanakaji-no-sato.jpeg"}, {"title": "Kino no Tabi: The Beautiful World", "image": "https://cdn.myanimelist.net/images/anime/1763/95397.jpg", "score": 8.22, "episodes": 13, "year": 2003, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["A.C.G.T.", "Acgt Co., Ltd."], "producers": ["A.C.G.T", "Adv Films", "Ascii Media Works"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Sci-Fi", "Slice of Life", "Psychological", "Historical"], "tags": ["1920S", "Achronological Order", "Action", "Adventure", "Agender", "Android", "Anthropomorphism", "Aviation", "Based On A Light Novel", "Battle Royale"], "local": "images/kino-no-tabi-the-beautiful-world.jpg", "synopsis": "Based on a hit light novel series by Keiichi Sigsawa, the philosophical Kino's Journey employs the time-honored motif of the road trip as a vehicle for self-discovery and universal truth. Deeply meditative and cooler than zero, the series follows the existential adventures of the apt marksman Kino along with talking motorcycle Hermes as they travel the world and learn much about themselves in the process. Imaginative, thought-provoking, and sometimes disturbing, Kino's journey is documented in an episodic style with an emphasis on atmosphere rather than action or plot, though still prevalent."}, {"title": "Love, Death + Robots", "image": "https://media.kitsu.app/anime/poster_images/42190/small.jpg", "score": 8.22, "episodes": 18, "year": 2019, "season": "SPRING", "type": "ONA", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 12.0, "genres": ["Comedy", "Fantasy", "Horror", "Sci-Fi", "Mecha", "Psychological", "Historical"], "tags": ["Android", "Anime Influenced", "Comedy", "Cyberpunk", "Cyborg", "Dystopia", "Fantasy", "Future", "Historical", "Horror"], "local": "images/love-death-robots.jpg"}, {"title": "No Doubt In Us 2: Part II", "image": "https://cdn.anime-planet.com/anime/primary/no-doubt-in-us-2-part-ii-1.webp", "score": 8.22, "episodes": 12, "year": 2023, "season": "UNDEFINED", "type": "ONA", "status": "FINISHED", "studios": ["Paper Plane Animation Studio"], "producers": ["Bilibili", "Linksure Literature", "Man Man"], "duration_min": 10.0, "genres": ["Comedy", "Romance", "Historical"], "tags": ["Ancient China", "Arranged Marriage", "Based On A Webtoon", "Body Swapping", "Cg Animation", "Chibi", "Chinese Animation", "Comedy", "Full Cgi", "Gender Bender"], "local": "images/no-doubt-in-us-2-part-ii.webp"}, {"title": "Thunderbolt Fantasy: Sword Seekers 2", "image": "https://cdn.anime-planet.com/anime/primary/thunderbolt-fantasy-sword-seekers-2-1.jpg", "score": 8.22, "episodes": 13, "year": 2018, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Pili International Multimedia", "Pili Puppetry"], "producers": ["Aniplex", "Good Smile Company", "Nitroplus"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Historical"], "tags": ["Action", "Adventure", "Ancient China", "Anti-Hero", "Crime", "Cultivation", "Desert", "Dragons", "Drama", "Fantasy"], "local": "images/thunderbolt-fantasy-sword-seekers-2.jpg", "synopsis": "The second season of Thunderbolt Fantasy."}, {"title": "Tsubasa: Tokyo Revelations", "image": "https://cdn.myanimelist.net/images/anime/4/49129.jpg", "score": 8.22, "episodes": 3, "year": 2007, "season": "FALL", "type": "OVA", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["Funimation", "Kodansha", "Production I.G"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Romance", "Isekai"], "tags": ["Action", "Action Drama", "Adventure", "Amnesia", "Asia", "Based On A Manga", "Be Careful What You Wish For", "Bionic Powers", "Body Horror", "Cannibalism"], "local": "images/tsubasa-tokyo-revelations.jpg", "synopsis": "Continuing their journey from Record Country (the place that held the book of memories), Syaoran and company land into Tokyo Country, a blood-filled country under war from opposing factions for natural resources and survival. While reluctantly involved in the race to live, the group faces their own problems as certain revelations are made, changing their journey forever. A shocking betrayal and a battle that risks all of their lives. After this revelation, they will never be the same again."}, {"title": "Tsue to Tsurugi no Wistoria Season 2", "image": "https://cdn.myanimelist.net/images/anime/1190/155788.jpg", "score": 8.22, "episodes": 12, "year": 2026, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Actas Inc.", "Bandai Namco Pictures Inc.", "Bn Pictures"], "producers": ["Bandai Namco Filmworks", "Bandai Namco Music Live", "Crunchyroll"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Romance", "Slapstick"], "tags": ["Action", "Adventure", "Alternative World", "Based On A Manga", "Crunchyroll Co-Production", "Drama", "Dungeon", "Elf", "Epic Fantasy", "Fantasy"], "local": "images/tsue-to-tsurugi-no-wistoria-season-2.jpg", "synopsis": "The second season of Tsue to Tsurugi no Wistoria . Will, a washout student at a magical academy who is unable to use magic, is aiming to join the top tier of mages, the Magia Vander, to fulfill a promise to his childhood friend, Elfaria. Wielding a sword instead of a wand, his abilities are slowly recognized within the academy. During the all-student praxis dungeon training he undertakes with Lihanna and the other top students of his year, they are ambushed by a mysterious mage. Though they barely manage to survive the attack together, they go on to face the exit exam. Can Will reach the girl waiting for him in the tower? (Source: Official Site)"}, {"title": "Uchuu Senkan Yamato 2199", "image": "https://cdn.myanimelist.net/images/anime/2/36607.jpg", "score": 8.22, "episodes": 26, "year": 2012, "season": "SPRING", "type": "OVA", "status": "FINISHED", "studios": ["Aic", "Xebec, Inc."], "producers": ["Bandai Namco Games", "Bandai Visual", "Funimation"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Drama", "Romance", "Sci-Fi"], "tags": ["3D Cg Animation", "Action", "Adult Cast", "Adventure", "Alien", "Aliens", "Amnesia", "Ancient Aliens", "Artificial Intelligence", "Aviation"], "local": "images/uchuu-senkan-yamato-2199.jpg", "synopsis": "The year is 2199. The human race has been crushed in their war with the Gamilos, driven into underground cities by the invader's assault. Scientists estimate they have only a year left. The young officers Susumu Kodai and Daisuke Shima receive a mysterious capsule from a ship that made an emergency landing on Mars and return with it to Earth. It contains humanity's last hope: the planet Iscandar on the other side of the Magellan Galaxy has the technology to defeat the Gamilos and restore the planet. The space battleship Yamato is entrusted with this task, but they have only one year before humanity ends. (Source: Anime News Network)"}, {"title": "Yahari Ore no Seishun Love Comedy wa Machigatteiru. Kan", "image": "https://cdn.myanimelist.net/images/anime/1958/107912.jpg", "score": 8.22, "episodes": 12, "year": 2020, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Feel."], "producers": ["Delfi Sound", "Marvelous Entertainment", "Movic"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Music"], "tags": ["Anti-Hero", "Antihero", "Asia", "Autumn", "Baking", "Based On A Light Novel", "Chiba", "Club", "Comedy", "Coming Of Age"], "local": "images/yahari-ore-no-seishun-love-comedy-wa-machigatteiru-kan.jpg"}, {"title": "Ze Tian Ji (2026)", "image": "https://cdn.myanimelist.net/images/anime/1993/157555.jpg", "score": 8.22, "episodes": 26, "year": 2026, "season": "WINTER", "type": "ONA", "status": "ONGOING", "studios": ["Shenman Entertainment"], "producers": ["Iqiyi"], "duration_min": 27.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Historical"], "tags": ["Action", "Adventure", "Arranged Marriage", "Based On A Web Novel", "Cg Animation", "Cg-Anime", "Chinese Animation", "Chinese Production", "Cultivation", "Drama"], "local": "images/ze-tian-ji-2026.jpg", "synopsis": "Chen Changsheng, a young man of mysterious origins, is prophesied to die before the age of twenty due to his unique constitution. Determined to defy fate, he follows his master’s orders and travels to the Divine Capital of the human realm with a marriage contract in hand. His goal is to win first place in the highest-level Grand Imperial Examination, thereby earning the right to enter the Tomb of Heavenly Books to study the steles and seek a way to extend his life. In the Divine Capital, the marriage contract draws him into complex power struggles involving the Saintess Xu Yourong. Soon, an even greater crisis emerges: the forces of the demon race begin stirring in secret, plotting to overthrow the human race. Relying on his vast knowledge, Chen Changsheng makes his debut at the Ivy Banquet, then goes on to claim first place in the Grand Imperial Examination, gaining entry to the Tomb of Heavenly Books. There, he not only comprehends profound cultivation techniques but also uncovers a connection between his own origins and a massive conspiracy from years past. After leaving the Tomb of Heavenly Books, Chen Changsheng enters the Zhou Garden secret realm with companions such as Xu Yourong, Luoluo, and Tang Thirty-Six. Inside the Zhou Garden, they clash head-on with the demon race. Chen Changsheng ultimately inherits Zhou Dufu's legacy and uncovers the shocking possibility that he is the Crown Prince Zhaoming. This revelation thrusts him into the eye of the storm… (Source: iQ)"}, {"title": "Zoku Owarimonogatari", "image": "https://cdn.anime-planet.com/anime/primary/zoku-owarimonogatari-1.jpg", "score": 8.21, "episodes": 1, "year": 2018, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Shaft Inc."], "producers": ["Aniplex", "Kodansha"], "duration_min": 148.0, "genres": ["Comedy", "Drama", "Fantasy", "Mystery", "Supernatural"], "tags": ["Asia", "Based On A Light Novel", "Comedy", "Contemporary Fantasy", "Dialogue Driven", "Drama", "Earth", "Ecchi", "Fantasy", "Japan"], "local": "images/zoku-owarimonogatari.jpg", "synopsis": "Third season of the Monogatari Series, part 5/5. Contains the arc Koyomi Reverse from the Zoku Owarimonogatari light novel. The morning after high school graduation, Koyomi is standing in front of the mirror above the sink to wash his face when he suddenly feels like his reflection is staring back at him. He instinctively reaches for the mirror, and upon touching it, his fingers sink in... When he comes to, Koyomi finds himself in a world where everything appears to be reversed. (Source: Aniplex) Zoku Owarimonogatari premiered in theaters across Japan in November 2018. It was later released as a 6-part OVA on Blu-ray/DVD from February to March 2019."}, {"title": "Bee and PuppyCat", "image": "https://media.kitsu.app/anime/poster_images/11108/small.jpg", "score": 8.21, "episodes": 10, "year": 2014, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": [], "producers": ["Dong Woo Animation", "Frederator Studios", "Oriental Light And Magic"], "duration_min": null, "genres": ["Comedy", "Fantasy"], "tags": ["Anime Influenced", "Comedy", "Fantasy", "Magical Girl", "Mahou Shoujo"], "local": "images/cover_3090.jpg"}, {"title": "Bee and PuppyCat: Lazy in Space", "image": "https://media.kitsu.app/anime/poster_images/41987/small.jpg", "score": 8.21, "episodes": 16, "year": 2022, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 26.0, "genres": ["Comedy", "Fantasy"], "tags": ["Anime Influenced", "Comedy", "Fantasy", "Magical Girl"], "local": "images/cover_3092.jpg"}, {"title": "Fruits Basket 1st Season", "image": "https://cdn.myanimelist.net/images/anime/1447/99827.jpg", "score": 8.21, "episodes": 25, "year": 2019, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["8 Pan", "8Pan", "Tms Entertainment Co., Ltd."], "producers": ["8Pan", "Avex Pictures", "Fruits Basket Production Committee"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Fantasy", "Romance", "Slice of Life", "Supernatural", "Slapstick"], "tags": ["3D Cg Animation", "Adoring Fan Club", "Agriculture", "Alcohol", "Amnesia", "Angst", "Animal Transformation", "Animals", "Asia", "Badminton"], "local": "images/cover_9529.jpg", "synopsis": "Tohru Honda thought her life was headed for misfortune when a family tragedy left her living in a tent. When her small home is discovered by the mysterious Soma clan, she suddenly finds herself living with Yuki, Kyo, and Shigure Soma. But she quickly learns their family has a bizarre secret of their own: when hugged by the opposite sex, they turn into the animals of the Zodiac! (Source: Crunchyroll)"}, {"title": "Kage no Jitsuryokusha ni Naritakute!", "image": "https://cdn.myanimelist.net/images/anime/1091/128729.jpg", "score": 8.21, "episodes": 20, "year": 2022, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Nexus"], "producers": ["Aiming", "At-X", "Bs Nippon"], "duration_min": 23.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Romance", "Isekai"], "tags": ["Absurdist Humour", "Acting", "Action", "Action Comedy", "Age Regression", "Aim For The Top", "Alchemy", "Alcohol", "Almighty Hero", "Alternative World"], "local": "images/kage-no-jitsuryokusha-ni-naritakute.jpg", "synopsis": "Some people just aren’t suited to playing the part of the flashy, in-your-face hero or the dastardly, mustache-twirling villain with larger-than-life panache. Instead, they operate in the shadows and pull the strings of society through wit and cleverness. That’s the role Cid wants to play when he’s transported to another world. Cid spins a yarn or three and becomes the unlikely leader of the underground Shadow Garden organization that fights against a menacing cult (which he totally made up). However, there’s a catch even his wild imagination didn’t see coming: the cult he concocted actually exists, and they’re beyond displeased that his power fantasy just got in the way of their evil plans! (Source: HIDIVE)"}, {"title": "Kono Sekai no Katasumi ni", "image": "https://cdn.myanimelist.net/images/anime/2/87704.jpg", "score": 8.21, "episodes": 1, "year": 2016, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Mappa Co., Ltd."], "producers": ["Animatsu Entertainment", "At-X", "Bandai Visual"], "duration_min": 168.0, "genres": ["Drama", "Romance", "Slice of Life", "Historical"], "tags": ["Adapted Into Jdrama", "Adapted Into Other Media", "Adult Couples", "Arranged Marriage", "Asia", "Award Winning", "Awards", "Based On A Manga", "Coming Of Age", "Crowdfunded"], "local": "images/kono-sekai-no-katasumi-ni.jpg", "synopsis": "The story follows a young lady named Suzu Urano, who in 1944 moves to the small town of Kure in Hiroshima to live with her husband's family. Suzu's life is thrown into chaos when her town is bombed during World War II. Her perseverance and courage underpin this heart-warming and inspirational tale of the everyday challenges faced by the Japanese in the midst of a violent, war-torn country. This beautiful yet poignant tale shows that even in the face of adversity and loss, people can come together and rebuild their lives. (Source: Shout! Factory)"}, {"title": "Koukaku Kidoutai", "image": "https://cdn.myanimelist.net/images/anime/10/82594.jpg", "score": 8.21, "episodes": 1, "year": 1995, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["Aube", "Bandai Visual", "Kodansha"], "duration_min": 82.0, "genres": ["Action", "Drama", "Mystery", "Sci-Fi", "Thriller", "Mecha", "Psychological"], "tags": ["Action", "Action Drama", "Adult Cast", "Artificial Intelligence", "Asia", "Award Winning", "Based On A Manga", "Bionic Powers", "Cgi", "Cops"], "local": "images/koukaku-kidoutai.jpg", "synopsis": "A TV anime version of Ghost in the Shell: Arise . Note: The first eight episodes are an edited version of the four movies while the last two are new content."}, {"title": "Major S6", "image": "https://cdn.myanimelist.net/images/anime/2/75216.jpg", "score": 8.21, "episodes": 25, "year": 2010, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Synergy Sp", "Synergysp Co. ,Ltd."], "producers": ["Nhk Enterprises", "Shogakukan-Shueisha Productions", "Synergysp"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Romance", "Sports"], "tags": ["Adoption", "Ambitious", "America", "Americas", "Baseball", "Based On A Manga", "Comedy", "Drama", "Earth", "Flashback"], "local": "images/major-s6.jpg", "synopsis": "The sixth season begins after the \"Baseball World Cup\" has ended. Goro regained his passion for baseball in Japan thanks to his friends, and left to join the Hornets baseball team in preperation to the new season. When he arrives in America he starts to celebrate his role as a Major League pitcher at last! Goro's family and friends gathers in groups in Japan to watch Goro's debut in the Major League. However, Goro's debut is the beginning of a line of surprising happenings, that has an outcome no one expected..."}, {"title": "Mushoku Tensei II: Isekai Ittara Honki Dasu", "image": "https://cdn.myanimelist.net/images/anime/1898/138005.jpg", "score": 8.21, "episodes": 12, "year": 2023, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Studio Bind", "Studiobind Co., Ltd."], "producers": ["Bs11", "Egg Firm", "Frontier Works"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Romance", "Isekai", "Psychological"], "tags": ["Action", "Adventure", "Alternative World", "Anthropomorphism", "Anthropomorphs", "Archery", "Aristocracy", "Autumn", "Based On A Light Novel", "Black Humour"], "local": "images/mushoku-tensei-ii-isekai-ittara-honki-dasu.jpg", "synopsis": "After his relationship with Eris Boreas Greyrat reaches new heights, Rudeus Greyrat is ecstatic. Unfortunately, his joy is short-lived, as Eris suddenly abandons him to embark on her own journey. Believing that Eris has lost all interest in him, a heartbroken and depressed Rudeus sets forth to the Northern Territories. With his sole goal being to locate his mother on the vast continent, Rudeus wonders if persisting through daily life is worth the pain, falling into a robotic routine as he endlessly ruminates on his lost love. However, the dangers of the North soon prove that one cannot survive with a dulled mind. While on a quest with the party Counter Arrow, with whom he recently became acquainted, Rudeus has a brush with death—an experience that forces him to finally snap out of his despair. With his newfound teammates, Rudeus rediscovers the pleasure of daily adventuring and moves forward with his original goal of living his second lease on life to the fullest. (Source: MAL Rewrite) Note: Includes episode 0, Shugo Jutsushi Fitz."}, {"title": "Natsume Yuujinchou", "image": "https://cdn.myanimelist.net/images/anime/1681/108439.jpg", "score": 8.21, "episodes": 13, "year": 2008, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Brain'S Base"], "producers": ["Aniplex", "Hakusensha", "Nas"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Fantasy", "Slice of Life", "Supernatural"], "tags": ["Adoption", "Afterlife", "Alcohol", "Animal Sidekick", "Asia", "Based On A Manga", "Bionic Powers", "Bodyguards", "Bullying", "Cats"], "local": "images/natsume-yuujinchou.jpg", "synopsis": "Takashi Natsume and his loyal feline protector Madara take a trip to Hitoyoshi Kuma, a peaceful area in Kumamoto. From admiring the Kaname Falls to relaxing at the Tsurukame hot spring, the duo unwind and take in the beautiful scenery throughout the eventful day. (Source: MAL Rewrite)"}, {"title": "Pretty Guardian Sailor Moon Cosmos Movie 2", "image": "https://cdn.anime-planet.com/anime/primary/pretty-guardian-sailor-moon-cosmos-movie-2-1.webp", "score": 8.21, "episodes": 1, "year": 2023, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Studio Deen", "Toei Animation"], "producers": [], "duration_min": 82.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Romance"], "tags": ["Action", "Adventure", "Aliens", "Coming Of Age", "Contemporary Fantasy", "Cosmic Horror", "Demons", "Drama", "Fantasy", "Female Protagonist"], "local": "images/pretty-guardian-sailor-moon-cosmos-movie-2.webp", "synopsis": "Sailor Moon battles Shadow Galactica, an enemy threatening her friends in order to rule the universe. Can she protect her loved ones and persevere? (Source: Netflix Anime)"}, {"title": "Prism Rondo", "image": "https://cdn.myanimelist.net/images/anime/1862/153881.jpg", "score": 8.21, "episodes": 20, "year": 2026, "season": "WINTER", "type": "ONA", "status": "FINISHED", "studios": ["Wit Studio, Inc."], "producers": ["Glovision", "Netflix"], "duration_min": 26.0, "genres": ["Drama", "Romance", "Historical"], "tags": ["Adult Cast", "Arranged Marriage", "Art", "Art School", "Bicycling", "Bullying", "College", "Coming Of Age", "Dancing", "Drama"], "local": "images/prism-rondo.jpg", "synopsis": "Yoko Kamio, whose manga \"Boys Over Flowers\" enraptured readers around the globe, brings a brand-new classic to viewers worldwide. Set at a London art academy in the opening decade of the 1900s, the Netflix Series \"Love Through a Prism\" follows Lili Ichijoin, a girl enchanted by painting, as she chases her dreams and experiences youth. This ensemble coming-of-age story about young people striving for prismatic radiance against the odds is about to begin. (Source: Netflix)"}, {"title": "Sakamichi no Apollon", "image": "https://cdn.myanimelist.net/images/anime/1604/98654.jpg", "score": 8.21, "episodes": 12, "year": 2012, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Mappa Co., Ltd.", "Tezuka Productions Co., Ltd."], "producers": ["Dax Production", "Dentsu Inc.", "Fuji Television Network"], "duration_min": 22.0, "genres": ["Drama", "Romance", "Slice of Life", "Music", "Historical"], "tags": ["1960S", "Adapted Into Japanese Movie", "Adapted Into Other Media", "Age Gap", "Angst", "Asia", "Band", "Based On A Manga", "Christianity", "Classical Music"], "local": "images/sakamichi-no-apollon.jpg", "synopsis": "The beginning of summer, 1966. Because of his father's job situation, freshman high school student Kaoru Nishimi moves by himself from Yokosuka to Kyushu to live with relatives. Until then, Kaoru was an honor roll student who tended to keep to himself, but meeting notorious bad boy Sentaro Kawabuchi starts to change him. Through his devil-may-care classmate, Kaoru learns the attractions of jazz and finds the first person he can call a \"friend\". He also discovers how much fun it is to play music with a pal. Other characters include Sentaro's kind childhood chum, Ritsuko, who is the daughter of a record shop owner; the mysterious upperclassman, Yurika; and Brother Jun, the much-admired leader among their peers. Set against the backdrop of a seaside town with a scent of American culture, this series is a drama about young people coming into their own, crossing each other's paths, and finding friendship, love, and music! (Source: Official Website)"}, {"title": "She-Ra and the Princesses of Power Season 4", "image": "https://media.kitsu.app/anime/poster_images/42649/small.jpg", "score": 8.21, "episodes": 13, "year": 2019, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": ["Dreamworks"], "producers": ["Netflix"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Fantasy", "Sci-Fi"], "tags": ["Action", "Adventure", "Anime Influenced", "Fantasy", "Fantasy World", "Friendship", "Magic", "Science Fiction"], "local": "images/she-ra-and-the-princesses-of-power-season-4.jpg"}, {"title": "Spy x Family Season 3", "image": "https://cdn.myanimelist.net/images/anime/1697/151793.jpg", "score": 8.21, "episodes": 13, "year": 2025, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Cloverworks Inc.", "Wit Studio, Inc."], "producers": ["Cloverworks", "Shogakukan-Shueisha Productions", "Shueisha"], "duration_min": 23.0, "genres": ["Action", "Comedy", "Drama", "Romance", "Slice of Life", "Supernatural"], "tags": ["Action", "Action Comedy", "Assassin", "Assassins", "Based On A Manga", "Childcare", "Cohabitation", "Comedy", "Dissociative Identities", "Drama"], "local": "images/spy-x-family-season-3.jpg", "synopsis": "The third season of SPY×FAMILY . World peace is at stake and secret agent Twilight must undergo his most difficult mission yet—pretend to be a family man. Posing as a loving husband and father, he’ll infiltrate an elite school to get close to a high-profile politician. He has the perfect cover, except his wife’s a deadly assassin and neither knows each other’s identity. But someone does, his adopted daughter who’s a telepath! (Source: Crunchyroll)"}, {"title": "Tenkuu no Shiro Laputa", "image": "https://cdn.myanimelist.net/images/anime/5/37799.jpg", "score": 8.21, "episodes": 1, "year": 1986, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Studio Ghibli Inc."], "producers": ["Gkids", "Omnibus Promotion", "Streamline Pictures"], "duration_min": 124.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Romance", "Sci-Fi", "Mecha", "Historical"], "tags": ["Action", "Adventure", "Android", "Anti-War", "Aviation", "Award Winning", "Awards", "Boy Meets Girl", "Comedy", "Damsel In Distress"], "local": "images/tenkuu-no-shiro-laputa.jpg", "synopsis": "This high-flying adventure begins when Pazu, an engineer's apprentice, finds a young girl, Sheeta, floating down from the sky wearing a glowing pendant. Together they discover both are searching for a legendary floating castle, Laputa, and vow to unravel the mystery of the luminous crystal around Sheeta's neck. Their quest won't be easy, however. There are greedy air pirates, secret government agents and astounding obstacles to keep them from the truth, and from each other. (Source: Disney)"}, {"title": "The Dragon Prince", "image": "https://media.kitsu.app/anime/42096/poster_image/small-591b7a43c32319ac574dd6c114530e1d.jpeg", "score": 8.21, "episodes": 9, "year": 2018, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 24.0, "genres": ["Adventure", "Fantasy"], "tags": ["Adventure", "Anime Influenced", "Dragon", "Elf", "Fantasy", "Fantasy World", "High Fantasy", "Kids", "Magic"], "local": "images/the-dragon-prince.jpeg"}, {"title": "Wakfu: The Animated Series", "image": "https://media.kitsu.app/anime/poster_images/8299/small.jpg", "score": 8.21, "episodes": 26, "year": 2008, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": [], "producers": ["Ankama Animation"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Fantasy"], "tags": ["Action", "Adventure", "Anime Influenced"
