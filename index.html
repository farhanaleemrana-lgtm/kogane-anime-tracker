cceed. (Source: Anime News Network)"}, {"title": "JoJo no Kimyou na Bouken Part 6: Stone Ocean", "image": "https://cdn.myanimelist.net/images/anime/1896/119844.jpg", "score": 8.13, "episodes": 12, "year": 2021, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": ["David Production Inc."], "producers": ["Klockworx", "Medicos Entertainment", "Shueisha"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Horror", "Supernatural"], "tags": ["Action", "Adventure", "Agender", "America", "Americas", "Based On A Manga", "Body Horror", "Cgi", "Comedy", "Contemporary Fantasy"], "local": "images/jojo-no-kimyou-na-bouken-part-6-stone-ocean.jpg"}, {"title": "Kimi ni Todoke", "image": "https://cdn.myanimelist.net/images/anime/1502/124384.jpg", "score": 8.13, "episodes": 25, "year": 2009, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["D.N. Dream Partners", "Nippon Television Network Corporation", "Nis America Inc."], "duration_min": 22.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Slapstick"], "tags": ["Adapted Into Japanese Movie", "Adapted Into Other Media", "Angst", "Asia", "Baseball", "Based On A Manga", "Bicycle", "Boy Meets Girl", "Bullying", "Character Driven"], "local": "images/kimi-ni-todoke.jpg", "synopsis": "Kuronuma Sawako is completely misunderstood by her classmates. Her timid and sweet demeanor is often mistaken for malicious behavior. This is due to her resemblance to the ghost girl from \"The Ring\", which has led her peers to give her the nickname Sadako. Longing to make friends and live a normal life, she is naturally drawn to Kazehaya Shouta, the most popular guy in class, whose \"100% refreshing\" personality earns him great admiration from Sawako. So when Kazehaya starts talking to her, maybe there is hope for the friendships Sawako has always longed for. Maybe...there is even a little hope for some romance in her future."}, {"title": "Kipo and the Age of Wonderbeasts Season 2", "image": "https://media.kitsu.app/anime/poster_images/43157/small.jpg", "score": 8.13, "episodes": 10, "year": 2020, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 25.0, "genres": ["Fantasy", "Sci-Fi"], "tags": ["Anime Influenced", "Anthropomorphism", "Dystopia", "Fantasy", "Friendship", "Kids", "Post Apocalypse", "Science Fiction"], "local": "images/kipo-and-the-age-of-wonderbeasts-season-2.jpg"}, {"title": "Noragami Aragoto", "image": "https://cdn.myanimelist.net/images/anime/1689/94850.jpg", "score": 8.13, "episodes": 13, "year": 2015, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Bones Inc."], "producers": ["A-Sketch", "Ai Addiction", "Animatic"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Romance", "Supernatural", "Slapstick"], "tags": ["Action", "Adventure", "Amnesia", "Angst", "Anti-Hero", "Asia", "Based On A Manga", "Betrayal", "Blackmail", "Comedy"], "local": "images/noragami-aragoto.jpg", "synopsis": "The second season of Noragami . Life for minor god Yato isn't getting any easier. He's still broke, shrineless, and his partner-slash-sword-regalia has zero respect for him. Worse yet, Bishamon, one of the deadliest war gods, is after his life. Blaming him for the death of her past regalia, she won't stop until she kills him. But there's more to that story than she could ever realize. And as if that's not bad enough, there's someone working against her behind the scenes! Can Yato take on a god as powerful as Bishamon? Or will things take a more dangerous turn? Between all of this godly drama and even more dangerous battles, Yato still needs to figure out how to help Hiyori. But all options lead to losing her, and he's not willing to make that choice – no matter what. Five yen doesn't even begin to cover his trouble! (Source: Funimation)"}, {"title": "Ookami to Koushinryou: Merchant Meets the Wise Wolf", "image": "https://cdn.myanimelist.net/images/anime/1059/142414.jpg", "score": 8.13, "episodes": 25, "year": 2024, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Passione Co., Ltd."], "producers": ["Enishiya", "Good Smile Company", "Hayabusa Film"], "duration_min": 23.0, "genres": ["Adventure", "Drama", "Fantasy", "Romance", "Slice of Life", "Supernatural", "Historical"], "tags": ["Adult Cast", "Adult Couples", "Adventure", "Age Difference Romance", "Age Gap", "Agriculture", "Animal Characteristics", "Animal Transformation", "Animals", "Based On A Light Novel"], "local": "images/ookami-to-koushinryou-merchant-meets-the-wise-wolf.jpg", "synopsis": "Lawrence is a traveling merchant selling various goods from a horse-drawn cart. One day, he arrives at a village and meets a beautiful girl with the ears and tail of an animal! Her name is Holo the Wisewolf and she brings bountiful harvests. She wishes to return to her homeland, and Lawrence offers to take her. Now, the once-lonely merchant and the once-lonely wisewolf begin their journey north. (Source: Crunchyroll)"}, {"title": "Rurouni Kenshin: Meiji Kenkaku Romantan", "image": "https://cdn.myanimelist.net/images/anime/1346/119505.jpg", "score": 8.13, "episodes": 94, "year": 1996, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Gallop Co., Ltd.", "Studio Deen Co., Ltd."], "producers": ["Aniplex Of America", "Fuji Television Network", "Fuji Tv"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Romance", "Psychological", "Historical"], "tags": ["19Th Century", "Action", "Adapted Into Japanese Movie", "Adapted Into Other Media", "Adventure", "Age Difference Romance", "Asia", "Assassins", "Atonement", "Bakumatsu - Meiji Period"], "local": "images/rurouni-kenshin-meiji-kenkaku-romantan.jpg", "synopsis": "Himura Kenshin is a vagabond with a dark past and sunny disposition. Not a ronin but a rurouni, he was never a samurai, but an assassin of utmost skill in the Meiji restoration, who in the turning point of the war simply walked away. His travels lead him to Tokyo in the 11th year of the Meiji era, where he befriends a female Kendo master, a former thief, a brawler and a doctor all with their own secrets. Together they fight off the enemies surfacing from the dark past that Kenshin cannot escape. (Source: Anime News Network)"}, {"title": "Skip Beat!", "image": "https://cdn.myanimelist.net/images/anime/11/84022.jpg", "score": 8.13, "episodes": 25, "year": 2008, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Hal Film Maker Inc."], "producers": ["Hakusensha", "Hal Film Maker", "Omnibus Promotion"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Music", "Slapstick"], "tags": ["Acting", "Age Difference", "Anime & Movie", "Asia", "Based On A Manga", "Comedy", "Coming Of Age", "Drama", "Earth", "Ending"], "local": "images/skip-beat.jpg", "synopsis": "Kyouko followed her true love and childhood friend Shou to Tokyo so she could help him reach his dream of becoming an idol. She cleans, cooks, works three jobs and does nothing for herself because she loves him so much, but gets nothing in return. Still, she remains by his side. But then one day she goes unannounced to his agency with a delivery, and overhears him talking about her; he reveals to his manager that he only took her with him as a maid, and that he doesn't care for her at all. Upon hearing this, Kyouko doesn't just sit around and cry. She cuts and dyes her hair, changes her clothes and attitude and thus begins her journey to join showbiz and have her revenge against Shou. (Source: Anime News Network)"}, {"title": "Suponjibobu Anime", "image": "https://media.kitsu.app/anime/poster_images/43801/small.jpg", "score": 8.13, "episodes": null, "year": 2020, "season": "SUMMER", "type": "ONA", "status": "ONGOING", "studios": [], "producers": [], "duration_min": 14.0, "genres": ["Action", "Drama"], "tags": ["Acti os": ["Madhouse Inc."], "producers": ["Madhouse", "Nippon Television Network Corporation", "Sentai Filmworks"], "duration_min": 22.0, "genres": ["Drama", "Romance", "Slice of Life", "Sports", "Slapstick"], "tags": ["Adapted Into Japanese Movie", "Adapted Into Other Media", "Aim For The Top", "Asia", "Athletics", "Based On A Manga", "Brain Games And Gambling", "Bullying", "Card Games", "Cgi"], "local": "images/cover_5121.jpg", "synopsis": "Chihaya Ayase has spent most of her life supporting her sister’s model career. When she meets a boy named Arata Wataya, he thinks Chihaya has potential to become a great karuta player. As Chihaya dreams of becoming Japan's best karuta player, she is soon separated from her karuta playing friends. Now in high school, Chihaya still plays karuta in the hope that she will one day meet her friends again. (Source: Crunchyroll)"}, {"title": "Gyakkyou Burai Kaiji: Ultimate Survivor", "image": "https://cdn.myanimelist.net/images/anime/12/80032.jpg", "score": 8.12, "episodes": 26, "year": 2007, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Madhouse Inc."], "producers": ["Arts Pro", "D.N. Dream Partners", "Madhouse"], "duration_min": 23.0, "genres": ["Action", "Drama", "Thriller", "Psychological"], "tags": ["Action", "Adapted Into Japanese Movie", "Adapted Into Other Media", "Adult Cast", "Angst", "Anti-Hero", "Asia", "Athletics", "Based On A Manga", "Battle Of Wits"], "local": "images/gyakkyou-burai-kaiji-ultimate-survivor.jpg", "synopsis": "Itou Kaiji is a bum who steals car emblems and slashes tires on what seems to be a regular basis. This routine changes one day when he is paid a visit by a man in a trench-coat. Once the two get talking, it seems that the visitor (Calling himself Endou) is a debt collector. The reason for his visit is an unpaid loan which Kaiji had previously co-signed for a work-mate (Furuhata Takeshi). The original loan was 300,000 yen and once Takeshi had disappeared, the loan then fell on Kaiji. their hearts, a new story for Tanjiro and the Hashira begins. (Source: Aniplex USA) Note: The first episode received an early premiere in cinemas as part of a special screening alongside the final episode of Kimetsu no Yaiba: Katanakaji no Sato-hen."}, {"title": "Kuroko no Basket 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/9/56155.jpg", "score": 8.12, "episodes": 25, "year": 2013, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["Bandai Visual", "Banpresto", "Bs11"], "duration_min": 24.0, "genres": ["Comedy", "Sports", "Slapstick"], "tags": ["Asia", "Based On A Manga", "Basketball", "Calling Your Attacks", "Cgi", "Character Growth", "Club", "Comedy", "Coming Of Age", "Dissociative Identities"], "local": "images/kuroko-no-basket-2nd-season.jpg", "synopsis": "With the Interhigh Championship finally over, Seirin's basketball team refocuses their efforts, training harder than ever to get the chance to participate in the Winter Cup. Both Kuroko and Kagami see old friends walk back into their lives, providing a challenge both on and off the court. As new skills are developed and new alliances created, enemies from various teams—giants of high school basketball such as Yousen, Shuutoku and Touou—stand in the way of Seirin's steadfast attempts to get to the top. All of these schools prove to be formidable foes whose abilities progress exponentially, while Kuroko struggles to find a balance between his resolve to play as part of a team and his desire to win. With old wounds reopening, new challenges to face on the court, and a new set of foes—the \"Uncrowned Kings\"—vowing to defeat the new hopefuls, will Seirin ever be able to achieve their dream of beating the Generation of Miracles? (Source: MAL Rewrite)"}, {"title": "Legend of the Galactic Heroes: Die Neue These Third 1", "image": "https://cdn.anime-planet.com/anime/primary/legend-of-the-galactic-heroes-die-neue-these-third-1-1.jpg", "score": 8. y", "Crime Fiction", "Crossdressing", "Detective", "Detectives", "Drama"], "local": "images/meitantei-conan-movie-26-kurogane-no-submarine.jpg"}, {"title": "Mobile Suit Gundam - The Movie Trilogy", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A154-578461492.1444288208.jpg", "score": 8.12, "episodes": 1, "year": 1981, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": [], "producers": ["Sunrise"], "duration_min": 135.0, "genres": ["Action", "Drama", "Sci-Fi", "Mecha"], "tags": ["Action", "Drama", "Mecha", "Military", "Real Robot", "Science Fiction", "Space", "Space Colonies", "Space Navy"], "local": null}, {"title": "Natsume Yuujinchou: Itsuka Yuki no Hi ni", "image": "https://cdn.myanimelist.net/images/anime/11/79742.jpg", "score": 8.12, "episodes": 1, "year": 2014, "season": "WINTER", "type": "OVA", "status": "FINISHED", "studios": ["Brain'S Base"], "producers": ["Aniplex", "Brain'S Base", "Nas"], "duration_min": 22.0, "genres": ["Comedy", "Drama", "Fantasy", "Slice of Life", "Supernatural"], "tags": ["Adoption", "Anthropomorphism", "Asia", "Based On A Manga", "Bodyguards", "Cats", "Comedy", "Contemporary Fantasy", "Countryside", "Demon"], "local": "images/natsume-yuujinchou-itsuka-yuki-no-hi-ni.jpg", "synopsis": "Natsume Yuujinchou OVA which will be aired on 5th February 2014. The Blu-ray & DVD package will also includes the Chapter ~ SOUND THEATRE x Natsume's Book of Friends ~ gathering sound play which was held on September 28. Natsume takes a walk to enjoy the first winter snow and happens upon a snow-woman youkai searching for something she's lost and but can't seem to remember. While she causes anything she touches to freeze and it’s unclear what she’s looking for, he decides to help her search. (Source: ANN)"}, {"title": "Nisemonogatari", "image": "https://cdn.myanimelist.net/images/anime/1044/103654.jpg", "score": 8.12, "episodes": 11, "year": 2012, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Shaft Inc."], "producers": ["Aniplex Of America", "Hanabee Entertainment", "Kodansha"], "duration_min": 25.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Mystery", "Romance", "Supernatural", "Psychological", "Slapstick"], "tags": ["Absurdity", "Achronological Order", "Action", "Angst", "Asia", "Awards", "Based On A Light Novel", "Black And White", "Borderline Porn", "Brother-Sister Incest"], "local": "images/nisemonogatari.jpg", "synopsis": "First season of the Monogatari Series, part 5/6. Contains the arcs Karen Bee and Tsukihi Phoenix from the Nisemonogatari light novels. In Bakemonogatari, the story centered on Koyomi Araragi, a third year high school student who has recently survived a vampire attack and finds himself mixed up with all kinds of apparitions: gods, ghosts, myths, and spirits. However, in Nisemonogatari, we pick up right where we left off and follow Koyomi as the psychological twists delve deeper and deeper... (Source: Aniplex)"}, {"title": "Non Non Biyori Repeat", "image": "https://cdn.myanimelist.net/images/anime/9/75105.jpg", "score": 8.12, "episodes": 12, "year": 2015, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Silver Link."], "producers": ["Lantis", "Sentai Filmworks", "Silver Link."], "duration_min": 23.0, "genres": ["Comedy", "Slice of Life", "Slapstick"], "tags": ["Achronological Order", "Aliens", "Asia", "Based On A Manga", "Cgdct", "Character Driven", "Comedy", "Countryside", "Cute Girls Doing Cute Things", "Daily Life"], "local": "images/non-non-biyori-repeat.jpg", "synopsis": "Even though there are still only five students who attend the remote Asahigaoka Branch School, each one of the girls already has a lifetime of wonderful experiences in the carefree Japanese countryside. Some memories may belong to just one person, like Hotaru’s recollections of her first day in Asahigaoka before she’d had a chance to meet her new friends. Other memories bring an otherwise sleepy town to life for Komari, Natsumi, Renge, or even Suguru. (Source: Sentai Filmworks)"}, {"title": "Redline", "image": "https://cdn.myanimelist.net/images/anime/12/28553.jpg", "score": 8.12, "episodes": 1, "year": 2009, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Madhouse Inc."], "producers": ["Anchor Bay Films", "Madhouse", "Tohokushinsha Film Corporation"], "duration_min": 102.0, "genres": ["Action", "Comedy", "Drama", "Romance", "Sci-Fi", "Sports", "Thriller", "Psychological"], "tags": ["Absurdity", "Action", "Adult Cast", "Alien", "Aliens", "Anthropomorphism", "Automobiles", "Battle Royale", "Bendy Lasers", "Cars"], "local": "images/redline.jpg", "synopsis": "Redline is about the biggest and most deadly racing tournament in the universe. Only held once every five years, everyone wants to stake their claim to fame, including JP, a reckless dare-devil driver oblivious to speed limits with his ultra-customized car - all the while, organized crime and militaristic governments want to leverage the race to their own ends. Amongst the other elite rival drivers in the tournament, JP falls for the alluring Sonoshee - but will she prove his undoing, or can a high speed romance survive a mass destruction race? (Source: Anchor Bay Films)"}, {"title": "Sennen Joyuu", "image": "https://cdn.myanimelist.net/images/anime/1648/93626.jpg", "score": 8.12, "episodes": 1, "year": 2002, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Madhouse Inc."], "producers": ["Bandai Visual", "Chaos Union", "Dreamworks"], "duration_min": 86.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Romance", "Slice of Life", "Thriller", "Psychological", "Historical"], "tags": ["Acting", "Action", "Adult Cast", "Adventure", "Age Gap", "Anachronism", "Angst", "Anime & Movie", "Asia", "Award Winning"], "local": "images/sennen-joyuu.jpg", "synopsis": "Millennium Actress blurs the lines between the past and the present, and truth and fiction, when a documentary filmmaker fulfills his quest to find the legendary actress Chiyoko Fujiwara, and learn why she mysteriously vanished at the height of her brilliant career. When Chiyoko grants the filmmaker’s request, he, in turn, presents her with a token – a key she had lost and thought was gone forever. The filmmaker could not have imagined that the key would not only unlock the long-held secrets of Chiyoko’s life, but also his own. (Source: Dreamworks) Note: The film received an early premiere at the Fantasia Film Festival on July 28, 2001."}, {"title": "The Brave Fighter of Legend Da-Garn", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A1302-1863485195.1466743339.jpg", "score": 8.12, "episodes": 46, "year": 1992, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": [], "producers": ["Sunrise", "Takara"], "duration_min": 30.0, "genres": ["Action", "Sci-Fi", "Mecha"], "tags": ["Action", "Mecha", "Science Fiction"], "local": null, "synopsis": "Seiji Takasugi obtained a jewel called \"Aurin\" which is the earth's alter ego and it has elected him to be the commander of eight brave robots. The Brave robots are sleeping in many parts of the world as \"Brave Stones\". However, they become super robots by fusing with modern people and machines once Seiji awakens them and they soon follow his instructions. Their enemy is Lord Oh-Boss who is an invader who aims at stealing the planet's energy with the aid of his subordinates that Da-Garn and the other brave robots must stop in order to save the world. (Source: Wikipedia)"}, {"title": "Voltron: Legendary Defender Season 4", "image": "https://media.kitsu.app/anime/poster_images/13663/small.jpg", "score": 8.12, "episodes": 6, "year": 2017, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 24.0, "genres": ["Action", "Sci-Fi", "Mecha"], "tags": ["Action", "Alien", "Anime Influenced", "Humanoid Alien", "Mecha", "Piloted Robot", "Science Fiction", "Space", "Transforming Craft uction I.G., Inc."], "producers": ["Aiming", "Shochiku", "Wright Staff"], "duration_min": 25.0, "genres": ["Action", "Drama", "Sci-Fi"], "tags": ["Action", "Action Drama", "Adult Cast", "Conspiracy", "Drama", "Japanese Production", "Military", "Novel", "Sci-Fi", "Science Fiction"], "local": "images/ginga-eiyuu-densetsu-die-neue-these-sakubou.jpg", "synopsis": "The sequel to Legend of the Galactic Heroes: Die Neue These - Collision . Note: It received a limited special screening in theaters with the episodes spliced together into 3 separate movies."}, {"title": "Ansatsu Kyoushitsu", "image": "https://cdn.myanimelist.net/images/anime/5/75639.jpg", "score": 8.11, "episodes": 22, "year": 2015, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Lerche"], "producers": ["Avex Pictures", "Dax Production", "Dentsu"], "duration_min": 23.0, "genres": ["Action", "Comedy", "Drama", "Sci-Fi", "Supernatural"], "tags": ["Action", "Action Comedy", "Adapted Into Japanese Movie", "Adapted Into Other Media", "Adults Are Useless", "Aliens", "Anti-Hero", "Artificial Intelligence", "Asia", "Assassin"], "local": "images/cover_1603.jpg", "synopsis": "The students of class 3-E have a mission: kill their teacher before graduation. He has already destroyed the moon, and has promised to destroy the Earth if he can not be killed within a year. But how can this class of misfits kill a tentacled monster, capable of reaching Mach 20 speed, who may be the best teacher any of them have ever had?"}, {"title": "Bee and PuppyCat Pilot", "image": "https://media.kitsu.app/anime/poster_images/11109/small.jpg", "score": 8.11, "episodes": 1, "year": 2013, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": [], "producers": ["Frederator Studios"], "duration_min": 10.0, "genres": ["Comedy", "Fantasy"], "tags": ["Anime Influenced", "Comedy", "Fantasy", "Magical Girl", "Mahou Shoujo"], "local": "images/cover_3091.jpg"}, {"title": "Death Parade", "image": "https://cdn.myanimelist.net/images/anime/5/71553.jpg", "score": 8.11, "episodes": 12, "year": 2015, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Madhouse Inc."], "producers": ["Dax Production", "Madhouse", "Nippon Television Network Corporation"], "duration_min": 23.0, "genres": ["Drama", "Fantasy", "Mystery", "Supernatural", "Thriller", "Psychological"], "tags": ["Adult Cast", "Afterlife", "Amnesia", "Bar", "Bowling", "Cgi", "Contemporary Fantasy", "Crime Fiction", "Death", "Death Game"], "local": "images/cover_6759.jpg", "synopsis": "When two people die at the same time, they’re sent to a place that’s neither heaven nor hell—a lavish bar between worlds where the stakes are high and the rules are simple: if you win you live again, if you die… you’re gone for good. Decim is the bartender charged with serving the souls who enter Quindecim. He may make a mean cocktail, but his true profession is to play the role of arbiter—a judge who determines whether or not a soul is worthy of reincarnation. To aid in his judgment, the bar’s patrons are forced to play simple games laced with sadistic twists designed to bring their true natures to light. To Decim, judgment has always been black and white—that is—until he meets a mysterious young woman whose fate seems impossible to decide. His indecision shakes the very foundation of the games and raises the biggest question of all: Who is fit to judge the dead? (Source: Funimation)"}, {"title": "Dragon Ball Super: Broly", "image": "https://cdn.myanimelist.net/images/anime/1575/93498.jpg", "score": 8.11, "episodes": 1, "year": 2018, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Toei Animation Co., Ltd."], "producers": ["Bandai Co., Ltd.", "Bandai Namco Entertainment", "Echoes"], "duration_min": 100.0, "genres": ["Action", "Adventure", "Comedy", "Fantasy", "Sci-Fi", "Slapstick"], "tags": ["Action", "Adventure", "Alien", "Aliens", "Alternative World", "Based On A Manga", "Bionic Powers", "Canon Filler", "Cgi", "Comedy"], "local": "images/cover_7935.jpg", "synopsis": "Earth is at peace after The Tournament of Power but Goku continues to train, knowing there are ever-stronger forces in the universe. With the arrival of a Saiyan warrior named Broly, Goku and Vegeta face their most dangerous challenge yet. The film also chronicles the history of the Saiyans and the background story of these three Saiyans with different destinies connected to the turbulent period of their now extinct race."}, {"title": "Ginga Eiyuu Densetsu: Die Neue These - Seiran 1", "image": "https://cdn.myanimelist.net/images/anime/1772/102667.jpg", "score": 8.11, "episodes": 4, "year": 2019, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["Production I.G", "Shochiku"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Drama", "Sci-Fi"], "tags": ["Action", "Action Drama", "Adult Cast", "Adventure", "Cgi", "Drama", "Ensemble Cast", "Genius", "Male Protagonist", "Military"], "local": "images/ginga-eiyuu-densetsu-die-neue-these-seiran-1.jpg"}, {"title": "Initial D Second Stage", "image": "https://cdn.myanimelist.net/images/anime/8/12750.jpg", "score": 8.11, "episodes": 13, "year": 1999, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Pastel"], "producers": ["Avex Entertainment", "Fuji Television Network", "Fuji Tv"], "duration_min": 23.0, "genres": ["Action", "Drama", "Romance", "Slice of Life", "Sports", "Slapstick"], "tags": ["Action", "Asia", "Auto Racing", "Based On A Manga", "Cars", "Cgi", "Coming Of Age", "Drama", "Drifting", "Earth"], "local": "images/initial-d-second-stage.jpg", "synopsis": "Following his victory over RedSuns leader Ryosuke Takahashi, AE86 driver Takumi Fujiwara is challenged by the Lancer EVO-based \"Emperor,\" a group known for taking decals of racing teams they defeat, cutting them up and placing them on their cars like a fighter plane kill board. Takumi's undefeated streak is on the line as his AE86 is virtually no match against the more powerful and more agile four-wheel-drive EVOs of the Emperor team. (Source: Anime News Network)"}, {"title": "Kaguya-hime no Monogatari", "image": "https://cdn.myanimelist.net/images/anime/1935/93606.jpg", "score": 8.11, "episodes": 1, "year": 2013, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Studio Ghibli Inc."], "producers": ["Buena Vista Home Entertainment", "D-Rights", "Dentsu Inc."], "duration_min": 137.0, "genres": ["Drama", "Fantasy", "Romance", "Supernatural", "Historical"], "tags": ["Adapted Into Japanese Movie", "Adapted Into Other Media", "Adoption", "Agriculture", "Amnesia", "Asia", "Award Winning", "Calligraphy", "Classic Literature", "Coming Of Age"], "local": "images/kaguya-hime-no-monogatari.jpg", "synopsis": "Okina is a bamboo cutter in ancient rural Japan. One day in the forest, he finds a tiny baby in the folds of a bamboo shoot. He brings the creature home to his wife Ounaa and they decide to keep her and raise her as a princess. She is clearly not of this world. Kaguya grows at an unnatural rate, soon maturing into an uncommonly beautiful young woman. Since Okina has now also found a cache of gold and treasure in the forest, every suitor wants Kaguya. But this is not a fairy tale of courtship and marriage. (Source: Toronto International Film Festival)"}, {"title": "Liz to Aoi Tori", "image": "https://cdn.myanimelist.net/images/anime/1638/93032.jpg", "score": 8.11, "episodes": 1, "year": 2018, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["Kyoto Animation Co., Ltd."], "producers": ["Animation Do", "Bandai Namco Arts", "Kyoto Animation"], "duration_min": 90.0, "genres": ["Drama", "Slice of Life", "Music"], "tags": ["Angst", "Asia", "Award Winning", "Awards", "Band", "Based On A Novel", "Classical Music", "Club", "Coming Of Age", "Drama"], "local": "images/liz-to-aoi-tori.jpg", "synopsis": "Students and best friends Mizore Yoroizuka and Nozomi Kasaki prepare to play a complex musical duet, Liz and the Blue Bird , for oboe and flute. Though they play beautifully together and have been friends since childhood, Mizore and Nozomi find that with graduation looming and the duet proving difficult, their friendship begins to buckle under the pressure. Interspersed with their story is the fantasy tale of Liz, drawn like a storybook, contrasting with the crisp realism of the school. (Source: Shout! Factory)"}, {"title": "Luo Fanchen (Movie)", "image": "https://cdn.myanimelist.net/images/anime/1933/156789.jpg", "score": 8.11, "episodes": 1, "year": 2024, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Winsing Animation"], "producers": ["Bilibili", "Glowing & Unit", "Youku"], "duration_min": 118.0, "genres": ["Fantasy", "Romance"], "tags": ["Cg Animation", "Cg-Anime", "Chinese Animation", "Chinese Production", "Fantasy", "Original Work", "Romance"], "local": "images/luo-fanchen-movie.jpg"}, {"title": "Miraculous Ladybug Season 3", "image": "https://media.kitsu.app/anime/poster_images/42156/small.jpg", "score": 8.11, "episodes": 26, "year": 2018, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 22.0, "genres": ["Action", "Adventure", "Comedy", "Fantasy", "Romance"], "tags": ["Action", "Action Comedy", "Adventure", "Anime Influenced", "Cg-Anime", "Comedy", "Episodic", "Fantasy", "Henshin", "Heroine Of Strong Character"], "local": "images/miraculous-ladybug-season-3.jpg"}, {"title": "Nippon Sangoku", "image": "https://cdn.myanimelist.net/images/anime/1623/156387.jpg", "score": 8.11, "episodes": 12, "year": 2026, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Studio Kafka Co., Ltd."], "producers": ["Amazon Mgm Studios", "Sound Team Don Juan", "Twin Engine"], "duration_min": 24.0, "genres": ["Action", "Drama", "Sci-Fi", "Thriller", "Psychological"], "tags": ["Action", "Agriculture", "Alternate History", "Anachronism", "Asia", "Based On A Manga", "Class Struggle", "Conspiracy", "Corruption", "Death"], "local": "images/nippon-sangoku.jpg", "synopsis": "A revolution sparked by nuclear war, natural disaster, and misrule leads to the collapse of Japanese society. The country splits into three nations vying for hegemony, and the Sangoku era begins. Aoteru Misumi, a former agricultural officer, vows to reunify Japan. He rises through the ranks with only his knowledge and eloquence. Witness the legend of the man later hailed as a genius strategist. (Source: Amazon Prime Video)"}, {"title": "Overlord IV", "image": "https://cdn.myanimelist.net/images/anime/1530/120110.jpg", "score": 8.11, "episodes": 13, "year": 2022, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Madhouse Inc."], "producers": ["At-X", "Hakuhodo Dy Music & Pictures", "Kadokawa"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Fantasy", "Isekai"], "tags": ["Action", "Adventure", "Almighty Hero", "Alternative World", "Anti-Hero", "Antihero", "Based On A Light Novel", "Cgi", "Comedy", "Conspiracy"], "local": "images/overlord-iv.jpg", "synopsis": "The fourth season of Overlord . E-Rantel, the capital city of the newly established Sorcerer Kingdom, suffers from a dire shortage of goods. Once a prosperous city known for its trade, it now faces a crisis due to its caution—or even fear—of its king, Ainz Ooal Gown. To make amends, Ainz sends Albedo to the city as a diplomatic envoy. Meanwhile, the cardinals of the Slane Theocracy discuss how to retaliate against Ainz after his attack crippled the Re-Estize Kingdom's army, plotting for the Baharuth Empire to take over the Sorcerer Kingdom. However, when Emperor Jircniv Rune Farlord El Nix arranges a meeting with the Theocracy's messengers at a colosseum, he is confronted by none other than Ainz himself. With their secret gathering now out in the open, the emperor and his guests learn that Ainz has challenged the Warrior King, the empire's greatest fighter, to a duel. With Ainz's motivations beyond his comprehension, Jircniv can do nothing but watch as humanity's future changes before his very eyes. (Source: MAL Rewrite)"}, {"title": "Quanzhi Gaoshou Specials", "image": "https://cdn.myanimelist.net/images/anime/1825/91514.jpg", "score": 8.11, "episodes": 3, "year": 2018, "season": "SPRING", "type": "ONA", "status": "FINISHED", "studios": ["China Literature Limited", "Chongqing Caise Qianbi Dongman Sheji Youxian Zeren Gongsi", "Colored Pencil Animation Japan"], "producers": ["China Literature Limited", "Colored Pencil Animation Japan", "Colored-Pencil Animation Design"], "duration_min": 27.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Sports"], "tags": ["Action", "Adoring Fan Club", "Adventure", "Asia", "Based On A Web Novel", "Battle Of Wits", "Bishoujo", "Bishounen", "Broken Friendship", "Cgi"], "local": "images/quanzhi-gaoshou-specials.jpg", "synopsis": "The All-Star Tournament is a three-day event that allows e-sports participants from various professional clubs to display their skills, while also giving casual Glory players the chance to interact with pros in the flesh. Retired top-tier Glory player Ye Xiu agrees to watch the tournament together with Tang Rou and Chen Guo after the latter manages to get ahold of three tickets. It is a strange sensation for Ye Xiu, as unlike previous occasions, this time he attends the tournament as a spectator, not a participant. However, despite his attempts to keep a low profile, events in the All-Star Tournament may force the former Glory legend back into the limelight."}, {"title": "She-Ra and the Princesses of Power Season 3", "image": "https://media.kitsu.app/anime/poster_images/42417/small.jpg", "score": 8.11, "episodes": 6, "year": 2019, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 23.0, "genres": ["Action", "Adventure", "Fantasy", "Sci-Fi"], "tags": ["Action", "Adventure", "Anime Influenced", "Fanta but Chito and Yuuri are still alive. So they hop aboard their beloved Kettenkrad motorbike and aimlessly wander the ruins of the world they once knew. Day after hopeless day, they look for their next meal and fuel for their ride. But as long as the two are together, even an existence as bleak as theirs has a ray or two of sunshine in it, whether they're sucking down their fill of soup or hunting for machine parts to tinker with. For two girls in a world full of nothing, the experiences and feelings the two share give them something to live for… (Source: Yen Press)"}, {"title": "Spy x Family Season 2", "image": "https://cdn.myanimelist.net/images/anime/1506/138982.jpg", "score": 8.11, "episodes": 12, "year": 2023, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Cloverworks Inc.", "Wit Studio, Inc."], "producers": ["Shogakukan-Shueisha Productions", "Shueisha", "Spy×Family Production Committee"], "duration_min": 23.0, "genres": ["Action", "Comedy", "Drama", "Romance", "Slice of Life", "Supernatural", "Slapstick"], "tags": ["Action", "Action Comedy", "Adoption", "Amnesia", "Animals", "Assassin", "Assassins", "Based On A Manga", "Childcare", "Cohabitation"], "local": "images/spy-x-family-season-2.jpg", "synopsis": "The second season of SPY×FAMILY . The Forger family will face a new familial mission as Yor heads on a cruise ship expedition! (Source: Crunchyroll News)"}, {"title": "Thunderbolt Fantasy 3", "image": "https://cdn.anime-planet.com/anime/primary/thunderbolt-fantasy-3-1.jpg", "score": 8.11, "episodes": 13, "year": 2021, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Pili International Multimedia", "Pili Puppetry"], "producers": ["Aniplex", "Good Smile Company", "Nitroplus"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Isekai", "Historical"], "tags": ["Action", "Adventure", "Ancient China", "Anti-Hero", "Cultivation", "Demons", "Disability", "Drama", "Fantasy", "Gore"], "local": "images/th ear": 2019, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Ajia-Do", "Ajiado Co.,Ltd."], "producers": ["Abc Animation", "Ajiado", "Bs Fuji"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Fantasy", "Slice of Life", "Isekai", "Slapstick", "Historical"], "tags": ["Adoption", "Age Regression", "Age Transformation", "Alternative World", "Archery", "Based On A Light Novel", "Body And Host", "Body Takeover", "Catastrophic Gadgets", "Cheats"], "local": "images/honzuki-no-gekokujou-shisho-ni-naru-tame-ni-wa-shudan-wo-era.jpg", "synopsis": "Anime adaptation of Part 1 of Honzuki no Gekokujou . When a sickly young girl suddenly becomes obsessed with inventing new things, her family and friends are all puzzled. \"What has gotten into Myne?\" they wondered, never dreaming that the answer is not a \"What\" but a \"Who\": Urano Motosu, a book-loving apprentice librarian who died in an earthquake in Tokyo who somehow found herself in Myne's body! And since Myne's world is still in a medieval stage, where books can only be owned by the elite, the new Myne intends to do everything she can to bring her beloved books to the masses in the time she has left. (Source: Sentai Filmworks) Note: The first episode was included in a bonus DVD that came with the limited edition of the 8th volume of Part 4 of the light novel that was released on September 10th, 2019 prior to its TV premiere."}, {"title": "Horimiya: Piece", "image": "https://cdn.myanimelist.net/images/anime/1007/136277.jpg", "score": 8.1, "episodes": 13, "year": 2023, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Cloverworks Inc."], "producers": ["Aniplex", "Global Solutions", "Kanetsu Investment"], "duration_min": 23.0, "genres": ["Comedy", "Romance", "Slice of Life", "Slapstick"], "tags": ["Achronological Order", "Based On A Manga", "Chibi", "Comedy", "Ensemble Cast", "Episodic", "Facial Distortion", "Family Life", "Female Protagonist", "Friendship"], "local": "images/horimiya-piece.jpg", "synopsis": "A new anime project adapting popular side stories that were left out from the previous adaptation. As the graduation ceremony at Katagiri High School comes to an end, Kyouko Hori, her boyfriend Izumi Miyamura, and their friends begin to look back on their time as students. The moments they shared together may be fleeting, but each one is a colorful piece of their precious memories. (Source: MAL Rewrite)"}, {"title": "Hyakuemu.", "image": "https://cdn.myanimelist.net/images/anime/1259/151080.jpg", "score": 8.1, "episodes": 1, "year": 2025, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Rock N' Roll Mountain", "Rock'N Roll Mountain"], "producers": ["Asmik Ace, Inc.", "Gkids", "Pony Canyon"], "duration_min": 106.0, "genres": ["Drama", "Sports"], "tags": ["Athletics", "Based On A Manga", "Club", "Coming Of Age", "Drama", "Elementary School", "Fitness", "Ganbatte", "High School", "Japanese Production"], "local": "images/hyakuemu.jpg", "synopsis": "100 METERS follows Togashi, a track star who is born to run. As a kid, he is naturally gifted and wins every 100-meter race without effort. But in sixth grade, he meets Komiya, a transfer student who is full of determination but lacks technique. In teaching him, Togashi gives Komiya a new purpose: to win no matter what. Years pass by, and Togashi and Komiya meet again as rivals on the track and reveal their true selves. (Source: GKIDS)"}, {"title": "Jigokuraku", "image": "https://cdn.myanimelist.net/images/anime/1075/131925.jpg", "score": 8.1, "episodes": 13, "year": 2023, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Mappa Co., Ltd."], "producers": ["Mappa", "Shueisha", "Twin Engine"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Horror", "Mystery", "Romance", "Supernatural", "Thriller", "Psychological", "Historical"], "tags": ["Action", "Action Drama", "Adventure", "Amnesia", "Anti-Hero", "Aristocracy", "Asia", "Assassins", "Based On A Manga", "Battle Royale"], "local": "images/jigokuraku.jpg", "synopsis": "The Edo period is nearing its end. Gabimaru, a shinobi formerly known as the strongest in Iwagakure who is now a death row convict, is told that he will be acquitted and set free if he can bring back the Elixir of Life from an island that is rumored to be the Buddhist pure land Sukhavati. In hopes of reuniting with his beloved wife, Gabimaru heads to the island along with the executioner Yamada Asaemon Sagiri. Upon arriving there, they encounter other death row convicts in search of the Elixir of Life... as well as a host of unknown creatures, eerie manmade statues, and the hermits who rule the island. Can Gabimaru find the Elixir of Life on this mysterious island and make it back home alive? (Source: Crunchyroll)"}, {"title": "Jujutsu Kaisen: Kaigyoku/Gyokusetsu", "image": "https://cdn.myanimelist.net/images/anime/1999/147023.jpg", "score": 8.1, "episodes": 1, "year": 2025, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["Mappa Co., Ltd."], "producers": ["Dugout", "Toho Next"], "duration_min": 110.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Supernatural"], "tags": ["Action", "Based On A Manga", "Comedy", "Compilation", "Contemporary Fantasy", "Criminal Organization", "Curses", "Dark Fantasy", "Demon", "Demons"], "local": "images/jujutsu-kaisen-kaigyoku-gyokusetsu.jpg", "synopsis": "\"The strongest duo—A youth they can never return to.\" Recompilation film of Jujutsu Kaisen 2nd Season's \"Kaigyoku・Gyokusetsu\" (Hidden Inventory / Premature Death) arc (episodes 1-5 re-edited) with new footage showing glimpses of school memories accompanied by an acoustic version of \"Ao no Sumika\" (Where Our Blue Is) by Tatsuya Kitani. Before they were enemies, Satoru Gojo and Suguru Geto were high school classmates and friends. The two most powerful sorcerers are tasked with protecting Riko Amanai, a student who has been designated to be sacrificed as the Star Plasma Vessel, until she can fulfill her duty. Pursued by a religious cult and other curse users, they are the only sorcerers capable of carrying out such a difficult task – but this mission will set their destinies, and challenge the two sorcerers in ways unimaginable. (Source: GKIDS)"}, {"title": "Kamisama Hajimemashita: Kamisama, Kekkon Zenya", "image": "https://media.kitsu.app/anime/poster_images/12199/small.jpg", "score": 8.1, "episodes": 1, "year": 2016, "season": "WINTER", "type": "OVA", "status": "FINISHED", "studios": ["Tms Entertainment"], "producers": ["Tms Entertainment"], "duration_min": 30.0, "genres": ["Comedy", "Fantasy", "Romance", "Supernatural"], "tags": ["Comedy", "Demon", "Demons", "Fantasy", "Romance", "Sequel", "Shoujo", "Supernatural"], "local": "images/kamisama-hajimemashita-kamisama-kekkon-zenya.jpg"}, {"title": "Kimi ni Todoke 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1311/121574.jpg", "score": 8.1, "episodes": 12, "year": 2011, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["D.N. Dream Partners", "Nippon Television Network Corporation", "Nis America Inc."], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Slapstick"], "tags": ["Asia", "Based On A Manga", "Chibi", "Comedy", "Coming Of Age", "Daily Life", "Drama", "Earth", "Eternal Blush", "Female Protagonist"], "local": "images/kimi-ni-todoke-2nd-season.jpg", "synopsis": "The second season of Kimi ni Todoke . Sawako Kuronuma and her friends have just begun their second year of high school and they are in the same class together again. To make matters more interesting a male student newly transferred into their class is seated right next to Kuronuma and has taken an interest in her. What hurdles will Sawako and Kazehaya face next? Note: Includes episode 0, \"Kataomoi/A Crush\"."}, {"title": "Kingdom 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/13/53589.jpg", "score": 8.1, "episodes": 39, "year": 2013, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Pierrot Co., Ltd."], "producers": ["Nhk Enterprises", "Sogo Vision", "Studio Pierrot"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Drama", "Thriller", "Historical"], "tags": ["Action", "Adventure", "Ancient China", "Aristocracy", "Asia", "Based On A Manga", "Cgi", "China", "Coming Of Age", "Coming-Of-Age"], "local": "images/kingdom-2nd-season.jpg", "synopsis": "The second season of Kingdom . A year after the devastating battle against the formidable Zhao, the State of Qin has returned its focus to pursuing King Ying Zheng's ambition of conquering the other six states and unifying China. Their next target is Wei, a smaller state which stands as a geographic stepping stone for the sake of conquest. Xin, now a three hundred man commander of the swiftly rising Fei Xin Unit, continues to seek out lofty achievements in order to garner recognition for himself and his soldiers, motivated by those previously lost in battle. In the preliminary battles ahead of Qin's invasion of Wei, Xin finds competition in other young commanders who are of a higher social status than him. Back in Qin, the royal palace faces turmoil as opposing factions begin to make their move against Ying Zheng's regime. With their hands full both abroad and at home, Zheng and Xin must lead the way in this era of unending war, resolved to etch their names in history by creating a unified China. (Source: MAL Rewrite)"}, {"title": "Kuroshitsuji Movie: Book of the Atlantic", "image": "https://cdn.myanimelist.net/images/anime/9/85792.jpg", "score": 8.1, "episodes": 1, "year": 2017, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["A-1 Pictures Inc."], "producers": ["A-1 Pictures", "Aniplex", "Hakuhodo Dy Music & Pictures"], "duration_min": 100.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Horror", "Mystery", "Supernatural", "Historical"], "tags": ["19Th Century", "Action", "Action Drama", "Anti-Hero", "Awards", "Based On A Manga", "Butler", "Butlers", "Cgi", "Comedy"], "local": "images/kuroshitsuji-movie-book-of-the-atlantic.jpg"}, {"title": "One Piece Film: Strong World", "image": "https://cdn.myanimelist.net/images/anime/1192/116784.jpg", "score": 8.1, "episodes": 1, "year": 2009, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Toei Animation Co., Ltd."], "producers": ["Bandai Co., Ltd.", "Fuji Television Network", "Funimation"], "duration_min": 115.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Slapstick"], "tags": ["Action", "Adventure", "Alternative World", "Based On A Manga", "Beastman", "Bionic Powers", "Call My Name", "Calling Your Attacks", "Comedy", "Crime"], "local": "images/one-piece-film-strong-world.jpg", "synopsis": "The story begins somewhere between the Thriller Bark arc and the Sabaody Archipelago arc. The main villain's name is \"Golden Lion\" Shiki. 20 years ago he lost a battle against Monkey D. Garp and Sengoku and was imprisoned in Impel Down, but managed to escape. After that he starts to collect his crew and steals Nami to make her his navigator. Luffy tries to get to Shiki's hideout to free his friend."}, {"title": "RWBY VIII", "image": "https://media.kitsu.app/anime/poster_images/42599/small.jpg", "score": 8.1, "episodes": 14, "year": 2020, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 18.0, "genres": ["Action", "Adventure", "Fantasy"], "tags": ["Action", "Adventure", "Anime Influenced", "Fantasy", "Fantasy World"], "local": "images/rwby-viii.jpg"}, {"title": "Sasaki to Miyano Movie: Sotsugyou-hen", "image": "https://cdn.myanimelist.net/images/anime/1574/128922.jpg", "score": 8.1, "episodes": 1, "year": 2023, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Studio Deen Co., Ltd."], "producers": ["Bs Ntv", "Cinema Sunshine", "Frontier Works"], "duration_min": 51.0, "genres": ["Comedy", "Romance", "Slice of Life"], "tags": ["All-Boys School", "Based On A Manga", "Bisexual", "Bl", "Boys Love", "Boys' Love", "Comedy", "Coming Of Age", "Cute Boys Doing Cute Things", "Delinquents"], "local": "images/sasaki-to-miyano-movie-sotsugyou-hen.jpg"}, {"title": "Shangri-La Frontier: Kusoge Hunter, Kamige ni Idoman to su", "image": "https://cdn.myanimelist.net/images/anime/1500/139931.jpg", "score": 8.1, "episodes": 25, "year": 2023, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["C2C Co., Ltd."], "producers": ["Crunchyroll", "Dentsu Inc.", "Flying Dog"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Romance", "Sci-Fi", "Slapstick"], "tags": ["Action", "Adventure", "Alternative World", "Anachronism", "Animals", "Anthropomorphism", "Anthropomorphs", "Antihero", "Asia", "Assassins"], "local": "images/shangri-la-frontier-kusoge-hunter-kamige-ni-idoman-to-su.jpg", "synopsis": "The second season of Shangri-La Frontier . Rakuro Hizutome only cares about one thing: beating crappy VR games. He devotes his entire life to these buggy games and could clear them all in his sleep. One day, he decides to challenge himself and play a popular god-tier game called Shangri-La Frontier. But he quickly learns just how difficult it is. Will his expert skills be enough to uncover its hidden secrets? (Source: Crunchyroll)"}, {"title": "Shen Yin Wangzuo", "image": "https://cdn.myanimelist.net/images/anime/1776/122162.jpg", "score": 8.1, "episodes": 26, "year": 2022, "season": "SPRING", "type": "ONA", "status": "FINISHED", "studios": ["Shenman Entertainment"], "producers": ["China South Angel", "Shenman Entertainment", "Tencent Penguin Pictures"], "duration_min": 20.0, "genres": ["Action", "Adventure", "Fantasy"], "tags": ["3D Cg Animation", "Action", "Adventure", "Amnesia", "Assassin", "Assassins", "Based On A Web Novel", "Cg Animation", "Cg-Anime", "Cgi"], "local": "images/shen-yin-wangzuo.jpg", "synopsis": "While the demons were rising, mankind was about to become extinct. Six temples rose, and protected the last of mankind. A young boy joins the temple as a knight to save his mother. During his journey of wonders and mischief in the world of temples and demons, will he be able to ascend to become the strongest knight and inherit the throne?"}, {"title": "Shijou Saikyou no Deshi Kenichi", "image": "https://cdn.myanimelist.net/images/anime/9/75515.jpg", "score": 8.1, "episodes": 50, "year": 2006, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Tms Entertainment Co., Ltd."], "producers": ["Discotek", "Funimation", "Shogakukan"], "duration_min": 24.0, "genres": ["Action", "Comedy", "Romance", "Sports", "Slapstick"], "tags": ["Action", "Ambitious", "Asia", "Based On A Manga", "Boxing", "Boy Meets Girl", "Calling Your Attacks", "Childhood Promise", "Combat", "Combat Sport"], "local": "images/shijou-saikyou-no-deshi-kenichi.jpg", "synopsis": "From wimp to warrior. Sort of… Yeah, Kenichi’s a total wimp. He’s always getting picked on and doesn’t have a lot of friends to stick up for him. The guy needs motivation if he hopes to graduate in one piece. Well, Miu’s the perfect motivation. She’s hot, she accepts him, and she just so happens to live at a dojo with six martial arts masters. You could say fate has led Kenichi to their door, or you could say he was just following the hottie. Either way, he’s about to get whipped into serious shape. If he can survive some hard-core training, he might survive another day at school. He might even score with Miu. Yeah, you could call Kenichi a wimp. But let’s go with underdog instead. (Source: Discotek)"}, {"title": "Shinsekai yori", "image": "https://cdn.myanimelist.net/images/anime/1549/136389.jpg", "score": 8.1, "episodes": 25, "year": 2012, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["A-1 Pictures Inc."], "producers": ["A-1 Pictures", "Aniplex", "From The New World Production Committee"], "duration_min": 22.0, "genres": ["Adventure", "Drama", "Fantasy", "Horror", "Mystery", "Romance", "Sci-Fi", "Supernatural", "Thriller", "Psychological"], "tags": ["Adventure", "Alternative World", "Amnesia", "Angst", "Animals", "Anthropomorphism", "Anti-Hero", "Asia", "Aviation", "Based On A Novel"], "local": "images/shinsekai-yori.jpg", "synopsis": "Following a sudden outbreak of psychokinesis in 0.1% of the population, a rapid transformation swept the world. The godlike ability to manipulate matter remotely turned many power wielders to violence, inciting a long period of upheaval. Finally, after a chaotic era shaped by the rise and fall of oppressive regimes, the psychic humans were able to achieve a fragile peace by isolating their society, creating a new world bound by complex rules. In the town of Kamisu 66, 12-year-old Saki Watanabe has just awakened to her powers and is relieved to rejoin her friends—the mischievous Satoru Asahina, the shy Mamoru Itou, the cheerful Maria Akizuki, and Shun Aonuma, a mysterious boy whom Saki admires—at Sage Academy, a special school for psychics. However, unease looms as Saki begins to question the fate of those unable to awaken to their powers, and the children begin to get involved with secretive matters such as the rumored Tainted Cats said to abduct children. Shinsekai yori tells the unique coming-of-age story of Saki and her friends as they journey to grow into their roles in the supposed utopia. Accepting these roles, however, might not come easy when faced with the dark and shocking truths of society, and the impending havoc born from the new world. (Source: MAL Rewrite)"}, {"title": "Silent Witch: Chinmoku no Majo no Kakushigoto", "image": "https://cdn.myanimelist.net/images/anime/1669/149732.jpg", "score": 8.1, "episodes": 13, "year": 2025, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Andraft", "Studio Gokumi"], "producers": ["Aniplex", "Bs11", "Cygames"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Slapstick"], "tags": ["Action", "Action Drama", "Adventure", "Alternative World", "Aristocracy", "Arranged Marriage", "Based On A Light Novel", "Boarding School", "Bodyguards", "Bullying"], "local": "images/silent-witch-chinmoku-no-majo-no-kakushigoto.jpg", "synopsis": "Monica Everett, the Silent Witch, is the world’s only practitioner of Voiceless Magic, a veritable heroine who single-handedly fended off the Black Dragon of legend. However, the young prodigy is actually…super-duper shy! Yup, turns out she only learned Voiceless Magic to avoid speaking in public. Ignorant of this, the Seven Sages have placed her on a top-secret mission to guard the Second Prince. Can Monica keep it together as she contends with both social interaction and the evils targeting the young royal? (Source: Yen Press, edited)"}, {"title": "Toaru Kagaku no Railgun T", "image": "https://cdn.myanimelist.net/images/anime/1819/103287.jpg", "score": 8.1, "episodes": 25, "year": 2020, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["J.C. Staff", "J.C.Staff Co., Ltd."], "producers": ["At-X", "J.C. Staff", "Kadokawa"], "duration_min": 24.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Sci-Fi", "Supernatural", "Slapstick"], "tags": ["3D Cg Animation", "Action", "Adoring Fan Club", "All-Girls School", "Alternative Present", "Android", "Angst", "Artificial Intelligence", "Asia", "Based On A Manga"], "local": "images/toaru-kagaku-no-railgun-t.jpg", "synopsis": "The third season of Toaru Kagaku no Railgun . The Daihasei Festival has begun, and that of course means that Tokiwadai Middle School—a prestigious all-girls' middle school—is competing too. Despite the participation of the \"Ace of Tokiwadai,\" Mikoto Misaka, the other students who are participating are still putting their utmost effort into winning, no matter how impossible the feat may seem against her might. However, not all is fun and games. Due to the festival, Academy City opens to the outside world, and various factions have begun plotting ways to infiltrate the city. Misaka appears to be on their radar, and as the festival proceeds, people lurking from the shadows begin to emerge... Toaru Kagaku no Railgun T brings back the Tokiwadai Ace and her friends as they dive deeper into the dark side of Academy City. From terrorist attacks to ruthless underground projects, anything is possible in this city. (Source: MAL Rewrite)"}, {"title": "Wu Dong Qian Kun 5th Season", "image": "https://cdn.myanimelist.net/images/anime/1315/146994.jpg", "score": 8.1, "episodes": 12, "year": 2025, "season": "WINTER", "type": "ONA", "status": "FINISHED", "studios": ["Dc Impression Vision", "Motion Magic"], "producers": ["Tencent Animation & Comics", "Tencent Penguin Pictures", "Tencent Video"], "duration_min": 22.0, "genres": ["Action", "Adventure", "Fantasy", "Historical"], "tags": ["Action", "Adventure", "Based On A Web Novel", "Cg Animation", "Cg-Anime", "Chinese Animation", "Chinese Production", "Cultivation", "Fantasy", "Full Cgi"], "local": "images/wu-dong-qian-kun-5th-season.jpg"}, {"title": "Xingchen Bian: Zuizhong Ji", "image": "https://cdn.myanimelist.net/images/anime/1147/156957.jpg", "score": 8.1, "episodes": 12, "year": 2026, "season": "SPRING", "type": "ONA", "status": "FINISHED", "studios": ["Foch Film", "Shanghai Foch Film And Tv Culture Investment"], "producers": ["China Literature Limited", "Tencent Animation & Comics", "Tencent Penguin Pictures"], "duration_min": 29.0, "genres": ["Action", "Adventure", "Fantasy", "Romance", "Historical"], "tags": ["Action", "Adventure", "Based On A Web Novel", "Cg Animation", "Chinese Animation", "Chinese Production", "Cultivation", "Fantasy", "Historical", "Martial Arts"], "local": "images/xingchen-bian-zuizhong-ji.jpg"}, {"title": "Yu Yu Hakusho: Ghost Files", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A311-14.jpg", "score": 8.1, "episodes": 112, "year": 1992, "season": "FALL",
