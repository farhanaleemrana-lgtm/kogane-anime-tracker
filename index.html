1711, alchemists are about to learn the price of immortality. Based on the award winning light novels of the same name, this anime adaptation follows several events that initially seem unrelated, both in time and place, but are part of a much bigger story&mdash;one of alchemy, survival and immortality. Merging these events together are the kindhearted would-be thieves, Isaac and Miria, connecting various people, all of them with their own hidden ambitions and agendas, and creating lifelong bonds and consequences for everyone involved. (Source: MAL Rewrite)"}, {"title": "Bungou Stray Dogs 4th Season", "image": "https://cdn.myanimelist.net/images/anime/1263/132759.jpg", "score": 8.26, "episodes": 13, "year": 2023, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Bones Inc."], "producers": ["Bandai Namco Music Live", "Crunchyroll", "Glovision"], "duration_min": 23.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Mystery", "Romance", "Supernatural"], "tags": ["Achromatic", "Action", "Action Comedy", "Adult Cast", "Anti-Hero", "Based On A Manga", "Classic Literature", "Comedy", "Conspiracy", "Contemporary Fantasy"], "local": "images/cover_4295.jpg", "synopsis": "The fourth season of Bungou Stray Dogs . No longer concerned with military affairs, Yukichi Fukuzawa intends to act as a lone bodyguard-for-hire, making use of his deadly swordsmanship. However, things are not going as planned for his freelance business, and that is when he crosses paths with a mouthy boy named Ranpo Edogawa. While their initial interactions are intertwined with a bizarre murder mystery, the aftermath prompts the formation of the Armed Detective Agency. Presently, Ranpo finds himself chasing down a gifted individual with the dangerous ability to execute the perfect crime. But as the great detective unravels the case, he soon discovers an elaborate plot to obliterate the Agency in its entirety. Although forewarned of the trap, the Agency continue their pursuit of the criminals, only to end up framed for the crime themselves. Now branded as wanted terrorists, the remaining members must find a way to prove their innocence—even if they must turn to sworn enemies for assistance. (Source: MAL Rewrite)"}, {"title": "Castlevania", "image": "https://cdn.anime-planet.com/anime/primary/castlevania-1.jpg", "score": 8.26, "episodes": 4, "year": 2017, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": ["Frederator Studios", "Mua Film", "Powerhouse Animation"], "producers": ["Netflix"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Drama", "Horror", "Supernatural", "Historical"], "tags": ["15Th Century", "Action", "Adventure", "Anime Influenced", "Based On A Video Game", "Dark Fantasy", "Demons", "Drama", "Elemental Powers", "Europe"], "local": "images/cover_4705.jpg"}, {"title": "Dororo", "image": "https://cdn.myanimelist.net/images/anime/1879/100467.jpg", "score": 8.26, "episodes": 24, "year": 2019, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Mappa Co., Ltd.", "Tezuka Productions Co., Ltd."], "producers": ["Sentai Filmworks", "Twin Engine"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Supernatural", "Historical"], "tags": ["15Th Century", "Action", "Adapted Into Japanese Movie", "Adapted Into Other Media", "Adventure", "Animal Abuse", "Anti-Hero", "Anti-War", "Asia", "Based On A Manga"], "local": "images/cover_7666.jpg", "synopsis": "Dororo, a young orphan thief, meets Hyakkimaru, a powerful ronin. Hyakkimaru's father, a greedy feudal lord, had made a pact with 12 demons, offering his yet-unborn son's body parts in exchange for great power. Thus, Hyakkimaru - who was born without arms, legs, eyes, ears, a nose or a mouth - was abandoned in a river as a baby. Rescued and raised by Dr. Honma, who equips him with artificial limbs and teaches him sword-fighting techniques, Hyakkimaru discovers that each time he slays a demon, a piece of his body is restored. Now, he roams the war-torn countryside in search of demons."}, {"title": "Dr. Stone", "image": "https://cdn.myanimelist.net/images/anime/1613/102576.jpg", "score": 8.26, "episodes": 24, "year": 2019, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["8 Pan", "8Pan", "Tms Entertainment Co., Ltd."], "producers": ["8Pan", "Dr.Stone Production Committee", "Shueisha"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Sci-Fi", "Slapstick"], "tags": ["Action", "Adventure", "Aim For The Top", "Alcohol", "Angst", "Apocalyptic Fiction", "Asia", "Astronomy", "Based On A Manga", "Betrayal"], "local": "images/cover_7903.jpg", "synopsis": "After five years of harboring unspoken feelings, high-schooler Taiju Ooki is finally ready to confess his love to Yuzuriha Ogawa. Just when Taiju begins his confession however, a blinding green light strikes the Earth and petrifies mankind around the world— turning every single human into stone. Several millennia later, Taiju awakens to find the modern world completely nonexistent, as nature has flourished in the years humanity stood still. Among a stone world of statues, Taiju encounters one other living human: his science-loving friend Senkuu, who has been active for a few months. Taiju learns that Senkuu has developed a grand scheme—to launch the complete revival of civilization with science. Taiju's brawn and Senkuu's brains combine to forge a formidable partnership, and they soon uncover a method to revive those petrified. However, Senkuu's master plan is threatened when his ideologies are challenged by those who awaken. All the while, the reason for mankind's petrification remains unknown. (Source: MAL Rewrite)"}, {"title": "Fate/Zero", "image": "https://cdn.myanimelist.net/images/anime/1887/117644.jpg", "score": 8.26, "episodes": 13, "year": 2011, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Ufotable, Inc."], "producers": ["Aniplex Of America", "Nitroplus", "Notes"], "duration_min": 27.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Supernatural", "Psychological"], "tags": ["Action", "Action Drama", "Adventure", "Alternative Present", "Anti-Hero", "Asia", "Assassins", "Awards", "Based On A Light Novel", "Battle Royale"], "local": "images/cover_9063.jpg", "synopsis": "With the promise of granting any wish, the omnipotent Holy Grail triggered three wars in the past, each too cruel and fierce to leave a victor. In spite of that, the wealthy Einzbern family is confident that the Fourth Holy Grail War will be different; namely, with a vessel of the Holy Grail now in their grasp. Solely for this reason, the much hated \"Magus Killer\" Kiritsugu Emiya is hired by the Einzberns, with marriage to their only daughter Irisviel as binding contract. Kiritsugu now stands at the center of a cutthroat game of survival, facing off against six other participants, each armed with an ancient familiar, and fueled by unique desires and ideals. Accompanied by his own familiar, Saber, the notorious mercenary soon finds his greatest opponent in Kirei Kotomine, a priest who seeks salvation from the emptiness within himself in pursuit of Kiritsugu. Based on the light novel written by Gen Urobuchi, Fate/Zero depicts the events of the Fourth Holy Grail War—10 years prior to Fate/stay night . Witness a battle royale in which no one is guaranteed to survive. (Source: MAL Rewrite) Note: The first episode aired with a runtime of ~48 minutes as opposed to the standard 24 minute long episode."}, {"title": "Fruits Basket: Prelude", "image": "https://cdn.myanimelist.net/images/anime/1034/120096.jpg", "score": 8.26, "episodes": 1, "year": 2022, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["8Pan", "Tms Entertainment Co., Ltd."], "producers": ["8Pan", "Avex Pictures", "Fruits Basket Production Committee"], "duration_min": 88.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Supernatural", "Slapstick"], "tags": ["Achronological Or : 15, "year": 2018, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": ["B.C May Pictures", "B.Cmay Pictures", "G.Cmay Animation & Film"], "producers": ["Aniplex", "Tencent Penguin Pictures", "Tencent Video"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Mystery", "Supernatural", "Historical"], "tags": ["3D Cg Animation", "Achronological Order", "Action", "Adoption", "Adventure", "Ancient China", "Anti-Hero", "Archery", "Asia", "Based On A Web Novel"], "local": "images/mo-dao-zu-shi.jpg", "synopsis": "The Wen Clan's rampage caused untold sufferings, and the other cultivation clans launched the \"Sunshot Campaign\" to join forces against the Wen Clan. Although Wei Wuxian, the Yiling Patriarch, had made great contributions to overthrowing the Wens, he was stigmatized and punished because he was considered too powerful and dangerous. He was persecuted by ten thousand people. Thirteen years later, Wei Wuxian has been brought back by a sacrificial ritual and has met again with old acquaintances such as Lan Wangji from the Gusu Lan Clan and Jiang Cheng from the Yunmeng Jiang Clan. The mysteries of Wei Wuxian's past remain, and conflicts in the cultivation world have resurfaced - all of which began from when they were all once youths. (Source: QQ, translated)"}, {"title": "Non Non Biyori Nonstop", "image": "https://cdn.myanimelist.net/images/anime/1033/111540.jpg", "score": 8.26, "episodes": 12, "year": 2021, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Silver Link."], "producers": ["At-X", "Bandai Namco Arts", "Bit Grooove Promotion"], "duration_min": 24.0, "genres": ["Comedy", "Slice of Life", "Slapstick"], "tags": ["Absurdist Humour", "Achronological Order", "Asia", "Based On A Manga", "Cgdct", "Cgi", "Colour Coded", "Comedy", "Countryside", "Cute Girls Doing Cute Things"], "local": "images/non-non-biyori-nonstop.jpg", "synopsis": "Fresh excitement brews as someone new moves into the hous ctrolux recreates the glorious journey of the great Holy Necromancer God Electrolux, the Scourge of the Undead (Source: Tencent, translated)"}, {"title": "Shinseiki Evangelion", "image": "https://cdn.myanimelist.net/images/anime/1314/108941.jpg", "score": 8.26, "episodes": 26, "year": 1995, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Gainax Co., Ltd.", "Tatsunoko Production Co., Ltd."], "producers": ["Adv Films", "Audio Tanaka", "Gainax"], "duration_min": 24.0, "genres": ["Action", "Comedy", "Drama", "Mystery", "Romance", "Sci-Fi", "Thriller", "Mecha", "Psychological"], "tags": ["Action", "Action Drama", "Adapted Into Manga", "Adapted Into Other Media", "Adapted Into Video Game", "Air Force", "Alien", "Aliens", "Americas", "Ancient Aliens"], "local": "images/shinseiki-evangelion.jpg", "synopsis": "Compilation recap movie for the series Shin Seiki Evangelion. Due to the struggling production of the movie 'End of Evangelion' delaying the film a month before it was set to release, this film was announced to 'hold fans over'. During the early 21st century a meteorite crashed into Antarctica. After scientists went to study the crash a gigantic explosion followed, classified as the 'Second Impact'. Shinji Ikari is a fourteen year-old boy who has come to Toyko3, a city that also serves as a fortress, to meet up with his father who left him many years ago. The city also happens to be under siege by monstrous creatures called 'Angels' at the time of his arrival. Somehow Shinji finds himself in Evangelion Unit 01, and manages to synchronize with the giant robot. Shinji is told to become its permanent pilot, and is thrown into combat as the city's last defense for fighting off the angels. However, as Shinji fights, he begins to realize the truth behind the Angels, the Second Impact, man's struggle against God and what he truly is afraid of. (Source: Anime News Network) Note: Exists in several versions: (with most appearing on the Japanese 2015 Blu-ray Boxset) • Evangelion: DEATH & REBIRTH , released theatrically on March 15, 1997 - 2-part feature, the first 2/3rds titled 'Death' consisting of a recap of the TV series with new/re-drawn animation added in, and the later 1/3rd titled 'Rebirth' consisting of the first 28 minute rough cut of End of Evangelion. • Death(True) , aired on TV channel WOWOW on January 2, 1998 - re-edited version of 'Death' by director Masayuki, with most of the new animation cut (as it was moved to the \"Directors Cut\" of Episodes 21-24), but with some new shots added. Later released on the 'ARCHIVES OF EVANGELION' DVD Boxset. • Death(True)² , released on March 7, 1998 - a further edited down version of Death(True), but with some new animation added. Regarded as this film's 'definitive' release, this is the version opted to be licensed by Netflix. • Revival of Evangelion , released theatrically on March 8, 1998 - Theatrical double feature consisting of Death(True)² + 4 minute intermission + End of Evangelion. For simplicity's sake, we are only counting the first theatrical release in this entry."}, {"title": "Spy x Family Part 2", "image": "https://cdn.myanimelist.net/images/anime/1111/127508.jpg", "score": 8.26, "episodes": 13, "year": 2022, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Cloverworks Inc.", "Wit Studio, Inc."], "producers": ["Shogakukan-Shueisha Productions", "Shueisha", "Spy×Family Production Committee"], "duration_min": 24.0, "genres": ["Action", "Comedy", "Drama", "Romance", "Slice of Life", "Supernatural", "Slapstick"], "tags": ["Action", "Action Comedy", "Adoption", "Animals", "Assassin", "Assassins", "Based On A Manga", "Childcare", "Cohabitation", "Comedy"], "local": "images/spy-x-family-part-2.jpg"}, {"title": "Summertime Render", "image": "https://cdn.myanimelist.net/images/anime/1120/120796.jpg", "score": 8.26, "episodes": 25, "year": 2022, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Bug Films", "Olm, Inc.", "Studio 4°C" , "duration_min": 23.0, "genres": ["Comedy", "Slice of Life", "Slapstick"], "tags": ["3D Cg Animation", "4-Koma Manga", "Absurdist Humour", "Absurdity", "Achronological Order", "Android", "Androids", "Anthropomorphism", "Asia", "Association Football"], "local": "images/nichijou.jpg", "synopsis": "Nichijou primarily focuses on the daily antics of a trio of childhood friends—high school girls Mio Naganohara, Yuuko Aioi and Mai Minakami—whose stories soon intertwine with the young genius Hakase Shinonome, her robot caretaker Nano, and their talking cat Sakamoto. With every passing day, the lives of these six, as well as of the many people around them, experience both the calms of normal life and the insanity of the absurd. Walking to school, being bitten by a talking crow, spending time with friends, and watching the principal suplex a deer: they are all in a day's work in the extraordinary everyday lives of those in Nichijou . (Source: MAL Rewrite)"}, {"title": "Ookami to Koushinryou", "image": "https://cdn.myanimelist.net/images/anime/5/59401.jpg", "score": 8.25, "episodes": 13, "year": 2008, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Imagin Co., Ltd."], "producers": ["Funimation", "Imagin", "Kadokawa Pictures Japan"], "duration_min": 23.0, "genres": ["Adventure", "Drama", "Fantasy", "Romance", "Slice of Life", "Supernatural", "Historical"], "tags": ["Adult Cast", "Adult Couples", "Adventure", "Age Difference Romance", "Agriculture", "Animal Characteristics", "Animal Transformation", "Anthropomorphism", "Based On A Light Novel", "Betrayal"], "local": "images/ookami-to-koushinryou.jpg", "synopsis": "The peddler Kraft Lawrence travels through the world selling all kinds of things. After visiting a village, he discovers a sleeping girl under the pelts in his cart. She has wolf ears and a tail. The wolf girl explains that she has been called a \"god\", but that her name is Holo and nothing more. Lawrence teases the girl a little, but after hearing more of her story, he is moved and decides to accompany her further north. On their travels the two have many adventures, often getting into trouble, but the bond between them grows stronger."}, {"title": "Psycho-Pass", "image": "https://cdn.myanimelist.net/images/anime/1314/142015.jpg", "score": 8.25, "episodes": 22, "year": 2012, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["Dentsu Inc.", "Fuji Television Network", "Fuji Tv"], "duration_min": 23.0, "genres": ["Action", "Drama", "Mystery", "Sci-Fi", "Thriller", "Psychological"], "tags": ["Action", "Adapted Into Manga", "Adapted Into Novel", "Adapted Into Other Media", "Adapted Into Video Game", "Adult Cast", "Angst", "Anti-Hero", "Artificial Intelligence", "Asia"], "local": "images/psycho-pass.jpg", "synopsis": "Justice, and the enforcement of it, has changed. In the 22nd century, Japan enforces the Sibyl System, an objective means of determining the threat level of each citizen by examining their mental state for signs of criminal intent, known as their Psycho-Pass. Inspectors uphold the law by subjugating, often with lethal force, anyone harboring the slightest ill-will; alongside them are Enforcers, jaded Inspectors that have become latent criminals, granted relative freedom in exchange for carrying out the Inspectors' dirty work. Into this world steps Akane Tsunemori, a young woman with an honest desire to uphold justice. However, as she works alongside veteran Enforcer Shinya Kougami, she soon learns that the Sibyl System's judgments are not as perfect as her fellow Inspectors assume. With everything she has known turned on its head, Akane wrestles with the question of what justice truly is, and whether it can be upheld through the use of a system that may already be corrupt. (Source: MAL Rewrite) Note: In the Summer 2014 season, Psycho-Pass was rebroadcast and re-edited to fit into an hour time-slot, ending up in 11 one-hour episodes. This edit included added scenes at the beginning and middle of the episodes, as well as fixing and improving animation."}, {"title": "RWBY II", "image": "https://media.kitsu.app/anime/poster_images/8278/small.jpg", "score": 8.25, "episodes": 12, "year": 2014, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": [], "producers": ["Rooster Teeth Productions"], "duration_min": 14.0, "genres": ["Action", "Adventure", "Fantasy"], "tags": ["Action", "Adventure", "Anime Influenced", "Fantasy", "Fantasy World"], "local": "images/rwby-ii.jpg"}, {"title": "Samurai Jack (2017)", "image": "https://media.kitsu.app/anime/11580/poster_image/small-8fc8f4885c6e3b5faf865c5ca23e4c3e.jpeg", "score": 8.25, "episodes": 10, "year": 2017, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": [], "producers": ["Cartoon Network Studios"], "duration_min": 22.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Sci-Fi"], "tags": ["Action", "Adventure", "Anime Influenced", "Drama", "Fantasy", "Magic", "Martial Arts", "Samurai", "Sci-Fi", "Science Fiction"], "local": "images/samurai-jack-2017.jpeg"}, {"title": "Sono Bisque Doll wa Koi wo Suru Season 2", "image": "https://cdn.myanimelist.net/images/anime/1024/150787.jpg", "score": 8.25, "episodes": 12, "year": 2025, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Cloverworks Inc."], "producers": ["Aniplex", "Bs11", "Cloverworks"], "duration_min": 23.0, "genres": ["Comedy", "Romance", "Slice of Life", "Slapstick"], "tags": ["Asia", "Barefoot", "Based On A Manga", "Body Image", "Cgi", "Chibi", "Comedy", "Coming-Of-Age", "Cosplay", "Cosplaying"], "local": "images/sono-bisque-doll-wa-koi-wo-suru-season-2.jpg", "synopsis": "The second season of Sono Bisque Doll wa Koi wo Suru . When Marin Kitagawa and Wakana Gojo met, they grew close over their love for cosplay. Through interacting with classmates and making new cosplay friends, Marin and Wakana’s world keeps growing. New developments arise as Marin’s love for Wakana continues to be filled with endless excitement. In their ever-expanding world, Marin and Wakana’s story of cosplay and thrills continues! (Source: Crunchyroll)"}, {"title": "Steven Universe Season 2 Specials", "image": "https://media.kitsu.app/anime/poster_images/11215/small.jpg", "score": 8.25, "episodes": 6, "year": 2015, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": [], "producers": ["Cartoon Network Studios"], "duration_min": 2.0, "genres": ["Adventure", "Comedy", "Fantasy"], "tags": ["Adventure", "Anime Influenced", "Comedy", "Contemporary Fantasy", "Family", "Fantasy", "Friendship", "Kids", "United States"], "local": "images/steven-universe-season-2-specials.jpg"}, {"title": "The Legend of Korra Book 4: Balance", "image": "https://media.kitsu.app/anime/8706/poster_image/small-73443971e1bf208374a6ae63c60a385b.jpeg", "score": 8.25, "episodes": 13, "year": 2014, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": [], "producers": ["Studio Mir"], "duration_min": 22.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy"], "tags": ["Action", "Adventure", "Anime Influenced", "Comedy", "Drama", "Fantasy", "Fantasy World", "Martial Arts", "Super Power"], "local": "images/the-legend-of-korra-book-4-balance.jpeg"}, {"title": "Uchuu Kyoudai", "image": "https://cdn.myanimelist.net/images/anime/1290/135694.jpg", "score": 8.25, "episodes": 99, "year": 2012, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["A-1 Pictures Inc."], "producers": ["A-1 Pictures", "Aniplex", "Dentsu Inc."], "duration_min": 24.0, "genres": ["Adventure", "Comedy", "Drama", "Romance", "Sci-Fi", "Slice of Life", "Slapstick"], "tags": ["Adapted Into Japanese Movie", "Adapted Into Other Media", "Adult Cast", "Adventure", "Age Gap", "Aim For The Top", "Alcohol", "Americas", "Angst", "Asia"], "local": "images/uchuu-kyoudai.jpg", "synopsis": "Mutta's life has hit rock bottom. He's been fired, blackballed from his profession and now he's had to move back in with his parents. Meanwhile, his kid brother Hibito has been literally riding a rocket and training to be an astronaut. The same career Mutta once dreamed of. So, is it ever too late to go after your dreams? Through a little coercing and a bit of covert activity, Mutta's family and friends can get his resume on the right desk, but from that point on it will be up to Mutta himself. Does he have what it takes to turn his life around and put his footprint on the moon? The first step on the highway to the stars is always the hardest, and in a job where crash and burn isn't just a euphemism, it will be the biggest risk Mutta's ever taken. But with the best support team ever, maybe he'll find what he needs to rekindle the spark inside him and light the biggest candle of them all! (Source: Sentai Filmworks)"}, {"title": "Boku no Hero Academia 3rd Season", "image": "https://cdn.myanimelist.net/images/anime/1319/92084.jpg", "score": 8.24, "episodes": 25, "year": 2018, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Bones Inc."], "producers": ["Bones", "Dentsu Inc.", "Movic"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Sci-Fi", "Slapstick"], "tags": ["Action", "Action Comedy", "Adventure", "Aim For The Top", "Asia", "Awards", "Bar", "Based On A Manga", "Battle Royale", "Bisexual"], "local": "images/cover_3761.jpg", "synopsis": "Summer is here, and the heroes of Class 1-A and 1-B are in for the toughest training camp of their lives! A group of seasoned pros pushes everyone's Quirks to new heights as the students face one overwhelming challenge after another. Braving the elements in this secret location becomes the least of their worries when routine training turns into a critical struggle for survival. (Source: Crunchyroll)"}, {"title": "Brave King GaoGaiGar Final", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A2066-19.jpg", "score": 8.24, "episodes": 8, "year": 200
