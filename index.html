ear": 2006, "season": "WINTER", "type": "OVA", "status": "FINISHED", "studios": ["Asahi Production", "Graphinica, Inc.", "Madhouse Inc."], "producers": ["Funimation", "G.D.H.", "Gdh"], "duration_min": 49.0, "genres": ["Action", "Fantasy", "Horror", "Supernatural", "Slapstick", "Historical"], "tags": ["Action", "Adult Audience Only", "Adult Cast", "Age Regression", "Anti-Hero", "Antihero", "Based On A Manga", "Bdsm", "Bisexual", "Body Horror"], "local": "images/hellsing-ultimate.jpg", "synopsis": "Hellsing, a secret organization of the British government, has long been battling supernatural threats to keep the people safe from creatures of the night. The current leader, Integra Wingates Hellsing controls her own personal army to eliminate the undead beings, but even her highly trained soldiers pale in comparison to her most trusted vampire exterminator, a man by the name of Alucard, who is actually a powerful vampire himself. Along with Integra's mysterious butler and Alucard's new vampire minion, Seras Victoria, The Hellsing Organization must face not only regular ghouls and vampires, but a rivaling secret organization from the Vatican, and Millennium, an enigmatic group of madmen spawned by a certain war over 50 years ago... A bloody battle between monsters is about to begin, the dead are dancing, and all hell is singing..."}, {"title": "JoJo no Kimyou na Bouken Part 6: Stone Ocean Part 3", "image": "https://cdn.myanimelist.net/images/anime/1233/128920.jpg", "score": 8.33, "episodes": 14, "year": 2022, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": ["David Production Inc."], "producers": ["Klockworx", "Medicos Entertainment", "Shueisha"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Horror", "Supernatural"], "tags": ["Aboard Aeroplane", "Action", "Adventure", "America", "Americas", "Comedy", "Contemporary Fantasy", "Death", "Disaster", "Drama"], "local": "images/jojo-no-kimyou-na-bouken-part-6-stone-ocean-part-3.jpg"}, {"title": "Josee to Tora to Sakana-tachi", "image": "https://cdn.myanimelist.net/images/anime/1714/108892.jpg", "score": 8.33, "episodes": 1, "year": 2020, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Bones Inc."], "producers": ["Bones", "East Japan Marketing & Communications, Inc.", "Jr Higashi Nihon Kikaku"], "duration_min": 98.0, "genres": ["Drama", "Romance", "Slice of Life"], "tags": ["Adapted Into Japanese Movie", "Adapted Into Other Media", "Adult Cast", "Asia", "Based On A Novel", "Coastal", "College", "Coming Of Age", "Disability", "Drama"], "local": "images/josee-to-tora-to-sakana-tachi.jpg", "synopsis": "The story centers on the relationship between Tsuneo and Josee. Tsuneo is a university student, and Josee is a young girl who has rarely gone out of the house by herself due to her being unable to walk. The two meet when Tsuneo finds Josee's grandmother taking her out for a morning walk. (Source: Anime News Network)"}, {"title": "K-On! Movie", "image": "https://cdn.myanimelist.net/images/anime/5/76233.jpg", "score": 8.33, "episodes": 1, "year": 2011, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Kyoto Animation Co., Ltd."], "producers": ["Animation Do", "Pony Canyon", "Sentai Filmworks"], "duration_min": 110.0, "genres": ["Comedy", "Slice of Life", "Music"], "tags": ["4-Koma Manga", "All Girls School", "All-Girls School", "Asia", "Award Winning", "Awards", "Band", "Based On A 4-Koma Manga", "Based On A Manga", "Cgdct"], "local": "images/k-on-movie.jpg", "synopsis": "With graduation right around the corner, every member of the Light Music Club except for Azusa will be leaving for good. But the girls aren’t going to let something as silly as graduation tear them apart! For their final hurrah, the girls are going on the ultimate vacation tour— all the way to London! Their overseas journey will lead them on a trip of discovery and friendship as they take the stage one last time for their final encore together. (Source: Sentai Filmworks)"}, {"title": "Kono Oto Tomare! Part 2", "image": "https://cdn.myanimelist.net/images/anime/1422/111621.jpg", "score": 8.33, "episodes": 13, "year": 2019, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Platinum Vision", "Platinumvision Co., Ltd."], "producers": ["King Records", "Klockworx", "Kono Oto Tomare! Production Committee"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Music", "Slapstick"], "tags": ["Angst", "Asia", "Band", "Based On A Manga", "Bullying", "Club", "Comedy", "Coming Of Age", "Competition", "Conspiracy"], "local": "images/kono-oto-tomare-part-2.jpg"}, {"title": "Mushoku Tensei II: Isekai Ittara Honki Dasu Part 2", "image": "https://cdn.myanimelist.net/images/anime/1876/141251.jpg", "score": 8.33, "episodes": 12, "year": 2024, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Studio Bind", "Studiobind Co., Ltd."], "producers": ["Bs11", "Egg Firm", "Frontier Works"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Romance", "Isekai", "Psychological"], "tags": ["Action", "Adventure", "Age Gap", "Alternative World", "Amnesia", "Anthropomorphs", "Aristocracy", "Based On A Light Novel", "Boarding School", "Body Horror"], "local": "images/mushoku-tensei-ii-isekai-ittara-honki-dasu-part-2.jpg", "synopsis": "The second cour of Mushoku Tensei II: Isekai Ittara Honki Dasu . Following the faceless god Hitogami's advice seems to have worked wonders for Rudeus Greyrat. After enrolling into the University of Magic as he was told, Rudeus reunites with his childhood friend Sylphiette, who put a valiant effort into curing his condition. The two grow ever closer together and decide to host a wedding party, inviting the friends they have made over the years to announce and formalize their relationship. For all his recent blessings, however, Rudeus' troubles are far from over. The research he is helping Shizuka Nanahoshi conduct hits a bottleneck, sending her into a deep slump much like he experienced in his previous life. Furthermore, a letter from his father, Paul, brings complications to Rudeus' relationships, and Sylphiette still knows next to nothing about his real background. In the face of these issues, Rudeus will have to apply the lessons he has learned in this new world to navigate through the challenges that come with living a life to its fullest. (Source: MAL Rewrite)"}, {"title": "Mushoku Tensei: Isekai Ittara Honki Dasu", "image": "https://cdn.myanimelist.net/images/anime/1530/117776.jpg", "score": 8.33, "episodes": 11, "year": 2021, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Studio Bind", "Studiobind Co., Ltd."], "producers": ["Bs11", "Egg Firm", "Frontier Works"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Romance", "Isekai", "Psychological", "Slapstick", "Historical"], "tags": ["3D Cg Animation", "Action", "Adventure", "Age Regression", "Alternative World", "Anthropomorphism", "Anthropomorphs", "Aristocracy", "Asia", "Based On A Light Novel"], "local": "images/mushoku-tensei-isekai-ittara-honki-dasu.jpg", "synopsis": "When a 34-year-old underachiever gets run over by a bus, his story doesn’t end there. Reincarnated in a new world as an infant, Rudeus will seize every opportunity to live the life he’s always wanted. Armed with new friends, some freshly acquired magical abilities, and the courage to do the things he’s always dreamed of, he’s embarking on an epic adventure—with all of his past experience intact! (Source: Funimation, edited) Note: The anime pre-screened its 1st and 2nd episode starting on the 27th of December on the Nico Nico Live Broadcasting and D Anime Store services"}, {"title": "My Little Pony Friendship is Magic: Season 2", "image": "https://media.kitsu.app/anime/poster_images/44268/small.jpg", "score": 8.33, "episodes": 26, "year": 2011, "season": "FALL", "type": "TV", 1.jpeg", "score": 8.33, "episodes": 12, "year": 2023, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 25.0, "genres": ["Drama", "Sci-Fi", "Psychological"], "tags": ["Alien", "Anime Influenced", "Drama", "Other Planet", "Psychological", "Science Fiction", "Space"], "local": "images/scavengers-reign.jpeg"}, {"title": "Shin Evangelion Movie:||", "image": "https://cdn.myanimelist.net/images/anime/1422/113533.jpg", "score": 8.33, "episodes": 1, "year": 2021, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Studio Khara"], "producers": ["Gainax", "Khara", "Klockworx"], "duration_min": 155.0, "genres": ["Action", "Adventure", "Drama", "Sci-Fi", "Thriller", "Mecha", "Psychological"], "tags": ["3D Cg Animation", "Action", "Action Drama", "Adventure", "Agriculture", "Alien", "Alternate Universe", "Angst", "Apocalyptic Fiction", "Asia"], "local": "images/shin-evangelion-movie.jpg", "synopsis": "In the aftermath of the Fourth Impact, stranded without their Evangelions, Shinji, Asuka, and Rei find refuge in one of the rare pockets of humanity that still exist on the ruined planet Earth. There, each of them live a life far different from their days as an Evangelion pilot. However, the danger to the world is far from over. A new impact is looming on the horizon—one that will prove to be the true end of Evangelion. Finally, the Human Instrumentality Project is set in motion, and WILLE makes one last grueling stand to prevent the Final Impact. Note: Exists in several versions, as denoted by the version number: • 3.0+1.0 : March 8, 2021 - Original theatrical release • 3.0+1.01 : June 12, 2021 - A second theatrical release which features updated cuts of various scenes while not changing the overall story of the film. • 3.0+1.11 : March 8, 2023 - A home media release scheduled for the film's two-year anniversary."}, {"title": "Shingeki no Kyojin Movie: Kanketsu-hen - The Last Attack", "image": "https://cdn.my ", "status": "FINISHED", "studios": ["J.C. Staff", "J.C.Staff Co., Ltd."], "producers": ["J.C.Staff", "Media Blasters", "Nhk Enterprises"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life"], "tags": ["Aim For The Top", "Anime Industry", "Asia", "Based On A Manga", "Comedy", "Coming Of Age", "Daily Life", "Dialogue Driven", "Drama", "Drawing"], "local": "images/cover_2673.jpg", "synopsis": "Short animation included as a bonus in the Blu-ray Box volume 2."}, {"title": "Fangkai Nage Nuwu", "image": "https://cdn.myanimelist.net/images/anime/1381/153536.jpg", "score": 8.32, "episodes": 8, "year": 2026, "season": "WINTER", "type": "ONA", "status": "FINISHED", "studios": ["Shanghai Zhen Lei Wenhua Chuanbo Youxiangongsi", "Thundray"], "producers": ["China Literature Limited", "Tencent Animation & Comics", "Tencent Penguin Pictures"], "duration_min": 26.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Romance", "Isekai", "Historical"], "tags": ["Action", "Adventure", "Alternative World", "Anachronism", "Based On A Web Novel", "Chinese Animation", "Chinese Production", "Demon", "Demons", "Drama"], "local": "images/cover_8900.jpg", "synopsis": "Roland, a modern man reborn as a prince in the dangerous Border Town, rescues the witches Anna and Nana Pine from the Church. Harnessing their extraordinary powers, he fuses magic and technology to craft weapons, armies, and steam engines to defend his people. As the Demon Moon rises and conspiracies close in on his family, Roland must lead a revolution to protect his allies and reshape the world. (Source: Crunchyroll)"}, {"title": "Fullmetal Alchemist", "image": "https://cdn.myanimelist.net/images/anime/10/75815.jpg", "score": 8.32, "episodes": 51, "year": 2003, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Bones Inc."], "producers": ["Aniplex", "Bones", "Dentsu Inc."], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Mystery", "Isekai", "Slapstick", "Historical"], "tags": ["Action", "Adapted Into Japanese Movie", "Adapted Into Other Media", "Adventure", "Against Destiny", "Aim For The Top", "Alchemists", "Alchemy", "Alternate Universe", "Alternative World"], "local": "images/cover_9644.jpg", "synopsis": "The rules of alchemy state that to gain something, one must lose something of equal value. Alchemy is the process of taking apart and reconstructing an object into a different entity, with the rules of alchemy to govern this procedure. However, there exists an object that can bring any alchemist above these rules, the object known as the Philosopher's Stone. The young Edward Elric is a particularly talented alchemist who through an accident years back lost his younger brother Alphonse and one of his legs. Sacrificing one of his arms as well, he used alchemy to bind his brother's soul to a suit of armor. This lead to the beginning of their journey to restore their bodies, in search for the legendary Philosopher's Stone. Note: Episodes 11, 12 and 37 were adapted from the light novel \"Fullmetal Alchemist: The Land of Sand.\""}, {"title": "Kaguya-sama wa Kokurasetai: Tensai-tachi no Renai Zunousen", "image": "https://cdn.myanimelist.net/images/anime/1295/106551.jpg", "score": 8.32, "episodes": 12, "year": 2019, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["A-1 Pictures Inc."], "producers": ["Aniplex", "East Japan Marketing & Communications, Inc.", "Jr East Marketing & Communications"], "duration_min": 25.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Psychological", "Slapstick"], "tags": ["Adapted Into Japanese Movie", "Adapted Into Other Media", "Angst", "Archery", "Asia", "Awards", "Based On A Manga", "Battle Of Wits", "Canon Filler", "Comedy"], "local": "images/kaguya-sama-wa-kokurasetai-tensai-tachi-no-renai-zunousen.jpg", "synopsis": "Known for being both brilliant and powerful, Miyuki Shirogane and Kaguya Shinomiya lead the illustrious Shuchiin Academy as near equals. And everyone thinks they’d make a great couple. Pride and arrogance are in ample supply, so the only logical move is to trick the other into instigating a date! Who will come out on top in this psychological war where the first move is the only one that matters? (Source: Aniplex)"}, {"title": "Kara no Kyoukai Movie 7: Satsujin Kousatsu (Go)", "image": "https://cdn.myanimelist.net/images/anime/9/56619.jpg", "score": 8.32, "episodes": 1, "year": 2009, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Ufotable, Inc."], "producers": ["Aniplex Of America", "Kodansha", "Notes"], "duration_min": 121.0, "genres": ["Action", "Drama", "Fantasy", "Horror", "Mystery", "Romance", "Supernatural", "Thriller"], "tags": ["Action", "Anti-Hero", "Based On A Light Novel", "Bionic Powers", "Body Horror", "Cannibalism", "Crime", "Dissociative Identities", "Drama", "Drugs"], "local": "images/kara-no-kyoukai-movie-7-satsujin-kousatsu-go.jpg"}, {"title": "Kaze no Tani no Nausicaä", "image": "https://cdn.myanimelist.net/images/anime/10/75914.jpg", "score": 8.32, "episodes": 1, "year": 1984, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Studio Ghibli Inc.", "Top Craft", "Topcraft"], "producers": ["Gkids", "Omnibus Promotion", "Studio Ghibli"], "duration_min": 117.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Sci-Fi"], "tags": ["Action", "Adventure", "Alternative World", "Anachronism", "Anti-War", "Apocalyptic Fiction", "Aviation", "Award Winning", "Awards", "Based On A Manga"], "local": "images/kaze-no-tani-no-nausica.jpg"}, {"title": "Kingdom", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A35719-3183016506.1760528782.jpg", "score": 8.32, "episodes": null, "year": 2025, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["St.Signpost", "Studio Pierrot"], "producers": [], "duration_min": 23.0, "genres": ["Action", "Drama", "Thriller", "Historical"], "tags": ["Action", "Aristocracy", "China", "Coming-Of-Age", "Conspiracy", "Drama", "Duels", "Government", "Historical", "Medieval"], "local": "images/kingdom.png", "synopsis": "When low-born servant boys Piao and Xin set out to become the world’s greatest war generals, they quickly find themselves caught up in a violent struggle between two noblemen plotting to overthrow the King. After Piao is killed protecting the rightful ruler of the kingdom of Qin, Xin sets out on a campaign for revenge that leads him straight into the fire of war. Now, with a target on his back and an army of enemies standing in his way, it will be up to a boy with no name and a young king without a throne to return order to their war-torn country in this historical action-drama based on the Tezuka Award-winning manga, Kingdom. (Source: Funimation) Note: The first episode aired with a runtime of 50 minutes as opposed to the standard 25 minute runtime."}, {"title": "Koukaku Kidoutai: Stand Alone Complex", "image": "https://cdn.myanimelist.net/images/anime/11/50857.jpg", "score": 8.32, "episodes": 26, "year": 2002, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["Animax", "Bandai Entertainment", "Bandai Visual"], "duration_min": 24.0, "genres": ["Action", "Drama", "Mystery", "Sci-Fi", "Thriller", "Mecha", "Psychological"], "tags": ["Action", "Action Drama", "Adapted Into Other Media", "Adapted Into Video Game", "Adult Cast", "Android", "Androids", "Artificial Intelligence", "Asia", "Assassins"], "local": "images/koukaku-kidoutai-stand-alone-complex.jpg", "synopsis": "In the not so distant future, mankind has advanced to a state where complete body transplants from flesh to machine is possible. This allows for great increases in both physical and cybernetic prowess and blurring the lines between the two worlds. However, criminals can also make full use of such technology, leading to new and sometimes, very dangerous crimes. In response to such innovative new methods, the Japanese Government has established Section 9, an independently operating police unit which deals with such highly sensitive crimes. Led by Daisuke Aramaki and Motoko Kusanagi, Section 9 deals with such crimes over the entire social spectrum, usually with success. However, when faced with a new A level hacker nicknamed “The Laughing Man”, the team is thrown into a dangerous cat and mouse game, following the hacker’s trail as it leaves its mark on Japan. (Source: MyAnimeList)"}, {"title": "Made in Abyss Movie 2: Hourou Suru Tasogare", "image": "https://cdn.myanimelist.net/images/anime/1336/95168.jpg", "score": 8.32, "episodes": 1, "year": 2019, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Kinema Citrus"], "producers": ["At-X", "Cygames", "Global Solutions"], "duration_min": 105.0, "genres": ["Adventure", "Drama", "Fantasy", "Horror", "Mystery", "Sci-Fi"], "tags": ["Adventure", "Androids", "Body Horror", "Chibi", "Child Protagonists", "Compilation", "Cosmic Horror", "Curse", "Curses", "Dark Fantasy"], "local": "images/made-in-abyss-movie-2-hourou-suru-tasogare.jpg"}, {"title": "Samurai Jack", "image": "https://media.kitsu.app/anime/poster_images/7939/small.jpg", "score": 8.32, "episodes": 52, "year": 2001, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": [], "producers": ["Cartoon Network Studios", "Rough Draft Studios"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Sci-Fi"], "tags": ["Action", "Adventure", "Anime Influenced", "Drama", "Fantasy", "Kids", "Magic", "Martial Arts", "Samurai", "Sci-Fi"], "local": "images/samurai-jack.jpg"}, {"title": "Sayonara no Asa ni Yakusoku no Hana wo Kazarou", "image": "https://cdn.myanimelist.net/images/anime/11/89556.jpg", "score": 8.32, "episodes": 1, "year": 2018, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["P.A. Works Co., Ltd.", "P.A.Works"], "producers": ["Bandai Visual", "Cygames", "Hakuhodo Dy Music & Pictures"], "duration_min": 114.0, "genres": ["Adventure", "Drama", "Fantasy", "Romance", "Slice of Life", "Psychological", "Historical"], "tags": ["Adoption", "Adventure", "Arranged Marriage", "Assassins", "Awards", "Childcare", "Coming Of Age", "Dragons", "Drama", "Ensemble Cast"], "local": "images/sayonara-no-asa-ni-yakusoku-no-hana-wo-kazarou.jpg", "synopsis": "The people of Iorph live far away from the lands of men, weaving the happenings of each day into a fabric called Hibiol. They live for centuries while maintaining their youthful appearance. Maquia, an orphaned Iorph girl, lives her life in an oasis surrounded by friends, yet somehow feels “alone”. But the tranquil lives of the Iorph are shattered in an instant when the Mezarte army invades their territory on a dragon fleet, seeking the blood that grants the Iorph long life. Maquia manages to escape, but loses her friends and her home in the chaos. She then encounters an orphaned baby who is “alone”. Maquia raises this boy \"Ariel\", with the help of some new friends. But as the era changes, the bond between Maquia and Ariel changes too, amidst a backdrop of racial tensions between the Iorph and the Mezarte. This is a story of irreplaceable time, woven by two lonely people who can only find solace in each other. (Source: Eleven Arts)"}, {"title": "Star vs. the Forces of Evil Season 2", "image": "https://media.kitsu.app/anime/poster_images/13429/small.jpg", "score": 8.32, "episodes": 22, "year": 2016, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 22.0, "genres": ["Comedy", "Drama", "Fantasy"], "tags": ["Anime Influenced", "Comedy", "Demon", "Drama", "Fantasy", "Fantasy World", "Friendship", "Kids", "Magic", "Magical Girl"], "local": "images/star-vs-the-forces-of-evil-season-2.jpg"}, {"title": "Steven Universe Season 3", "image": "https://media.kitsu.app/anime/poster_images/13414/small.jpg", "score": 8.32, "episodes": 25, "year": 2016, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Cartoon Network Studios"], "producers": [], "duration_min": 11.0, "genres": ["Adventure", "Comedy", "Fantasy"], "tags": ["Adventure", "Anime Influenced", "Comedy", "Coming Of Age", "Contemporary Fantasy", "Family", "Fantasy", "Friendship", "Kids", "United States"], "local": "images/steven-universe-season-3.jpg"}, {"title": "Tensei shitara Slime Datta Ken 2nd Season Part 2", "image": "https://cdn.myanimelist.net/images/anime/1033/118296.jpg", "score": 8.32, "episodes": 12, "year": 2021, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["8 Bit", "8-Bit", "8Bit Corp, Inc."], "producers": ["8 Bit", "Adk Marketing Solutions", "Bandai Namco Arts"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Fantasy", "Isekai", "Slapstick"], "tags": ["3D Cg Animation", "Action", "Adventure", "Afterlife", "Agender", "Alcohol", "Alternative World", "Anti-Hero", "Based On A Manga", "Calling Your Attacks"], "local": "images/tensei-shitara-slime-datta-ken-2nd-season-part-2.jpg", "synopsis": "The second cour of Tensei Shitara Slime Datta Ken 2nd Season . The nation of Tempest is in a festive mood after successfully overcoming the surprise attack from the Falmuth Army and the Western Holy Church. Beyond the festivities lies a meeting between Tempest and its allies to decide the future of the Nation of Monsters. The aftermath of the Falmuth invasion, Milim Nava's suspicious behavior, and the disappearance of Demon Lord Carrion—the problems seem to keep on piling up. Rimuru Tempest, now awakened as a \"True Demon Lord,\" decides to go on the offensive against Clayman. With the fully revived \"Storm Dragon\" Veldora, \"Ultimate Skill\" Raphael, and other powerful comrades, the ruler of the Tempest is confident in taking down his enemies one by one until he can face the man pulling the strings."}, {"title": "Uma Musume: Cinderella Gray Part 2", "image": "https://cdn.myanimelist.net/images/anime/1120/152280.jpg", "score": 8.32, "episodes": 10, "year": 2025, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Cygamespictures", "Cypic, Inc."], "producers": ["Bit Grooove Promotion", "Cygames", "Happinet Media Marketing"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Slice of Life", "Sports", "Music", "Historical"], "tags": ["Animal Characteristics", "Animals", "Anthropomorphic", "Anthropomorphism", "Athletics", "Based On A Manga", "Basketball", "Beastman", "Comedy", "Coming Of Age"], "local": "images/uma-musume-cinderella-gray-part-2.jpg", "synopsis": "The second half of Umamusume: Cinderella Gray . Hailing from the humble countryside, Oguri Cap has turned the racing world on its head. Her rampage through the national race scene seemed unstoppable... until it wasn't. Tamamo Cross, the current peak of racing, has bested the Beast and declared Oguri Cap her rival. But Oguri Cap can't afford to keep her attention on Tamamo Cross alone. One by one, racers from all over the world arrive in Japan, ready to demonstrate their own prowess. Up against the best the world has to offer, our ashen racer will need to reach beyond her limits if she wants to stand a chance… Keep those eyes peeled—a Cinderella story full of twists and turns lies ahead! (Source: It's Anime powered by REMOW)"}, {"title": "Ghost in the Shell: Stand Alone Complex: Solid State Society", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A6717-17.jpg", "score": 8.31, "episodes": 1, "year": 2006, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": [], "producers": ["Production I.G"], "duration_min": 105.0, "genres": ["Action", "Mystery", "Sci-Fi"], "tags": ["Action", "Cyberpunk", "Mystery", "Police", "Science Fiction"], "local": "images/ghost-in-the-shell-sac-solid-state-society.jpg", "synopsis": "Three new 3D Tachikomatic shorts released with the 3D version of Ghost in the Shell: Stand Alone Complex - Solid State Society on blu-ray and also in a BD-box with all the Tachikoma shorts."}, {"title": "Kage no Jitsuryokusha ni Naritakute! 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1938/138295.jpg", "score": 8.31, "episodes": 12, "year": 2023, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Nexus"], "producers": ["Aiming", "At-X", "Bs Nittele"], "duration_min": 23.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Isekai"], "tags": ["Action", "Action Comedy", "Alchemy", "Almighty Hero", "Alternate Universe", "Alternative World", "Anti-Hero", "Assassins", "Based On A Light Novel", "Chuunibyou"], "local": "images/kage-no-jitsuryokusha-ni-naritakute-2nd-season.jpg", "synopsis": "The second season of Kage no Jitsuryokusha ni Naritakute! Everything has been going according to plan, but the hour of awakening draws near. Cid Kagenou and Shadow Garden investigate the Lawless City, a cesspool where the red moon hangs low in the sky and three powerful monarchs rule the streets. The true draw for Cid, however, is one who can draw blood–the Blood Queen, a vampire who has slumbered in her coffin for eons. Her awakening approaches, and Cid could finally face a day of reckoning. (Source: HIDIVE, edited) Note: A world premiere screening of Episode 1 was shown in the The Eminence in Shadow 2nd Season panel at Anime Expo on July 1, 2023."}, {"title": "Kizumonogatari I: Tekketsu-hen", "image": "https://cdn.myanimelist.net/images/anime/1783/112810.jpg", "score": 8.31, "episodes": 1, "year": 2016, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Shaft"], "producers": ["Aniplex", "Kodansha", "Shaft"], "duration_min": 63.0, "genres": ["Action", "Drama", "Fantasy", "Mystery", "Romance", "Supernatural", "Psychological"], "tags": ["Action", "Age Regression", "Based On A Light Novel", "Body Horror", "Cgi", "Coming Of Age", "Drama", "Ecchi", "Fantasy", "Gore"], "local": "images/kizumonogatari-i-tekketsu-hen.jpg", "synopsis": "First season of the Monogatari Series, part 2/6. Contains the arc Koyomi Vamp from the Kizumonogatari light novel. March 25th—just another day during spring break. Koyomi Araragi, a second year high school student at Naoetsu High School, befriends Tsubasa Hanekawa, the top honors student at his school. Hanekawa mentions a rumor about a \"blonde vampire\" that has been sighted around their town recently. Araragi, who is usually anti-social, takes a liking to her down-to-earth personality. That night, Araragi encounters the rumored vampire: she is Kiss-Shot Acerola-Orion Heart-Under-Blade, also known as the \"iron-blooded, hot-blooded, cold-blooded King of Apparitions.\" The stunningly beautiful vampire cries out for Koyomi to save her as she lies in a pool of her own blood, all four of her limbs cut off. Kiss-shot asks Araragi to give her his blood, and when he does, the next moment he awakes, Araragi finds himself reborn as her vampire kin. As Araragi struggles to accept his existence, Kiss-Shot whispers, \"Welcome to the world of darkness...\" (Source: Aniplex)"}, {"title": "Mo Dao Zu Shi: Xian Yun Pian", "image": "https://cdn.myanimelist.net/images/anime/1404/106707.jpg", "score": 8.31, "episodes": 8, "year": 2019, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": ["B.C May Pictures", "B.Cmay Pictures", "G.Cmay Animation & Film"], "producers": ["Tencent Penguin Pictures", "Tencent Video"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Mystery", "Supernatural", "Historical"], "tags": ["3D Cg Animation", "Achronological Order", "Action", "Adventure", "Afterlife", "Ancient China", "Anti-Hero", "Asia", "Based On A Web Novel", "Boys Love"], "local": "images/mo-dao-zu-shi-xian-yun-pian.jpg"}, {"title": "Tenki no Ko", "image": "https://cdn.myanimelist.net/images/anime/1880/101146.jpg", "score": 8.31, "episodes": 1, "year": 2019, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Comix Wave Films Inc."], "producers": ["Comix Wave Films", "East Japan Marketing & Communications, Inc.", "Gkids"], "duration_min": 112.0, "genres": ["Comedy", "Drama", "Fantasy", "Romance", "Slice of Life", "Supernatural"], "tags": ["Asia", "Award Winning", "Awards", "Boy Meets Girl", "Comedy", "Coming Of Age", "Contemporary Fantasy", "Crossdressing", "Disaster", "Drama"], "local": "images/tenki-no-ko.jpg", "synopsis": "High school student Hodaka leaves his home on an isolated island and moves to Tokyo, but he immediately becomes broke. He lives his days in isolation, but finally finds a job as a writer for a shady occult magazine. After he starts his job, the weather has been rainy day after day. In a corner of the crowded and busy city, Hodaka meets a young woman named Hina. Due to certain circumstances, Hina and her younger brother live together, but have a cheerful and sturdy life. Hina also has a certain power: the power to stop the rain and clear the sky. (Source: Anime News Network)"}, {"title": "Wu Liuqi: Jiyi Suipian", "image": "https://cdn.myanimelist.net/images/anime/1787/151956.jpg", "score": 8.31, "episodes": 10, "year": 2024, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": ["Aha Entertainment", "Sharefun Studio"], "producers": ["Aha Entertainment", "Ahaverse"], "duration_min": 15.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Mystery", "Sci-Fi", "Supernatural"], "tags": ["Action", "Adventure", "Amnesia", "Assassins", "Chinese Animation", "Chinese Production", "Comedy", "Drama", "Male Protagonist", "Martial Arts"], "local": "images/wu-liuqi-jiyi-suipian.jpg", "synopsis": "In order to find his cherished partner, Seven returns to Xuanwu Country and faces those forgotten fragments of memory. The dusty truth brings pain and anger, but now he is no longer alone. What is the purpose of having power? This time, Seven has to make a new choice for his life..."}, {"title": "Super no Ura de Yani Suu Futari", "image": "https://cdn.myanimelist.net/images/anime/1768/156339.jpg", "score": 8.3, "episodes": 6, "year": 2026, "season": "SUMMER", "type": "TV", "status": "ONGOING", "studios": ["Asahi Production"], "producers": ["Asmik Ace", "Bit Grooove Promotion", "Nichion"], "duration_min": 12.0, "genres": ["Comedy", "Romance", "Slice of Life"], "tags": ["Adult Cast", "Adult Couples", "Age Gap", "Based On A Manga", "Comedy", "Half-Length Episodes", "Heterosexual", "Iyashikei", "Konbini", "Love Status Quo"], "local": "images/super-no-ura-de-yani-suu-futari.jpg", "synopsis": "Sasaki is an overworked salaryman drifting through the corporate grind, sustained by cigarettes and the cheerful service and smile of Yamada, the clerk at his favorite supermarket. But one night after a grueling shift, he arrives late to find Yamada nowhere to be seen. With nowhere left to smoke, his spirits sink—until a pierced young woman calls out to him: “You can smoke here.” (Source: Crunchyroll) Note: Episodes 1-6 had an early release by ABEMA and Crunchyroll on June 3rd, 2026 in a mini-episode batch format that splits 6 episodes into 12, ahead of the TV broadcast which started on July 10th, 2026."}, {"title": "Adventure Time Season 6", "image": "https://media.kitsu.app/anime/poster_images/13766/small.jpg", "score": 8.3, "episodes": 43, "year": 2014, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 11.0, "genres": ["Adventure", "Comedy", "Fantasy"], "tags": ["Adventure", "Anime Influenced", "Anthropomorphism", "Comedy", "Fantasy", "Friendship", "Post Apocalypse", "Vampire"], "local": "images/cover_616.jpg"}, {"title": "Aria the Origination", "image": "https://cdn.myanimelist.net/images/anime/1431/132867.jpg", "score": 8.3, "episodes": 13, "year": 2008, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Hal Film Maker Inc."], "producers": ["Aria Company", "Hal Film Maker", "Mag Garden"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Fantasy", "Sci-Fi", "Slice of Life", "Slapstick"], "tags": ["Amnesia", "Anachronisms", "Angst", "Animals", "Anthropomorphism", "Apprenticeship", "Banana Peel", "Based On A Manga", "Bishoujo", "Character Driven"], "local": "images/cover_1860.jpg", "synopsis": "In Neo Venezia, Akari, Aika, and Alice continue to work diligently toward the day they become full-fledged Prima Undine (a professional tour guide gondolier). The girls have come far since they began their training, and they are slowly forming their own distinctive styles as tour guides for the city. On the long journey towards their goal, the girls have relied on the advice of their seniors from their respective companies: the patient and understanding Alicia from Aria Company, the strict and proper Akira from Himeya Company, and the clumsy yet caring Athena from Orange Planet Company. Will the girls be able to blend the advice from their mentors with their personally acquired knowledge of Neo Venezia to become praiseworthy Prima Undines? Welcome once more to Neo Venezia; the city that personifies warmth and tranquility."}, {"title": "Bocchi the Rock! Re:Re:", "image": "https://cdn.anime-planet.com/anime/primary/bocchi-the-rock-rere-1.webp", "score": 8.3, "episodes": 1, "year": 2024, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Cloverworks"], "producers": ["Aniplex"], "duration_min": 75.0, "genres": ["Comedy", "Slice of Life", "Music"], "tags": ["Band", "Based On A 4-Koma Manga", "Based On A Manga", "Comedy", "Cute Girls Doing Cute Things", "Female Protagonist", "Lgbtq+ Themes", "Loneliness", "Music", "Musical Band"], "local": "images/cover_3721.webp", "synopsis": "Compilation film of Bocchi the Rock! featuring new animation intro footage and additional scenes. The second of the Bocchi compilation movie duology."}, {"title": "Boku no Hero Academia 6th Season", "image": "https://cdn.myanimelist.net/images/anime/1483/126005.jpg", "score": 8.3, "episodes": 25, "year": 2022, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Bones Inc."], "producers": ["Bones", "Dentsu Inc.", "Movic"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Sci-Fi", "Slapstick"], "tags": ["Action", "Action Comedy", "Adventure", "Alternative Present", "Anti-Hero", "Asia", "Assassins", "Based On A Manga", "Bisexual", "Boarding School"], "local": "images/cover_3764.jpg", "synopsis": "With Tomura Shigaraki at its helm, the former Liberation Army is now known as the Paranormal Liberation Front. This organized criminal group poses an immense threat to the Hero Association, not only because of its sheer size and strength, but also the overpowering quirks of Jin \"Twice\" Bubaigawara and Gigantomachia. As new intel from the covert hero Keigo \"Hawks\" Takami confirms that Shigaraki is nowhere to be seen, the Hero Association decides to strike the enemy headquarters with a surprise attack using the entirety of its assets—and the UA students find themselves on the battlefield once again. As the fight rages on, the unsuspecting villains must regroup and push back, but the brave heroes are determined to eradicate every last one of them. (Source: MAL Rewrite)"}, {"title": "Castlevania Season 3", "image": "https://cdn.anime-planet.com/anime/primary/castlevania-season-3-1.jpg", "score": 8.3, "episodes": 10, "year": 2020, "season": "WINTER", "type": "ONA", "status": "FINISHED", "studios": ["Frederator Studios", "Mua Film", "Powerhouse Animation"], "producers": ["Netflix"], "duration_min": 27.0, "genres": ["Action", "Adventure", "Drama", "Horror", "Supernatural", "Historical"], "tags": ["15Th Century", "Action", "Adventure", "Anime Influenced", "Based On A Video Game", "Dark Fantasy", "Drama", "Europe", "Historical", "Horror"], "local": "images/cover_4707.jpg"}, {"title": "Golden Kamuy 3rd Season", "image": "https://cdn.myanimelist.net/images/anime/1763/108108.jpg", "score": 8.3, "episodes": 12, "year": 2020, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Geno Studio Inc."], "producers": ["East Japan Marketing & Communications, Inc.", "Golden Kamuy Production Committee", "Good Smile Company"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Mystery", "Thriller", "Psychological", "Slapstick", "Historical"], "tags": ["Absurdist Humour", "Action", "Adult Cast", "Adventure", "Ainu", "Ainu Mythology", "Animal Abuse", "Animals", "Anti-Hero", "Archery"], "local": "images/golden-kamuy-3rd-season.jpg", "synopsis": "Separated from Sugimoto, Asirpa now travels toward the Russian border, focused on discovering more about her and her father’s involvement with the coded tattoos. But Sugimoto is determined to find and protect Asirpa! Along the way, he’ll discover new people, new cultures rich with history, and an unforgiving terrain. Will Sugimoto and Asirpa survive their journeys and reunite? (Source: Funimation)"}, {"title": "Karakai Jouzu no Takagi-san Movie", "image": "https://cdn.myanimelist.net/images/anime/1376/123398.jpg", "score": 8.3, "episodes": 1, "year": 2022, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["Shin-Ei Animation Co., Ltd."], "producers": ["Asmik Ace, Inc.", "Shin-Ei Animation", "Shogakukan-Shueisha Productions"], "duration_min": 73.0, "genres": ["Comedy", "Romance", "Slice of Life", "Slapstick"], "tags": ["Animals", "Based On A Manga", "Comedy", "Coming Of Age", "Female Protagonist", "Hero Of Weak Character", "Heroine Of Strong Character", "Heterosexual", "Iyashikei", "Japanese Production"], "local": "images/karakai-jouzu-no-takagi-san-movie.jpg", "synopsis": "Takagi and Nishikata’s final summer in junior high is about to begin, and it’s already off to a heartwarming start! When the pair find an abandoned kitten, they decide to work together and take care of Hana, their adorable new companion until they can locate its missing mother. What follows is the true beginning of this moving story of young love, complete with the delightful teasing and hilarious antics fans have come to expect from this beloved series and its cast of fan-favorite characters. (Source: Sentai Filmworks, edited)"}, {"title": "Kono Subarashii Sekai ni Shukufuku wo! Movie: Kurenai Densetsu", "image": "https://cdn.myanimelist.net/images/anime/1638/119321.jpg", "score": 8.3, "episodes": 1, "year": 2019, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["J.C. Staff", "J.C.Staff Co., Ltd."], "producers": ["81 Produce", "Crunchyroll", "Half H.P Studio"], "duration_min": 90.0, "genres": ["Action", "Adventure", "Comedy", "Fantasy", "Supernatural", "Isekai", "Slapstick", "Historical"], "tags": ["Action", "Adventure", "Adventure Comedy", "Afterlife", "Alternative World", "Anthropomorphism", "Anti-Hero", "Awards", "Based On A Light Novel", "Bishoujo"], "local": "images/kono-subarashii-sekai-ni-shukufuku-wo-movie-kurenai-densetsu.jpg"}, {"title": "Legend of the Galactic Heroes: A Hundred Billion Stars, A Hundred Billion Lights", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A1800-25.jpg", "score": 8.3, "episodes": 24, "year": 1998, "season": "UNDEFINED", "type": "OVA", "status": "FINISHED", "studios": [], "producers": ["Artland", "Kitty Films", "Tokuma Japan Corporation"], "duration_min": 25.0, "genres": ["Sci-Fi"], "tags": ["Military", "Science Fiction", "Space"], "local": null}, {"title": "NHK ni Youkoso!", "image": "https://cdn.myanimelist.net/images/anime/3/52675.jpg", "score": 8.3, "episodes": 24, "year": 2006, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Gonzo K.K."], "producers": ["Funimation", "Nhk Ni Youkoso! Production Team", "Omnibus Promotion"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Psychological"], "tags": ["Angst", "Antihero", "Asia", "Based On A Light Novel", "Boy Meets Girl", "Comedy", "Coming Of Age", "Conspiracy", "Daily Life", "Dark Comedy"], "local": "images/nhk-ni-youkoso.jpg", "synopsis": "Satou’s life – or what’s left of it – is a paranoid mess of conspiracy theories and social anxieties. He’s terrified of the outside world; his apartment is overflowing with the remnants of cheap take-out food; and his retinas have been permanently scarred by a steady diet of internet porn. But maybe it’s not all his fault. After all, the nefarious N-H-K is out there, and they’re determined to turn society’s fringe-dwellers into a brainwashed lot of jobless, hopeless, futureless recluses. Enter Misaki – a mysterious girl-next-door type who is Satou’s last chance to beat down his inner demons and venture out into the light of day. She’s ready to help him overcome his crippling phobias, but Satou would rather cower in his existential foxhole and pretend to work on the demo for his virtual sex game. He’s afraid to face the world. She’s strangely desperate to fix a total stranger. Maybe together they can be normal. (Source: Funimation)"}, {"title": "Sakamoto Days 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1812/158683.jpg", "score": 8.3, "episodes": 12, "year": 2027, "season": "WINTER", "type": "TV", "status": "UPCOMING", "studios": ["Tms Entertainment Co., Ltd."], "producers": [], "duration_min": null, "genres": ["Action", "Comedy", "Drama", "Thriller"], "tags": ["Action", "Action Comedy", "Adult Cast", "Assassin", "Assassins", "Based On A Manga", "Bounty Hunter", "Chases", "Comedy", "Convenience Store"], "local": "images/sakamoto-days-2nd-season.jpg", "synopsis": "The second season of SAKAMOTO DAYS ."}, {"title": "Star vs. the Forces of Evil Season 3", "image": "https://media.kitsu.app/anime/poster_images/13431/small.jpg", "score": 8.3, "episodes": 17, "year": 2017, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Disney Television Animation"], "producers": [], "duration_min": 22.0, "genres": ["Comedy", "Drama", "Fantasy"], "tags": ["Anime Influenced", "Comedy", "Demon", "Drama", "Fantasy", "Fantasy World", "Friendship", "Kids", "Magic", "Magical Girl"], "local": "images/star-vs-the-forces-of-evil-season-3.jpg"}, {"title": "Steven Universe", "image": "https://media.kitsu.app/anime/poster_images/10735/small.jpg", "score": 8.3, "episodes": 52, "year": 2013, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": [], "producers": ["Cartoon Network Studios"], "duration_min": 11.0, "genres": ["Adventure", "Comedy", "Fantasy"], "tags": ["Adventure", "Anime Influenced", "Comedy", "Coming Of Age", "Contemporary Fantasy", "Family", "Fantasy", "Friendship", "Kids", "United States"], "local": "images/steven-universe.jpg"}, {"title": "The Legend of Vox Machina", "image": "https://media.kitsu.app/anime/45932/poster_image/small-f8cd0f2423be7ccb4e24ec0ca3f5352f.jpeg", "score": 8.3, "episodes": 12, "year": 2022, "season": "WINTER", "type": "ONA", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 25.0, "genres": ["Action", "Adventure", "Fantasy"], "tags": ["Action", "Adventure", "Anime Influenced", "Elf", "Fantasy", "High Fantasy", "Magic"], "local": "images/the-legend-of-vox-machina.jpeg"}, {"title": "Tonari no Totoro", "image": "https://cdn.myanimelist.net/images/anime/1110/147278.jpg", "score": 8.3, "episodes": 1, "year": 1988, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["Studio Ghibli Inc."], "producers": ["Gkids", "Streamline Pictures", "Studio Fantasia"], "duration_min": 86.0, "genres": ["Adventure", "Comedy", "Drama", "Fantasy", "Slice of Life", "Supernatural", "Slapstick"], "tags": ["Adventure", "Asia", "Award Winning", "Awards", "Child Protagonists", "Comedy", "Contemporary Fantasy", "Countryside", "Drama", "Earth"], "local": "images/tonari-no-totoro.jpg", "synopsis": "Follow the adventures of Satsuki and her four-year-old sister Mei when they move into a new home in the countryside. To their delight they discover that their new neighbor is a mysterious forest spirit called Totoro who can be seen only through the eyes of a child. Totoro introduces them to extraordinary characters, including a cat that doubles as a bus, takes them on a journey through the wonders of nature. (Source: Disney)"}, {"title": "Uma Musume: Cinderella Gray", "image": "https://cdn.myanimelist.net/images/anime/1626/148097.jpg", "score": 8.3, "episodes": 13, "year": 2025, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Cygamespictures", "Cypic, Inc."], "producers": ["Bit Grooove Promotion", "Cygames", "Happinet Media Marketing"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Slice of Life", "Sports", "Music", "Historical"], "tags": ["Animal Characteristics", "Animals", "Anthropomorphic", "Anthropomorphism", "Athletics", "Based On A Manga", "Beastman", "Bullying", "Comedy", "Coming Of Age"], "local": "images/uma-musume-cinderella-gray.jpg", "synopsis": "Unbeknownst to those around her in the destitute countryside of Kasamatsu, the staggering potential of this ashen-haired \"Beast” will soon rock Japan with her feet and catapult her to the national stage—down the path of a legend. Follow Oguri Cap and her insatiable appetite as the starting gates open on this Umamusume's hot-blooded Cinderella story! (Source: It's Anime powered by REMOW, edited)"}, {"title": "Bakemonogatari", "image": "https://cdn.myanimelist.net/images/anime/11/75274.jpg", "score": 8.29, "episodes": 15, "year": 2009, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Shaft Inc."], "producers": ["Aniplex Of America", "Hanabee Entertainment", "Kodansha"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Mystery", "Romance", "Supernatural", "Psychological"], "tags": ["Absurdity", "Action", "Adventure", "Amnesia", "Angst", "Asia", "Attempted Rape", "Based On A Light Novel", "Basketball", "Be Careful What You Wish For"], "local": "images/cover_2616.jpg", "synopsis": "First season of the Monogatari Series, part 1/6. Contains the arcs Hitagi Crab, Mayoi Snail, Suruga Monkey, Nadeko Snake, and Tsubasa Cat from the Bakemonogatari light novels. Thanks to Meme Oshino, Koyomi Araragi, a high school student, is able to remain a human after coming across a female vampire... However, since the incident, Koyomi seems to meet girls who have an apparition-related issue. Hitagi Senjougahara doesn’t weigh anything, Suruga Kanbaru’s right arm becomes like that of a monkey’s, and a young girl, Mayoi, cannot find her way home no matter how many times she tries. Koyomi, a Mr. Nice Guy, ends up helping each and every girl solve her problem with the help of Meme Oshino. (Source: Aniplex) Note: Only the first 12 episodes were broadcast on television; the remaining three episodes were distributed on the anime's website between November 3, 2009, and June 25, 2010."}, {"title": "Comedy", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A3554-24.jpg", "score": 8.29, "episodes": null, "year": 2000, "season": "UNDEFINED", "type": "OVA", "status": "FINISHED", "studios": [], "producers": ["Studio 4°C"], "duration_min": 10.0, "genres": ["Drama", "Supernatural", "Historical"], "tags": ["Drama", "Historical", "Supernatural", "War"], "local": null, "synopsis": "Sweat Punch is a series of five Studio 4&deg;C shorts collected as a direct-to-DVD package film entitled Deep Imagination . 1. Tanpetori Kyouju no Yuuutsu (タンペトリー教授の憂鬱, Professor Dan Petory's Blues) A musical number starring a hand puppet named Junior. The puppet is controlled by the drunken Professor Dan Petory who explains in puppetry the answers to such questions as why the Earth is blue and why UFOs fly in a zig-zag pattern. 2. End of the World \"End of the World\" is a science fiction story about a young alien girl named Yuko as she escapes from the world of humans. After meeting Kazumi, a human girl Yuko met at a rock concert, the girls head to Kazumi's apartment. Before Yuko even takes off her shoes, however, she leaves through Kazumi's TV with her trusty cybernetic steed FACE to wage a retaliatory campaign against hordes of S&amp;M monsters from another dimension, and the evil queen of Yuko's world. 3. Kigeki (喜劇, Comedy) Set during the Irish War of Independence, a five-year old girl goes out in search of the mysterious Demon&rsquo;s Castle - home of the Black Knight whose services she hopes to recruit. The Black Knight is a dark, young, skilled swordsman who will only accept a particular genre of books as advance payment. 4. Higan (彼岸, Enlightenment) An injured man lies completely still in a hospital room with doctors hovering at his bedside, appearing serene and peaceful as he slowly succumbs to death. However, in his own mind, memories of a recent battle vividly flash by. Thoughts of death and chaos haunt him, even in his final moments. 5. Garakuta no Machi (ガラクタの町, Junk Town) One summer day, a young boy encounters a little robot at a shopping arcade-a hungry little robot, it turns out, as he devours one machine after the other, growing in size with each \"meal\". This story of a boy, a machine, and their little adventure is the tale of an unusual friendship, enriched by the details of daily life and seen through the director's unique visual style. (Source: Studio 4&deg;C website)"}, {"title": "Kaijuu 8-gou", "image": "https://cdn.myanimelist.net/images/anime/1370/140362.jpg", "score": 8.29, "episodes": 12, "year": 2024, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["Nippon Columbia", "Production I.G", "Shueisha"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Horror", "Sci-Fi", "Psychological", "Slapstick"], "tags": ["Action", "Action Comedy", "Adult Cast", "Adventure", "Apocalyptic", "Asia", "Aviation", "Based On A Manga", "Body Horror", "Canon Filler"], "local": "images/kaijuu-8-gou.jpg", "synopsis": "With the highest kaiju-emergence rates in the world, Japan is no stranger to attack by deadly monsters. Enter the Japan Defense Force, a military organization tasked with the neutralization of kaiju. Kafka Hibino, a kaiju-corpse cleanup man, has always dreamed of joining the force. But when he gets another shot at achieving his childhood dream, he undergoes an unexpected transformation. How can he fight kaiju now that he’s become one himself?! (Source: VIZ Media)"}, {"title": "Nodame Cantabile", "image": "https://cdn.myanimelist.net/images/anime/9/11986.jpg", "score": 8.29, "episodes": 23, "year": 2007, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["J.C. Staff", "J.C.Staff Co., Ltd."], "producers": ["Asmik Ace Entertainment, Inc.", "Dentsu Inc.", "Fuji Pacific Music Publishing"], "duration_min": 22.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Music", "Slapstick"], "tags": ["Adapted Into Japanese Movie", "Adapted Into Jdrama", "Adapted Into Other Media", "Adult Cast", "Adult Couples", "Angst", "Asia", "Band", "Based On A Manga", "Boy Meets Girl"], "local": "images/nodame-cantabile.jpg", "synopsis": "Shinichi Chiaki is a first class musician whose dream is to play among the elites in Europe. Coming from a distinguished family, he is an infamous perfectionist; not only is he highly critical of himself, but of others as well. The only thing stopping Chiaki from leaving for Europe is his fear of flying. As a result, he's grounded in Japan. During his 4th year at Japan's top music university, Chiaki happens to meet Noda Megumi; or as she refers to herself, Nodame. On the surface, she seems to be an unkempt girl with no direction in life. However, when Chiaki hears Nodame play the piano for the first time, he is in awe at the kind of music she plays. To Chiaki's dismay, Nodame moves into the apartment next to his and finds out that she is head over heels in love with him. Nodame Cantabile tells the story of Chiaki and Nodame, as they not only learn to deal with each other, but learn lessons from one another as they strive for the top of the musical world. (Source: MAL Rewrite)"}, {"title": "Shouwa Genroku Rakugo Shinjuu", "image": "https://cdn.myanimelist.net/images/anime/1354/124768.jpg", "score": 8.29, "episodes": 13, "year": 2016, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Studio Deen Co., Ltd."], "producers": ["Dax Production", "Kodansha", "Mainichi Broadcasting System"], "duration_min": 26.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Slapstick", "Historical"], "tags": ["Acting", "Adapted Into Jdrama", "Adapted Into Other Media", "Adult Couples", "Animeism", "Apprenticeship", "Asia", "Based On A Manga", "Character Driven", "Comedy"], "local": "images/shouwa-genroku-rakugo-shinjuu.jpg", "synopsis": "The story revolves around a mature prisoner who was released on good behavior during Japan's Shouwa Genroku era (1960s to early 1970s). He is called Yotarou by others, a term that means an \"anti-hero\" or a \"dim-witted man.\" When he returns to society, he starts a new life in rakugo (comic storytelling). Touched by Yakumo's role as the \"grim reaper,\" he asks the master to take him in as an apprentice. Most of the season delves into Yakumo's own past during World War II and the years afterward. (Source: Anime News Network) Note: The first episode aired with a runtime of 48 minutes as opposed to the standard 24 minute long episode."}, {"title": "Steven Universe Season 4", "image": "https://media.kitsu.app/anime/poster_images/13417/small.jpg", "score": 8.29, "episodes": 25, "year": 2016, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Cartoon Network Studios"], "producers": [], "duration_min": 11.0, "genres": ["Adventure", "Comedy", "Fantasy"], "tags": ["Adventure", "Anime Influenced", "Comedy", "Coming Of Age", "Contemporary Fantasy", "Family", "Fantasy", "Friendship", "Kids", "United States"], "local": "images/steven-universe-season-4.jpg"}, {"title": "Suzume no Tojimari", "image": "https://cdn.myanimelist.net/images/anime/1598/128450.jpg", "score": 8.29, "episodes": 1, "year": 2022, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Comix Wave Films Inc."], "producers": ["Aniplex", "Comix Wave Films", "Crunchyroll"], "duration_min": 121.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Mystery", "Sci-Fi", "Supernatural"], "tags": ["Aboard Ship", "Action", "Adventure", "Age Difference Romance", "Age Gap", "Alternative World", "Animals", "Anthropomorphism", "Asia", "Cgi"], "local": "images/suzume-no-tojimari.jpg", "synopsis": "The story follows Suzume, a 17-year-old girl from a quiet Kyushu town who meets a young man looking for a door. They find a door within ruins in the mountain, and Suzume opens it. Soon, more doors begin to open around Japan, bringing disasters from the other side. The film depicts Suzume's liberation and growth, as she closes the doors that are causing disaster. (Source: Anime News Network)"}, {"title": "The Dragon Prince Season 3", "image": "https://media.kitsu.app/anime/42232/poster_image/small-77348fd90172366444b49b7897f17d28.jpeg", "score": 8.29, "episodes": 9, "year": 2019, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 35.0, "genres": ["Action", "Adventure", "Fantasy"], "tags": ["Action", "Adventure", "Anime Influenced", "Dragon", "Elf", "Fantasy", "Fantasy World", "High Fantasy", "Kids", "Magic"], "local": "images/the-dragon-prince-season-3.jpeg"}, {"title": "Xian Ni", "image": "https://cdn.myanimelist.net/images/anime/1289/149708.jpg", "score": 8.29, "episodes": 180, "year": 2023, "season": "SUMMER", "type": "ONA", "status": "ONGOING", "studios": ["Build Dream"], "producers": ["Tencent Penguin Pictures", "Tencent Video"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Historical"], "tags": ["3D Cg Animation", "Action", "Adventure", "Anti-Hero", "Based On A Web Novel", "Cg Animation", "Cg-Anime", "Cgi", "Chinese Animation", "Chinese Production"], "local": "images/xian-ni.jpg", "synopsis": "It tells the story of Wang Lin, an ordinary young man in the countryside, who is moved by his heart and cultivates against immortality. His pursuit is not only for longevity, but also for getting rid of the ants behind it. He firmly believed in human beings and entered the path of cultivation with mediocre qualifications. After experiencing ups and downs, with his wise mind, he gradually reached the pinnacle and became famous in the cultivation world with his own strength. (Source: WeTV)"}, {"title": "Yofukashi no Uta Season 2", "image": "https://cdn.myanimelist.net/images/anime/1509/148453.jpg", "score": 8.29, "episodes": 12, "year": 2025, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Liden Films Inc.", "Lidenfilms"], "producers": ["Animax Broadcast Japan", "Aniplex", "Dentsu"], "duration_min": 22.0, "genres": ["Comedy", "Fantasy", "Romance", "Slice of Life", "Supernatural", "Psychological"], "tags": ["Age Difference Romance", "Age Gap", "Akihabara", "Alcohol", "Angst", "Aromantic", "Asia", "Autumn", "Based On A Manga", "Beer"], "local": "images/yofukashi-no-uta-season-2.jpg", "synopsis": "The second season of Yofukashi no Uta . Ko overcomes his confusion about becoming a vampire and decides to \"like\" Nazuna, while Nazuna resolves to make Ko \"fall in love\" with her. Without understanding what \"love\" even is, the two of them spend their nights together in a frenzy. Meanwhile, Detective Uguisu Anko is closing in with her plot to kill vampires, not just Nazuna. A vampire's weakness is \"anything they were attached to when they were human\" and so they all try to get rid of this weakness before it's too late. But, Nazuna has no memory of her human life. What is Nazuna's hidden past? Why did Anko start killing vampires? And what is the \"secret\" that Nazuna and Anko share? For Ko, Nazuna, Anko, a fun \"late night\" doesn't end here... a new \"night\" begins! (Source: HIDIVE)"}, {"title": "Adventure Time Season 5", "image": "https://media.kitsu.app/anime/poster_images/13765/small.jpg", "score": 8.28, "episodes": 52, "year": 2012, "season": "FALL", "type": han Subaru can imagine. Enemies attack one by one, and both of them are killed. He then finds out he has the power to rewind death, back to the time he first came to this world. But only he remembers what has happened since. (Source: Anime News Network) Notes: - The first episode aired with a runtime of ~50 minutes as opposed to the standard 25 minute long episode. - In the Winter 2020 season, Re:ZERO was rebroadcast and re-edited to fit into an hour time-slot. This edit included the first OVA and added slight modifications to certain scenes throughout. It also added an additional scene at the end of the final episode."}, {"title": "Re:Zero kara Hajimeru Isekai Seikatsu 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1444/108005.jpg", "score": 8.28, "episodes": 13, "year": 2020, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["White Fox Co., Ltd."], "producers": ["At-X", "Daikoku Denki Co., Ltd.", "Hakuhodo Dy Music & Pictures"], "duration_min": 26.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Horror", "Mystery", "Romance", "Thriller", "Isekai", "Psychological"], "tags": ["Action", "Adventure", "Age Gap", "Alternate Universe", "Alternative World", "Assassins", "Based On A Light Novel", "Body Horror", "Butterfly Effect", "Cheats"], "local": "images/re-zero-kara-hajimeru-isekai-seikatsu-2nd-season.jpg", "synopsis": "Even after dying countless times, Subaru finally ended the threat of the White Whale and defeated the Witch Cult's Sin Archbishop representing sloth, Petelgeuse Romaneeconti. But only shortly after overcoming a tragic ending and reuniting with his beloved Emilia, Subaru learns that Rem has been erased from this world, having fallen victim to the White Whale's Fog of Elimination in the midst of Subaru's death loop. With the White Whale now gone, Subaru and Emilia are forced to confront a reality they never dreamed would happen. (Source: Crunchyroll)"}, {"title": "RWBY III", "image": "https://media.kitsu.app/an season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["A-1 Pictures Inc."], "producers": ["Aniplex", "Bandai Spirits", "Kadokawa"], "duration_min": 23.0, "genres": ["Action", "Drama", "Sci-Fi", "Mecha"], "tags": ["Achronological Order", "Action", "Action Drama", "Alternative World", "Angst", "Anthropomorphism", "Artificial Intelligence", "Based On A Light Novel", "Body Horror", "Cgi"], "local": "images/cover_378.jpg", "synopsis": "Called “Juggernaut,” these are the unmanned combat drones developed by the Republic of San Magnolia in answer to the attacks by the autonomous unmanned drones of the neighboring Empire of Giad, the “Legion”. But they’re only unmanned in name. In reality, they are piloted by the Eighty-sixers—those considered to be less than human and treated as mere tools. Determined to achieve his own mysterious ends, Shin, the captain of Spearhead Squadron, which is comprised of Eighty-sixers, continues to fight a hopeless war on a battlefield where only death awaits him. (Source: Crunchyroll)"}, {"title": "Black Lagoon: The Second Barrage", "image": "https://cdn.myanimelist.net/images/anime/1701/152849.jpg", "score": 8.27, "episodes": 12, "year": 2006, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Madhouse Inc."], "producers": ["Arts Pro", "Black Lagoon Production Team", "Front Line"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Drama", "Thriller"], "tags": ["Action", "Adult Audience Only", "Adult Cast", "Adults Are Useless", "Adventure", "Angst", "Anti-Hero", "Asia", "Assassins", "Based On A Manga"], "local": "images/cover_3530.jpg", "synopsis": "Okajima Rokuro - now known almost exclusively as 'Rock' - was once a typical, put-upon Japanese businessman. Then, on a routine business trip, he was kidnapped and ransomed by the Lagoon Company: a band of mercenary pirates operating out of the crime-riddled city of Roanapur. Abandoned by his bosses, he joined the Lagoon Company. Now he must try and stay afloat amongst the ever-shifting politics of the criminal underworld, while simultaneously avoiding death at the hands of his quick-tempered, gun-toting co-worker, 'Two Hand' Revy. (Source: Anime News Network)"}, {"title": "Chou Kaguya-hime!", "image": "https://cdn.myanimelist.net/images/anime/1758/153953.jpg", "score": 8.27, "episodes": 1, "year": 2026, "season": "WINTER", "type": "ONA", "status": "FINISHED", "studios": ["Studio Chromato Co., Ltd.", "Studio Colorido Co., Ltd."], "producers": ["Twin Engine"], "duration_min": 140.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Sci-Fi", "Slice of Life", "Supernatural", "Music"], "tags": ["Action", "Aliens", "Archery", "Artificial Intelligence", "Cgi", "Comedy", "Coming Of Age", "Cute Girls Doing Cute Things", "Drama", "E-Sports"], "local": "images/cover_5397.jpg", "synopsis": "A tale of otherworldly beauty and celestial secrets unfolds in this new take on Japan’s oldest folktale. Inspired by The Tale of the Bamboo Cutter, the film reimagines Japan’s oldest folktale with a modern touch by integrating music, fantasy, and contemporary animation. Set in the virtual realm of Tsukuyomi, the story unfolds as a live performance marrying original music with Yamashita’s signature style of polished visuals, emotive pacing, and dynamic 3D camerawork to boldly transform this classic tale for a new generation. (Source: Netflix, edited)"}, {"title": "Cowboy Bebop: Tengoku no Tobira", "image": "https://cdn.myanimelist.net/images/anime/1439/93480.jpg", "score": 8.27, "episodes": 1, "year": 2001, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Bones Inc.", "Sunrise"], "producers": ["Bandai Visual", "Bones", "Funimation"], "duration_min": 115.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Mystery", "Sci-Fi"], "tags": ["Action", "Adult Cast", "Adventure", "Air Combat", "Amnesia", "Anti-Hero", "Bounty Hunter", "Bounty Hunters", "Comedy", "Crime"], "local": "images/cover_6034.jpg", "synopsis": "As the Cowboy  "duration_min": 24.0, "genres": ["Action", "Drama", "Fantasy", "Romance", "Supernatural"], "tags": ["3D Cg Animation", "Action", "Action Drama", "Anti-Hero", "Archery", "Based On A Visual Novel", "Based On An Eroge", "Battle Royale", "Bionic Powers", "Body Horror"], "local": "images/cover_9056.jpg", "synopsis": "The Holy Grail War continues, with each Master and Servant duo making their move for the omnipotent wish granter. Caster’s plans have been set in motion, beginning with taking Saber captive while Rin and Archer go their separate ways to continue their fights on their own. Without Saber’s aid, Shirou’s principles are put to the ultimate test. With many battles to come with expected and unexpected enemies, Shirou’s resolve begins to take form. Is his desire to protect people and become a hero, genuine? Or are they simply borrowed feelings? And will it be enough to carry him to the end? (Source: Aniplex of America)"}, {"title": "Hibike! Euphonium 2", "image": "https://cdn.myanimelist.net/images/anime/10/81155.jpg", "score": 8.27, "episodes": 13, "year": 2016, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Kyoto Animation Co., Ltd."], "producers": ["Kyoto Animation", "Lantis", "Pony Canyon"], "duration_min": 23.0, "genres": ["Drama", "Slice of Life", "Music"], "tags": ["Aim For The Top", "Angst", "Asia", "Band", "Bands", "Based On A Novel", "Classical Music", "Coming Of Age", "Competition", "Drama"], "local": "images/hibike-euphonium-2.jpg", "synopsis": "With another tournament fast approaching, Kumiko's band is doubling down on practice and discipline, leaving little time for sleep or other recreational activities. The redoubled practice schedule brings Kumiko and Reina closer together, but elsewhere in the band, it seems like drama threatens to tear the group's unity apart. The ghost of the prior year's mass band exodus still haunts many of Kumiko's classmates, and with former band member Nozomi Kasaki now asking to return, it seems like the grudges of the past will soon be impossible to ignore. (Source: Anime News Network, edited) Note: The first episode aired with a runtime of ~48 minutes as opposed to the standard 24 minute long episode."}, {"title": "Kizumonogatari", "image": "https://cdn.anisearch.com/images/anime/cover/6/6334_600.webp", "score": 8.27, "episodes": 3, "year": 2016, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Shaft Inc."], "producers": ["Aniplex", "Kodansha"], "duration_min": 72.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Horror", "Mystery", "Supernatural", "Slapstick"], "tags": ["3D Cg Animation", "Action", "Asia", "Awards", "Boy Meets Girl", "Canon Filler", "Cgi", "Christianity", "Collateral Damage", "Comedy"], "local": "images/kizumonogatari.webp", "synopsis": "Compilation film of the three Kizumonogatari movies. Spring break, an interval of time between the second and third year of high school. It was one fateful evening when Koyomi Araragi encounters her. Kiss-shot Acerola-orion Heart-under-blade. Legendary Vampire. Killer of Apparitions. King of Apparitions. Her legs and arms were cruelly torn apart, her extravagant dress soaked in red; she's a monster who finds herself in a tragic state, laying in a pool of her own blood. However, Koyomi finds her to be beautiful this way. On the brink of death after losing her four limbs, she asks Koyomi to save her. After experiencing fear, chaos, and finally conflict, Koyomi gives his own blood in order to save her. But when he awakens, he finds himself re-born as her vampire kin. Koyomi wishes to revert to being a human from a vampire. However, he must take back all of Kiss-shot's limbs to do so. Working as a negotiator, Meme Oshino stands in middle ground as Koyomi attempts to recapture her four limbs by challenging three powerful vampire hunters. This hellish spring break, the final one of his high school life, is only just beginning. (Source: KIZUMONOGATARI -Koyomi Vamp- Official USA Website, edited)"}, {"title": "Magnetic Rose", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A425-2.jpg", "score": 8.27, "episodes": 1, "year": 1995, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": [], "producers": ["Studio 4°C"], "duration_min": 44.0, "genres": ["Drama", "Horror", "Sci-Fi", "Supernatural", "Psychological"], "tags": ["Cyberpunk", "Drama", "Ghosts", "Horror", "Psychological", "Science Fiction", "Supernatural"], "local": "images/magnetic-rose.jpg", "synopsis": "Memories is a compilation of three standalone short films encompassing different genres. Magnetic Rose — a science fiction tale that tells a chilling story of love, loss, and the unwillingness to forget. Stink Bomb — a tongue-in-cheek story of a chemical researcher who is just looking for a way to get rid of his cold... so why is everybody around him dying? Cannon Fodder — an introspective tale about modern wars and simply following orders."}, {"title": "Pluto", "image": "https://cdn.myanimelist.net/images/anime/1021/138568.jpg", "score": 8.27, "episodes": 8, "year": 2023, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": ["Mappa", "Studio M2"], "producers": ["Genco", "Netease", "Netflix"], "duration_min": 61.0, "genres": ["Action", "Adventure", "Drama", "Mystery", "Sci-Fi", "Thriller", "Mecha", "Psychological"], "tags": ["Action", "Adoption", "Adventure", "Americas", "Amnesia", "Anachronism", "Android", "Androids", "Anti-War", "Artificial Intelligence"], "local": "images/pluto.jpg", "synopsis": "A murder occurs in an orderly world where robots are unable to kill humans. The robotic Europol investigator Gesicht takes the case, but the mystery deepens when he finds no trace of a human at the scene of the crime. As he pursues the truth, Gesicht uncovers the most evil manifestation of hate that history has ever seen, one that is bent on bringing destruction to the world ... (Source: Netflix)"}, {"title": "Shoujo☆Kageki Revue Starlight Movie", "image": "https://cdn.myanimelist.net/images/anime/1378/119190.jpg", "score": 8.27, "episodes": 1, "year": 2021, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["Kinema Citrus Co., Ltd."], "producers": ["Bushiroad", "Sentai Filmworks"], "duration_min": 120.0, "genres": ["Action", "Drama", "Fantasy", "Psychological", "Music"], "tags": ["Abstract", "Acting", "Action", "All-Girls School", "Angst", "Animals", "Archery", "Athletics", "Battle Royale", "Boarding School"], "local": "images/shoujo-kageki-revue-starlight-movie.jpg", "synopsis": "The stage emulates life and compresses it, setting free skills learned over lifetimes in brief but dazzling displays for the amusement and judgment of others. For the performers, it is the ultimate risk, and some will rise while others must fall. Nowhere is this truer than at the Seisho Music Academy, where music, dance and real weapons all come into play in the creation of the next great Star. Karen and Hikari’s destinies have been linked since a childhood promise, but their journeys here have taken very different paths. Now, after Hikari leaves, Karen must discover who she is without her opposite, while Hikari must rediscover her own course. (Source: Sentai Filmworks)"}, {"title": "Sono Bisque Doll wa Koi wo Suru", "image": "https://cdn.myanimelist.net/images/anime/1179/119897.jpg", "score": 8.27, "episodes": 12, "year": 2022, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Cloverworks Inc."], "producers": ["Aniplex", "Bs11", "Movic"], "duration_min": 23.0, "genres": ["Comedy", "Romance", "Slice of Life", "Slapstick"], "tags": ["3D Cg Animation", "Asia", "Based On A Manga", "Boy Meets Girl", "Canon Filler", "Cgi", "Chibi Ed", "Comedy", "Coming Of Age", "Coming-Of-Age"], "local": "images/sono-bisque-doll-wa-koi-wo-suru.jpg", "synopsis": "High schooler Wakana Gojou cares about one thing: making Hina dolls. With nobody to share his obsession, he has trouble finding friends—or even holding conversation. But after the school’s most popular girl, Marin Kitagawa, reveals a secret of her own, he discovers a new purpose for his sewing skills. Together, they’ll make her cosplay dreams come true! (Source: Funimation)"}, {"title": "Star vs. The Forces of Evil: The Battle for Mewni", "image": "https://media.kitsu.app/anime/poster_images/13533/small.jpg", "score": 8.27, "episodes": 1, "year": 2017, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Disney Television Animation"], "producers": [], "duration_min": 88.0, "genres": ["Comedy", "Drama", "Fantasy"], "tags": ["Anime Influenced", "Comedy", "Demon", "Drama", "Fantasy", "Fantasy World", "Friendship", "Kids", "Magic", "Magical Girl"], "local": "images/star-vs-the-forces-of-evil-the-battle-for-mewni.jpg"}, {"title": "Steven Universe: The Movie", "image": "https://media.kitsu.app/anime/poster_images/41493/small.jpg", "score": 8.27, "episodes": 1, "year": 2019, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Cartoon Network Studios"], "producers": [], "duration_min": 82.0, "genres": ["Adventure", "Comedy", "Fantasy", "Music"], "tags": ["Adventure", "Anime Influenced", "Comedy", "Coming Of Age", "Contemporary Fantasy", "Family", "Fantasy", "Friendship", "Kids", "Music"], "local": "images/steven-universe-the-movie.jpg"}, {"title": "Tensei shitara Slime Datta Ken", "image": "https://cdn.myanimelist.net/images/anime/1069/123309.jpg", "score": 8.27, "episodes": 24, "year": 2018, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["8 Bit", "8-Bit", "8Bit Corp, Inc."], "producers": ["8 Bit", "Asatsu-Dk", "Bandai Namco Arts"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Isekai", "Slapstick"], "tags": ["3D Cg Animation", "Absurdist Humour", "Acting", "Action", "Adventure", "Agender", "Alcohol", "Alternate Universe", "Alternative World", "Asia"], "local": "images/tensei-shitara-slime-datta-ken.jpg", "synopsis": "Lonely thirty-seven-year-old Satoru Mikami is stuck in a dead-end job, unhappy with his mundane life, but after dying at the hands of a robber, he awakens to a fresh start in a fantasy realm...as a slime monster! As he acclimates to his goopy new existence, his exploits with the other monsters set off a chain of events that will change his new world forever! (Source: Yen Press)"}, {"title": "The Eccentric Family 2", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A18812-1861532866.1488093150.jpg", "score": 8.27, "episodes": 12, "year": 2017, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["P.A. Works"], "producers": [], "duration_min": 30.0, "genres": ["Comedy", "Drama", "Fantasy"], "tags": ["Comedy", "Drama", "Family", "Fantasy", "Folklore", "Gender Switch", "Shapeshifting", "Youkai"], "local": "images/the-eccentric-family-2.webp", "synopsis": "One day, “The Junior”, estranged son of Professor Akadama, who disappeared after losing a fierce father-son dispute, has returned home after a century, now an English gentleman. The big news spread in and out of the Kyoto area in the blink of an eye and shake up both the Tengu and Tanuki worlds. The paths of Humans, Tanukis and Tengus intertwine in Kyoto as the second volume of the furball picture scroll unravels!"}, {"title": "The Legend of Korra Book 3: Change", "image": "https://media.kitsu.app/anime/8077/poster_image/small-b1473f7429ab32a81864d3f7ba22b86e.jpeg", "score": 8.27, "episodes": 13, "year": 2014, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": [], "producers": ["Studio Mir"], "duration_min": 22.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy"], "tags": ["Action", "Adventure", "Anime Influenced", "Comedy", "Drama", "Fantasy", "Fantasy World", "Martial Arts", "Super Power"], "local": "images/the-legend-of-korra-book-3-change.jpeg"}, {"title": "Wanmei Shijie 3", "image": "https://media.kitsu.app/anime/46567/poster_image/small-5b3d89fd220c10f6f39178ca4d3
