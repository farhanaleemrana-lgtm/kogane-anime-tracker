ndship", "Ganbatte"], "local": "images/cover_1642.jpg", "synopsis": "Ashito Aoi is a young, aspiring soccer player from a backwater town in Japan. His hopes of getting into a high school with a good soccer club are dashed when he causes an incident during a critical match for his team, which results in their loss and elimination from the tournament. Nevertheless, he catches the eye of someone important who happened to be visiting from Tokyo. How will things turn out for Ashito? (Source: Shogakukan Asia)"}, {"title": "Code Geass: Hangyaku no Lelouch III - Oudou", "image": "https://cdn.myanimelist.net/images/anime/1126/91344.jpg", "score": 8.04, "episodes": 1, "year": 2018, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["Sunrise"], "producers": [], "duration_min": 140.0, "genres": ["Action", "Drama", "Sci-Fi", "Thriller", "Mecha"], "tags": ["Action", "Anti-Hero", "Class Struggle", "Compilation", "Drama", "Dystopian", "Ensemble Cast", "Kuudere", "Male Protagonist", "Mecha"], "local": "images/cover_5796.jpg", "synopsis": "Third and final part of the three part theatrical film remake of Code Geass: Lelouch of the Rebellion and Code Geass: Lelouch of the Rebellion R2."}, {"title": "Douluo Dalu II: Jueshi Tangmen", "image": "https://cdn.myanimelist.net/images/anime/1357/154563.jpg", "score": 8.04, "episodes": 182, "year": 2023, "season": "SPRING", "type": "ONA", "status": "ONGOING", "studios": ["Sparkly Key Animation Studio"], "producers": ["Tencent Penguin Pictures", "Tencent Video", "Xuanshi Tangmen"], "duration_min": 20.0, "genres": ["Action", "Adventure", "Fantasy", "Romance"], "tags": ["Action", "Adventure", "Afterlife", "Based On A Web Novel", "Cg Animation", "Cgi", "Chinese Animation", "Chinese Production", "Coming Of Age", "Competition"], "local": "images/cover_7782.jpg"}, {"title": "Eizouken ni wa Te wo Dasu na!", "image": "https://cdn.myanimelist.net/images/anime/1680/110451.jpg", "score": 8.04, "episodes": 12, "year": 2020, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Science Saru Inc."], "producers": ["Crunchyroll", "Nhk Enterprises", "Science Saru"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Comedy", "Slice of Life", "Slapstick"], "tags": ["3D Cg Animation", "Absurdly Powerful Student Council", "Action", "Adapted Into Japanese Movie", "Adapted Into Jdrama", "Adapted Into Other Media", "Adventure", "Alternating Animation Style", "Angst", "Anime & Movie"], "local": "images/cover_8442.jpg", "synopsis": "First year high schooler Midori Asakusa loves anime so much, she insists that \"concept is everything\" in animation. Though she draws a variety of ideas in her sketchbook, she hasn't taken the first step to creating anime, insisting that she can't do it alone. The producer-type Sayaka Kanamori is the first to notice Asakusa's genius. Then, when it becomes clear that their classmate, charismatic fashion model Tsubame Mizusaki, really wants to be an animator, they create an animation club to realize the \"ultimate world\" that exists in their minds. (Source: Crunchyroll)"}, {"title": "Ginga Eiyuu Densetsu Gaiden", "image": "https://cdn.myanimelist.net/images/anime/9/28463.jpg", "score": 8.04, "episodes": 24, "year": 1998, "season": "WINTER", "type": "OVA", "status": "FINISHED", "studios": ["Artland", "K-Factory Inc.", "Magic Bus"], "producers": ["Kitty Films", "Tokuma Shoten", "Wright Staff"], "duration_min": 26.0, "genres": ["Action", "Drama", "Sci-Fi"], "tags": ["Achronological Order", "Action", "Based On A Novel", "Battle Of Wits", "Boys' Love", "Conspiracy", "Detective", "Disaster", "Drama", "Faster-Than-Light Travel"], "local": "images/ginga-eiyuu-densetsu-gaiden.jpg", "synopsis": "A prequel to Legend of Galactic Heroes, focusing more on Yang Wen-li; how he became the hero of El Facile and how he handled a couple of assignments he received afterward. Spiral Labyrinth also continues with the background of Reinhard and Kircheis where the first Gaiden left off. A collection of independent short stories taking place prior to the Overture to a New War, some of which are adapted from the novel and some of which are completely original."}, {"title": "K-ON!", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A11963-3127912345.1323767945.jpg", "score": 8.04, "episodes": 1, "year": 2011, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Kyoto Animation"], "producers": ["K-On! Movie Committee", "Kyoto Animation", "Movic"], "duration_min": 110.0, "genres": ["Comedy", "Slice of Life", "Music"], "tags": ["Bands", "Comedy", "Iyashikei", "Music", "School Life", "Slice Of Life"], "local": "images/k-on.webp", "synopsis": "Hirasawa Yui, a young, carefree girl entering high school, has her imagination instantly captured when she sees a poster advertising the ‘Light Music Club’. Being the carefree girl that she is, she quickly signs up. However, Yui has a problem, she is unable to play an instrument. When Yui goes to the clubroom to explain, she's greeted by the other members: Ritsu, Mio and Tsumugi. Although disheartened at Yui’s lack of musical know-how, they still try to convince her to stay to prevent the club’s disbandment. After playing Yui a short piece which re-ignites her imagination, they succeed in keeping their new member and guitarist. Along with the tasks of school and homework, Yui begins to learn the guitar with the help of the other band members, experiencing many mishaps along the way. However, with the school-festival drawing near and Yui getting stuck with her practice, will the Light Music Club be ready in time for their debut? (Source: MAL Rewrite)"}, {"title": "Kamisama Hajimemashita OVA", "image": "https://cdn.myanimelist.net/images/anime/6/56425.jpg", "score": 8.04, "episodes": 2, "year": 2013, "season": "SUMMER", "type": "OVA", "status": "FINISHED", "studios": ["Tms Entertainment Co., Ltd."], "producers": ["Tms Entertainment"], "duration_min": 14.0, "genres": ["Comedy", "Fantasy", "Romance", "Supernatural"], "tags": ["Animal Characteristics", "Based On A Manga", "Comedy", "Contemporary Fantasy", "Deity", "Demon", "Demons", "Fantasy", "Female Protagonist", "Interspecies Relationship"], "local": "images/kamisama-hajimemashita-ova.jpg", "synopsis": "Two OVA episodes bundled with the 16th volume of the manga. One of the included episodes will be based on the story from the 15th volume, while the other will contain an all-new original story. (Source: Anime News Network)"}, {"title": "Kimetsu no Yaiba: Kizuna no Kiseki, Soshite Hashira Keiko e", "image": "https://cdn.anisearch.com/images/anime/cover/19/19021_600.webp", "score": 8.04, "episodes": 1, "year": 2024, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Ufotable, Inc."], "producers": [], "duration_min": 103.0, "genres": ["Action", "Drama", "Fantasy", "Supernatural", "Slapstick", "Historical"], "tags": ["Action", "Action Drama", "Demon", "Drama", "Excessive Violence", "Fantasy", "Hero Of Strong Character", "Historical", "Shounen", "Slapstick"], "local": "images/kimetsu-no-yaiba-kizuna-no-kiseki-soshite-hashira-keiko-e.webp"}, {"title": "Lastman", "image": "https://media.kitsu.app/anime/poster_images/13999/small.jpg", "score": 8.04, "episodes": 26, "year": 2016, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 13.0, "genres": ["Action", "Adventure", "Fantasy", "Sports"], "tags": ["Action", "Adventure", "Anime Influenced", "Boxing", "Fantasy", "Sports", "Super Power"], "local": "images/lastman.jpg"}, {"title": "Maison Ikkoku", "image": "https://cdn.myanimelist.net/images/anime/6/17576.jpg", "score": 8.04, "episodes": 96, "year": 1986, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Kitty Film Co., Ltd.", "Studio Deen"], "producers": ["Fuji Television Network", "Fuji Tv", "Kitty Films"], "duration_min": 25.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Slapstick"], "tags": ["Adapted Into Japanese Movie", "Adapted Into Jdrama", "Adapted Into Other Media", "Adult Cast", "Age Gap", "Alcohol", "Apartment Life", "Asia", "Baseball", "Based On A Manga"], "local": "images/maison-ikkoku.jpg", "synopsis": "Maison Ikkoku is a romantic comedy series created by Rumiko Takahashi. The story centers around the development of the relationship between Kyoko Otonashi and Yusaku Godai. Kyoko is a recent widow who moves into the apartment house Ikkoku-kan where she becomes the manager. Godai is a wanna-be student (\"ronin\") struggling with college entrance exams. When they meet, it's love at first sight&mdash;for Godai anyway. Along the way, the other tentants, the mysterious Yotsuya, the seemingly alcoholic Ichinose, and the brash Akemi, watch and occasionally take part to make their lives more interesting. To complicate matters further, the wealthy tennis coach Shun Mitaka has his eye on Kyoko, while Godai is pursued by both Nanao Kozue and Ibuki Yagami. Covering a wide range of emotions from hysterically funny to painfully sad, Maison Ikkoku&mdash;all 96 episodes&mdash;is well worth seeing."}, {"title": "Omoide no Marnie", "image": "https://cdn.myanimelist.net/images/anime/7/64293.jpg", "score": 8.04, "episodes": 1, "year": 2014, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Studio Ghibli Inc."], "producers": ["D-Rights", "Dentsu Inc.", "Disney Platform Distribution"], "duration_min": 102.0, "genres": ["Drama", "Mystery", "Slice of Life", "Thriller", "Psychological"], "tags": ["Amnesia", "Angst", "Asia", "Based On A Novel", "Bullying", "Classic Literature", "Coastal", "Coming Of Age", "Disability", "Drama"], "local": "images/omoide-no-marnie.jpg", "synopsis": "Suffering from frequent asthma attacks, young Anna Sasaki is quiet, unsociable, and isolated from her peers, causing her foster parent endless worry. Upon recommendation by the doctor, Anna is sent to the countryside, in hope the cleaner air and more relaxing lifestyle will improve her health and help clear her mind. Engaging in her passion for sketching, Anna spends her summer days living with her aunt and uncle in a small town near the sea. One day while wandering outside, Anna discovers an abandoned mansion known as the Marsh House. However, she soon finds that the residence isn't as vacant as it appears to be, running into a mysterious girl named Marnie. Marnie's bubbly demeanor slowly begins to draw Anna out of her shell as she returns night after night to meet with her new friend. But it seems there is more to the strange girl than meets the eye—as her time in the town nears its end, Anna begins to discover the truth behind the walls of the Marsh House. Omoide no Marnie tells the touching story of a young girl's journey through self-discovery and friendship, and the summer that she will remember for the rest of her life. (Source: MAL Rewrite)"}, {"title": "RWBY V: Character Shorts", "image": "https://media.kitsu.app/anime/poster_images/13649/small.jpg", "score": 8.04, "episodes": 3, "year": 2017, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": ["Rooster Teeth Productions"], "producers": [], "duration_min": 4.0, "genres": ["Action", "Adventure", "Fantasy"], "tags": ["Action", "Adventure", "Anime Influenced", "Fantasy", "Fantasy World"], "local": "images/rwby-v-character-shorts.jpg"}, {"title": "Tamayura: Sotsugyou Shashin Part 4 - Ashita", "image": "https://cdn.myanimelist.net/images/anime/1697/134884.jpg", "score": 8.04, "episodes": 1, "year": 2016, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["Tyo Animations", "Yumeta Company"], "producers": ["Flying Dog", "Shochiku", "Tyo Animations"], "duration_min": 57.0, "genres": ["Comedy", "Drama", "Slice of Life"], "tags": ["Cgdct", "Comedy", "Coming Of Age", "Cute Girls Doing Cute Things", "Drama", "Female Protagonist", "Iyashikei", "Original Work", "Photography", "Primarily Female Cast"], "local": "images/tamayura-sotsugyou-shashin-part-4-as ands the palace guards at Versailles in the years before the French Revolution. Her beauty and noble spirit make her a shining figure in the eyes of both men and women but she is torn between her chosen life of service and duty to class and country and her own heart and desires. She lives as a noble amidst the opulence of Versailles but her keen senses and compassion are not blinded to the poverty of the French people. (Source: Anime News Network)"}, {"title": "Akatsuki no Yona", "image": "https://cdn.myanimelist.net/images/anime/9/64225.jpg", "score": 8.03, "episodes": 24, "year": 2014, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Pierrot Co., Ltd."], "producers": ["Age Global Networks", "Akatsuki No Yona Production Team", "At-X"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Romance", "Slapstick", "Historical"], "tags": ["Aboard Ship", "Action", "Adventure", "Alcohol", "Ancient China", "Archery", "Based On A Manga", "Betrayal", "Bishounen", "Black Humour"], "local": "images/cover_1006.jpg", "synopsis": "Since Yona is the only princess of a grand kingdom, she has been raised with great care by her doting father and protected by her childhood friend/guard Hak and others. However, her fate changes on her 16th birthday, when her beloved cousin Soo-won murders her father to claim the throne. She flees the castle to Hak's hometown and begins her new life. (Source: Anime News Network)"}, {"title": "Ao no Hako", "image": "https://cdn.myanimelist.net/images/anime/1341/145349.jpg", "score": 8.03, "episodes": 25, "year": 2024, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Telecom Animation Film", "Wit Studio"], "producers": ["Magic Capsule", "Shueisha", "Tbs"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Sports", "Slapstick"], "tags": ["Acrobatics", "Athletics", "Badminton", "Based On A Manga", "Basketball", "Chibi", "Cohabitation", "Comedy", "Coming Of Age", "Coming-Of-Age"], "local": "images/cover_1664.jpg", "synopsis": "Do these sports-crossed lovers have a chance? Taiki Inomata loves badminton, but he has a long way to go before he can reach nationals. When Taiki sees upperclassman Chinatsu Kano practicing her heart out on the girls’ basketball team, he falls for her hard. After an unexpected turn of events brings the two closer together, sports might not be the first thing on their minds anymore! (Source: TMS Anime) Note: The series streamed a week in advance on Netflix Japan starting with episode 2 released alongside episode 1."}, {"title": "Boku no Kokoro no Yabai Yatsu Movie", "image": "https://cdn.myanimelist.net/images/anime/1678/153935.jpg", "score": 8.03, "episodes": 1, "year": 2026, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Shin-Ei Animation Co., Ltd."], "producers": ["Bit Grooove Promotion", "Tv Asahi"], "duration_min": 105.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life"], "tags": ["Asia", "Based On A Manga", "Chuunibyou", "Comedy", "Coming Of Age", "Compilation", "Drama", "Earth", "Female Protagonist", "Food"], "local": "images/cover_3805.jpg", "synopsis": "A re-edit of both anime seasons featuring newly added footage and will depict the story of Ichikawa and Yamada after the events of the TV series."}, {"title": "Douluo Dalu: Shuang Shen Zhi Zhan", "image": "https://media.kitsu.app/anime/47603/poster_image/small-b9b89b2464b02031f309b7c7028a95c1.jpeg", "score": 8.03, "episodes": 3, "year": 2023, "season": "SPRING", "type": "ONA", "status": "FINISHED", "studios": ["Sparkly Key Animation"], "producers": ["Tencent Penguin Pictures"], "duration_min": 30.0, "genres": ["Action", "Fantasy"], "tags": ["Action", "Chinese Production", "Fantasy", "Full Cgi", "Gods"], "local": "images/cover_7808.jpeg", "synopsis": "The 30th and final part of Douluo Dalu . Note: Episodes 261 to 263."}, {"title": "Gachiakuta", "image": "https://cdn.myanimelist.net/images/anime/1682/150432.jpg", "score": 8.03, "episodes": 24, "year": 2025, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Bones Film Inc."], "producers": ["At-X", "Avex Pictures", "Bones"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Mystery", "Supernatural", "Psychological", "Slapstick"], "tags": ["Action", "Action Comedy", "Adoption", "Adventure", "Aristocracy", "Banishment", "Based On A Manga", "Body Horror", "Canon Filler", "Cgi"], "local": "images/gachiakuta.jpg", "synopsis": "A boy lives in a floating town, where the poor scrape by and the rich live a sumptuous life, simply casting their garbage off the side, into the abyss. When he’s falsely accused of murder, though, his wrongful conviction leads to an unimaginable punishment—exile off the edge, with the rest of the trash. Down on the surface, the cast-off waste of humanity has bred vicious monsters, and to travel the path to vengeance against those who cast him into Hell, a boy will have to become a warrior… (Source: Kodansha USA)"}, {"title": "Gintama Season 4", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A20160-2322508506.1506913147.jpg", "score": 8.03, "episodes": 25, "year": 2017, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Bandai Namco Pictures"], "producers": [], "duration_min": 30.0, "genres": ["Comedy"], "tags": ["Comedy"], "local": "images/gintama-season-4.jpg", "synopsis": "After joining the resistance against the bakufu, Gintoki and the gang are in hiding, along with Katsura and his Joui rebels. The Yorozuya is soon approached by Nobume Imai and two members of the Kiheitai, who explain that the Harusame pirates have turned against 7th Division Captain Kamui and their former ally Takasugi. The Kiheitai present Gintoki with a job: find Takasugi, who has been missing since his ship was ambushed in a Harusame raid. Nobume also makes a stunning revelation regarding the Tendoushuu, a secret organization pulling the strings of numerous factions, and their leader Utsuro, the shadowy figure with an uncanny resemblance to Gintoki's former teacher. Hitching a ride on Sakamoto's space ship, the Yorozuya and Katsura set out for Rakuyou, Kagura's home planet, where the various factions have gathered and tensions are brewing. Long-held grudges, political infighting, and the Tendoushuu's sinister overarching plan finally culminate into a massive, decisive battle on Rakuyou. (Source: MAL Rewrite)"}, {"title": "Hyouka", "image": "https://cdn.myanimelist.net/images/anime/13/50521.jpg", "score": 8.03, "episodes": 22, "year": 2012, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Kyoto Animation Co., Ltd."], "producers": ["Animation Do", "Chara-Ani.Com", "Kadokawa Shoten"], "duration_min": 25.0, "genres": ["Comedy", "Drama", "Mystery", "Romance", "Slice of Life"], "tags": ["Adapted Into Japanese Movie", "Adapted Into Other Media", "Asia", "Awards", "Based On A Novel", "Bishoujo", "Bishounen", "Bowling", "Bullying", "Character Driven"], "local": "images/hyouka.jpg", "synopsis": "Energy-conservative high school student Houtarou Oreki ends up with more than he bargained for when he signs up for the Classic Literature Club at his sister's behest—especially when he realizes how deep-rooted the club's history really is. Begrudgingly, Oreki is dragged into an investigation concerning the 45-year-old mystery that surrounds the club room. Accompanied by his fellow club members, the knowledgeable Satoshi Fukube, the stern but benign Mayaka Ibara, and the ever-curious Eru Chitanda, Oreki must combat deadlines and lack of information with resourcefulness and hidden talent, in order to not only find the truth buried beneath the dust of works created years before them, but of other side cases as well. Based on the award-winning Koten-bu light novel series, and directed by Yasuhiro Takemoto of Suzumiya Haruhi no Shoushitsu, Hyouka shows that normal life can be full of small mysteries, be it family history, a student film, or even the withered flowers that make up a ghost story. (Source: MAL Rewrite)"}, {"title": "Kaze Tachinu", "image": "https://cdn.myanimelist.net/images/anime/8/52353.jpg", "score": 8.03, "episodes": 1, "year": 2013, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Studio Ghibli Inc."], "producers": ["Buena Vista Home Entertainment", "D-Rights", "Dentsu Inc."], "duration_min": 126.0, "genres": ["Drama", "Romance", "Slice of Life", "Historical"], "tags": ["1920S", "Age Difference", "Air Force", "Asia", "Avaiation", "Aviation", "Award Winning", "Based On A Manga", "Based On Real Events", "Biographical"], "local": "images/kaze-tachinu.jpg", "synopsis": "Although Jirou Horikoshi's nearsightedness prevents him from ever becoming a pilot, he leaves his hometown to study aeronautical engineering at Tokyo Imperial University for one simple purpose: to design and build planes just like his hero, Italian aircraft pioneer Giovanni Battista Caproni. His arrival in the capital coincides with the Great Kanto Earthquake of 1923, during which he saves a maid serving the family of a young girl named Naoko Satomi; this disastrous event marks the beginning of over two decades of social unrest and malaise leading up to Japan's eventual surrender in World War II."}, {"title": "Kotarou wa Hitorigurashi", "image": "https://cdn.myanimelist.net/images/anime/1862/121020.jpg", "score": 8.03, "episodes": 10, "year": 2022, "season": "WINTER", "type": "ONA", "status": "FINISHED", "studios": ["Liden Films Inc.", "Lidenfilms"], "producers": ["Netflix"], "duration_min": 26.0, "genres": ["Comedy", "Drama", "Slice of Life"], "tags": ["Abuse", "Apartment Life", "Asia", "Based On A Manga", "Child Abuse", "Child Protagonists", "Childcare", "Comedy", "Coming Of Age", "Cute Boys Doing Cute Things"], "local": "images/kotarou-wa-hitorigurashi.jpg", "synopsis": "A lonely little boy moves into a ramshackle apartment building all on his own and makes friends with the broke manga artist who lives next door. (Source: Netflix)"}, {"title": "Kuroko no Basket", "image": "https://cdn.myanimelist.net/images/anime/11/50453.jpg", "score": 8.03, "episodes": 25, "year": 2012, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["Bandai Visual", "Banpresto", "Bs11"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Sports", "Slapstick"], "tags": ["Asia", "Awards", "Based On A Manga", "Basketball", "Club", "Colour Coded", "Comedy", "Drama", "Earth", "Engrish"], "local": "images/kuroko-no-basket.jpg", "synopsis": "Teikou Junior High School's basketball team is crowned champion three years in a row thanks to five outstanding players who, with their breathtaking and unique skills, leave opponents in despair and fans in admiration. However, after graduating, these teammates, known as \"The Generation of Miracles\", go their separate ways and now consider each other as rivals. At Seirin High School, two newly recruited freshmen prove that they are not ordinary basketball players: Taiga Kagami, a promising player returning from the US, and Tetsuya Kuroko, a seemingly ordinary student whose lack of presence allows him to move around unnoticed. Although Kuroko is neither athletic nor able to score any points, he was a member of Teikou's basketball team, where he played as the \"Phantom Sixth Man,\" who easily passed the ball and assisted his teammates. Kuroko no Basket follows the journey of Seirin's players as they attempt to become the best Japanese high school team by winning the Interhigh Championship. To reach their goal, they have to cross pathways with several powerful teams, some of which have one of the five players with godlike abilities, whom Kuroko and Taiga make a pact to defeat. (Source: MAL Rewrite)"}, {"title": "Kuroshitsuji: Book of Circus", "image": "https://cdn.myanimelist.net/images/anime/6/64811.jpg", "score": 8.03, "episodes": 10, "year": 2014, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["A-1 Pictures Inc."], "producers": ["A-1 Pictures", "Aniplex", "Asmik Ace Entertainment, Inc."], "duration_min": 24.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Mystery", "Slice of Life", "Supernatural", "Historical"], "tags": ["19Th Century", "Action", "Action Drama", "Angst", "Animeism", "Anti-Hero", "Based On A Manga", "Bishounen", "Butler", "Butlers"], "local": "images/kuroshitsuji-book-of-circus.jpg", "synopsis": "In late-nineteenth-century England, the Noah's Ark Circus enlivens the city of London with their grandeur and spectacular stunts. However, children are mysteriously disappearing from the town in a manner correlating to the troupe's movement. The Queen, then, sends her notorious Watchdog, Ciel Phantomhive, on an investigative mission to retrieve the missing children. Ciel and his demon butler, Sebastian Michaelis, infiltrate the circus, disguised as team members, to study and possibly unearth its ulterior motive. This arc immediately follows the Curry Contest Arc in the manga, which ended at episode 15 in the first season of the anime."}, {"title": "Mairimashita! Iruma-kun 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1527/113656.jpg", "score": 8.03, "episodes": 21, "year": 2021, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Bandai Namco Pictures Inc.", "Bn Pictures"], "producers": ["Nhk Enterprises"], "duration_min": 24.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Slice of Life", "Supernatural", "Isekai", "Slapstick"], "tags": ["Absurdist Humour", "Absurdly Powerful Student Council", "Action", "Adoption", "Aim For The Top", "Alternating Animation Style", "Alternative World", "Angst", "Based On A Manga", "Bishounen"], "local": "images/mairimashita-iruma-kun-2nd-season.jpg", "synopsis": "The second season of Mairimashita! Iruma-kun . Suzuki Iruma, human and deeply non-aggressive, one day becomes the grandson of the great demon Sullivan. Doted on beyond belief, Iruma starts school where \"Grandpa\" serves as the chair... and finds, to his surprise, that he enjoys life there with Asmodeus, Clara, and the rest of his demon classmates. But just when Iruma thought he'd fitted in, there's more trouble ahead! A ring begins to talk, and Iruma... goes bad?! Iruma's chaotic, demonic life at school continues! (Source: NHK)"}, {"title": "Non Non Biyori Nonstop: Bukatsu wo Ganbatta", "image": "https://cdn.myanimelist.net/images/anime/1984/120788.jpg", "score": 8.03, "episodes": 1, "year": 2022, "season": "WINTER", "type": "OVA", "status": "FINISHED", "studios": ["Silver Link."], "producers": [], "duration_min": 22.0, "genres": ["Comedy", "Slice of Life", "Slapstick"], "tags": ["Asia", "Based On A Manga", "Cgdct", "Colour Coded", "Comedy", "Countryside", "Cute Girls Doing Cute Things", "Daily Life", "Earth", "Elementary School"], "local": "images/non-non-biyori-nonstop-bukatsu-wo-ganbatta.jpg", "synopsis": "An unaired thirteenth episode of Non Non Biyori: Nonstop that is bundled with the special edition of the Non Non Biyori Remember spin-off manga's compilation release."}, {"title": "One Piece Movie 14: Stampede", "image": "https://cdn.myanimelist.net/images/anime/1221/100550.jpg", "score": 8.03, "episodes": 1, "year": 2019, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Toei Animation Co., Ltd."], "producers": ["Bandai Co., Ltd.", "Bandai Namco Entertainment", "Fuji Television Network"], "duration_min": 101.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy"], "tags": ["Action", "Adventure", "Alternative World", "Based On A Manga", "Beastman", "Bionic Powers", "Cgi", "Comedy", "Drama", "Ensemble Cast"], "local": "images/one-piece-movie-14-stampede.jpg"}, {"title": "School Rumble Ni Gakki", "image": "https://cdn.myanimelist.net/images/anime/5/75490.jpg", "score": 8.03, "episodes": 26, "year": 2006, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["S t-from-hell Johannes Krauser II (guitar/vocals,) and given pulsing, throbbing life by indestructible drummer Camus and bassist Alexander Jagi, Detroit Metal City is the hottest ticket on the concert circuit! There's just one catch. That \"hottest ticket\" is just a meal ticket, and beneath the makeup, these ultimate head-bangers are hired doppelgangers who don't even LIKE what they do! Jaggi is actually Wada, who wants to play glam rock; Camus is Nishida, an anime fan with an appalling weakness for curry and NSFW videos; and Krauser is... oh the shame... street-singing Soichi Negishi, whose dreams of singing happy pop hits seem hopelessly doomed by the success of his rage-fueled alter ego! Worse, he can't even tell anyone who Krauser is. Not even the girl he likes, who HATES DMC! Will rage against the corporate machine consume Negishi's tortured soul? Is there life after death metal? What it's like to put your head in a jet engine and turn up the volume? (Source: Sentai Filmworks)"}, {"title": "Kaiba", "image": "https://cdn.myanimelist.net/images/anime/1959/147908.jpg", "score": 8.02, "episodes": 12, "year": 2008, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Madhouse Inc."], "producers": ["Discotek", "Madhouse", "Mediarte Entertainment Works"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Mystery", "Romance", "Sci-Fi", "Psychological"], "tags": ["Abstract", "Action", "Adventure", "Alcohol", "Aliens", "Amnesia", "Android", "Apocalyptic Fiction", "Avant Garde", "Award Winning"], "local": "images/kaiba.jpg", "synopsis": "It is now possible to store memory data, so that the death of your body is not actually \"death\". As memories are stored in databanks, they can be \"transferred\" to new bodies. Because so-called \"memory trading\" now occurs, it is now possible to steal memories and illegally alter them. Society has fallen apart as authority has become lost and stagnant. One day, a man awakens in a ruined room. His name is Kaiba. He has no memories, but he does have a pendant with a picture of an unknown woman inside. In the skies are roiling clouds and electrical storms, impossible to pass without losing one's memories; above them lies the elusive realm of the rich and powerful, who barter others' bodies and memories for their own enjoyment and longevity. Below lies a troubled and dangerous world where good bodies are hard to come by and real money is scarce. After suddenly being attacked, Kaiba escapes into space, and during his travels meets all sorts of people and regains his memories. Throughout it, he continues to be troubled by the world's problems, as well as his own existence. And what of the woman in the pendant, Neiro?"}, {"title": "Koukaku Kidoutai: Stand Alone Complex 2nd GIG - Individual Eleven", "image": "https://cdn.myanimelist.net/images/anime/5/2829.jpg", "score": 8.02, "episodes": 1, "year": 2006, "season": "WINTER", "type": "OVA", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["Bandai Entertainment", "Bandai Visual", "Dentsu Inc."], "duration_min": 161.0, "genres": ["Action", "Sci-Fi", "Mecha"], "tags": ["Action", "Adult Cast", "Android", "Artificial Intelligence", "Asia", "Based On A Manga", "Bionic Powers", "Cops", "Crime", "Cyberpunk"], "local": "images/koukaku-kidoutai-stand-alone-complex-2nd-gig-individual-elev.jpg", "synopsis": "Compilation movie of the \"Individual Eleven\" story from Ghost in the Shell: SAC 2nd Gig series. (Source: AniDB)"}, {"title": "Kuroshitsuji: Book of Murder", "image": "https://cdn.myanimelist.net/images/anime/12/74392.jpg", "score": 8.02, "episodes": 2, "year": 2015, "season": "WINTER", "type": "OVA", "status": "FINISHED", "studios": ["A-1 Pictures Inc."], "producers": ["A-1 Pictures", "Aniplex", "Asmik Ace Entertainment, Inc."], "duration_min": 61.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Mystery", "Supernatural", "Historical"], "tags": ["19Th Century", "Action", "Anti-Hero", "Based On A Manga", "Bishounen", "Butler", "Butlers", "Comedy", "Contemporary Fantasy", "Contractor"], "local": "images/kuroshitsuji-book-of-murder.jpg", "synopsis": "At the Queen's behest, young master Ciel Phantomhive hosts a lavish banquet to be attended by the crème-de-la-crème of London's elite. What begins as a fabulous affair quickly takes a dark turn when guests begin turning up dead! Should Sebastian and Ciel wish to once more see the light of day, they must join forces with their guests, including the legendary author Sir Arthur Conan Doyle, to unravel the mystery – and apprehend the murderer before it's too late! (Source: Funimation)"}, {"title": "Kuroshitsuji: Midori no Majo-hen", "image": "https://cdn.myanimelist.net/images/anime/1517/148292.jpg", "score": 8.02, "episodes": 13, "year": 2025, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Cloverworks Inc."], "producers": ["Aniplex", "Cloverworks", "Crunchyroll"], "duration_min": 23.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Mystery", "Supernatural", "Historical"], "tags": ["19Th Century", "Action", "Anti-Hero", "Based On A Manga", "Butler", "Butlers", "Comedy", "Conspiracy", "Contemporary Fantasy", "Contractor"], "local": "images/kuroshitsuji-midori-no-majo-hen.jpg", "synopsis": "Sequel to Kuroshitsuji: Kishuku Gakkou-hen. Ciel and his loyal butler Sebastian brave a cursed forest in Germany to uncover the truth behind eerie deaths. (Source: Crunchyroll)"}, {"title": "Lovely★Complex", "image": "https://cdn.myanimelist.net/images/anime/11/75563.jpg", "score": 8.02, "episodes": 24, "year": 2007, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Toei Animation Co., Ltd."], "producers": ["Discotek Media", "Nichion", "Shueisha"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Slapstick"], "tags": ["Adapted Into Japanese Movie", "Adapted Into Other Media", "Amusement Park Visit", "Angst", "Asia", "Based On A Manga", "Basketball", "Befriend Attack", "Bishounen", "Comedy"], "local": "images/lovely-complex.jpg", "synopsis": "Love is unusual for Koizumi Risa and Ootani Atsushi, who are both striving to find their ideal partner in high school—172 cm tall Koizumi is much taller than the average girl, and Ootani is much shorter than the average guy at 156 cm. To add to their plights, their crushes fall in love with each other, leaving Koizumi and Ootani comically flustered and heartbroken. To make matters worse, they're even labeled as a comedy duo by their homeroom teacher due to their personalities and the stark difference in their heights, and their classmates even think of their arguments as sketches. Lovely★Complex follows Koizumi and Ootani as they encourage each other in finding love and become close friends. Apart from their ridiculous antics, they soon find out an unexpected similarity in their music and fashion tastes. Maybe they possess a chemistry yet unknown, but could love ever bloom between the mismatched pair? (Source: MAL Rewrite)"}, {"title": "Miraculous Ladybug OVA", "image": "https://media.kitsu.app/anime/poster_images/11747/small.jpg", "score": 8.02, "episodes": null, "year": null, "season": "UNDEFINED", "type": "OVA", "status": "UNKNOWN", "studios": [], "producers": ["Toei Animation", "Zagtoon"], "duration_min": null, "genres": ["Action", "Comedy"], "tags": ["Action", "Anime Influenced", "Comedy", "Henshin", "Magical Girl", "Mahou Shoujo", "Super Power"], "local": "images/miraculous-ladybug-ova.jpg"}, {"title": "Mononoke Movie 3: Hebigami", "image": "https://cdn.myanimelist.net/images/anime/1521/156670.jpg", "score": 8.02, "episodes": 1, "year": 2026, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["Eota", "Studio Kafka"], "producers": ["Twin Engine"], "duration_min": 87.0, "genres": ["Fantasy", "Horror", "Mystery", "Supernatural", "Thriller", "Psychological", "Historical"], "tags": ["Abstract", "Adult Cast", "Cosmic Horror", "Exorcists", "Fantasy", "Historical", "Horror", "Japanese Mythology", "Mystery", "Mythology"], "local": "images/mononoke-movie-3-hebigami.jpg"}, {"title": "Overlord III", "image": "https://cdn.myanimelist.net/images/anime/1511/93473.jpg", "score": 8.02, "episodes": 13, "year": 2018, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Madhouse Inc."], "producers": ["At-X", "Funimation", "Hakuhodo Dy Music & Pictures"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Fantasy", "Romance", "Sci-Fi", "Supernatural", "Isekai"], "tags": ["3D Cg Animation", "Action", "Adventure", "Almighty Hero", "Alternative World", "Anti-Hero", "Antihero", "Artificial Intelligence", "Based On A Light Novel", "Be Careful What You Wish For"], "local": "images/overlord-iii.jpg", "synopsis": "The third season of Overlord . With his foundations now set in this new world, the first steps of Ains Ooal Gown's master plan apparent begin to come to fruition. The value of Carne village and especially the political value of his alter ego Momon are reaffirmed; the “hidden” genius of his actions is continuously met with shock and awe by Demiurge, Albedo, the rest of his guardians, and even Ains himself at his “great wisdom.” His attempts to act in a way befitting the ruler of Nazarick, continuing to further cement his guardian’s loyalty, push him ever further down the path of not-so-intentional world domination. Without human conscience due to being undead, he is motivated only to continue searching for other players from Yggdrasil and to gain power to better protect the children and home of him and his forty former companions. Lord Ains Ooal Gown maintains his mantle of Overlord and leads the Great Tomb of Nazarick unto the world stage, directly into a vicious power struggle between two great empires. (Source: Anime News Network)"}, {"title": "Saiki Kusuo no Ψ-nan: Ψ-shidou-hen", "image": "https://cdn.myanimelist.net/images/anime/1993/119022.jpg", "score": 8.02, "episodes": 6, "year": 2019, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": ["Egg Firm", "J.C. Staff", "J.C.Staff Co., Ltd."], "producers": [], "duration_min": 22.0, "genres": ["Comedy", "Slice of Life", "Supernatural"], "tags": ["Asexual", "Based On A Manga", "Basketball", "Breaking The Fourth Wall", "Chuunibyou", "Comedy", "Gag", "Gag Humor", "Gyaru", "High School"], "local": "images/saiki-kusuo-no-nan-shidou-hen.jpg", "synopsis": "Being an esper seems cool on TV, but in Saiki Kusuo's life as a normal teenager it's a real drag. The hit comedy manga returns in a new anime series! (Source: Netflix) Note: The first 5 episodes take place between Season 2 and the Final Arc. The last continues the story from the Final Arc."}, {"title": "Seishun Buta Yarou wa Santa Claus no Yume wo Minai", "image": "https://cdn.myanimelist.net/images/anime/1823/149858.jpg", "score": 8.02, "episodes": 13, "year": 2025, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Cloverworks Inc."], "producers": ["Abc Animation", "Aniplex", "Bs11"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Mystery", "Romance", "Slice of Life", "Supernatural", "Psychological", "Music"], "tags": ["Acting", "Age Gap", "Alternate Universe", "Based On A Light Novel", "Cgi", "College", "Comedy", "Contemporary Fantasy", "Drama", "Female Protagonist"], "local": "images/seishun-buta-yarou-wa-santa-claus-no-yume-wo-minai.jpg", "synopsis": "Sequel to the film Seishun Buta Yarou wa Randoseru Girl no Yume wo Minai . After encountering various girls going through Puberty Syndrome, Sakuta Azusagawa's high school days have come to a close, and he is now a university student. He enrolls at a university in Kanazawa-hakkei alongside his girlfriend Mai Sakurajima, a nationally famed actress. Off campus, he stumbles upon an out-of-season miniskirt Santa. Precognitive dreams, an anonymous online singer, poltergeists buzzing on social media... A mysterious tale with enigmatic phenomenons surrounding girls with wavering hearts starts again. Puberty continues... (Source: Crunchyroll)"}, {"title": "Skip to Loafer", "image": "https://cdn.myanimelist.net/images/anime/1518/138730.jpg", "score": 8.02, "episodes": 12, "year": 2023, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["P.A. Works Co., Ltd.", "P.A.Works"], "producers": ["A-Sketch", "Bs Asahi", "Crunchyroll"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Slapstick"], "tags": ["Acting", "Adoring Fan Club", "Angst", "Asia", "Autumn", "Based On A Manga", "Coastal", "Comedy", "Coming Of Age", "Coming-Of-Age"], "local": "images/skip-to-loafer.jpg", "synopsis": "This country girl is ready for the big city! Well, at least she thought she was. Mitsumi’s dream is to attend a prestigious school and make the world a better place. But when she finally gets to Tokyo, it turns out she isn’t exactly prepared for city life. Luckily, she runs into Shima, a sweet and handsome classmate who becomes her first friend! Can she make it in Tokyo with Shima by her side? (Source: Crunchyroll)"}, {"title": "Sword Art Online: Progressive Movie - Hoshi Naki Yoru no Aria", "image": "https://cdn.myanimelist.net/images/anime/1590/116274.jpg", "score": 8.02, "episodes": 1, "year": 2021, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["A-1 Pictures Inc."], "producers": ["Aniplex", "Bandai Namco Entertainment", "Egg Firm"], "duration_min": 97.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Romance", "Sci-Fi", "Slice of Life", "Isekai"], "tags": ["Action", "Adventure", "Anti-Hero", "Awards", "Based On A Light Novel", "Cannibalism", "Conspiracy", "Contemporary Fantasy", "Death Game", "Drama"], "local": "images/sword-art-online-progressive-movie-hoshi-naki-yoru-no-aria.jpg"}, {"title": "Tokyo Magnitude 8.0", "image": "https://cdn.myanimelist.net/images/anime/1653/152734.jpg", "score": 8.02, "episodes": 11, "year": 2009, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Bones Inc.", "Kinema Citrus Co., Ltd."], "producers": ["Aquatone", "Asmik Ace Entertainment, Inc.", "Bones"], "duration_min": 22.0, "genres": ["Adventure", "Drama", "Slice of Life", "Thriller"], "tags": ["Adventure", "Angst", "Apocalyptic Fiction", "Asia", "Award Winning", "Be Careful What You Wish For", "Cgi", "Child Protagonists", "Coming Of Age", "Daily Life"], "local": "images/tokyo-magnitude-8-0.jpg", "synopsis": "The premise of the project is the 70% possibility that a magnitude 7.0 earthquake will occur in Tokyo in the next 30 years. The anime depicts what would happen if an 8.0 earthquake took place. The story centers on Mirai, a middle school freshman girl who goes to Tokyo&rsquo;s artificial Odaiba Island for a robot exhibition with her brother Yuuki at the start of summer vacation. A powerful tremor emanates from an ocean trench, the famed Tokyo Tower and Rainbow Bridge crumble and fall, and the landscape of Tokyo changes in an instant. With the help of a motorcycle delivery woman named Mari who they meet on Odaiba, Mirai and Yuuki strive to head back to their Setagaya home in western Tokyo."}, {"title": "Vanitas no Karte Part 2", "image": "https://cdn.myanimelist.net/images/anime/1247/120579.jpg", "score": 8.02, "episodes": 12, "year": 2022, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Bones Inc."], "producers": ["Aniplex", "Bones", "Contents Seed"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Mystery", "Romance", "Supernatural", "Historical"], "tags": ["19Th Century", "Action", "Adventure", "Alternative Past", "Anti-Hero", "Assassins", "Based On A Manga", "Bishounen", "Butler", "Comedy"], "local": "images/vanitas-no-karte-part-2.jpg"}, {"title": "Yojouhan Time Machine Blues", "image": "https://cdn.myanimelist.net/images/anime/1583/126128.jpg", "score": 8.02, "episodes": 6, "year": 2022, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": ["Science Saru Inc."], "producers": ["Asmik Ace", "Dentsu", "Fuji Tv"], "duration_min": 20.0, "genres": ["Action", "Comedy", "Drama", "Mystery", "Romance", "Sci-Fi", "Slice of Life", "Thriller", "Psychological"], "tags": ["Action", "Adult Cast", "Asia", "Based On A Novel", "College", "Comedy", "Disney+ Original", "Drama", "Earth", "Ensemble Cast"], "local": "images/yojouhan-time-machine-blues.jpg", "synopsis": "Spin-off of Yojouhan Shinwa Taikei . It is August 12th. After the remote control to his boarding house's only air conditioning unit is inadvertently destroyed by spilled cola, \"I\" devises a plan to return to yesterday in a time machine to recover the remote before it breaks. However, his friend Ozu cannot resist playing with past events, even when it means bringing the universe to the brink of destruction. Now \"I\" finds himself racing through time to avoid disaster. (Source: Disney+) Note: Released in Japan as a standalone film on September 30, 2022 with the same content as episodes 1-5. The anime has an earlier episodic release on Disney+ starting September 14, 2022 and with an exclusive episode 6."}, {"title": "Yuru Camp△ Season 3", "image": "https://cdn.myanimelist.net/images/anime/1178/142710.jpg", "score": 8.02, "episodes": 12, "year": 2024, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["8 Bit", "8-Bit", "8Bit Corp, Inc."], "producers": ["8-Bit", "81 Produce", "At-X"], "duration_min": 23.0, "genres": ["Adventure", "Comedy", "Slice of Life"], "tags": ["Adventure", "Based On A Manga", "Camping", "Cgdct", "Cgi", "Club", "Comedy", "Cute Girls Doing Cute Things", "Cycling", "Educational"], "local": "images/yuru-camp-season-3.jpg", "synopsis": "Within the narrow walls of the Outdoor Activities Club room, the few but lively members carry on the camping spirit as they have fun with DIY club experiments. Exciting experiences such as these have brought Nadeshiko Kagamihara deep into the world of camping, making her want to once again go on a solo trip. However, other plans come first, as Ayano Toki and Rin Shima invite Nadeshiko to camp near Ooi River. Eager to go on their first journey together, the girls set off to forge precious memories that will stick with their hearts for years to come. (Source: MAL Rewrite)"}, {"title": "Azumanga Daiou The Animation", "image": "https://cdn.myanimelist.net/images/anime/1066/117358.jpg", "score": 8.01, "episodes": 26, "year": 2002, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["J.C.Staff Co., Ltd."], "producers": ["Adv Films", "Azumanga Daioh Production Committee", "Cosmic Ray"], "duration_min": 24.0, "genres": ["Comedy", "Slice of Life", "Slapstick"], "tags": ["4-Koma Manga", "Absurdist Humour", "Asia", "Based On A 4-Koma Manga", "Based On A Manga", "Cgdct", "Character Driven", "Comedy", "Coming Of Age", "Cute Girls Doing Cute Things"], "local": "images/cover_2328.jpg", "synopsis": "Ten year old child prodigy, Chiyo Mihama, is finding it tough fitting in at high school with the girls five years her elder: Osaka (dimwitted with a weird take on the world), Tomo (a powder keg that goes off at a moment’s notice), Kagura (the competitive athlete of the bunch), Yomi (the hothead), and Sakaki (timid and obsessed with a love of animals that isn’t reciprocated). Together with their teacher, they navigate the rough waters and fun times of high school. (Source: Sentai Filmworks)"}, {"title": "Bai Lian Cheng Shen 3", "image": "https://cdn.myanimelist.net/images/anime/1108/154109.jpg", "score": 8.01, "episodes": 26, "year": 2025, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": ["Qingxiang Culture"], "producers": ["Youku"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Fantasy", "Historical"], "tags": ["Action", "Adventure", "Based On A Web Novel", "Cg Animation", "Chinese Animation", "Chinese Production", "Fantasy", "Full Cgi", "Historical", "Martial Arts"], "local": "images/cover_2538.jpeg", "synopsis": "Third season of Bai Lian Cheng Shen ."}, {"title": "Ballroom e Youkoso", "image": "https://cdn.myanimelist.net/images/anime/5/86739.jpg", "score": 8.01, "episodes": 24, "year": 2017, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["Animatic", "Bandai Namco Games", "Dentsu"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Sports", "Slapstick"], "tags": ["3D Cg Animation", "Asia", "Based On A Manga", "Bullying", "Cgi", "Comedy", "Coming Of Age", "Competition", "Dance", "Dancing"], "local": "images/cover_2749.jpg", "synopsis": "Fujita has drifted through middle school aimlessly, unable to find friends or anything that can hold his attention. Then, one day, he's attacked by a gang and saved by a mysterious man. But this isn't a karate master; it's a ballroom dance instructor! Reluctantly, Fujita takes a few beginner's classes, only to find his inspiration... an entrancing, teenage dance prodigy named Shizuku. It's Fujita's first step into the high-octane world of competitive dance! (Source: Kodansha USA)"}, {"title": "Bleach", "image": "https://cdn.myanimelist.net/images/anime/1541/147774.jpg", "score": 8.01, "episodes": 366, "year": 2004, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Pierrot Co., Ltd."], "producers": ["Aniplex", "Dentsu Inc.", "Shueisha"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Supernatural", "Slapstick"], "tags": ["Achronological Order", "Action", "Adapted Into Japanese Movie", "Adapted Into Other Media", "Adventure", "Afterlife", "Age Regression", "Amnesia", "Animal Abuse", "Anthropomorphism"], "local": "images/cover_3566.jpg", "synopsis": "Ichigo Kurosaki is a rather normal high school student apart from the fact he has the ability to see ghosts. This ability never impacted his life in a major way until the day he encounters the Shinigami Kuchiki Rukia, who saves him and his family's lives from a Hollow, a corrupt spirit that devours nrolling in an agriculture school. He thinks, with his talent in studying, no problems will arise no matter what kind of school he attends. He is proven wrong very quickly. Raised as a city boy, he is forced to uncover the inconvenient truth about agricultural life. Enjoy the story of Hachiken, as he tries to keep up with his new friends, farmers' heirs, who are already accustomed to the harsh world of farming. With no clear goals or understanding of farming life, how will Hachiken survive this new, cruel reality? The story of a sweat, tear, and mud-stained youth begins!"}, {"title": "Kidou Senshi Gundam: Senkou no Hathaway - Circe no Majo", "image": "https://cdn.myanimelist.net/images/anime/1983/154129.jpg", "score": 8.01, "episodes": 1, "year": 2026, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Sunrise Inc."], "producers": ["Bandai Namco Filmworks"], "duration_min": 108.0, "genres": ["Action", "Drama", "Sci-Fi", "Mecha"], "tags": ["Action", "Action Drama", "Class Struggle", "Drama", "Love Triangle", "Male Protagonist", "Mecha", "Military", "Outer Space", "Politics"], "local": "images/kidou-senshi-gundam-senkou-no-hathaway-circe-no-majo.jpg", "synopsis": "Second movie in the Hathaway trilogy celebrating the Gundam franchise's 40th anniversary, and the second project in the \"UC NexT 0100 Project\" that will tackle the future of the UC timeline. Haunted by past trauma, Hathaway is drawn to the mysterious girl Gigi Andalucia, whose strange powers stir memories within him. While swayed by her cryptic words, he continues preparing for Mafty’s mission — the attack on the Adelaide Conference. Meanwhile, Kenneth Sleg of the Federation Forces prepares a defense operation for the Adelaide Conference and a plan to eliminate Mafty, when he is approached by Handley Yoxon of the Criminal Police Organization with a secret proposal. As Hathaway and Kenneth pursue their respective goals, Gigi also sets off for Hong Kong to fulfill her own role. (Source: "status": "FINISHED", "studios": ["Aic", "Gonzo"], "producers": [], "duration_min": 30.0, "genres": ["Comedy", "Romance"], "tags": ["Comedy", "Harem", "Mermaid", "Romance", "School"], "local": "images/seto-no-hanayome.jpg", "synopsis": "Michishio Nagasumi's life couldn't be any more normal. In an odd twist of events, during his summer vacation he ends up almost drowning in the sea. Luckily, the cute mermaid Seto San appears to save him. However, San is from a yakuza mermaid family and according to their law, if a human is to catch sight of a mermaid, either he or the mermaid must die. The only other way is for Nagasumi to be taken in as a family member, marrying San. In attempts to save both of their lives, Nagasumi asks for San's hand in marriage. Nagasumi's summer vacation reaped more then what he would expect, as he must now protect San from others finding her secret out."}, {"title": "Shadows House 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1634/124231.jpg", "score": 8.01, "episodes": 12, "year": 2022, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Cloverworks Inc."], "producers": ["Aniplex", "Bs Asahi", "Shueisha"], "duration_min": 23.0, "genres": ["Drama", "Fantasy", "Horror", "Mystery", "Slice of Life", "Supernatural"], "tags": ["Amnesia", "Based On A Manga", "Brainwashing", "Butler", "Character Driven", "Conspiracy", "Cosmic Horror", "Cult", "Dialogue Driven", "Drama"], "local": "images/shadows-house-2nd-season.jpg", "synopsis": "After finishing their \"debut,\" Kate, Emilico and three other pairs who started with them begin a new life as adults. With the mystery of the \"Shadows House\" still unsolved, a new incident occurs in the children's wing. Kate and Emilico, whom the Star Bearers suspect of being malcontents, investigate a mysterious robed Shadow who may be the culprit. (Source: Anime News Network)"}, {"title": "Youkoso Jitsuryoku Shijou Shugi no Kyoushitsu e 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1010/124180.jpg", "score": 8.01, "episodes": 13, "year": 2022, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Lerche"], "producers": ["At-X", "Bandai Namco Music Live", "Crunchyroll"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Mystery", "Slice of Life", "Thriller", "Psychological"], "tags": ["Absurdly Powerful Student Council", "Almighty Hero", "Angst", "Anti-Hero", "Asexual", "Asia", "Athletics", "Based On A Light Novel", "Battle Of Wits", "Battle Royale"], "local": "images/youkoso-jitsuryoku-shijou-shugi-no-kyoushitsu-e-2nd-season.jpg", "synopsis": "The second season of Youkoso Jitsuryoku Shijou Shugi no Kyoushitsu e . Tokyo Metropolitan Advanced Nurturing High School seems like a paradise, but in reality, it is an extreme meritocracy. In the class of underachievers, Kiyotaka has begun working with Suzune, who seeks to ascend higher. After a survival test on an uninhabited island, they get to enjoy a luxury liner, but a new class-scrambling test will begin. (Source: Anime News Network)"}, {"title": "Zankyou no Terror", "image": "https://cdn.myanimelist.net/images/anime/1417/117422.jpg", "score": 8.01, "episodes": 11, "year": 2014, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Mappa Co., Ltd."], "producers": ["Aniplex", "Dentsu Inc.", "Fuji Television Network"], "duration_min": 22.0, "genres": ["Action", "Drama", "Mystery", "Slice of Life", "Thriller", "Psychological"], "tags": ["Action", "Anti-Hero", "Antihero", "Asia", "Battle Of Wits", "Coming Of Age", "Conspiracy", "Cops", "Crime", "Crime Fiction"], "local": "images/zankyou-no-terror.jpg", "synopsis": "Painted in red, the word \"VON\" is all that is left behind after a terrorist attack on a nuclear facility in Japan. The government is shattered by their inability to act, and the police are left frantically searching for ways to crack down the perpetrators. The public are clueless—until, six months later, a strange video makes its way onto the internet. In it, two teenage boys who identify themselves only as \"Sphinx\" directly challenge the police, threatening to cause destruction and mayhem across Tokyo. Unable to stop the mass panic quickly spreading through the city and desperate for any leads in their investigation, the police struggle to act effectively against these terrorists, with Detective Kenjirou Shibazaki caught in the middle of it all. Zankyou no Terror tells the story of Nine and Twelve, the two boys behind the masked figures of Sphinx. They should not exist, yet they stand strong in a world of deception and secrets while they make the city fall around them, all in the hopes of burying their own tragic truth. (Source: MAL Rewrite)"}, {"title": "The Demon Hunter 3", "image": "https://cdn.anime-planet.com/anime/primary/the-demon-hunter-3-1.webp", "score": 8.0, "episodes": 14, "year": 2026, "season": "UNDEFINED", "type": "ONA", "status": "UNKNOWN", "studios": ["Shenman Entertainment"], "producers": [], "duration_min": null, "genres": ["Action", "Fantasy"], "tags": ["Action", "Based On A Web Novel", "Cg Animation", "Chinese Animation", "Fantasy"], "local": "images/the-demon-hunter-3.webp", "synopsis": "The third season of Cang Yuan Tu ."}, {"title": "Full Metal Panic! The Second Raid", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A6256-5.jpg", "score": 8.0, "episodes": 1, "year": 2006, "season": "SPRING", "type": "OVA", "status": "FINISHED", "studios": ["Kyoto Animation"], "producers": ["Full Metal Panic! Film Partners", "Happinet Pictures", "Kadokawa Entertainment"], "duration_min": 30.0, "genres": ["Comedy", "Drama", "Romance"], "tags": ["Comedy", "Drama", "Military", "Romance"], "local": "images/cover_9633.jpg", "synopsis": "This series is set about two months after the events ocurred in the Tuatha de Danaan at the end of the original series. Mithril becomes aware of a secret organization that has technology able to counter the ECS (Electronic Cloaking System) mod const PAGE_SIZE = 60;

const grid = document.getElementById('grid');
const status = document.getElementById('status');
const sectionLabel = document.getElementById('sectionLabel');
const sectionSub = document.getElementById('sectionSub');
const resultCount = document.getElementById('resultCount');
const loadMoreWrap = document.getElementById('loadMoreWrap');
const loadMoreBtn = document.getElementById('loadMoreBtn');

let currentGenre = '';
let currentList = ANIME_DATA;
let shownCount = 0;

function placeholderCover(title) {
  const initials = title.split(' ').filter(w => w.length && /[A-Za-z0-9]/.test(w[0])).slice(0,2).map(w => w[0].toUpperCase()).join('');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#143d2b"/><stop offset="100%" stop-color="#04140f"/>
    </linearGradient></defs>
    <rect width="300" height="450" fill="url(#g)"/>
    <rect x="1" y="1" width="298" height="448" fill="none" stroke="#8a7226" stroke-width="1"/>
    <text x="150" y="235" font-family="Georgia, serif" font-size="72" fill="#d4af37" text-anchor="middle" opacity="0.85">${initials}</text>
  </svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

function attachImgFallback(img, anime) {
  img.addEventListener('error', function onErr() {
    img.removeEventListener('error', onErr);
    if (img.dataset.stage !== 'external' && anime.image) {
      img.dataset.stage = 'external';
      img.setAttribute('referrerpolicy', 'no-referrer');
      img.addEventListener('error', function onErr2() {
        img.removeEventListener('error', onErr2);
        img.src = placeholderCover(anime.title);
      });
      img.src = anime.image;
    } else {
      img.src = placeholderCover(anime.title);
    }
  });
}

function primarySrc(anime) {
  return anime.local || anime.image || '';
}

function appendCards(list) {
  const frag = document.createDocumentFragment();
  list.forEach(anime => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-img-wrap">
        <img src="${primarySrc(anime)}" alt="${anime.title}" loading="lazy"${anime.local ? '' : ' referrerpolicy="no-referrer"'}>
        <div class="type-badge">${anime.type}</div>
        ${anime.score ? `<div class="score-badge">★ ${anime.score.toFixed(1)}</div>` : ''}
      </div>
      <div class="card-body">
        <div class="card-title">${anime.title}</div>
        <div class="card-meta">${anime.year || ''}${anime.episodes ? ' · ' + anime.episodes + ' ep' : ''}</div>
      </div>
    `;
    const imgEl = card.querySelector('img');
    if (anime.local) imgEl.dataset.stage = 'local';
    attachImgFallback(imgEl, anime);
    card.addEventListener('click', () => openModal(anime));
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

function renderFirstPage(list) {
  grid.innerHTML = '';
  shownCount = 0;
  resultCount.textContent = list.length ? `${list.length} title${list.length === 1 ? '' : 's'}` : '';
  if (!list.length) {
    status.innerHTML = '<div class="empty">No titles found. Try a different search or filter.</div>';
    loadMoreWrap.style.display = 'none';
    return;
  }
  status.innerHTML = '';
  const slice = list.slice(0, PAGE_SIZE);
  appendCards(slice);
  shownCount = slice.length;
  loadMoreWrap.style.display = shownCount < list.length ? 'block' : 'none';
}

loadMoreBtn.addEventListener('click', () => {
  const nextSlice = currentList.slice(shownCount, shownCount + PAGE_SIZE);
  appendCards(nextSlice);
  shownCount += nextSlice.length;
  loadMoreWrap.style.display = shownCount < currentList.length ? 'block' : 'none';
});

function openModal(anime) {
  const extraTags = (anime.tags || []).filter(t => !(anime.genres||[]).some(g => g.toLowerCase() === t.toLowerCase()));
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-hero">
      <img id="modalImg" src="${primarySrc(anime)}" alt="${anime.title}"${anime.local ? '' : ' referrerpolicy="no-referrer"'}>
      <div class="modal-info">
        <h2>${anime.title}</h2>
        <div class="modal-type">${anime.type}${anime.status ? ' · ' + anime.status.replace(/_/g,' ') : ''}</div>
        <div class="modal-tags">
          ${(anime.genres || []).map(g => `<span>${g}</span>`).join('')}
        </div>
        <div class="modal-stats">
          ${anime.score ? `<div><b>${anime.score.toFixed(1)}</b>/10 rating</div>` : ''}
          ${anime.episodes ? `<div><b>${anime.episodes}</b> episodes</div>` : ''}
          ${anime.duration_min ? `<div><b>${anime.duration_min}</b> min/ep</div>` : ''}
          ${anime.year ? `<div><b>${anime.season ? anime.season.charAt(0) + anime.season.slice(1).toLowerCase() + ' ' : ''}${anime.year}</b></div>` : ''}
        </div>
      </div>
    </div>
    ${anime.synopsis ? `
    <div class="modal-section">
      <h3>Synopsis</h3>
      <p style="font-family:'Arial',sans-serif;font-size:13.5px;line-height:1.7;color:var(--ivory);">${anime.synopsis}</p>
      <div style="font-family:'Arial',sans-serif;font-size:10.5px;color:var(--text-dim);margin-top:8px;letter-spacing:0.5px;">Synopsis via AniList</div>
    </div>` : ''}
    <div class="modal-section">
      <h3>Production</h3>
      <dl class="modal-facts">
        <div><dt>Studio</dt><dd>${anime.studios && anime.studios.length ? anime.studios.join(', ') : '—'}</dd></div>
        <div><dt>Producer</dt><dd>${anime.producers && anime.producers.length ? anime.producers.join(', ') : '—'}</dd></div>
        <div><dt>Status</dt><dd>${anime.status ? anime.status.replace(/_/g,' ').toLowerCase().replace(/^./, c => c.toUpperCase()) : '—'}</dd></div>
        <div><dt>Format</dt><dd>${anime.type}</dd></div>
      </dl>
    </div>
    ${extraTags.length ? `
    <div class="modal-section">
      <h3>Tags</h3>
      <div class="modal-tags">
        ${extraTags.slice(0,10).map(t => `<span class="outline">${t}</span>`).join('')}
      </div>
    </div>` : ''}
    <div class="modal-note">Episode streaming and manga chapters aren't available here — that content is licensed and not something this catalog hosts. Everything the database has on this title is shown above.</div>
  `;
  const modalImgEl = document.getElementById('modalImg');
  if (anime.local) modalImgEl.dataset.stage = 'local';
  attachImgFallback(modalImgEl, anime);
  document.getElementById('overlay').classList.add('open');
}

document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('open');
});
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') e.target.classList.remove('open');
});

function applyGenre(genre) {
  currentGenre = genre;
  sectionLabel.textContent = genre ? genre : 'Highest Rated';
  sectionSub.textContent = '— from the Kōgane catalog';
  currentList = genre ? ANIME_DATA.filter(a => a.genres.includes(genre)) : ANIME_DATA;
  renderFirstPage(currentList);
}

function doSearch(term) {
  if (!term.trim()) { applyGenre(currentGenre); return; }
  const q = term.toLowerCase();
  sectionLabel.textContent = `Results for "${term}"`;
  sectionSub.textContent = '';
  currentList = ANIME_DATA.filter(a => a.title.toLowerCase().includes(q));
  renderFirstPage(currentList);
}

document.getElementById('searchBtn').addEventListener('click', () => {
  doSearch(document.getElementById('searchInput').value);
});
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doSearch(e.target.value);
});
document.getElementById('searchInput').addEventListener('input', (e) => {
  if (!e.target.value.trim()) applyGenre(currentGenre);
});

document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    document.getElementById('searchInput').value = '';
    applyGenre(chip.dataset.genre);
  });
});

applyGenre('');
</script>

</body>
</html>
