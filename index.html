ots and Ichikawa maturing both physically and emotionally as he tackles his affections for Yamada. However, spending time together outside of school allows for their relationship to deepen, and it becomes increasingly difficult to deny their budding romantic feelings. Grappling with these unexpected and new emotions, Ichikawa and Yamada realize that, with the passage of time, their relationship is bound to change—and they must ultimately decide whether they wish to remain close friends or finally become a couple. (Source: MAL Rewrite)"}, {"title": "Gintama Movie 3: Yoshiwara Daienjou", "image": "https://cdn.myanimelist.net/images/anime/1599/154487.jpg", "score": 8.63, "episodes": 1, "year": 2026, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Bandai Namco Pictures Inc.", "Bn Pictures"], "producers": ["Warner Bros. Japan", "Warner Bros. Pictures"], "duration_min": 124.0, "genres": ["Action", "Adventure", "Comedy", "Fantasy", "Sci-Fi", "Historical"], "tags": ["Action", "Adventure", "Aliens", "Comedy", "Fantasy", "Gag Humor", "Gender Bending", "Gore", "Historical", "Japanese Production"], "local": "images/gintama-movie-3-yoshiwara-daienjou.jpg"}, {"title": "Star Blazers 2199", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A13776-2978217008.1365421574.jpg", "score": 8.62, "episodes": 26, "year": 2012, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Aic", "Xebec"], "producers": ["Bandai Co., Ltd.", "Bandai Namco Games", "Bandai Visual"], "duration_min": 24.0, "genres": ["Adventure", "Drama", "Romance", "Sci-Fi"], "tags": ["Adventure", "Battleships", "Conspiracy", "Drama", "Military", "Romance", "Science Fiction", "Space", "Space Navy", "Space Opera"], "local": "images/star-blazers-2199.png", "synopsis": "The year is 2199. The human race has been crushed in their war with the Gamilos, driven into underground cities by the invader's assault. Scientists estimate they have only a year left. The young officers Susumu Kodai and Daisuke Shima receive a mysterious capsule from a ship that made an emergency landing on Mars and return with it to Earth. It contains humanity's last hope: the planet Iscandar on the other side of the Magellan Galaxy has the technology to defeat the Gamilos and restore the planet. The space battleship Yamato is entrusted with this task, but they have only one year before humanity ends. (Source: Anime News Network)"}, {"title": "Frieren: Beyond Journey's End", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A33628-1588041525.1770168616.jpg", "score": 8.61, "episodes": null, "year": 2026, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Madhouse"], "producers": [], "duration_min": 23.0, "genres": ["Adventure", "Comedy", "Drama", "Fantasy", "Psychological"], "tags": ["Adventure", "Aristocracy", "Comedy", "Conspiracy", "Contemplation", "Demi-Humans", "Demons", "Dragons", "Drama", "Dwarves"], "local": "images/frieren-beyond-journeys-end.png", "synopsis": "Chibi shorts posted on the official YouTube account of TOHO animation and Twitter account of the main series. Note: Includes \"Tokubetsu-hen:「Shokutaku o Shiawase ni Suru Mahou」/ Mizkan Ajipon Collaboration\""}, {"title": "Gintama. Shirogane no Tamashii-hen", "image": "https://cdn.myanimelist.net/images/anime/12/89603.jpg", "score": 8.61, "episodes": 12, "year": 2018, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Bandai Namco Pictures Inc.", "Bn Pictures"], "producers": ["Aniplex", "Dentsu", "Shueisha"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Sci-Fi", "Slapstick", "Historical"], "tags": ["Action", "Adventure", "Aliens", "Anachronism", "Based On A Manga", "Comedy", "Cosplay", "Crude", "Dissociative Identities", "Drama"], "local": "images/gintama-shirogane-no-tamashii-hen.jpg", "synopsis": "Utsuro's ultimate plan is revealed: spark a universal war that will ultimately lead to the destruction of Earth, allowing him to finally die but taking the universe down with him. Gintoki and others must team up with old allies and former enemies to not only defeat him but also the victims of the immortal's plans, a gathering army of vengeful Amanto who may no longer listen to reason."}, {"title": "Mononoke Hime", "image": "https://cdn.myanimelist.net/images/anime/1355/147277.jpg", "score": 8.61, "episodes": 1, "year": 1997, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Studio Ghibli Inc."], "producers": ["Dentsu Inc.", "Gkids", "Nippon Television Network Corporation"], "duration_min": 133.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Romance", "Historical"], "tags": ["Action", "Adventure", "Against Destiny", "Angst", "Animals", "Animism", "Anthropomorphism", "Anthropomorphs", "Anti-War", "Archery"], "local": "images/mononoke-hime.jpg", "synopsis": "A calm village residing in the mountains comes under attack from a demon-possessed boar one day. Ashitaka, a young man and prince of the tribe, engages the creature in an attempt to save his village. During the battle, the boar bites him on the arm, leaving it blackened and cursed. Following his village's traditions, Ashitaka is exiled and becomes a wanderer, looking for a solution to the curse before it engulfs him. Iron Town is a fortress under the leadership of Lady Eboshi. Through the clearing of the surrounding forests, Iron Town produces large amounts of Ironsand, used for gunpowder and other machinery. However, because of the forests destruction, nearby animal clans seek revenge led by a human girl of the Wolf clan called San. When Ashitaka comes to Iron Town, he discovers the area consumed in battle. Horrified, he attempts to create peace and befriend the Wolf Clan. However, after the forest's eradication and the ongoing war between Human and Beast, will the Spirit of the Forest be forgiving and accept Ashitaka's request to expel his curse? [Written by MAL Rewrite]"}, {"title": "Vinland Saga", "image": "https://cdn.myanimelist.net/images/anime/1500/103005.jpg", "score": 8.61, "episodes": 24, "year": 2019, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Wit Studio, Inc."], "producers": ["Dentsu Inc.", "Kodansha", "Mad Box"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Drama", "Historical"], "tags": ["11Th Century", "Achronological Order", "Action", "Adventure", "Alternative Past", "Anti-Hero", "Archery", "Based On A Manga", "Canon Filler", "Cgi"], "local": "images/vinland-saga.jpg", "synopsis": "Thorfinn is son to one of the Vikings' greatest warriors, but when his father is killed in battle by the mercenary leader Askeladd, he swears to have his revenge. Thorfinn joins Askeladd's band in order to challenge him to a duel, and ends up caught in the middle of a war for the crown of England. (Source: Kodansha USA)"}, {"title": "Vinland Saga Season 2", "image": "https://cdn.myanimelist.net/images/anime/1170/124312.jpg", "score": 8.61, "episodes": 24, "year": 2023, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Mappa Co., Ltd."], "producers": ["Dentsu", "Kodansha", "Twin Engine"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Drama", "Historical"], "tags": ["11Th Century", "Action", "Adventure", "Agriculture", "Anti-War", "Based On A Manga", "Class Struggle", "Coming Of Age", "Countryside", "Court Politics"], "local": "images/vinland-saga-season-2.jpg", "synopsis": "The second season of Vinland Saga . After his father's death and the destruction of his village at the hands of English raiders, Einar wishes for a peaceful life with his family on their newly rebuilt farms. However, fate has other plans: his village is invaded once again. Einar watches helplessly as the marauding Danes burn his lands and slaughter his family. The invaders capture Einar and take him back to Denmark as a slave. Einar clings to his mother's final words to survive. He is purchased by Ketil, a kind slave owner and landlord who promises that Einar can regain his freedom in return for working in the fields. Soon, Einar encounters his new partner in farm cultivation—Thorfinn, a dejected and melancholic slave. As Einar and Thorfinn work together toward their freedom, they are haunted by both sins of the past and the ploys of the present. Yet they carry on, grasping for a glimmer of hope, redemption, and peace in a world that is nothing but unjust and unforgiving. (Source: MAL Rewrite)"}, {"title": "Ginga Eiyuu Densetsu", "image": "https://cdn.myanimelist.net/images/anime/1976/142016.jpg", "score": 8.6, "episodes": 110, "year": 1988, "season": "WINTER", "type": "OVA", "status": "FINISHED", "studios": ["Artland", "K-Factory", "Kitty Film Mitaka Studio"], "producers": ["Kitty Films", "Madhouse", "Sentai Filmworks"], "duration_min": 26.0, "genres": ["Action", "Drama", "Sci-Fi", "Thriller"], "tags": ["Action", "Action Drama", "Adult Cast", "Alcohol", "Based On A Novel", "Battle Of Wits", "Board Games", "Chess", "Coming Of Age", "Conspiracy"], "local": "images/ginga-eiyuu-densetsu.jpg", "synopsis": "For decades, the Galactic Empire has been locked in an interstellar war with the Free Planets Alliance, a conflict that involves thousands of spaceships and millions of soldiers on both sides. Two new commanders enter the conflict with great hopes: Imperial Admiral Reinhard von Lohengramm and the FPA's Yang Wen-Li. As they deal with superiors and subordinates, maneuver through complicated political arrangements, plot strategies, and win battles, each will be tested, and ultimately, changed, by the reality of war. (Source: Anime News Network)"}, {"title": "Great Teacher Onizuka", "image": "https://cdn.myanimelist.net/images/anime/13/11460.jpg", "score": 8.6, "episodes": 43, "year": 1999, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Pierrot Co., Ltd."], "producers": ["Aniplex", "Discotek Media", "Fuji Television Network"], "duration_min": 25.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Slapstick"], "tags": ["Acting", "Adapted Into Japanese Movie", "Adapted Into Jdrama", "Adapted Into Other Media", "Age Gap", "Agriculture", "Asia", "Astronomy", "Based On A Manga", "Bullying"], "local": "images/great-teacher-onizuka.jpg", "synopsis": "Onizuka is a reformed biker gang leader who has his sights set on an honorable new ambition: to become the world's greatest teacher... for the purpose of meeting sexy high school girls. Okay, so he's mostly reformed. However, strict administrators and a class of ruthless delinquents stand between Onizuka and his goal and they will use any means, however illegal or low, to drive the new teacher away. Perfect, because Onizuka's methods won't be found in any teaching manual; he cares about the difference between legal and illegal activities about as much as he cares for the age difference between himself and a high school girl. So get ready for math that doesn't add up, language you'd be slapped for using, and biology that would make a grown man blush... unless of course, you're the Great Teacher Onizuka. Note: Episode 1 has an airtime of 48 minutes."}, {"title": "Haikyuu!! Second Season", "image": "https://cdn.myanimelist.net/images/anime/9/76662.jpg", "score": 8.6, "episodes": 25, "year": 2015, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Production I.G., Inc."], "producers": ["Dentsu", "Haikyu!! Second Season Production Committee", "Mainichi Broadcasting System"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Sports", "Slapstick"], "tags": ["Asia", "Autumn", "Based On A Manga", "Club", "Comedy", "Coming Of Age", "Competition", "Drama", "Earth", "Ensemble Cast"], "local": "images/haikyuu-second-season.jpg"}, {"title": "Kikansha no Mahou wa Tokubetsu desu 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1137/158402.jpg", "score": 8.6, "episodes": 12, "year": 2026, "season": "FALL", "type": "TV", "status": "UPCOMING", "studios": ["Arvo Animation Inc."], "producers": ["Aniplex", "Hayate"], "duration_min": null, "genres": ["Action", "Adventure", "Fantasy", "Romance"], "tags": ["Action", "Adventure", "Age Transformation", "Alternative World", "Based On A Webtoon", "Crunchyroll Co-Production", "Demon", "Fantasy", "Harem", "Japanese Production"], "local": "images/kikansha-no-mahou-wa-tokubetsu-desu-2nd-season.jpg", "synopsis": "The second season of Kikansha no Mahou wa Tokubetsu desu ."}, {"title": "Mob Psycho 100 II", "image": "https://cdn.myanimelist.net/images/anime/1918/96303.jpg", "score": 8.6, "episodes": 13, "year": 2019, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Bones Inc."], "producers": ["Bones", "Bs Fuji", "Hakuhodo Dy Music & Pictures"], "duration_min": 24.0, "genres": ["Action", "Comedy", "Drama", "Slice of Life", "Supernatural", "Psychological", "Slapstick"], "tags": ["Action", "Action Comedy", "Athletics", "Based On A Manga", "Body Horror", "Bullying", "Comedy", "Coming Of Age", "Coming-Of-Age", "Conspiracy"], "local": "images/mob-psycho-100-ii.jpg", "synopsis": "The second season of Mob Psycho 100 . Kageyama is an ordinary 8th grader who just wants to live a normal life. Although he can disappear in the crowd in a flash, he was actually the most powerful psychic. The lives of those around Mob and his numerous feelings that softly piles up for the eventual explosion. The mysterious group \"Claw\" stands before him once again. In the midst of his youthful days, where will his roaring heart take him!? (Source: Crunchyroll)"}, {"title": "Mushishi Zoku Shou 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/9/68095.jpg", "score": 8.6, "episodes": 10, "year": 2014, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Animation Studio Artland Inc.", "Artland"], "producers": ["Aniplex Of America", "Artland", "Delfi Sound"], "duration_min": 23.0, "genres": ["Adventure", "Drama", "Fantasy", "Horror", "Mystery", "Slice of Life", "Supernatural", "Psychological", "Historical"], "tags": ["Adult Cast", "Adventure", "Agriculture", "Alternative Past", "Angst", "Asia", "Based On A Manga", "Coming Of Age", "Contemporary Fantasy", "Countryside"], "local": "images/mushishi-zoku-shou-2nd-season.jpg", "synopsis": "Second season of Mushishi Zoku Shou. Ghostly, primordial beings known as Mushi continue to cause mysterious changes in the lives of humans. The travelling Mushishi, Ginko, persists in trying to set right the strange and unsettling situations he encounters. Time loops, living shadows, and telepathy are among the overt effects of interference from Mushi, but more subtle symptoms that take years to be noticed also rouse Ginko's concern as he passes from village to village."}, {"title": "Cowboy Bebop", "image": "https://cdn.myanimelist.net/images/anime/4/19644.jpg", "score": 8.59, "episodes": 26, "year": 1998, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Sunrise Inc."], "producers": ["Audio Planning U", "Bandai Entertainment", "Bandai Visual"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Sci-Fi", "Slapstick"], "tags": ["Action", "Adult Cast", "Adventure", "Air Combat", "Amnesia", "Angst", "Anti-Hero", "Antihero", "Award Winning", "Bounty Hunter"], "local": "images/cover_6032.jpg", "synopsis": "Enter a world in the distant future, where Bounty Hunters roam the solar system. Spike and Jet, bounty hunting partners, set out on journeys in an ever struggling effort to win bounty rewards to survive. While traveling, they meet up with other very interesting people. Could Faye, the beautiful and ridiculously poor gambler, Edward, the computer genius, and Ein, the engineered dog be a good addition to the group?"}, {"title": "Hajime no Ippo: New Challenger", "image": "https://cdn.myanimelist.net/images/anime/8/56617.jpg", "score": 8.59, "episodes": 26, "year": 2009, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Madhouse Inc."], "producers": ["D.N. Dream Partners", "Kodansha", "Madhouse"], "duration_min": 23.0, "genres": ["Action", "Comedy", "Drama", "Sports", "Slapstick"], "tags": ["Action", "Asia", "Based On A Manga", "Boxing", "Combat", "Combat Sport", "Combat Sports", "Comedy", "Coming Of Age", "Competition"], "local": "images/hajime-no-ippo-new-challenger.jpg", "synopsis": "Ippo Makunouchi continues his boxing career and his goal on knowing the meaning of being strong, and the desire on fighting his idol Ichiro Miyata once again. Along him are pro boxers Takamura, Aoki and Kimura that each one of them aspire to their own dreams. (Source: Anime News Network)"}, {"title": "Kimetsu no Yaiba Movie 1: Mugenjou-hen - Akaza Sairai", "image": "https://cdn.myanimelist.net/images/anime/1681/148216.jpg", "score": 8.59, "episodes": 1, "year": 2025, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Ufotable, Inc."], "producers": ["Aniplex", "Shueisha", "Ufotable"], "duration_min": 155.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Horror", "Supernatural", "Thriller", "Historical"], "tags": ["Action", "Action Drama", "Adventure", "Afterlife", "Amnesia", "Amputation", "Award Winning", "Based On A Manga", "Body Horror", "Cgi"], "local": "images/kimetsu-no-yaiba-movie-1-mugenjou-hen-akaza-sairai.jpg", "synopsis": "Part 1 of the theatrical trilogy adaptation of the Infinity Castle Arc. Tanjiro Kamado – a boy who joined an organization dedicated to hunting down demons called the Demon Slayer Corps after his younger sister Nezuko was turned into a demon. While growing stronger and deepening his friendships and bonds with fellow corps members, Tanjiro has battled many demons with his comrades – Zenitsu Agatsuma and Inosuke Hashibira. Along the way, his journey has led him to fight alongside the Demon Slayer Corps’ highest-ranking swordsmen, the Hashira, including Flame Hashira Kyojuro Rengoku aboard the Mugen Train, Sound Hashira Tengen Uzui within the Entertainment District, as well as Mist Hashira Muichiro Tokito and Love Hashira Mitsuri Kanroji at the Swordsmith Village. As the Demon Slayer Corps members and Hashira engaged in a group strength training program, the Hashira Training, in preparation for the forthcoming battle against the demons, Muzan Kibutsuji appears at the Ubuyashiki Mansion. With the head of the Demon Corps in danger, Tanjiro and the Hashira rush to the headquarters but are plunged into a deep descent to a mysterious space by the hands of Muzan Kibutsuji. The destination of where Tanjiro and Demon Slayer Corps have fallen is the demons’ stronghold – the Infinity Castle. And so, the battleground is set as the final battle between the Demon Slayer Corps and the demons ignites. (Source: Crunchyroll)"}, {"title": "Kizumonogatari III: Reiketsu-hen", "image": "https://cdn.myanimelist.net/images/anime/1084/112813.jpg", "score": 8.59, "episodes": 1, "year": 2017, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Shaft"], "producers": ["Aniplex", "Kodansha", "Shaft"], "duration_min": 82.0, "genres": ["Action", "Drama", "Fantasy", "Mystery", "Romance", "Supernatural", "Psychological", "Slapstick"], "tags": ["Action", "Age Regression", "Anti-Hero", "Based On A Light Novel", "Body Horror", "Cgi", "Drama", "Ecchi", "Fanservice", "Fantasy"], "local": "images/kizumonogatari-iii-reiketsu-hen.jpg", "synopsis": "First season of the Monogatari Series, part 4/6. Contains the arc Koyomi Vamp from the Kizumonogatari light novel. With help from Meme Oshino, the apparition specialist, Koyomi defeats the three powerful vampire hunters: Dramaturgy, Episode and Guillotinecutter. Koyomi takes back all the limbs of Kiss-Shot Acerola-Orion Heart-Under-Blade in order to become a human again. But, when he returns to Kiss-Shot, she reveals to him the cold truth of what it means to be a vampire—a creature of the night. Unable to take back what he has done, Koyomi feels nothing but regret and can only deny his dreadful fate. While Koyomi is struggling to face reality, his “friend” Tsubasa Hanekawa comes to him with a certain plan… (Source: Aniplex)"}, {"title": "Suzumiya Haruhi no Shoushitsu", "image": "https://cdn.myanimelist.net/images/anime/1248/112352.jpg", "score": 8.59, "episodes": 1, "year": 2010, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Kyoto Animation Co., Ltd."], "producers": ["Animation Do", "Bandai Entertainment", "Funimation"], "duration_min": 161.0, "genres": ["Comedy", "Drama", "Mystery", "Romance", "Sci-Fi", "Supernatural", "Psychological", "Slapstick"], "tags": ["Alien", "Aliens", "Alternate Reality", "Alternate Universe", "Alternating Animation Style", "Alternative Present", "Angst", "Asia", "Award Winning", "Based On A Light Novel"], "local": "images/suzumiya-haruhi-no-shoushitsu.jpg", "synopsis": "It is mid-December, and SOS Brigade chief Haruhi Suzumiya announces that the Brigade is going to hold a Christmas party in their clubroom, with Japanese hotpot for dinner. The brigade members Kyon, Yuki Nagato, Mikuru Asahina and Itsuki Koizumi start preparing everything for the party, such as costumes and decorations. But a couple of days later, Kyon arrives at school only to find that Haruhi is missing. Not only that, but Mikuru claims she has never known Kyon before, Koizumi is also missing, and Yuki has become the sole member of the literature club. The SOS Brigade seems to have never existed, nor has Haruhi Suzumiya. No one in the school has ever heard about her... except for Kyon. (Source: Anime News Network)"}, {"title": "Gravity Falls Season 2", "image": "https://media.kitsu.app/anime/47506/poster_image/small-985cdc861e73e465038d6e6f4a277d10.jpeg", "score": 8.58, "episodes": 20, "year": 2014, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 22.0, "genres": ["Adventure", "Comedy", "Fantasy", "Mystery", "Sci-Fi"], "tags": ["Adventure", "Anime Influenced", "Comedy", "Fantasy", "Kids", "Mystery", "Science Fiction"], "local": "images/gravity-falls-season-2.jpeg"}, {"title": "Monogatari Series: Second Season", "image": "https://cdn.myanimelist.net/images/anime/1807/121534.jpg", "score": 8.58, "episodes": 26, "year": 2013, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Shaft Inc."], "producers": ["Aniplex Of America", "Cyclone Graphics Inc", "Kodansha"], "duration_min": 25.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Mystery", "Romance", "Sci-Fi", "Supernatural", "Thriller", "Psychological", "Slapstick"], "tags": ["Absurdist Humour", "Achronological Order", "Action", "Alternate Universe", "Alternating Animation Style", "Alternative Past", "Alternative Present", "Animal Abuse", "Anti-Hero", "Asia"], "local": "images/monogatari-series-second-season.jpg", "synopsis": "Second season of the Monogatari Series, part 1/2. Contains the arcs Tsubasa Tiger, Mayoi Jiangshi, Nadeko Medusa, Shinobu Time, and Hitagi End, from the Nekomonogatari White, Kabukimonogatari, Otorimonogatari, Onimonogatari and Koimonogatari light novels, respectively. These stories take place after the end of the summer vacation when the apparition of the bee had left and the apparition of the phoenix avoided any consequences… Now that Koyomi Araragi and the girls were entering their new school terms, they were once again about to encounter supernatural beings…but this time, they may not be so easy to deal with. Tsubasa Hanekawa, Mayoi Hachikuji, Nadeko Sengoku, Shinobu Oshino, and finally Hitagi Senjougahara. The girls’ loneliness, their confessions, and their departures… 5 new “stories” begin now. (Source: Aniplex) Notes: Includes 3 recap episodes from the TV version (Ep. 6, 11, 16). The recap episodes were not included in the Blu-Ray version of the anime."}, {"title": "Mushishi Zoku Shou", "image": "https://cdn.myanimelist.net/images/anime/13/58533.jpg", "score": 8.58, "episodes": 10, "year": 2014, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Animation Studio Artland Inc.", "Artland"], "producers": ["Aniplex Of America", "Artland", "Delfi Sound"], "duration_min": 24.0, "genres": ["Adventure", "Drama", "Fantasy", "Horror", "Mystery", "Slice of Life", "Supernatural", "Psychological", "Historical"], "tags": ["Adult Cast", "Adventure", "Agriculture", "Alcohol", "Alternative Past", "Anachronism", "Angst", "Asia", "Based On A Manga", "Buddhism"], "local": "images/mushishi-zoku-shou.jpg", "synopsis": "They existed long before anyone can remember. They are simple and strange in nature, not resembling any other plant or animal in this world. In ancient times, people revered these bizarre creatures and called them \"Mushi.\" People once again began to believe in the existence of these \"Mushi\" when they began affecting their lives in inexplicable ways. The one who connects the world of \"Mushi\" to the world of humans—they were called the \"Mushi-shi.\" All life exists not to hinder others in this world. They are simply there to live as they were meant to. (Source: Aniplex of America)"}, {"title": "Shingeki no Kyojin Season 3", "image": "https://cdn.myanimelist.net/images/anime/1173/92110.jpg", "score": 8.58, "episodes": 12, "year": 2018, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Wit Studio, Inc."], "producers": ["Attack On Titan Production Committee", "Dentsu Inc.", "Kodansha"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Horror", "Mystery", "Thriller", "Psychological", "Historical"], "tags": ["Action", "Action Drama", "Adventure", "Alternative Past", "Alternative World", "Angst", "Anti-Hero", "Apocalyptic Fiction", "Asymmetric Warfare", "Awards"], "local": "images/shingeki-no-kyojin-season-3.jpg", "synopsis": "Eren and his companions in the 104th are assigned to the newly-formed Levi Squad, whose assignment is to keep Eren and Historia safe given Eren's newly-discovered power and Historia's knowledge and pedigree. Levi and Erwin have good reason to be concerned, because the priest of the Church that Hanji had hidden away was found tortured to death, making it clear that the Military Police are involved with the cover-up. Things get more harrowing when the MPs make a move on Erwin and the Levi Squad narrowly avoids capture. Eren is also having problems with his Titan transformation, and a deadly killer has been hired to secure Eren and Historia, one Levi knows all too well from his youth. (Source: Anime News Network)"}, {"title": "Shingeki no Kyojin: The Final Season Part 2", "image": "https://cdn.myanimelist.net/images/anime/1948/120625.jpg", "score": 8.58, "episodes": 12, "year": 2022, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Contrail", "Mappa Co., Ltd."], "producers": ["Dentsu Inc.", "Kodansha", "Mainichi Broadcasting System"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Horror", "Mystery", "Thriller", "Psychological"], "tags": ["Action", "Action Drama", "Adults Are Useless", "Adventure", "Alternate Universe", "Alternative Past", "Alternative World", "Amputation", "Angst", "Anti-Hero"], "local": "images/shingeki-no-kyojin-the-final-season-part-2.jpg", "synopsis": "The war for Paradis zeroes in on Shiganshina just as Jaegerists have seized control. After taking a huge blow from a surprise attack led by Eren, Marley swiftly acts to return the favor. With Zeke’s true plan revealed and a military forced under new rule, this battle might be fought on two fronts. Does Eren intend on fulfilling his half-brother’s wishes or does he have a plan of his own? (Source: Funimation)"}, {"title": "Tensei shitara Ken deshita 2", "image": "https://cdn.myanimelist.net/images/anime/1955/150906.jpg", "score": 8.58, "episodes": 12, "year": 2026, "season": "FALL", "type": "TV", "status": "UPCOMING", "studios": ["C2C Co., Ltd."], "producers": ["Gentosha Comics", "Micro Magazine Publishing", "Nbcuniversal Entertainment Japan"], "duration_min": null, "genres": ["Action", "Adventure", "Comedy", "Fantasy", "Isekai"], "tags": ["Action", "Adventure", "Afterlife", "Air Combat", "Alternative World", "Based On A Light Novel", "Betrayal", "Body And Host", "Body Takeover", "Child Abuse"], "local": "images/tensei-shitara-ken-deshita-2.jpg", "synopsis": "The second season of Tensei Shitara Ken Deshita . Note: Each episode was streamed one week in advance of the TV broadcast starting on October 1, 2026 on Abema. Regular broadcasting began on October 8, 2026."}, {"title": "To Be Hero X PV", "image": "https://cdn.anime-planet.com/anime/primary/to-be-hero-x-pv-1.webp", "score": 8.58, "episodes": 1, "year": 2022, "season": "UNDEFINED", "type": "ONA", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 6.0, "genres": ["Action"], "tags": ["Action", "Chinese Animation", "Promotional", "Superheroes", "Superpowers"], "local": "images/to-be-hero-x-pv.webp"}, {"title": "Violet Evergarden", "image": "https://cdn.myanimelist.net/images/anime/1795/95088.jpg", "score": 8.58, "episodes": 13, "year": 2018, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Kyoto Animation Co., Ltd."], "producers": ["Abc Animation", "Kyoto Animation", "Lantis"], "duration_min": 24.0, "genres": ["Adventure", "Drama", "Fantasy", "Romance", "Sci-Fi", "Slice of Life", "Psychological", "Historical"], "tags": ["Adventure", "Age Gap", "Android", "Assassins", "Awards", "Based On A Light Novel", "Character Driven", "Child Soldier", "Coming Of Age", "Coming-Of-Age"], "local": "images/violet-evergarden.jpg", "synopsis": "A certain point in time, in the continent of Telesis. The great war which divided the continent into North and South has ended after four years, and the people are welcoming a new generation. Violet Evergarden, a young girl formerly known as “the weapon”, has left the battlefield to start a new life at CH Postal Service. There, she is deeply moved by the work of “Auto Memories Dolls”, who carry people's thoughts and convert them into words. Violet begins her journey as an Auto Memories Doll, and comes face to face with various people's emotions and differing shapes of love. There are words Violet heard on the battlefield, which she cannot forget. These words were given to her by someone she holds dear, more than anyone else. She does not yet know their meaning but she searches to find it. (Source: Anime News Network)"}, {"title": "Bocchi the Rock!", "image": "https://cdn.myanimelist.net/images/anime/1448/127956.jpg", "score": 8.57, "episodes": 12, "year": 2022, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Cloverworks Inc."], "producers": ["Aniplex", "Houbunsha"], "duration_min": 23.0, "genres": ["Comedy", "Slice of Life", "Music", "Slapstick"], "tags": ["4-Koma Manga", "Asia", "Awards", "Band", "Based On A 4-Koma Manga", "Based On A Manga", "Cgdct", "Character Driven", "Chibi", "Colour Coded"], "local": "images/bocchi-the-rock.jpg", "synopsis": "Hitori Gotou, “Bocchi-chan,” is a girl who’s so introverted and shy around people that she’d always start her conversations with “Ah...” During her middle school years, she started playing the guitar, wanting to join a band because she thought it could be an opportunity for even someone shy like her to also shine. But because she had no friends, she ended up practicing guitar for six hours every day all by herself. After becoming a skilled guitar player, she uploaded videos of herself playing the guitar to the internet under the name “Guitar Hero” and fantasized about performing at her school’s cultural festival concert. But not only could she not find any bandmates, before she knew it, she was in high school and still wasn’t able to make a single friend! She was really close to becoming a shut-in, but one day, Nijika Ijichi, the drummer in Kessoku Band, reached out to her. And because of that, her everyday life started to change little by little... (Source: Crunchyroll)"}, {"title": "Gintama. Shirogane no Tamashii-hen - Kouhan-sen", "image": "https://cdn.myanimelist.net/images/anime/1776/96566.jpg", "score": 8.57, "episodes": 14, "year": 2018, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Bandai Namco Pictures Inc.", "Bn Pictures"], "producers": ["Aniplex", "Dentsu", "Shueisha"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Sci-Fi", "Slapstick", "Historical"], "tags": ["Action", "Adventure", "Alien", "Aliens", "Aliens Living On Earth", "Alternative Past", "Alternative Present", "Anachronism", "Asia", "Bakumatsu - Meiji Period"], "local": "images/gintama-shirogane-no-tamashii-hen-kouhan-sen.jpg", "synopsis": "The second season of the Silver Soul arc."}, {"title": "Hunter X Hunter", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A1135-10.jpg", "score": 8.57, "episodes": 8, "year": 2002, "season": "WINTER", "type": "OVA", "status": "FINISHED", "studios": ["Nippon Animation"], "producers": ["Hunter X Hunter Ova Production Committee", "Marvelous Entertainment", "Nippon Animation"], "duration_min": 23.0, "genres": ["Adventure", "Drama", "Fantasy", "Thriller"], "tags": ["Adventure", "Assassins", "Drama", "Fantasy", "Organized Crime", "Revenge", "Special Abilities", "Thriller"], "local": "images/hunter-x-hunter.png", "synopsis": "A Hunter is one who travels the world doing all sorts of dangerous tasks. From capturing criminals to searching deep within uncharted lands for any lost treasures. Gon is a young boy whose father disappeared long ago, being a Hunter. He believes if he could also follow his father's path, he could one day reunite with him. After becoming 12, Gon leaves his home and takes on the task of entering the Hunter exam, notorious for its low success rate and high probability of death to become an official Hunter. He befriends the revenge-driven Kurapika, the doctor-to-be Leorio and the rebellious ex-assassin Killua in the exam, with their friendship prevailing throughout the many trials and threats they come upon taking on the dangerous career of a Hunter. Based on the manga by Togashi Yoshihiro."}, {"title": "Kingdom 3rd Season", "image": "https://cdn.myanimelist.net/images/anime/1443/111830.jpg", "score": 8.57, "episodes": 26, "year": 2020, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Pierrot Co., Ltd.", "St. Signpost", "St.Signpost.Co.,Ltd."], "producers": ["Avex Pictures", "Nhk Enterprises", "Shueisha"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Drama", "Historical"], "tags": ["Action", "Adventure", "Ancient China", "Asia", "Based On A Manga", "Cgi", "China", "Disaster", "Drama", "Earth"], "local": "images/kingdom-3rd-season.jpg", "synopsis": "The third season of Kingdom . Following the successful Sanyou campaign, the Qin army, including 1,000-Man Commander Xin, inches ever closer to fulfilling King Ying Zheng's dream of unifying China. With a major geographical foothold in the state of Wei now under its control, Qin sets its sights eastward toward the remaining warring states. Meanwhile Li Mu—an unparalleled strategist and the newly appointed prime minister of the state of Zhao—has taken advantage of Zhao's temporary truce with Qin to negotiate with the other states without interruption. Seemingly without warning, Ying Zheng receives news that armies from the states of Chu, Zhao, Wei, Han, Yan, and Qi have crossed into Qin territory. Realizing too late the purpose behind Li Mu's truce with Qin, Zheng quickly gathers his advisors to devise a plan to address the six-state coalition army on their doorstep. For the first time in history, the state of Qin faces complete destruction and must use every resource and strategy at their disposal to prevent themselves from being wiped off the map. (Source: MAL Rewrite)"}, {"title": "Rurouni Kenshin: Meiji Kenkaku Romantan - Tsuioku-hen", "image": "https://cdn.myanimelist.net/images/anime/1656/137618.jpg", "score": 8.57, "episodes": 4, "year": 1999, "season": "WINTER", "type": "OVA", "status": "FINISHED", "studios": ["Studio Deen Co., Ltd."], "producers": ["Aniplex Of America"], "duration_min": 29.0, "genres": ["Action", "Drama", "Romance", "Historical"], "tags": ["19Th Century", "Action", "Adapted Into Japanese Movie", "Adapted Into Other Media", "Adult Cast", "Asia", "Assassins", "Bakumatsu - Meiji Period", "Bakumatsu Era", "Bakumatsu Meiji Period"], "local": "images/rurouni-kenshin-meiji-kenkaku-romantan-tsuioku-hen.jpg"}, {"title": "Guimi Zhi Zhu Specials", "image": "https://cdn.myanimelist.net/images/anime/1211/157100.jpg", "score": 8.56, "episodes": 3, "year": 2026, "season": "SPRING", "type": "ONA", "status": "FINISHED", "studios": ["B.C May Pictures", "B.Cmay Pictures"], "producers": ["China Literature Limited", "Tencent Penguin Pictures", "Tencent Video"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Horror", "Mystery", "Supernatural", "Thriller", "Isekai"], "tags": ["Action", "Adult Cast", "Adventure", "Based On A Web Novel", "Chinese Animation", "Cult", "Cultivation", "Detective", "Drama", "Fantasy"], "local": "images/guimi-zhi-zhu-specials.jpg", "synopsis": "Special episodes of Lord of Mysteries, taking place in season 1. Covering important scenes skipped after the end credits in Episode 10, as included: City of Silver (Episode 1) : Above the undying gray fog, Klein Moretti, the enigmatic The Fool, presided over the Tarot Club when a new, distant prayer echoed through the mists. Reaching across the veil, he summoned Derrick Berg from the City of Silver—a cursed bastion trapped within the Forsaken Land of God. Through Derrick’s haunting tales, the grim history of this sunless city was unveiled. Seeking salvation for his people, Derrick pledged his soul to The Fool’s grace. From the twenty-two Major Arcana, he chose his mantle: \"The Sun.\" The Marked Hunt (Episodes 2 and 3) : The gathering then turned to matters of blood and ambition. \"The Hanged Man,\" Alger Wilson, proposed a high-stakes exchange. He sought the head of Qilangos, one of the infamous seven Pirate Admirals, and tasked \"Justice,\" Audrey Hall, with leveraging her noble influence in Backlund to hunt the wind-blessed killer. In the foggy streets of the Loen capital, Audrey’s quest led her to the Beyonder duo, Fors Wall and Xio Derecha. As the web tightened around the Admiral, Klein sought the intervention of his mentor, the mysterious Mr. Azik. By weaving together the threads of divinity, ancient power, and mortal cunning, The Fool ensured the Tarot Club’s first great triumph: the fall of Qilangos. (Source: Crunchyroll)"}, {"title": "Made in Abyss", "image": "https://cdn.myanimelist.net/images/anime/6/86733.jpg", "score": 8.56, "episodes": 13, "year": 2017, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Kinema Citrus Co., Ltd."], "producers": ["At-X", "Cygames", "Global Solutions"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Horror", "Mystery", "Sci-Fi", "Mecha", "Psychological", "Slapstick"], "tags": ["Action", "Adventure", "Agender", "Alternative World", "Amnesia", "Amputation", "Android", "Androids", "Angst", "Animal Abuse"], "local": "images/made-in-abyss.jpg", "synopsis": "The \"Abyss\" is the last unexplored place in the world. Strange and wonderful creatures roam within, and it is full of precious relics that present humans can't recreate. Those that dare to explore the depths are known as \"Cave Raiders.\" An orphan girl named Riko lives on the rim. Her dream is to become a Cave Raider like her mother and solve the mysteries of the cave system. One day, Riko starts exploring the caves and discovers a robot who resembles a human boy. (Source: Anime News Network, edited) Note: The last episode aired with a runtime of ~48 minutes as opposed to the standard 24 minute long episode."}, {"title": "Shingeki no Kyojin", "image": "https://cdn.myanimelist.net/images/anime/10/47347.jpg", "score": 8.56, "episodes": 25, "year": 2013, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Production I.G", "Wit Studio, Inc."], "producers": ["Dentsu Inc.", "Kodansha", "Mad Box"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Horror", "Mystery", "Thriller", "Psychological", "Historical"], "tags": ["Action", "Action Drama", "Adapted Into Japanese Movie", "Adapted Into Jdrama", "Adapted Into Other Media", "Adoption", "Adventure", "Alternative Past", "Alternative World", "Amnesia"], "local": "images/shingeki-no-kyojin.jpg", "synopsis": "Several hundred years ago, humans were nearly exterminated by titans. Titans are typically several stories tall, seem to have no intelligence, devour human beings and, worst of all, seem to do it for the pleasure rather than as a food source. A small percentage of humanity survived by walling themselves in a city protected by extremely high walls, even taller than the biggest of titans. Flash forward to the present and the city has not seen a titan in over 100 years. Teenage boy Eren and his foster sister Mikasa witness something horrific as the city walls are destroyed by a colossal titan that appears out of thin air. As the smaller titans flood the city, the two kids watch in horror as their mother is eaten alive. Eren vows that he will murder every single titan and take revenge for all of mankind. (Source: MangaHelpers)"}, {"title": "Boku no Hero Academia: Final Season", "image": "https://cdn.myanimelist.net/images/anime/1959/151055.jpg", "score": 8.55, "episodes": 11, "year": 2025, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Bones Film", "Bones Inc."], "producers": ["Bones", "Dentsu", "Movic"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Sci-Fi"], "tags": ["Action", "Action Comedy", "Adventure", "Age Regression", "Based On A Manga", "Body Swapping", "Comedy", "Coming-Of-Age", "Contemporary Fantasy", "Drama"], "local": "images/cover_3779.jpg", "synopsis": "The eighth and final season of Boku no Hero Academia . Deku and the heroes are plunged into a final battle against villains across Japan. Deku, by fully unleashing One For All Quirks, faces off against Shigaraki. A young and refreshed All For One faces Armored All Might, Quirkless in his powered armor suit. Will Deku be able to bring the story of how they all became the greatest heroes to its finale? Or will everything be destroyed?! (Source: Crunchyroll)"}, {"title": "Mushishi", "image": "https://cdn.myanimelist.net/images/anime/2/73862.jpg", "score": 8.55, "episodes": 26, "year": 2005, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Artland Inc."], "producers": ["Artland", "Avex Entertainment", "Delfi Sound"], "duration_min": 23.0, "genres": ["Adventure", "Drama", "Fantasy", "Horror", "Mystery", "Slice of Life", "Supernatural", "Psychological", "Historical"], "tags": ["Adapted Into Japanese Movie", "Adapted Into Other Media", "Adult Cast", "Adventure", "Alternative Past", "Amnesia", "Angst", "Animals", "Anthology", "Anthropomorphism"], "local": "images/mushishi.jpg", "synopsis": "Neither good nor evil, they are life in its purest form. Vulgar and strange, they have inspired fear in humans since the dawn of time and have, over the ages, come to be known as \"mushi.\" The stories of the Mushi and the people they affect are all linked together by a traveling Mushi-shi, or \"Mushi Master,\" who seeks rare Mushi sightings and uses his shaman-like knowledge of Mushi to help the affected people. What are the Mushi and what do they want? (Source: Funimation)"}, {"title": "[Oshi no Ko] 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1006/143302.jpg", "score": 8.54, "episodes": 13, "year": 2024, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Doga Kobo", "Dōga Kōbō"], "producers": ["Cyberagent", "Delfi Sound", "Doga Kobo"], "duration_min": 25.0, "genres": ["Comedy", "Drama", "Mystery", "Romance", "Slice of Life", "Supernatural", "Thriller", "Psychological", "Music"], "tags": ["Acting", "Anti-Hero", "Asia", "Based On A Manga", "Bullying", "Character Driven", "Comedy", "Coming Of Age", "Coming-Of-Age", "Conspiracy"], "local": "images/cover_403.jpg", "synopsis": "Aqua’s desire for revenge takes center stage as he navigates the dark underbelly of the entertainment world alongside his twin sister, Ruby. While Ruby follows in their slain mother’s footsteps to become an idol, Aqua joins a famous theater troupe in hopes of uncovering clues to the identity of his father — the man who arranged their mother’s untimely death, and the man who once starred in the same troupe Aqua hopes to infiltrate. (Source: HIDIVE)"}, {"title": "Kaguya-sama wa Kokurasetai: First Kiss wa Owaranai", "image": "https://cdn.myanimelist.net/images/anime/1670/130060.jpg", "score": 8.54, "episodes": 1, "year": 2022, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["A-1 Pictures Inc."], "producers": ["Aniplex", "East Japan Marketing & Communications, Inc.", "Jr East Marketing & Communications"], "duration_min": 96.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Psychological", "Slapstick"], "tags": ["Angst", "Asia", "Based On A Manga", "Battle Of Wits", "Chibi", "Christmas", "Comedy", "Coming Of Age", "Dissociative Identities", "Drama"], "local": "images/kaguya-sama-wa-kokurasetai-first-kiss-wa-owaranai.jpg", "synopsis": "Shuchiin Academy’s student council room: the place where Student Council Vice President Kaguya Shinomiya and President Miyuki Shirogane met. After a long battle in love, these two geniuses communicated their feelings and, at the Hoshin Festival, had their very first kiss. However, there was no clear confession of love. The relationship between these two, who assumed they would be a couple, remains ambiguous. Now, overly conscious of their feelings, they must face the biggest challenge yet: Christmas. It’s Shirogane who wants it to be perfect versus Kaguya who pursues the imperfect situation. This is the very “normal” love story of two geniuses and the first kiss that never ends. (Source: Aniplex of America) Note: The anime first premiered in theaters across Japan on December 17, 2022. It was later split into 2 parts on TV, and 4 episodes on streaming, and Blu-Ray/DVD."}, {"title": "Kimetsu no Yaiba Movie: Mugen Ressha-hen", "image": "https://cdn.myanimelist.net/images/anime/1704/106947.jpg", "score": 8.54, "episodes": 1, "year": 2020, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Ufotable, Inc."], "producers": ["Aniplex", "Shueisha", "Ufotable"], "duration_min": 116.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Horror", "Mystery", "Supernatural", "Thriller", "Historical"], "tags": ["Action", "Action Drama", "Adventure", "Angst", "Asia", "Awards", "Based On A Manga", "Body Horror", "Call My Name", "Calling Your Attacks"], "local": "images/kimetsu-no-yaiba-movie-mugen-ressha-hen.jpg"}, {"title": "Takopii no Genzai", "image": "https://cdn.myanimelist.net/images/anime/1182/149879.jpg", "score": 8.54, "episodes": 6, "year": 2025, "season": "SPRING", "type": "ONA", "status": "FINISHED", "studios": ["Enishiya Inc."], "producers": ["Good Smile Company", "Klockworx", "Magic Capsule"], "duration_min": 26.0, "genres": ["Drama", "Sci-Fi", "Thriller", "Psychological", "Slapstick"], "tags": ["Achronological Order", "Adults Are Useless", "Alien", "Aliens", "Angst", "Animal Abuse", "Asia", "Back To Square One", "Based On A Manga", "Bullying"], "local": "images/takopii-no-genzai.jpg", "synopsis": "A Happy alien, Takopi, lands on Earth with one mission: to spread happiness! When he meets Shizuka, a lonely fourth grader, he vows to bring back her smile using his magical Happy Gadgets. But as he uncovers the pain in her life, Takopi learns that true happiness may require more than gadgets. (Source: Crunchyroll)"}, {"title": "86 Part 2", "image": "https://cdn.myanimelist.net/images/anime/1321/117508.jpg Tengen Toppa Gurren Lagann", "image": "https://cdn.myanimelist.net/images/anime/4/5123.jpg", "score": 8.51, "episodes": 27, "year": 2007, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Gainax Co., Ltd."], "producers": ["Aniplex Of America", "Bandai Entertainment", "Dentsu Inc."], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Romance", "Sci-Fi", "Mecha", "Slapstick"], "tags": ["Absurdist Humour", "Action", "Action Comedy", "Adventure", "Alien", "Aliens", "Alternate Universe", "Alternative World", "Ambitious", "Ancient Aliens"], "local": "images/tengen-toppa-gurren-lagann.jpg", "synopsis": "In a far away future, mankind lives underground in huge caves, unknowing of a world above with a sky and stars. In the small village of Jiha, Simon, a shy boy who works as a digger discovers a strange glowing object during excavation. The enterprising Kamina, a young man with a pair of rakish sunglasses and the passion of a firey sun, befriends Simon and forms a small band of brothers, the Gurren Brigade, to escape the village and break through the ceiling of the cave to reach the surface, which few believe exist. The village elder won't hear of such foolishness and punishes the Brigade. However, when disaster strikes from the world above and the entire village is in jeopardy, it's up to Simon, Kamina, a girl with a big gun named Yoko, and the small yet sturdy robot, Lagann, to save the day. The new friends journey to the world above and find that the surface is a harsh battlefield, and it's up to them to fight back against the rampaging Beastmen to turn the tide in the humans' favor! Pierce the heavens, Gurren Lagann!"}, {"title": "Angel ga Tonda Hi", "image": "https://cdn.myanimelist.net/images/anime/11/59567.jpg", "score": 8.5, "episodes": 1, "year": 1996, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": [], "producers": ["E&G Films", "Easy Film"], "duration_min": 80.0, "genres": ["Comedy", "Slice of Life"] eason", "image": "https://simkl.in/posters/19/19195874d515f066fc_m.webp", "score": 8.5, "episodes": 26, "year": 2025, "season": "FALL", "type": "ONA", "status": "ONGOING", "studios": ["Oriental Creative Color"], "producers": ["Bilibili"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Fantasy", "Historical"], "tags": ["Action", "Adventure", "Chinese Production", "Fantasy", "Historical", "Martial Arts"], "local": "images/immortality-5th-season.webp", "synopsis": "The fifth season of Yong Sheng ."}, {"title": "Jujutsu Kaisen", "image": "https://cdn.myanimelist.net/images/anime/1171/109222.jpg", "score": 8.5, "episodes": 24, "year": 2020, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Mappa Co., Ltd."], "producers": ["Dugout", "Jujutsu Kaisen Production Committee", "Mainichi Broadcasting System"], "duration_min": 23.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Horror", "Mystery", "Supernatural", "Thriller", "Psychological", "Slapstick"], "tags": ["Action", "Alternate Dimension", "Angst", "Anthropomorphism", "Archery", "Asia", "Award Winning", "Awards", "Baseball", "Based On A Manga"], "local": "images/jujutsu-kaisen.jpg", "synopsis": "A boy fights... for \"the right death.\" Hardship, regret, shame: the negative feelings that humans feel become Curses that lurk in our everyday lives. The Curses run rampant throughout the world, capable of leading people to terrible misfortune and even death. What's more, the Curses can only be exorcised by another Curse. Itadori Yuji is a boy with tremendous physical strength, though he lives a completely ordinary high school life. One day, to save a friend who has been attacked by Curses, he eats the finger of the Double-Faced Specter, taking the Curse into his own soul. From then on, he shares one body with the Double-Faced Specter. Guided by the most powerful of sorcerers, Gojou Satoru, Itadori is admitted to the Tokyo Metropolitan Technical High School of Sorcery, an organization that fights the Curses... and thus begins the heroic tale of a boy who became a Curse to exorcise a Curse, a life from which he could never turn back. (Source: Crunchyroll) Note: The first episode received an early web premiere on September 19th, 2020. The regular TV broadcast started on October 3rd, 2020."}, {"title": "Kingdom 4th Season", "image": "https://cdn.myanimelist.net/images/anime/1566/122794.jpg", "score": 8.5, "episodes": 26, "year": 2022, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Pierrot Co., Ltd.", "St. Signpost", "St.Signpost.Co.,Ltd."], "producers": ["Avex Pictures", "Nhk Enterprises", "Shueisha"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Drama", "Historical"], "tags": ["Action", "Adventure", "Ancient China", "Asia", "Based On A Manga", "China", "Disaster", "Drama", "Earth", "Ensemble Cast"], "local": "images/kingdom-4th-season.jpg", "synopsis": "The fourth season of Kingdom . Following the conclusion of the large-scale coalition campaign, the entirety of China is in a state of economic recovery. The victor of the battle, the state of Qin, is no different. There, the political parties led by Ying Zheng and Buwei Lü continue their inner conflict. Having played the role of king in the coalition battle, Zheng has the trust of the people—but Lü is far from out of the fight. In 18 months, he plans to interrupt Zheng's coming-of-age ceremony. Meanwhile, a Zhao army numbering 20,000 troops has set out toward Qin. In the royal court, due to the lack of generals capable of responding to the incoming threat, Lü slyly suggests that Zheng take command. However, Cheng Jiao, Zheng's half-brother, volunteers instead. As they grew to trust each other during the coalition battle, Zheng now accepts Jiao as his replacement. However, the Zhao forces retreat a mere half-day after clashing with Jiao's army. With trouble quickly brewing in the shadows, the internal struggle of Qin is only complicated further. There are only two men Zheng feels he can rely on: Bi, a general who commands 30,000 men; and Xin, the leader of the Fei Xin force. (Source: MAL Rewrite)"}, {"title": "Mushoku Tensei: Isekai Ittara Honki Dasu Part 2", "image": "https://cdn.myanimelist.net/images/anime/1028/117777.jpg", "score": 8.5, "episodes": 12, "year": 2021, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Studio Bind", "Studiobind Co., Ltd."], "producers": ["Bs11", "Egg Firm", "Frontier Works"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Romance", "Isekai", "Psychological", "Slapstick"], "tags": ["3D Cg Animation", "Aboard Ship", "Action", "Adventure", "Alternative Present", "Alternative World", "Anthropomorphism", "Anthropomorphs", "Aristocracy", "Asia"], "local": "images/mushoku-tensei-isekai-ittara-honki-dasu-part-2.jpg", "synopsis": "After the mysterious mana calamity, Rudeus Greyrat and his fierce student Eris Boreas Greyrat are teleported to the Demon Continent. There, they team up with their newfound companion Ruijerd Supardia—the former leader of the Superd's Warrior group—to form \"Dead End,\" a successful adventurer party. Making a name for themselves, the trio journeys across the continent to make their way back home to Fittoa. Following the advice he received from the faceless god Hitogami, Rudeus saves Kishirika Kishirisu, the Great Emperor of the Demon World, who rewards him by granting him a strange power. Now, as Rudeus masters the powerful ability that offers a number of new opportunities, it might prove to be more than what he bargained for when unexpected dangers threaten to hinder their travels. (Source: MAL Rewrite)"}, {"title": "Pantheon Season 2", "image": "https://media.kitsu.app/anime/48124/poster_image/small-c59aeaa59fc5e1f63cc55964c462630f.jpeg", "score": 8.5, "episodes": 8, "year": 2023, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": [], "producers": [], "duration_min": null, "genres": ["Drama", "Sci-Fi", "Thriller"], "tags": ["Anime Influenced", "Conspiracy", "Drama", "Science Fiction", "Thriller"], "local": "images/pantheon-season-2.jpeg"}, {"title": "Shiguang Dailiren", "image": "https://cdn.myanimelist.net/images/anime/1135/114867.jpg", "score": 8.5, "episodes": 11, "year": 2021, "season": "SPRING", "type": "ONA", "status": "FINISHED", "studios": ["Dongguanshi Lan Ying Hua Donghua Zhizuo Youxiangongsi", "Huamei Animation", "Lan Studio"], "producers": ["Aniplex", "Bedream", "Bilibili"], "duration_min": 23.0, "genres": ["Action", "Drama", "Fantasy", "Mystery", "Sci-Fi", "Supernatural", "Thriller", "Psychological"], "tags": ["Action", "Adult Cast", "Asia", "Basketball", "Body Swapping", "Boys' Love", "China", "Chinese Animation", "Chinese Production", "College"], "local": "images/shiguang-dailiren.jpg", "synopsis": "In a corner of a bustling city, there is a small shop called \"Time Photo Studio\" operating as usual. Although the entrance looks abandoned, it's actually run by two men with special abilities: Cheng Xiaoshi and Lu Guang. In order to fulfil customers' requests, Lu Guang and Cheng Xiaoshi work together and use their special abilities to enter photos. However, things don't go as planned... (Source: bilibili, translated) Note: The final episode aired with a runtime of ~31 minutes."}, {"title": "Shiguang Dailiren II", "image": "https://cdn.myanimelist.net/images/anime/1897/137108.jpg", "score": 8.5, "episodes": 12, "year": 2023, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": ["Chongqing Qian Yuansu Wenhua Chuanbo Youxiangongsi", "Cmc Media Inc.", "Dongguanshi Lan Ying Hua Donghua Zhizuo Youxiangongsi"], "producers": ["Bedream", "Bilibili"], "duration_min": 24.0, "genres": ["Drama", "Fantasy", "Mystery", "Supernatural", "Thriller"], "tags": ["Achromatic", "Achronological Order", "Adult Cast", "Anthropomorphism", "Body Swapping", "Chinese Animation", "Chinese Production", "Contemporary Fantasy", "Crime", "Crime Fiction"], "local": "images/shiguang-dailiren-ii.jpg", "synopsis": "Cheng Xiaoshi by chance meets Lu Guang, a person possessing super powers, and awakens to his own special ability. In order to save the Time Photo Studio which is on the verge of closing down, the two of them start to cooperate in using their super powers to enter photos of customers to complete their commissions. However, the appearance of a mysterious killer shatters the peace, Lu Guang's condition is still unknown and Qiao Ling has also become entangled in the conspiracy. Faced with all this, how will Cheng Xiaoshi solve the situation? (Source: bilibili, translated)"}, {"title": "That Time I Got Reincarnated as a Slime", "image": "https://simkl.in/posters/19/19613952e335dfd046_m.webp", "score": 8.5, "episodes": 16, "year": 2026, "season": "SPRING", "type": "TV", "status": "ONGOING", "studios": ["8Bit"], "producers": ["Adk Marketing Solutions", "Bandai Namco Filmworks", "Bandai Namco Music Live"], "duration_min": 18.8, "genres": ["Action", "Comedy", "Fantasy", "Isekai"], "tags": ["Action", "Comedy", "Fantasy", "Isekai", "Japanese Production", "Reincarnation", "Shounen", "Speculative Fiction"], "local": "images/that-time-i-got-reincarnated-as-a-slime.webp", "synopsis": "Lonely thirty-seven-year-old Satoru Mikami is stuck in a dead-end job, unhappy with his mundane life, but after dying at the hands of a robber, he awakens to a fresh start in a fantasy realm...as a slime monster! As he acclimates to his goopy new existence, his exploits with the other monsters set off a chain of events that will change his new world forever! (Source: Yen Press)"}, {"title": "You and I Are Polar Opposites", "image": "https://simkl.in/posters/20/20184500dafdcb0c22_m.webp", "score": 8.5, "episodes": null, "year": 2026, "season": "SUMMER", "type": "TV", "status": "UPCOMING", "studios": ["Lapin Track"], "producers": [], "duration_min": null, "genres": ["Comedy", "Romance"], "tags": ["Comedy", "Japanese Production", "Romance", "School", "Shounen"], "local": "images/you-and-i-are-polar-opposites.webp", "synopsis": "Suzuki’s a high school girl in love, but the guy she’s fallen for is nothing like her! While she’s cheerful, outgoing, and always trying to fit in, her classmate Yusuke Tani is stoic, quiet, and doesn’t seem to care what people think of him. Will Suzuki be able to overcome her anxieties and ask him out, or will she discover that opposites really don’t attract? (Source: Crunchyroll)"}, {"title": "Gintama'", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A15223-2335294335.1364400831.jpg", "score": 8.49, "episodes": 13, "year": 2012, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Sunrise"], "producers": [], "duration_min": null, "genres": ["Action", "Comedy", "Drama", "Sci-Fi", "Historical"], "tags": ["Action", "Aliens", "Comedy", "Drama", "Historical", "Parody", "Samurai", "Science Fiction"], "local": "images/gintama.png", "synopsis": "After a one-year hiatus, Shinpachi Shimura returns to Edo, only to stumble upon a shocking surprise: Gintoki and Kagura, his fellow Yorozuya members, have become completely different characters! Fleeing from the Yorozuya headquarters in confusion, Shinpachi finds that all the denizens of Edo have undergone impossibly extreme changes, in both appearance and personality. Most unbelievably, his sister Otae has married the Shinsengumi chief and shameless stalker Isao Kondou and is pregnant with their first child. Bewildered, Shinpachi agrees to join the Shinsengumi at Otae and Kondou's request and finds even more startling transformations afoot both in and out of the ranks of the the organization. However, discovering that Vice Chief Toushirou Hijikata has remained unchanged, Shinpachi and his unlikely Shinsengumi ally set out to return the city of Edo to how they remember it. With even more dirty jokes, tongue-in-cheek parodies, and shameless references, Gintama' follows the Yorozuya team through more of their misadventures in the vibrant, alien-filled world of Edo. (Source: MAL Rewrite)"}, {"title": "Castlevania Season 4", "image": "https://cdn.anime-planet.com/anime/primary/castlevania-season-4-1.jpg", "score": 8.49, "episodes": 10, "year": 2021, "season": "SPRING", "type": "ONA", "status": "FINISHED", "studios": ["Powerhouse Animation", "Tiger Animation"], "producers": [], "duration_min": 27.0, "genres": ["Action", "Adventure", "Drama", "Horror", "Supernatural", "Historical"], "tags": ["15Th Century", "Action", "Adventure", "Anime Influenced", "Based On A Video Game", "Dark Fantasy", "Drama", "Europe", "Historical", "Horror"], "local": "images/cover_4708.jpg"}, {"title": "Gravity Falls", "image": "https://media.kitsu.app/anime/47505/poster_image/small-3c0b3f2b5c442192d7ec87f59e3177be.jpeg", "score": 8.49, "episodes": 20, "year": 2012, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 22.0, "genres": ["Adventure", "Comedy", "Fantasy", "Mystery", "Sci-Fi"], "tags": ["Adventure", "Anime Influenced", "Comedy", "Fantasy", "Kids", "Mystery", "Science Fiction"], "local": "images/gravity-falls.jpeg"}, {"title": "Howl no Ugoku Shiro", "image": "https://cdn.myanimelist.net/images/anime/1470/138723.jpg", "score": 8.49, "episodes": 1, "year": 2004, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Studio Ghibli Inc."], "producers": ["D-Rights", "Fonishia", "Gkids"], "duration_min": 119.0, "genres": ["Adventure", "Comedy", "Drama", "Fantasy", "Romance", "Historical"], "tags": ["Adventure", "Age Gap", "Air Force", "Anti-War", "Aristocracy", "Aviation", "Award Winning", "Based On A Novel", "Boy Meets Girl", "Cgi"], "local": "images/howl-no-ugoku-shiro.jpg", "synopsis": "Sophie, a quiet girl working in a hat shop, finds her life thrown into turmoil when she is literally swept off her feet by a handsome but mysterious wizard named Howl. The vain and vengeful Witch of the Waste, jealous of their friendship, puts a spell on Sophie. In a life-changing adventure, Sophie climbs aboard Howl's magnificent flying castle and enters a magical world on a quest to break the spell. (Source: Disney)"}, {"title": "Kaguya-sama wa Kokurasetai? Tensai-tachi no Renai Zunousen", "image": "https://cdn.myanimelist.net/images/anime/1764/106659.jpg", "score": 8.49, "episodes": 12, "year": 2020, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["A-1 Pictures Inc.", "Clip+Bison, Llc."], "producers": ["Aniplex", "East Japan Marketing & Communications, Inc.", "Jr East Marketing & Communications"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Psychological", "Slapstick"], "tags": ["Angst", "Archery", "Asia", "Based On A Manga", "Battle Of Wits", "Board Game", "Bullying", "Comedy", "Coming Of Age", "Crossdressing"], "local": "images/kaguya-sama-wa-kokurasetai-tensai-tachi-no-renai-zunousen.jpg", "synopsis": "Known for being both brilliant and powerful, Miyuki Shirogane and Kaguya Shinomiya lead the illustrious Shuchiin Academy as near equals. And everyone thinks they’d make a great couple. Pride and arrogance are in ample supply, so the only logical move is to trick the other into instigating a date! Who will come out on top in this psychological war where the first move is the only one that matters? (Source: Aniplex)"}, {"title": "Kingdom 5th Season", "image": "https://cdn.myanimelist.net/images/anime/1050/139641.jpg", "score": 8.49, "episodes": 13, "year": 2024, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Pierrot Co., Ltd.", "St. Signpost", "St.Signpost.Co.,Ltd."], "producers": ["Avex Pictures", "Jinnan Studio", "Nhk Enterprises"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Drama", "Historical"], "tags": ["Action", "Adventure", "Ancient China", "Archery", "Asia", "Assassins", "Based On A Manga", "Body Horror", "Cgi", "China"], "local": "images/kingdom-5th-season.jpg", "synopsis": "The fifth season of Kingdom ."}, {"title": "Made in Abyss Movie
