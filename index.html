ld stragglers and other crime organizations making their way in from abroad. Meanwhile, Dazai Osamu had premonitions of another impending disaster. Lurking in the darkness is the Fyodor D., leader of pirate organization Rats in the House of the Dead, his dreadful plans on the verge of execution. (Source: Crunchyroll)"}, {"title": "Dr. Stone: Science Future Part 3", "image": "https://cdn.myanimelist.net/images/anime/1773/155779.jpg", "score": 8.09, "episodes": 13, "year": 2026, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Tms Entertainment Co., Ltd."], "producers": ["Magic Capsule", "Shueisha", "Tms Entertainment"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Sci-Fi"], "tags": ["Action", "Adventure", "Aliens", "Based On A Manga", "Civilization", "Coastal", "Comedy", "Discovery", "Drama", "Educational"], "local": "images/cover_7909.jpg", "synopsis": "The third and final cour of the fourth season of Dr.STONE ."}, {"title": "Eve no Jikan", "image": "https://cdn.myanimelist.net/images/anime/13/19480.jpg", "score": 8.09, "episodes": 6, "year": 2008, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": ["Studio Rikka Ltd."], "producers": ["Code", "Directions, Inc.", "Studio Rikka"], "duration_min": 18.0, "genres": ["Comedy", "Drama", "Romance", "Sci-Fi", "Slice of Life"], "tags": ["Amnesia", "Android", "Androids", "Angst", "Artificial Intelligence", "Asia", "Asimov'S Three Laws Of Robotics", "Bar", "Cafe", "Café"], "local": "images/cover_8742.jpg", "synopsis": "The movie version is the complete version of the story. It includes all the OVAs and completely new scenes giving details on the background story of some characters. Sometime in future Japan, androids have been involved in every aspect of peoples lives. One day, upon checking his android's behavioral log, Rikuo, a student, noticed his android's returning times have been odd recently. With his friend Masaki, they found out the place where his android, Sammy, have been visiting: a small cafe called Eve no Jikan where androids and human are not seen as different. Upon talking with the \"people\" in the cafe and discovering more of Sammy's behavior, Rikuo changed his view about androids and treat them as friends rather than tools. At the same time, elsewhere in Japan, the Ethics committee is trying to impose policies to reduce the involvement and use of androids in society. (Source: Anime News Network)"}, {"title": "Fanren Xiu Xian Chuan: Zai Bie Tian Nan", "image": "https://cdn.anime-planet.com/anime/primary/fanren-xiu-xian-chuan-zai-bie-tian-nan-1.webp", "score": 8.09, "episodes": 14, "year": 2022, "season": "SPRING", "type": "ONA", "status": "FINISHED", "studios": ["Original Force", "Wonder Cat Animation"], "producers": ["Bilibili", "Mopi"], "duration_min": 19.0, "genres": ["Action", "Adventure", "Fantasy", "Historical"], "tags": ["Action", "Adventure", "Cg Animation", "Chinese Animation", "Cultivation", "Fantasy", "Full Cgi", "Historical", "Martial Arts"], "local": "images/cover_8912.webp"}, {"title": "Fate/strange Fake", "image": "https://cdn.myanimelist.net/images/anime/1752/150192.jpg", "score": 8.09, "episodes": 13, "year": 2026, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["A-1 Pictures Inc."], "producers": ["Aniplex", "Bs11", "Contents Seed"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Drama", "Fantasy", "Mystery", "Supernatural", "Thriller", "Psychological"], "tags": ["Action", "Adventure", "America", "Anachronism", "Animals", "Archery", "Assassins", "Based On A Light Novel", "Battle Royale", "Body Swapping"], "local": "images/cover_9059.jpg", "synopsis": "In a Holy Grail War, Mages (Masters) and their Heroic Spirits (Servants) fight for the control of the Holy Grail—an omnipotent wish-granting device said to fulfill any desire. Years have passed since the end of the Fifth Holy Grail War in Japan. Now, signs portend the emergence of a new Holy Grail in the western American city of Snowfield. Sure enough, Masters and Servants begin to gather... A missing Servant class... Impossible Servant summonings... A nation shrouded in secrecy... And a city created as a battleground. In the face of such irregularities, the Holy Grail War is twisted and driven into the depth of madness. Let the curtain rise on a masquerade of humans and heroes, made to dance upon the stage of a false Holy Grail. This is a Holy Grail War covered in lies. (Source: Official Site, Aniplex USA, edited) Notes: • Special premiere of Episode 1 in its English Dub occurred in Los Angeles at the Fate 20th Anniversary Showcase event and as well through Crunchyroll’s YouTube Channel on November 23, 2024 before the Japanese television premiere. • The Japanese advanced premiere occurred during the \"Fate New Year's Eve TV Special 2024\" on December 31, 2024."}, {"title": "Ginga Eiyuu Densetsu: Die Neue These - Seiran 2", "image": "https://cdn.myanimelist.net/images/anime/1215/103351.jpg", "score": 8.09, "episodes": 4, "year": 2019, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Production I.G"], "producers": ["Shochiku"], "duration_min": 25.0, "genres": ["Action", "Adventure", "Drama", "Sci-Fi"], "tags": ["Action", "Adult Cast", "Adventure", "Drama", "Military", "Political", "Politics", "Sci Fi", "Sci-Fi", "Science Fiction"], "local": "images/ginga-eiyuu-densetsu-die-neue-these-seiran-2.jpg"}, {"title": "Golden Kamuy 4th Season", "image": "https://cdn.myanimelist.net/images/anime/1855/128059.jpg", "score": 8.09, "episodes": 13, "year": 2022, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Brain'S Base"], "producers": ["Good Smile Company", "Jr East Marketing & Communications", "Jr Higashi Nihon Kikaku"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Mystery", "Thriller", "Psychological", "Historical"], "tags": ["Acting", "Action", "Adult Cast", "Adventure", "Ainu", "Animals", "Archery", "Asia", "Bakumatsu - Meiji Period", "Based On A Manga"], "local": "images/golden-kamuy-4th-season.jpg", "synopsis": "The fourth season of Golden Kamuy . The race to obtain the lost Ainu gold is nearing its peak, as even more formidable ex-prisoners are set on keeping their tattooed skins intact. Saichi \"The Immortal\" Sugimoto and Asirpa can finally move forward together, but Asirpa's time with Kiroranke and Ogata Hyakunosuke has slightly altered her ambition and strengthened her determination. As their party leaves the Russian territory, they gain a peculiar follower. Meanwhile, Toshizou Hijikata's crew makes major moves to get invaluable skins, falling into the poisonous trap of a dangerous convict. Although each group possesses a strong advantage over the others, even First Lieutenant Tokushirou Tsurumi—the most powerful and ruthless contender—cannot advance without Asirpa's help. However, his ominous plans for when they will inevitably meet remain a mystery. (Source: MAL Rewrite) Note: On November 7, 2022, it was announced that the seventh episode of the season and beyond would be postponed due to the passing of a main staff member. The season restarted broadcasting from the first episode on April 3, 2023, with the seventh episode released on May 15."}, {"title": "Gyakkyou Burai Kaiji: Hakairoku-hen", "image": "https://cdn.myanimelist.net/images/anime/10/30599.jpg", "score": 8.09, "episodes": 26, "year": 2011, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Madhouse Inc."], "producers": ["Arts Pro", "Madhouse", "Nippon Television Network Corporation"], "duration_min": 24.0, "genres": ["Drama", "Thriller", "Psychological"], "tags": ["Adult Cast", "Angst", "Asia", "Based On A Manga", "Battle Of Wits", "Brain Games And Gambling", "Bullying", "Card Battle", "Class Struggle", "Crime"], "local": "images/gyakkyou-burai-kaiji-hakairoku-hen.jpg", "synopsis": "Several months after the events of the first season, Kaiji, with his appendages reattached and his debt now run up to 9.5 million yen, is still desperately seeking the elusive big score that will cancel all of his markers. Unbeknownst to him, Hyodo’s company, the Teiai Corporation, is actively searching for Kaiji, and have sent Kaiji’s old “friend” Endoh, who entered him in the high stakes games in the past, to find him. The two meet when Kaiji chances to walk in front of Endoh’s car at a stop light, and thinking that he has found the answer to his prayers, Kaiji gets in the car with him. While Kaiji and Endoh are “happy” to see one another, and both want to see Kaiji’s debt repaid, their means to that goal couldn’t be more different. Instead of leading Kaiji to the big score, Endoh delivers him drugged and docile to the Teiai Corporation’s secret underground labor camp where Kaiji will have an opportunity to repay his debt… with 15 years of hard labor. (Source: Sea Slugs)"}, {"title": "Hikaru no Go", "image": "https://cdn.myanimelist.net/images/anime/12/78317.jpg", "score": 8.09, "episodes": 75, "year": 2001, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["M.S.C", "Pierrot Co., Ltd."], "producers": ["Dentsu Inc.", "Dream Force", "J-Force"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Slice of Life", "Sports", "Supernatural", "Psychological"], "tags": ["Afterlife", "Asia", "Based On A Manga", "Battle Of Wits", "Board Game", "Board Games", "Body And Host", "Body Sharing", "Body Takeover", "Brain Games And Gambling"], "local": "images/hikaru-no-go.jpg", "synopsis": "With a two-tone hairstyle and a streak of immaturity, Hikaru Shindou finds an old Go board with a hidden surprise - trapped within the Go Board is Fujiwara-no-Sai, the ghost of an ancient Go master! In the blink of an eye, Sai becomes part of Hikaru's consciousness and soon begins to learn the true essence behind this ancient game of skill and strategy. (Source: VIZ Media)"}, {"title": "Hinamatsuri", "image": "https://cdn.myanimelist.net/images/anime/1580/93526.jpg", "score": 8.09, "episodes": 12, "year": 2018, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Feel."], "producers": ["Akatsuki", "At-X", "Funimation"], "duration_min": 23.0, "genres": ["Action", "Comedy", "Sci-Fi", "Slice of Life", "Supernatural", "Isekai", "Slapstick"], "tags": ["3D Cg Animation", "Action", "Adoption", "Alcohol", "Asia", "Bar", "Based On A Manga", "Cgi", "Childcare", "China"], "local": "images/hinamatsuri.jpg", "synopsis": "The comedy manga centers around a super-powered girl named Hina and Nitta, a young member of the yakuza. Hina suddenly appears in Nitta's room and threatens him with her extraordinary powers. However, they end up living together. (Source: Anime News Network)"}, {"title": "K-On!!", "image": "https://cdn.myanimelist.net/images/anime/12/76121.jpg", "score": 8.09, "episodes": 26, "year": 2010, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Kyoto Animation Co., Ltd."], "producers": ["Animation Do", "Kyoto Animation", "Movic"], "duration_min": 24.0, "genres": ["Comedy", "Slice of Life", "Music", "Slapstick"], "tags": ["4-Koma Manga", "All Girls School", "All-Girls School", "Asia", "Award Winning", "Band", "Bands", "Based On A 4-Koma Manga", "Based On A Manga", "Bisexual"], "local": "images/k-on.jpg", "synopsis": "It is the new year, which means that the senior members of the Light Music Club are now third-years, with Azusa Nakano being the only second-year. The seniors soon realize that Azusa will be the only member left once they graduate and decide to recruit new members. Despite trying many methods of attracting underclassmen—handing out fliers, bringing people into the clubroom, and performing at the welcoming ceremony—there are no signs of anyone that plans to join. While heading to the clubroom, Azusa overhears Yui Hirasawa say that the club is fine with only five people and that they can do many fun things together. Changing her mind, she decides that they do not need to recruit any members for the time being. K-On!! revolves around the members of the Light Music Club as they experience their daily high school life. From rehearsing for concerts to just messing around, they are ready to make their last year together an exciting one! (Source: MAL Rewrite)"}, {"title": "Kanon (2006)", "image": "https://cdn.myanimelist.net/images/anime/1362/128746.jpg", "score": 8.09, "episodes": 24, "year": 2006, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Kyoto Animation Co., Ltd."], "producers": ["Adv Films", "Funimation", "Hyakkaya"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Fantasy", "Romance", "Slice of Life", "Supernatural", "Slapstick"], "tags": ["Amnesia", "Angst", "Asia", "Based On A Visual Novel", "Befriend Attack", "Boy Meets Girl", "Childhood Memory", "Childhood Promise", "Cohabitation", "Colour Coded"], "local": "images/kanon-2006.jpg", "synopsis": "As a young child, Aizawa Yuuichi had often visited his cousin in the city. However, something drastic happened to keep him away for seven long years. Now, Yuuichi returns, his memories of those days are simply gone. Settling into the wintry town, Yuuichi comes across several young girls, all of whom are connected to his past. As he befriends them and continues to interact with them, the long forgotten memories from his childhood begin to resurface..."}, {"title": "Kidou Senshi Gundam 00", "image": "https://cdn.myanimelist.net/images/anime/3/13200.jpg", "score": 8.09, "episodes": 25, "year": 2007, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Sunrise Inc."], "producers": ["Asatsu Dk", "Bandai Entertainment", "Mainichi Broadcasting System"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Drama", "Sci-Fi", "Mecha"], "tags": ["Action", "Action Drama", "Adventure", "Africa", "Angst", "Anti-War", "Bad Luck", "Call My Name", "Combat Butler -- Do Not Add -- To Be Split And Deleted", "Crime"], "local": "images/kidou-senshi-gundam-00.jpg", "synopsis": "It is the year A.D. 2307. Fossil fuels on Earth have been depleted entirely, with mankind turning to the next available power source: solar energy. During this time, 3 orbital elevators with solar power generation systems are built, each under control by the Union (formerly United States of America), the Human Reformist Alliance (Russia, China and India) and the AEU (Europe). However, not all countries are able to enjoy the benefits of this system, leading to widespread resentment and war. Arising out of the conflict, a mysterious non-profit military organization known as Celestial Being appears, dedicated to end all warfare using Mobile Suits called Gundam. This begins the stories of Gundam Meisters (pilots) Setsuna F. Seiei, Lockon Stratos, Allelujah Haptism and Tieria Erde as they are thrown into conflict between the 3 superpowers and the other various factions. (Source: Anime News Network)"}, {"title": "Kipo and the Age of Wonderbeasts Season 3", "image": "https://media.kitsu.app/anime/poster_images/43562/small.jpg", "score": 8.09, "episodes": 10, "year": 2020, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 23.0, "genres": ["Action", "Adventure", "Sci-Fi"], "tags": ["Action", "Adventure", "Anime Influenced", "Anthropomorphism", "Friendship", "Future", "Post Apocalypse", "Science Fiction"], "local": "images/kipo-and-the-age-of-wonderbeasts-season-3.jpg"}, {"title": "Komi-san wa, Comyushou desu. 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1108/121157.jpg", "score": 8.09, "episodes": 12, "year": 2022, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Olm, Inc."], "producers": ["Dentsu", "Half H.P Studio", "Nippon Columbia"], "duration_min": 23.0, "genres": ["Comedy", "Romance", "Slice of Life", "Slapstick"], "tags": ["Agender", "Asia", "Based On A Manga", "Character Driven", "Chuunibyou", "Comedy", "Coming Of Age", "Daily Life", "Disability", "Earth"], "local": "images/komi-san-wa-comyushou-desu-2nd-season.jpg"}, {"title": "Ling Long 2 Qianzhan Pian: Changye Jiangzhi", "image": "https://s4.anilist.co/file/anilistcdn/media/anime/cover/medium/bx213544-TH3LuAy1Anys.png", "score": 8.09, "episodes": 1, "year": 2023, "season": "UNDEFINED", "type": "ONA", "status": "FINISHED", "studios": ["Yhkt Entertainment"], "producers": ["Bilibili"], "duration_min": 31.0, "genres": ["Action", "Sci-Fi", "Mecha"], "tags": ["Action", "Mecha", "Sci-Fi"], "local": "images/ling-long-2-qianzhan-pian-changye-jiangzhi.png", "synopsis": "Yuekui Bai's mysterious past and how it intricately links to Marc's origins and the apocalypse's truth, all of which are explored in this one long night."}, {"title": "Lycoris Recoil", "image": "https://cdn.myanimelist.net/images/anime/1261/127311.jpg", "score": 8.09, "episodes": 13, "year": 2022, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["A-1 Pictures Inc."], "producers": ["Abc Animation", "Aniplex", "Bs11"], "duration_min": 24.0, "genres": ["Action", "Comedy", "Drama", "Sci-Fi", "Slice of Life", "Thriller", "Slapstick"], "tags": ["Action", "Action Drama", "Asia", "Assassin", "Assassins", "Bar", "Boys' Love", "Comedy", "Conspiracy", "Contract Killer / Assassin"], "local": "images/lycoris-recoil.jpg", "synopsis": "“LycoReco” is a café with a traditional Japanese twist located in downtown Tokyo. But the delicious coffee and sugary sweets are not the only orders this café takes! From delivering packages short distances, to pick-ups and drop-offs on the lonely streets at night, to zombies and giant monster extermination…?! Whatever your problem, we're here to help! We will solve any kind of \"trouble\" you may have! Waiting for you are the ever-smiling poster-girl and the cool, serious newcomer. A petite girl who never wants to work and a young woman approaching thirty who wants to get married. And the manager is a nice guy who’s obsessed with Japan! Whatever your order is, leave it all up to us♪ (Source: Official Site)"}, {"title": "Miraculous Ladybug Season 2", "image": "https://media.kitsu.app/anime/poster_images/13425/small.jpg", "score": 8.09, "episodes": 26, "year": 2016, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 22.0, "genres": ["Action", "Adventure", "Comedy", "Fantasy", "Romance"], "tags": ["Action", "Action Comedy", "Adventure", "Anime Influenced", "Cg-Anime", "Comedy", "Episodic", "Fantasy", "Henshin", "Heroine Of Strong Character"], "local": "images/miraculous-ladybug-season-2.jpg"}, {"title": "One Piece Film: Z", "image": "https://cdn.myanimelist.net/images/anime/6/44297.jpg", "score": 8.09, "episodes": 1, "year": 2012, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Toei Animation Co., Ltd."], "producers": ["Bandai Co., Ltd.", "Fuji Television Network", "Funimation"], "duration_min": 107.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy"], "tags": ["Action", "Adventure", "Age Regression", "Alternative World", "Based On A Manga", "Beastman", "Call My Name", "Calling Your Attacks", "Comedy", "Crime"], "local": "images/one-piece-film-z.jpg", "synopsis": "Said to be comparable to the Ancient Weapons of old, the Marines’ trump card, the “Dyna Stones,” have suddenly been stolen by a group of renegade vigilantes. The terrifyingly powerful man responsible, former Marine Admiral “Z”, now stands in the path of Luffy and his Straw Hat Pirates. Can the Straw Hats defeat “Z” and his crew, or will the New World meet its end at the hands of this mad man? (Source: Funimation)"}, {"title": "RWBY VII", "image": "https://media.kitsu.app/anime/poster_images/42425/small.jpg", "score": 8.09, "episodes": 13, "year": 2019, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 18.0, "genres": ["Action", "Adventure", "Fantasy"], "tags": ["Action", "Adventure", "Anime Influenced", "Fantasy", "Fantasy World", "Friendship"], "local": "images/rwby-vii.jpg"}, {"title": "Song of the Sea", "image": "https://media.kitsu.app/anime/poster_images/14164/small.jpg", "score": 8.09, "episodes": 1, "year": 2014, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Cartoon Saloon"], "producers": [], "duration_min": 93.0, "genres": ["Adventure", "Fantasy"], "tags": ["Adventure", "Anime Influenced", "Fantasy"], "local": "images/song-of-the-sea.jpg"}, {"title": "Spy x Family Movie: Code: White", "image": "https://cdn.myanimelist.net/images/anime/1426/139388.jpg", "score": 8.09, "episodes": 1, "year": 2023, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Cloverworks Inc.", "Wit Studio, Inc."], "producers": ["Shogakukan-Shueisha Productions", "Shueisha", "Toho Animation"], "duration_min": 110.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Romance", "Slice of Life", "Supernatural"], "tags": ["Action", "Action Comedy", "Adventure", "Animals", "Assassin", "Assassins", "Aviation", "Based On A Manga", "Childcare", "Comedy"], "local": "images/spy-x-family-movie-code-white.jpg"}, {"title": "Summer Wars", "image": "https://cdn.myanimelist.net/images/anime/1593/116751.jpg", "score": 8.09, "episodes": 1, "year": 2009, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Madhouse Inc."], "producers": ["D.N. Dream Partners", "Funimation", "Gkids"], "duration_min": 114.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Romance", "Sci-Fi", "Slice of Life", "Thriller", "Slapstick"], "tags": ["3D Cg Animation", "Action", "Adventure", "Alternate Universe", "Alternative World", "Anthropomorphism", "Artificial Intelligence", "Asia", "Award Winning", "Baseball"], "local": "images/summer-wars.jpg", "synopsis": "When timid eleventh-grader and math genius Kenji Koiso is asked by older student and secret crush Natsuki to come with her to her family's Nagano home for a summer job, he agrees without hesitation. Natsuki's family, the Jinnouchi clan, dates back to the Muromachi era (1336 to 1573), and they've all come together to celebrate the 90th birthday of the spunky matriarch of the family, Sakae. That&rsquo;s when Kenji discovers his \"summer job\" is to pretend to be Natsuki's fiance and dance with her at the birthday celebration. As Kenji attempts to keep up with Natsuki's act around her family, he receives a strange math problem on his cell phone which, being a math genius, he can't resist solving. As it turns out, the solution to the mysterious equation causes Oz, the program that controls nearly every aspect of life to be hacked into, it's up to Kenji and his new \"family\" to stop the hacker before it's too late. (Source: twitchfilm.net)"}, {"title": "xxxHOLiC Rou", "image": "https://cdn.myanimelist.net/images/anime/9/25080.jpg", "score": 8.09, "episodes": 2, "year": 2010, "season": "SPRING", "type": "OVA", "status": "FINISHED", "studios": ["Production I.G"], "producers": ["Fonishia", "Kodansha", "Production I.G"], "duration_min": 34.0, "genres": ["Drama", "Fantasy", "Mystery", "Supernatural", "Psychological"], "tags": ["Alcohol", "Animal Sidekick", "Based On A Manga", "Be Careful What You Wish For", "Contemporary Fantasy", "Curses", "Drama", "Fantasy", "Food", "Japanese Mythology"], "local": "images/xxxholic-rou.jpg", "synopsis": "10 years after the events of xxxHOLiC Shunmuki, a melancholic Kimihiro Watanuki has taken over the shop formerly run by the mysterious Yuuko due to a promise he made to her. His companions Maru, Moro, and Mokona live together with him in relative contentment, and some familiar faces arrive every now and then: former rival turned-steadfast friend Shizuka Doumeki, and the former psychic prodigy Kohane Tsuyuri. While Kohane studies folklore under Doumeki at university, they encounter a case that is perfect for the master of the shop. Eventually, Watanuki receives a visit from Doumeki's grandfather, Haruka. He requests that Watanuki investigates his grandson's dreams. While inside the dream world, he discovers how their past adventures played out from Doumeki's perspective of view, leading Watanuki to discover truths from 10 years ago and secrets about the ties that bind their friendship. (Source: MAL Rewrite)"}, {"title": "5-toubun no Hanayome ∬", "image": "https://cdn.myanimelist.net/images/anime/1775/109514.jpg", "score": 8.08, "episodes": 12, "year": 2021, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Bibury Animation Studios", "Tezuka Productions"], "producers": ["Bs11", "Dax Production", "Good Smile Film"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Slapstick"], "tags": ["3D Cg Animation", "Alternating Animation Style", "Asia", "Based On A Manga", "Cgi", "Colour Coded", "Comedy", "Coming Of Age", "Dear Mother In Heaven", "Description Needs Improvement"], "local": "images/cover_334.jpg", "synopsis": "Through their tutor Fuutarou Uesugi's diligent guidance, the Nakano quintuplets' academic performance shows signs of improvement, even if their path to graduation is still rocky. However, as they continue to cause various situations that delay any actual tutoring, Fuutarou becomes increasingly involved with their personal lives, further complicating their relationship with each other. On another note, Fuutarou slowly begins to realize the existence of a possible connection between him and the past he believes to have shared with one of the five girls. With everyone's feelings beginning to develop and overlap, will they be able to keep their bond strictly to that of a teacher and his students—or will it mature into something else entirely? (Source: MAL Rewrite)"}, {"title": "Aria the Natural", "image": "https://cdn.myanimelist.net/images/anime/2/77621.jpg", "score": 8.08, "episodes": 26, "year": 2006, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Hal Film Maker Inc."], "producers": ["Aria Company", "Hal Film Maker", "Mag Garden"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Fantasy", "Sci-Fi", "Slice of Life", "Slapstick"], "tags": ["Anachronisms", "Animals", "Anthropomorphism", "Apprenticeship", "Based On A Manga", "Character Driven", "Chibi", "Coastal", "Colour Coded", "Comedy"], "local": "images/cover_1858.jpg", "synopsis": "Akari Mizunashi continues her training to become a Prima Undine (a professional tour guide gondolier) along with her friends Aika and Alice in the peaceful city of Neo Venezia. Despite the fact that these three girls are from competing companies, they are constantly together, learning more about how to become better tour guides and more about the mysteries of Neo Venezia. As the group continues to meet interesting and unforgettable people through their daily routines, they will also come closer to the secrets that make the enigmatic and ever beautiful city of Neo Venezia so warm and alive. Welcome back to Neo Venezia: the city where miracles can be created by hand."}, {"title": "Blue Spring Ride: Page.13", "image": "https://cdn.anime-planet.com/anime/primary/blue-spring-ride-page-13-1.jpg", "score": 8.08, "episodes": 1, "year": 2014, "season": "FALL", "type": "OVA", "status": "FINISHED", "studios": ["Production I.G"], "producers": ["Animatic", "Bs11", "Hakuhodo Dy Music & Pictures"], "duration_min": 22.0, "genres": ["Drama", "Romance", "Slice of Life"], "tags": ["Based On A Manga", "Drama", "Female Protagonist", "Heterosexual", "Love Triangle", "Romance", "School Club", "Shoujo", "Slice Of Life"], "local": "images/cover_3683.jpg"}, {"title": "Boku no Hero Academia", "image": "https://cdn.myanimelist.net/images/anime/10/78745.jpg", "score": 8.08, "episodes": 13, "year": 2016, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Bones Inc."], "producers": ["Dentsu", "Mainichi Broadcasting System", "Movic"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Slapstick"], "tags": ["Action", "Action Comedy", "Adventure", "Aim For The Top", "Asia", "Based On A Manga", "Bullying", "Call My Name", "Calling Your Attacks", "Canon Filler"], "local": "images/cover_3757.jpg", "synopsis": "What would the world be like if 80 percent of the population manifested extraordinary superpowers called “Quirks” at age four? Heroes and villains would be battling it out everywhere! Becoming a hero would mean learning to use your power, but where would you go to study? U.A. High's Hero Program of course! But what would you do if you were one of the 20 percent who were born Quirkless? Middle school student Izuku Midoriya wants to be a hero more than anything, but he hasn't got an ounce of power in him. With no chance of ever getting into the prestigious U.A. High School for budding heroes, his life is looking more and more like a dead end. Then an encounter with All Might, the greatest hero of them all gives him a chance to change his destiny… (Source: VIZ Media)"}, {"title": "Cang Lan Jue 2", "image": "https://cdn.myanimelist.net/images/anime/1784/149998.jpg", "score": 8.08, "episodes": 26, "year": 2025, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": ["Garden Culture", "Shanghai Garden Culture Co.,Ltd.", "Stellar Pictures"], "producers": ["Iqiyi", "Stellar", "Youliao Studio"], "duration_min": 20.0, "genres": ["Action", "Adventure", "Comedy", "Fantasy", "Romance", "Supernatural", "Historical"], "tags": ["Action", "Adventure", "Afterlife", "Ancient China", "Body Sharing", "Chinese Animation", "Chinese Production", "Comedy", "Cultivation", "Demon King"], "local": "images/cover_4549.jpg"}, {"title": "Chuunibyou demo Koi ga Shitai! Movie: Take On Me", "image": "https://cdn.myanimelist.net/images/anime/2/89974.jpg", "score": 8.08, "episodes": 1, "year": 2018, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Kyoto Animation Co., Ltd."], "producers": ["Kyoto Animation", "Lantis", "Pony Canyon"], "duration_min": 93.0, "genres": ["Adventure", "Comedy", "Drama", "Romance", "Slice of Life", "Slapstick"], "ta e urban legend stands out above the rest—the existence of a headless \"Black Rider\" who is said to be seen driving a jet-black motorcycle through the city streets. Ryuugamine Mikado has always longed for the excitement of the city life, and an invitation from a childhood friend convinces him to move to Tokyo. Witnessing the Black Rider on his first day in the city, his wishes already seem to have been granted. But as supernatural events begin to occur, ordinary citizens like himself, along with Ikebukuro's most colorful inhabitants, are mixed up in the commotion breaking out in their city. (Source: MAL Rewrite)"}, {"title": "Evangelion Movie 1: Jo", "image": "https://cdn.myanimelist.net/images/anime/7/74975.jpg", "score": 8.08, "episodes": 1, "year": 2007, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Studio Khara"], "producers": ["Funimation", "Gainax", "Khara"], "duration_min": 101.0, "genres": ["Action", "Drama", "Sci-Fi", "Thriller", "Mecha", "Psychological"], "tags": ["3D Cg Animation", "Action", "Action Drama", "Alien", "Aliens", "Angst", "Anthropomorphism", "Antihero", "Apocalyptic Fiction", "Asia"], "local": "images/cover_8731.jpg"}, {"title": "JoJo's Bizarre Adventure: Diamond Is Unbreakable", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A17832-1221974480.1460280938.jpg", "score": 8.08, "episodes": 39, "year": 2016, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["David Production"], "producers": ["Jojo'S Bizarre Adventure Du Production Committee"], "duration_min": 30.0, "genres": ["Action", "Comedy", "Drama", "Horror", "Mystery", "Supernatural", "Thriller", "Psychological"], "tags": ["Absurdity", "Action", "Betrayal", "Comedy", "Conspiracy", "Crime", "Dark Comedy", "Dark Fantasy", "Drama", "Europe"], "local": "images/jojo-diamond-is-unbreakable.webp", "synopsis": "JoJo no Kimyou na Bouken: Diamond wa Kudakenai adapts the fourth part of the JoJo no Kimyou na Bouken manga series. It's the year 1999, 11 years after Jotaro Kujo's desperate fight against DIO in Egypt. Jotaro meets with Josuke Higashikata, the illegitimate son of his grandfather Joseph Joestar. He discovers that Josuke also has the same \"Stand\" power and that a new threat is surfacing in Morioh City. (Source: Anime News Network)"}, {"title": "Kono Subarashii Sekai ni Shukufuku wo! 4", "image": "https://cdn.myanimelist.net/images/anime/1067/154983.jpg", "score": 8.08, "episodes": 12, "year": null, "season": "UNDEFINED", "type": "TV", "status": "UPCOMING", "studios": [], "producers": ["Kadokawa"], "duration_min": null, "genres": ["Action", "Adventure", "Comedy", "Fantasy", "Isekai"], "tags": ["Action", "Adventure", "Afterlife", "Anti-Hero", "Based On A Light Novel", "Chuunibyou", "Comedy", "Demons", "Ecchi", "Fantasy"], "local": "images/konosuba-season-4.webp", "synopsis": "The fourth season of Kono Subarashii Sekai ni Shukufuku wo!"}, {"title": "Koukyoushihen Eureka Seven", "image": "https://cdn.myanimelist.net/images/anime/12/34443.jpg", "score": 8.08, "episodes": 50, "year": 2005, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Bones Inc."], "producers": ["Aniplex", "Ashi Productions", "Bandai Channel"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Romance", "Sci-Fi", "Mecha", "Slapstick"], "tags": ["Action", "Action Drama", "Adventure", "Air Force", "Alcohol", "Alien", "Aliens", "Alternative World", "Angst", "Anti-Hero"], "local": "images/koukyoushihen-eureka-seven.jpg", "synopsis": "Renton is a teenager trapped working as a mechanic in a backwater town. He dreams of joining up with a daredevil group of pilots known as Gekkostate and following in his father's heroic footsteps. When a mysterious beauty named Eureka shows up asking for a tune-up, Renton soon finds himself drawn into a high-flying mecha dogfight that makes him a target of the military. When the dust settles on the spectacular battle, Renton is invited to join Gekkostate, but he soon discovers that even a dream come true has a dark side. (Source: Funimation)"}, {"title": "Kyoukai no Kanata Movie 2: I'll Be Here - Mirai-hen", "image": "https://cdn.myanimelist.net/images/anime/9/72614.jpg", "score": 8.08, "episodes": 1, "year": 2015, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["Kyoto Animation"], "producers": ["Kyoto Animation", "Sentai Filmworks", "Shochiku"], "duration_min": 90.0, "genres": ["Action", "Drama", "Fantasy", "Romance", "Slice of Life", "Supernatural", "Psychological"], "tags": ["Action", "Amnesia", "Based On A Light Novel", "Beast", "Contemporary Fantasy", "Demons", "Drama", "Ensemble Cast", "Fantasy", "Immortality"], "local": "images/kyoukai-no-kanata-movie-2-i-ll-be-here-mirai-hen.jpg"}, {"title": "Paripi Koumei", "image": "https://cdn.myanimelist.net/images/anime/1970/122297.jpg", "score": 8.08, "episodes": 12, "year": 2022, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["P.A. Works Co., Ltd.", "P.A.Works"], "producers": ["Avex Pictures", "Bit Grooove Promotion", "Dmm Pictures"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Fantasy", "Slice of Life", "Supernatural", "Isekai", "Music", "Historical"], "tags": ["Adapted Into Jdrama", "Adapted Into Other Media", "Adult Cast", "Anachronism", "Ancient China", "Anti-War", "Asia", "Band", "Bar", "Based On A Manga"], "local": "images/paripi-koumei.jpg", "synopsis": "Fate and reincarnation deliver brilliant military strategist, Kongming, from warring, ancient China to Japan’s modern party hot spot in Shibuya City, Tokyo. After a lifetime of battles and military skirmishes, Kongming wished with his last breath to be reborn in a world of peace and prosperity. It’s nearly two millennia later and he’s finding his way in a very different world than that of his past life. When he meets Eiko, an amateur musician with big dreams, the unlikely duo strikes up an even unlikelier friendship. Eiko has street smarts to help Kongming navigate this strange new world, and Kongming will use his strategic mind to help Eiko achieve stardom! (Source: Sentai Filmworks) An advanced online screening of the first episode was held on March 31, 2022, but the weekly TV release began on April 5, 2022."}, {"title": "RWBY VI", "image": "https://media.kitsu.app/anime/poster_images/41937/small.jpg", "score": 8.08, "episodes": 13, "year": 2018, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": ["Rooster Teeth Productions"], "producers": [], "duration_min": 18.0, "genres": ["Action", "Adventure", "Fantasy"], "tags": ["Action", "Adventure", "Anime Influenced", "Fantasy", "Fantasy World", "Friendship"], "local": "images/rwby-vi.jpg"}, {"title": "Shin-chan", "image": "https://media.kitsu.app/anime/poster_images/7993/small.jpg", "score": 8.08, "episodes": 78, "year": 2006, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": [], "producers": ["Funimation", "Shin-Ei Animation"], "duration_min": 21.0, "genres": ["Comedy", "Slice of Life"], "tags": ["Comedy", "Ecchi", "School", "School Life", "Slice Of Life"], "local": "images/shin-chan.jpg", "synopsis": "Crayon Shin-chan follows the wacky antics and adventures of five-year-old Shinnosuke \"Shin\" Nohara and his parents, neighbors, and friends and is set in Kasukabe, Saitama Prefecture, Japan. Many of the jokes in the series stem from Shin-chan's occasionally weird, unnatural and inappropriate use of language, as well as from his inappropriate behavior. A typical gag involves Shin-chan confounding his parents by using the wrong phrase for the occasion; for example, saying \"Welcome back!\" instead of \"I am back!\" when he comes home. During the beginning of the series, the TV show was mostly based on the storyline in the original manga. As the show progressed, more and more episodes became anime-original."}, {"title": "The Powerpuff Girls", "image": "https://media.kitsu.app/anime/poster_images/12773/small.jpg", "score": 8.08, "episodes": 78, "year": 1998, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": [], "producers": ["Cartoon Network Studios", "Hanna-Barbera Cartoons"], "duration_min": 25.0, "genres": ["Action", "Comedy"], "tags": ["Action", "Anime Influenced", "Comedy", "Kids", "Super Power", "Superhero"], "local": "images/the-powerpuff-girls.jpg", "synopsis": "Based on the American cartoon, \"The Powerpuff Girls.\" Professor Utonium and his son Ken are studying the strange Chemical X. When a mochi cake falls into the formula, it changes into Chemical Z. Ken fires a ray of Chemical Z at a glacier in Tokyo Bay, however that causes strange black and white lights to scatter. The black lights turn its victims into monsters, with emphasis on a black light hitting a zoo monkey and transforming him into Mojo Jojo. The white lights, however, aim at three normal girls, Momoko, Miyako, and Kaoru. This gives them the power to transform into superheroes, the Powerpuff Girls Z!"}, {"title": "Touch: Tobidashi wa Out da yo!", "image": "https://cdn.myanimelist.net/images/anime/1122/99354.jpg", "score": 8.08, "episodes": 1, "year": 1987, "season": "UNDEFINED", "type": "OVA", "status": "FINISHED", "studios": ["Group Tac"], "producers": [], "duration_min": 17.0, "genres": ["Sports"], "tags": ["Educational", "Kids", "Sports"], "local": "images/touch-tobidashi-wa-out-da-yo.jpg"}, {"title": "Yong Zhi Cheng", "image": "https://cdn.myanimelist.net/images/anime/1826/122643.jpg", "score": 8.08, "episodes": 1, "year": 2021, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Fantawild Animation Inc."], "producers": ["Fantawild Animation", "Maoyan Movie"], "duration_min": 111.0, "genres": ["Action", "Adventure", "Fantasy", "Historical"], "tags": ["Action", "Adventure", "Cg-Anime", "Chinese Animation", "Chinese Production", "Fantasy", "Historical"], "local": "images/yong-zhi-cheng.jpg"}, {"title": "Boku no Hero Academia 4th Season", "image": "https://cdn.myanimelist.net/images/anime/1412/107914.jpg", "score": 8.07, "episodes": 25, "year": 2019, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Bones Inc."], "producers": ["Bones", "Dentsu Inc.", "Movic"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Sci-Fi", "Slapstick"], "tags": ["Action", "Action Comedy", "Adventure", "Asia", "Band", "Based On A Manga", "Bisexual", "Boarding School", "Comedy", "Coming Of Age"], "local": "images/cover_3762.jpg", "synopsis": "The villain world teeters on the brink of war now that All For One is out of the picture. Shigaraki of the League of Villains squares off with Overhaul of the yakuza, vying for total control of the shadows. Meanwhile, Deku gets tangled in another dangerous internship as he struggles to keep pace with his upperclassman—Mirio. (Source: Crunchyroll)"}, {"title": "Bungou Stray Dogs 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1572/133096.jpg", "score": 8.07, "episodes": 12, "year": 2016, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Bones Inc."], "producers": ["Bandai Namco Live Creative", "Bones", "Crunchyroll"], "duration_min": 23.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Mystery", "Romance", "Supernatural", "Thriller", "Slapstick", "Historical"], "tags": ["3D Cg Animation", "Action", "Action Comedy", "Adult Cast", "Adults Are Useless", "Alcohol", "Angst", "Anti-Hero", "Anti-War", "Asia"], "local": "images/cover_4293.jpg", "synopsis": "The second season of Bungou Stray Dogs . Despite their differences in position, three men—the youngest senior executive of the Port Mafia, Osamu Dazai, the lowest ranking member, Sakunosuke Oda, and the intelligence agent, Angou Sakaguchi—gather at the Lupin Bar at the end of the day to relax and take delight in the company of friends. However, one night, Angou disappears. A photograph taken at the bar is all that is left of the three together. Fast forward to the present, and Dazai is now a member of the Armed Dete ation", "Cute Girls Doing Cute Things", "Female Protagonist", "Hikikomori"], "local": "images/cover_3720.jpg", "synopsis": "Compilation film of Bocchi the Rock! featuring new animation intro footage. The first of the Bocchi compilation movie duology."}, {"title": "Cardcaptor Sakura Movie 2: Fuuin Sareta Card", "image": "https://cdn.myanimelist.net/images/anime/1652/90326.jpg", "score": 8.06, "episodes": 1, "year": 2000, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Madhouse Inc."], "producers": ["Amber Film Works", "Bandai Visual", "Discotek"], "duration_min": 82.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Romance"], "tags": ["Acting", "Action", "Adventure", "Asia", "Award Winning", "Based On A Manga", "Bisexual", "Catchphrase", "Comedy", "Contemporary Fantasy"], "local": "images/cover_4631.jpg"}, {"title": "Diamond no Ace: Second Season", "image": "https://cdn.myanimelist.net/images/anime/9/74398.jpg", "score": 8.06, "episodes": 51, "year": 2015, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Madhouse Inc.", "Production I.G., Inc."], "producers": ["At-X", "Kodansha", "Madhouse"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Slice of Life", "Sports", "Slapstick"], "tags": ["Aim For The Top", "Asia", "Baseball", "Based On A Manga", "Comedy", "Competition", "Diva", "Drama", "Earth", "Ensemble Cast"], "local": "images/cover_7057.jpg", "synopsis": "The second season of Diamond no Ace . After the National Tournament, the Seidou High baseball team moves forward with uncertainty as the Fall season quickly approaches. In an attempt to build a stronger team centered around their new captain, fresh faces join the starting roster for the very first time. Previous losses weigh heavily on the minds of the veteran players as they continue their rigorous training, preparing for what will inevitably be their toughest season yet. Rivals both new and old stand in their path as Seidou once again climbs their way toward the top, one game at a time. Needed now more than ever before, Furuya and Eijun must be determined to pitch with all their skill and strength in order to lead their team to victory. And this time, one of these young pitchers may finally claim that coveted title: \"The Ace of Seidou.\" [Written by MAL Rewrite]"}, {"title": "Douluo Dalu: Hanhai Qian Kun", "image": "https://media.kitsu.app/anime/poster_images/44617/small.jpg", "score": 8.06, "episodes": 13, "year": 2020, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": ["Sparkly Key Animation Studio"], "producers": ["Tencent Penguin Pictures"], "duration_min": 20.0, "genres": ["Action", "Adventure", "Fantasy", "Romance", "Supernatural", "Historical"], "tags": ["3D Cg Animation", "Action", "Adventure", "Cgi", "Chinese Production", "Cultivation", "Fantasy", "Full Cgi", "Historical", "Martial Arts"], "local": "images/cover_7795.jpg"}, {"title": "Douluo Dalu: Hao Tian Yang Wei", "image": "https://media.kitsu.app/anime/poster_images/44607/small.jpg", "score": 8.06, "episodes": 13, "year": 2019, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": ["Sparkly Key Animation Studio"], "producers": ["Tencent Penguin Pictures"], "duration_min": 20.0, "genres": ["Action", "Adventure", "Fantasy", "Romance", "Supernatural", "Historical"], "tags": ["3D Cg Animation", "Action", "Adventure", "Cgi", "Chinese Production", "Competition", "Cultivation", "Family Life", "Fantasy", "Fictional Location"], "local": "images/cover_7796.jpg"}, {"title": "Gankutsuou", "image": "https://cdn.myanimelist.net/images/anime/1910/138560.jpg", "score": 8.06, "episodes": 24, "year": 2004, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Gone-Zo", "Gonzo K.K."], "producers": ["Funimation", "Future Vision Music", "Gdh"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Drama", "Mystery", "Romance", "Sci-Fi", "Supernatural", "Thriller"], "tags": ["Abstract", "Action", "Adventure", "Alien", "Aliens", "Anachronism", "Angst", "Anti-Hero", "Aristocrat", "Award Winning"], "local": "images/gankutsuou.jpg", "synopsis": "Gankutsuou is an anime loosely based on the novel The Count of Monte Cristo by Alexandre Dumas. It tells the story of Albert Morcerf, a young aristocrat who happens to befriend a wealthy nobleman, The Count of Monte Cristo, through a series of bizarre events. Fascinated by the Count's charm, Albert invites him to meet his friends and family, all of whom happen to be part of the upper class society of Paris, France. Unfortunately, little does Albert realize that the Count has ulterior motives in mind. (Source: MAL Rewrite)"}, {"title": "Girls & Panzer: Saishuushou Part 2", "image": "https://cdn.myanimelist.net/images/anime/1240/119215.jpg", "score": 8.06, "episodes": 1, "year": 2019, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["Actas"], "producers": ["Bandai Visual", "Hakuhodo Dy Music & Pictures", "Lantis"], "duration_min": 54.0, "genres": ["Action", "Sports"], "tags": ["Action", "All Girls School", "Cgdct", "Class Struggle", "Cute Girls Doing Cute Things", "Ensemble Cast", "Female Protagonist", "Friendship", "Military", "Military School"], "local": "images/girls-panzer-saishuushou-part-2.jpg"}, {"title": "JoJo no Kimyou na Bouken Part 3: Stardust Crusaders", "image": "https://cdn.myanimelist.net/images/anime/11/55267.jpg", "score": 8.06, "episodes": 24, "year": 2014, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["David Production Inc."], "producers": ["Jojo'S Bizarre Adventure Production Committee", "Kamikaze Douga", "Klockworx"], "duration_min": 24.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Horror", "Mystery", "Supernatural", "Thriller", "Psychological", "Slapstick", "Historical"], "tags": ["Absurdity", "Action", "Adventure", "Africa", "Animal Abuse", "Aristocracy", "Asia", "Assassins", "Based On A Manga", "Betrayal"], "local": "images/jojo-no-kimyou-na-bouken-part-3-stardust-crusaders.jpg", "synopsis": "In a Japanese jail sits 17-year-old Jotaro Kujo: punk, fighter, delinquent...and possessed by a force beyond his control! Around the world, evil spirits are awakening: \"Stands,\" monstrous invisible creatures which give their bearers incredible powers. To save his mother's life, Jotaro must tame his dark forces and travel around the world to Cairo, Egypt, where a hundred-year-old vampire thirsts for the blood of his family. But the road is long, and an army of evil Stand Users waits to kill JoJo and his friends... (Source: VIZ Media)"}, {"title": "Kimi ni Todoke - From Me to You Season 3", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A29713-1459390501.1712194058.jpg", "score": 8.06, "episodes": null, "year": 2024, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": ["Production I.G"], "producers": [], "duration_min": null, "genres": ["Drama", "Romance"], "tags": ["Drama", "Romance"], "local": null, "synopsis": "The third season of Kimi ni Todoke . What do you do once you're a couple? Although she struggles with her blossoming feelings, Sawako comes to terms with herself and tells Kazehaya how she feels about him. Attracted by Sawako's unnoticed efforts and genuine personality, Kazehaya also candidly makes his feelings known. Thus, their new relationship begins. Their first date, their school life together, joy, embarrassment and new struggles — everything is fresh and new as the couple awkwardly and gradually learns more about one another, all while their friends' love stories begin to take shape as well. This bittersweet and poignant story of young people, woven from their romantic feelings and dear friendships, begins once more. (Source: Netflix Anime)"}, {"title": "Kimi wa Houkago Insomnia", "image": "https://cdn.myanimelist.net/images/anime/1402/134007.jpg", "score": 8.06, "episodes": 13, "year": 2023, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Liden Films Inc.", "Lidenfilms"], "producers": ["Chocolate", "Magnet", "Pony Canyon"], "duration_min": 23.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life"], "tags": ["Animals", "Asia", "Astronomy", "Based On A Manga", "Camping", "Club", "Comedy", "Coming Of Age", "Disability", "Drama"], "local": "images/kimi-wa-houkago-insomnia.jpg", "synopsis": "Ganta Nakami is a high school student who suffers from insomnia. One day, he meets Isaki Magari, a girl with the same condition. A strange, but special relationship forms as they share a secret and catch up on their sleep in their school’s abandoned observatory… (Source: HIDIVE)"}, {"title": "Kono Subarashii Sekai ni Shukufuku wo!", "image": "https://cdn.myanimelist.net/images/anime/1895/142748.jpg", "score": 8.06, "episodes": 10, "year": 2016, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Studio Deen Co., Ltd."], "producers": ["81 Produce", "Half H.P Studio", "Kadokawa Media House"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Fantasy", "Supernatural", "Isekai", "Slapstick", "Historical"], "tags": ["Action", "Adventure", "Adventure Comedy", "Afterlife", "Alcohol", "Alternative World", "Anti-Hero", "Awards", "Based On A Light Novel", "Calling Your Attacks"], "local": "images/kono-subarashii-sekai-ni-shukufuku-wo.jpg", "synopsis": "Kazuma Satou decides that today is the day to get out of the house for a bit. Since he dies, pointlessly, it's clearly a bad choice. The goddess who greets him in the afterlife, however, offers him a chance to be reborn in a world not unlike that of a video game, and as a bonus she'll even throw in a cool item or power! Can't possibly be a bad choice, right? Except he arrives with no money at all, dead average skills, and his \"bonus\" isn't useful at all--since he picked the goddess, Aqua, herself. How are the two of them supposed to defeat the evil Devil King and live happily ever after? Well, for them, it probably starts with day laboring rather than adventuring. And it's only going to get more disappointing from there! (Source: Crunchyroll)"}, {"title": "Legend of the Galactic Heroes: Die Neue These Third 3", "image": "https://cdn.anime-planet.com/anime/primary/legend-of-the-galactic-heroes-die-neue-these-third-3-1.webp", "score": 8.06, "episodes": 1, "year": 2022, "season": "SPRING", "type": "MOVIE", "status": "FINISHED", "studios": ["Production I.G"], "producers": [], "duration_min": 95.0, "genres": ["Drama", "Sci-Fi"], "tags": ["Adult Cast", "Based On A Novel", "Drama", "Military", "Outer Space", "Sci Fi", "Sci-Fi", "Sequel", "Space", "Space Opera"], "local": "images/legend-of-the-galactic-heroes-die-neue-these-third-3.webp"}, {"title": "Mahou Shoujo Lyrical Nanoha: The Movie 2nd A's", "image": "https://cdn.myanimelist.net/images/anime/1511/94432.jpg", "score": 8.06, "episodes": 1, "year": 2012, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Seven Arcs Ltd."], "producers": ["Aniplex", "Dwango", "Good Smile Company"], "duration_min": 150.0, "genres": ["Action", "Comedy", "Drama", "Fantasy", "Sci-Fi"], "tags": ["Action", "Action Drama", "Adoption", "Alien", "Archery", "Artificial Intelligence", "Asia", "Awards", "Bionic Powers", "Body Horror"], "local": "images/mahou-shoujo-lyrical-nanoha-the-movie-2nd-a-s.jpg", "synopsis": "Sequel of Mahou Shoujo Lyrical Nanoha The Movie 1st."}, {"title": "Mahoutsukai no Yome", "image": "https://cdn.myanimelist.net/images/anime/3/88476.jpg", "score": 8.06, "episodes": 24, "year": 2017, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": ["Dmm.Futureworks", "W-Toon Studio", "Wit Studio, Inc."], "producers": ["Crunchyroll", "Flying Dog", "Mag Garden"], "duration_min": 24.0, "genres": ["Adventure", "Drama", "Fantasy", "Romance", "Slice of Life", "Supernatural", "Slapstick"], "tags": ["Adventure", "Age Difference", "Age Difference Romance", "Age Gap", "Alternative Present", "Angst", "Animal Abuse", "Apprenticeship", "Asia", "Autumn"], "local": , "Sci-Fi", "Slice of Life", "Psychological", "Slapstick"], "tags": ["Acting", "Adapted Into Japanese Movie", "Adapted Into Other Media", "Age Gap", "Age Regression", "Age Transformation", "Angst", "Based On A Webtoon", "Bullying", "Chibi"], "local": "images/relife.jpg", "synopsis": "The story follows Kaizaki Arata, a 27-year-old jobless man, who fails at every job interview he had after quitting his last company. His life changes after he met Yoake Ryou of the ReLife Research Institute, who offered him a drug that can change his appearance to 17-years-old and to become a subject in an experiment for one year. Thus, he begins his life as a high school student once more."}, {"title": "Shokugeki no Souma: San no Sara - Tootsuki Ressha-hen", "image": "https://cdn.myanimelist.net/images/anime/1604/93531.jpg", "score": 8.06, "episodes": 12, "year": 2018, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["J.C. Staff", "J.C.Staff Co., Ltd."], "producers": ["Klockworx", "Lantis", "Sentai Filmworks"], "duration_min": 24.0, "genres": ["Comedy", "Drama", "Romance", "Slapstick", "Historical"], "tags": ["Absurdly Powerful Student Council", "Aim For The Top", "Asia", "Based On A Manga", "Boarding School", "Comedy", "Competition", "Cooking", "Culinary School", "Dialogue Driven"], "local": "images/shokugeki-no-souma-san-no-sara-tootsuki-ressha-hen.jpg", "synopsis": "The second half of the third season of Shokugeki no Souma . A dark age of cooking befalls Tootsuki Culinary Academy. With the Elite Ten's devastating coup d'état, Azami Nakiri is now the director of the prestigious school. Students must now conform to Azami's ideology of \"true gourmet food\" and are forbidden to express creativity, or else face expulsion. However, Souma Yukihira and the members of the Polar Star Dormitory refuse to accept these changes. Aided by other rebellious first-years, including the tenth seat, Erina Nakiri, Souma and his allies band together to fight off supporters of Azami's regime. But corrupt instructors and the menacing Central organization stand in their way, and so they must work together, harder than ever before, to survive every underhanded plot designed to banish them from the school. (Source: MAL Rewrite)"}, {"title": "Stand By Me Doraemon 2", "image": "https://cdn.myanimelist.net/images/anime/1842/109657.jpg", "score": 8.06, "episodes": 1, "year": 2020, "season": "FALL", "type": "MOVIE", "status": "FINISHED", "studios": ["Robot Communications Inc.", "Shin-Ei Animation Co., Ltd.", "Shirogumi Inc."], "producers": ["Abe Shuuji Jimusho", "Adk Emotions", "Asahi Broadcasting Corporation"], "duration_min": 95.0, "genres": ["Adventure", "Comedy", "Drama", "Fantasy", "Sci-Fi"], "tags": ["Adventure", "Body Swapping", "Cats", "Cg Animation", "Cg-Anime", "Cgi", "Comedy", "Drama", "Family Friendly", "Fantasy"], "local": "images/stand-by-me-doraemon-2.jpg", "synopsis": "The second film of Stand By Me Doraemon . Nobita travels to the future to show his beloved grandma his bride, but adult Nobita has fled his own wedding. Can he ever be a good husband to Shizuka? (Source: Netflix)"}, {"title": "Takopi's Original Sin", "image": "https://cdn.animenewsnetwork.com/thumbnails/max500x600/encyc/A34142-2081954509.1752229472.jpg", "score": 8.06, "episodes": 6, "year": 2025, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Enishiya"], "producers": ["Good Smile Company", "Movic", "The Klockworx Co., Ltd."], "duration_min": 23.0, "genres": ["Drama", "Sci-Fi", "Psychological"], "tags": ["Abuse", "Aliens", "Bullying", "Drama", "Psychological", "School", "Science Fiction", "Suicide", "Time Travel", "Trauma"], "local": "images/takopis-original-sin.webp", "synopsis": "A Happy alien, Takopi, lands on Earth with one mission: to spread happiness! When he meets Shizuka, a lonely fourth grader, he vows to bring back her smile using his magical Happy Gadgets. But as he uncovers the pain in her life, Takopi learns that true happiness may require more than gadgets. (Source: Crunchyroll)"}, {"title": "Teen Titans: The Lost Episode", "image": "https://media.kitsu.app/anime/poster_images/11483/small.jpg", "score": 8.06, "episodes": 1, "year": 2005, "season": "WINTER", "type": "ONA", "status": "FINISHED", "studios": [], "producers": ["Dc Entertainment", "Warner Bros."], "duration_min": 12.0, "genres": ["Action", "Comedy"], "tags": ["Action", "Anime Influenced", "Comedy", "Super Power", "Superhero"], "local": "images/teen-titans-the-lost-episode.jpg"}, {"title": "Youjo Senki", "image": "https://cdn.myanimelist.net/images/anime/5/82890.jpg", "score": 8.06, "episodes": 12, "year": 2017, "season": "WINTER", "type": "TV", "status": "FINISHED", "studios": ["Nut Inc."], "producers": ["At-X", "Enterbrain", "Kadokawa"], "duration_min": 23.0, "genres": ["Action", "Drama", "Fantasy", "Isekai", "Slapstick", "Historical"], "tags": ["3D Cg Animation", "Absurdist Humour", "Action", "Africa", "Age Regression", "Air Combat", "Air Force", "Alternative Past", "Alternative World", "Anachronisms"], "local": "images/youjo-senki.jpg", "synopsis": "The novel series centers on a young girl who fights on the frontlines in war. She has blonde hair, blue eyes, and nearly transparent white skin, and she flies through the air and mercilessly strikes down her opponents. Her name is Tanya Degurechaff, and she speaks with a young girl's lisp and commands the army. Tanya used to be one of Japan's elite office workers, but because of a wrathful god, was reborn as a little girl. Tanya prioritizes optimization and career advancement above all, and she will become the most dangerous entity among the Imperial Army's sorcerers. (Source: Anime News Network)"}, {"title": "Cheng He Titong 2nd Season", "image": "https://cdn.myanimelist.net/images/anime/1663/157036.jpg", "score": 8.05, "episodes": 24, "year": 2026, "season": "WINTER", "type": "ONA", "status": "FINISHED", "studios": ["Shengying Animation", "Shenying Animation"], "producers": ["Energy Studio", "Iqiyi"], "duration_min": 23.0, "genres": ["Comedy", "Fantasy", "Romance", "Isekai", "Historical"], "tags": ["Ancient China", "Based On A Novel", "Cg Animation", "Chinese Animation", "Comedy", "Fantasy", "Full Cgi", "Historical", "Isekai", "Romance"], "local": "images/cover_5001.jpg", "synopsis": "Second season of Cheng He Titong ."}, {"title": "Given Movie 1", "image": "https://cdn.myanimelist.net/images/anime/1648/111422.jpg", "score": 8.05, "episodes": 1, "year": 2020, "season": "SUMMER", "type": "MOVIE", "status": "FINISHED", "studios": ["Lerche"], "producers": ["Aniplex", "Blue Lynx", "Dentsu Inc."], "duration_min": 59.0, "genres": ["Comedy", "Drama", "Romance", "Slice of Life", "Music", "Slapstick"], "tags": ["Adult Couples", "Attempted Rape", "Band", "Based On A Manga", "Bisexual", "Bl", "Boys Love", "Boys' Love", "Cgi", "Classical Music"], "local": "images/given-movie-1.jpg"}, {"title": "Great Pretender", "image": "https://cdn.myanimelist.net/images/anime/1418/107954.jpg", "score": 8.05, "episodes": 23, "year": 2020, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Wit Studio, Inc."], "producers": ["Fuji Television Network", "Fuji Tv", "Hakuhodo Dy Media Partners"], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Drama", "Mystery", "Thriller", "Psychological", "Slapstick"], "tags": ["Acting", "Action", "Action Comedy", "Adult Cast", "Adventure", "Americas", "Anti-Hero", "Asia", "Aviation", "Baseball"], "local": "images/great-pretender.jpg", "synopsis": "Self-styled “Japan's greatest swindler” Makoto Edamura is mainly targeting elder people and occasional foreign travelers. But when he tries to scam an apparently clueless French tourist in Tokyo, he can't possibly imagine that what looked like just another ordinary job is going to take him all the way to Los Angeles, tied upside-down on the famous Hollywood sign… And he is yet to find out what fate awaits him! (Source: Crunchyroll)"}, {"title": "Initial D Final Stage", "image": "https://cdn.myanimelist.net/images/anime/1404/101364.jpg", "score": 8.05, "episodes": 4, "year": 2014, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": ["Synergy Sp", "Synergysp Co. ,Ltd."], "producers": ["Avex Entertainment", "Avex Pictures", "Kodansha"], "duration_min": 27.0, "genres": ["Action", "Drama", "Sports"], "tags": ["Action", "Asia", "Auto Racing", "Based On A Manga", "Cars", "Cgi", "Coming Of Age", "Defeat Means Friendship", "Drama", "Drifting"], "local": "images/initial-d-final-stage.jpg", "synopsis": "After defeating every racing team in the prefecture, everything comes down to one last race. Takumi Fujiwara has never lost a race, but when his opponent is also using an AE86, it turns into a battle of the AE86. Will Project D succeed in the final and most difficult race of Initial D?"}, {"title": "Kara no Kyoukai Movie 3: Tsuukaku Zanryuu", "image": "https://cdn.myanimelist.net/images/anime/4/21735.jpg", "score": 8.05, "episodes": 1, "year": 2008, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Ufotable, Inc."], "producers": ["Aniplex Of America", "Kodansha", "Notes"], "duration_min": 59.0, "genres": ["Action", "Drama", "Fantasy", "Horror", "Mystery", "Romance", "Supernatural", "Thriller"], "tags": ["Achronological Order", "Action", "Action Drama", "Amnesia", "Anti-Hero", "Based On A Light Novel", "Bionic Powers", "Body Horror", "Crime", "Dissociative Identities"], "local": "images/kara-no-kyoukai-movie-3-tsuukaku-zanryuu.jpg"}, {"title": "Karakai Jouzu no Takagi-san 2", "image": "https://cdn.myanimelist.net/images/anime/1393/107033.jpg", "score": 8.05, "episodes": 12, "year": 2019, "season": "SUMMER", "type": "TV", "status": "FINISHED", "studios": ["Shin-Ei Animation Co., Ltd."], "producers": ["Asmik Ace", "Dentsu", "Karakai Jozu No Takagi-San 2 Production Committee"], "duration_min": 23.0, "genres": ["Comedy", "Romance", "Slice of Life", "Slapstick"], "tags": ["Asia", "Based On A Manga", "Battle Of Wits", "Comedy", "Countryside", "Daily Life", "Dialogue Driven", "Earth", "Ensemble Cast", "Episodic"], "local": "images/karakai-jouzu-no-takagi-san-2.jpg", "synopsis": "Even after spending a considerable amount of time with Takagi, Nishikata is still struggling to find a perfect plan to defeat the expert teaser. A battle of wits, a contest of physical prowess, a test of courage—any strategy he employs to expose her weaknesses is to no avail. On the contrary, Nishikata's pitiful attempts only reveal more of his own flaws, which Takagi takes advantage of to become increasingly daring in her teasing attempts. To make things worse for Nishikata, rumors about him and Takagi may have spread in class due to the frequent interactions between them. However, the optimistic Nishikata believes that wisdom comes with age and that as the days go by, his experience with her constant teasing will eventually bear fruit, leading him to the awaited moment of victory. Thus, Nishikata continues to strive for the seemingly impossible—to outsmart Takagi and make her blush with embarrassment."}, {"title": "Mahoutsukai no Yome: Hoshi Matsu Hito", "image": "https://cdn.myanimelist.net/images/anime/4/80587.jpg", "score": 8.05, "episodes": 3, "year": 2016, "season": "SUMMER", "type": "OVA", "status": "FINISHED", "studios": ["Wit Studio, Inc."], "producers": ["Flying Dog", "Production I.G"], "duration_min": 23.0, "genres": ["Drama", "Fantasy", "Romance", "Slice of Life"], "tags": ["Age Difference Romance", "Age Gap", "Asia", "Based On A Manga", "Contemporary Fantasy", "Countryside", "Detailed Landscapes", "Drama", "Earth", "Elf"], "local": "images/mahoutsukai-no-yome-hoshi-matsu-hito.jpg", "synopsis": "The three-part OVA series will chronicle a story taking place before Chise meets the Magus. Chise Hatori has lived a life full of neglect and abuse, devoid of anything resembling love. Far from the warmth of family, she has had her share of troubles and pitfalls. Just when all hope seems lost, a fateful encounter awaits her. When a man with the head of a beast, wielding strange powers, obtains her through a slave auction, Chise's life will never be the same again. (Source: Seven Seas Entertainment)"}, {"title": "Miraculous Ladybug Season 4", "image": "https://media.kitsu.app/anime/poster_images/44436/small.jpg", "score": 8.05, "episodes": 26, "year": 2021, "season": "SPRING", "type": "TV", "status": "FINISHED", "studios": [], "producers": [], "duration_min": 23.0, "genres": ["Action", "Adventure", "Comedy", "Fantasy", "Romance"], "tags": ["Action", "Action Comedy", "Adventure", "Anime Influenced", "Cg-Anime", "Comedy", "Fantasy", "Henshin", "Heroine Of Strong Character", "Magical Girl"], "local": "images/miraculous-ladybug-season-4.jpg"}, {"title": "Natsume Yuujinchou: Ishi Okoshi to Ayashiki Raihousha", "image": "https://cdn.myanimelist.net/images/anime/1992/111560.jpg", "score": 8.05, "episodes": 1, "year": 2021, "season": "WINTER", "type": "MOVIE", "status": "FINISHED", "studios": ["Shuka Inc."], "producers": ["Ai Addiction", "Aniplex"], "duration_min": 51.0, "genres": ["Drama", "Fantasy", "Slice of Life", "Supernatural"], "tags": ["Based On A Manga", "Cats", "Contemporary Fantasy", "Countryside", "Demon", "Dinosaurs", "Dissociative Identities", "Drama", "Fantasy", "Iyashikei"], "local": "images/natsume-yuujinchou-ishi-okoshi-to-ayashiki-raihousha.jpg", "synopsis": "In \"Ishi Okoshi,\" Natsume meets a small youkai called Mitsumi in a forest. Mitsumi is entrusted to wake up the divine youkai \"Iwatetsu\" from its deep slumber. Mitsumi weighs on Natsume's mind, so he sets out to help Mitsumi with his task. In \"Ayashiki Raihousha,\" a mysterious visitor appears in front of Tanuma. Nearly every day, the visitor visits Tanuma, talks to him a little, and then leaves. Natsume, who knows the visitor is a youkai, worries for Tanuma, but Tanuma enjoys these exchanges with the youkai. The youkai means no harm, but Tanuma's health slowly starts to deteriorate. (Source: Anime News Network)"}, {"title": "Totally Spies!", "image": "https://media.kitsu.app/anime/poster_images/13505/small.jpg", "score": 8.05, "episodes": 156, "year": 2001, "season": "FALL", "type": "TV", "status": "FINISHED", "studios": [], "producers": ["Marathon Media Group"], "duration_min": 22.0, "genres": ["Action", "Adventure", "Comedy", "Mystery"], "tags": ["Action", "Adventure", "Anime Influenced", "Comedy", "Mystery"], "local": "images/totally-spies.jpg"}, {"title": "Tunshi Xingkong Movie: Xueluo Dalu", "image": "https://cdn.myanimelist.net/images/anime/1695/145740.jpg", "score": 8.05, "episodes": 1, "year": 2024, "season": "FALL", "type": "ONA", "status": "FINISHED", "studios": ["Sparkly Key Animation Studio"], "producers": ["Tencent Penguin Pictures", "Tencent Video"], "duration_min": 93.0, "genres": ["Action", "Adventure", "Fantasy", "Sci-Fi"], "tags": ["Action", "Adventure", "Based On A Web Novel", "Cg Animation", "Cg-Anime", "Chinese Animation", "Chinese Production", "Fantasy", "Martial Arts", "Sci Fi"], "local": "images/tunshi-xingkong-movie-xueluo-dalu.jpg", "synopsis": "Luo Feng embarks on a journey to the Xue Luo Continent to undergo trials in order to protect Earth. On this vast continent, he continually pushes his limits, forming bonds with friendly allies and facing formidable enemies. Despite the challenges, he never retreats. Instead, he moves forward steadily, overcoming obstacles step by step. Ultimately, he achieves limitless advancement and gains the immense power needed to safeguard Earth."}, {"title": "Wu Shan Wu Xing: Xichuan Huan Zi Lin", "image": "https://cdn.myanimelist.net/images/anime/1911/157526.jpg", "score": 8.05, "episodes": 4, "year": 2023, "season": "SUMMER", "type": "ONA", "status": "FINISHED", "studios": ["Nice Boat Animation", "Samsara Animation Studio", "Samsara Studio"], "producers": ["Bilibili", "Nice Boat Animation"], "duration_min": 38.0, "genres": ["Action", "Drama", "Fantasy", "Supernatural", "Historical"], "tags
